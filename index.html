                      <small style="${row.canSellBeforeExpiry === false ? 'color: var(--danger); font-weight: 600;' : ''}">${escapeHtml(shortenProductName(row.productName) || "-")}</small>
                    </button>

                </div>
              </div>
            </div>
          </div>

      return `
        <div class="panel matrix-panel" id="matrix-panel">
          <div class="block-head">
            <div>
              <h2>SKU 九宫格分析（日销系数 × 消化周期）</h2>
              <div class="note">横轴=日销系数（N列数值：1高日销~3低日销），纵轴=消化周期反推（1低~3高）。点击商品图片会跳到联动总表对应行。</div>

            <div style="display:flex;gap:10px;align-items:center;">
              <span class="badge neutral">共 ${formatInteger(model.matrixSummary.totalSku)} 个商品</span>

            </label>
            <label>

          <div class="table-toolbar">

          ${tableSection({
            tabId: "linked",
            title: "联动总表（九宫格命中结果）",
            note: "这里展示当前筛选条件下的 SKU 明细，点击品名可跳回九宫格对应商品。",
            rows: rows,
            showAll: true,
            columns: [
              { label: "品名", key: "productName", render: (row) => `<a href="#" class="link-to-matrix" data-link-key="${escapeHtml(row.key)}" title="点击跳回九宫格">${escapeHtml(shortenProductName(row.productName) || "-")}</a>`, sortValue: (row) => row.productName || "" },
              { label: "规格", render: (row) => escapeHtml(row.spec || "-") },
              { label: "条码", key: "barcode", render: (row) => escapeHtml(row.barcode || row.sku || "-"), sortValue: (row) => row.barcode || row.sku || "" },
              { label: "分类", render: (row) => escapeHtml(row.category || "-") },
              { label: "日销系数", render: (row) => row.dailySalesCoef !== null && row.dailySalesCoef !== undefined ? formatNumber(row.dailySalesCoef) : "-", sortValue: (row) => row.dailySalesCoef ?? 0 },
              { label: "消化周期", render: (row) => {
                if (isIndigestible(row.sellOutDays)) return "无法消化";
                if (row.sellOutDays !== null && row.sellOutDays !== undefined) return `${Math.round(row.sellOutDays)} 天`;
                return "-";
              }, sortValue: (row) => row.sellOutDays === Infinity ? Number.MAX_SAFE_INTEGER : (row.sellOutDays ?? 0) },
              { label: "即时库存", render: (row) => formatInteger(row.stockQty || 0) },
              { label: "生产备注", render: (row) => escapeHtml(row.productionNote || "-") },
              { label: "补单备注", render: (row) => escapeHtml(row.reorderNote || "-") },
              { label: "保质期", render: (row) => row.avgExpiryDate ? `${escapeHtml(row.avgExpiryDate)} 年` : "-" },
              { label: "能否卖完", render: (row) => badge(row.canSellBeforeExpiry === false ? "danger" : "good", row.canSellBeforeExpiry === false ? "卖不完" : "可卖完") },
              { label: "九宫格位置", key: "matrixPos", render: (row) => escapeHtml(isIndigestible(row.sellOutDays) ? "九号位" : getMatrixPosition(row.salesCoef, row.inventoryCoef)), sortValue: (row) => { const idx = GRID_ORDER.findIndex(p => p.x === row.salesCoef && p.y === row.inventoryCoef); return idx >= 0 ? idx + 1 : 0; } },
            ],
            emptyText: "当前筛选下没有 SKU。请换个分类或放宽条件。",
            previewText: `共 ${formatInteger(rows.length)} 条`,
            rowClassName: (row) => row.key === state.matrixFocusKey ? "focus-row" : "",
          })}

        </div>
      `;
    }

    // 渲染历史位置对比子表
    function renderHistoryCompareTable(rows) {
      if (!state.matrixHistoryNodes.length) return "";
      const nodeOptions = ["", ...state.matrixHistoryNodes];
      const compareNodes = state.historyCompareNodes;
      const compareRows = rows.filter(row => row.key && state.matrixHistory[row.key]).map(row => {
        const hist = state.matrixHistory[row.key] || {};
        const positions = compareNodes.map(node => node ? (hist[node] || "-") : "-");
        return {
          key: row.key,
          productName: row.productName,
          spec: row.spec,
          category: row.category,
          sellOutDays: row.sellOutDays,
          positions,
          // 趋势箭头：节点1→2、节点2→3（仅当两端都有有效位置时显示）
          trend12: (positions[0] !== "-" && positions[1] !== "-") ? getPositionTrendArrow(positions[0], positions[1]) : "",
          trend23: (positions[1] !== "-" && positions[2] !== "-") ? getPositionTrendArrow(positions[1], positions[2]) : "",
        };
      });
      return tableSection({
        tabId: "historyCompare",
        title: "历史节点九宫格位置对比",
        note: "选择最多三个时间节点，对比商品在九宫格中的位置变化。每次上传新文件会自动记录当前位置。趋势箭头：绿色↑变好 / 红色↓变差 / 灰色→持平。",
        rows: compareRows,
        showAll: true,
        columns: [
          { label: "品名", key: "productName", render: (row) => escapeHtml(row.productName || "-"), sortValue: (row) => row.productName || "" },
          { label: "规格", render: (row) => escapeHtml(row.spec || "-") },
          { label: "分类", render: (row) => escapeHtml(row.category || "-") },
          { label: "消化周期", render: (row) => {
            if (isIndigestible(row.sellOutDays)) return "无法消化";
            if (row.sellOutDays !== null && row.sellOutDays !== undefined) return `${Math.round(row.sellOutDays)} 天`;
            return "-";
          }, sortValue: (row) => row.sellOutDays === Infinity ? Number.MAX_SAFE_INTEGER : (row.sellOutDays ?? 0) },
          { label: "历史节点1", render: (row) => escapeHtml(row.positions[0] || "-"), sortValue: (row) => row.positions[0] || "" },
          { label: "趋势", render: (row) => row.trend12, sortValue: (row) => row.trend12 },
          { label: "历史节点2", render: (row) => escapeHtml(row.positions[1] || "-"), sortValue: (row) => row.positions[1] || "" },
          { label: "趋势", render: (row) => row.trend23, sortValue: (row) => row.trend23 },
          { label: "历史节点3", render: (row) => escapeHtml(row.positions[2] || "-"), sortValue: (row) => row.positions[2] || "" },
        ],
        emptyText: "暂无历史位置数据。每次上传新文件时会自动记录当前九宫格位置。",
        previewText: `共 ${formatInteger(compareRows.length)} 条`,
        extraToolbar: `
          <label>节点1 <select data-history-node="0">
            ${nodeOptions.map(n => `<option value="${escapeHtml(n)}" ${compareNodes[0] === n ? "selected" : ""}>${escapeHtml(n || "请选择")}</option>`).join("")}
          </select></label>
          <label>节点2 <select data-history-node="1">
            ${nodeOptions.map(n => `<option value="${escapeHtml(n)}" ${compareNodes[1] === n ? "selected" : ""}>${escapeHtml(n || "请选择")}</option>`).join("")}
          </select></label>
          <label>节点3 <select data-history-node="2">
            ${nodeOptions.map(n => `<option value="${escapeHtml(n)}" ${compareNodes[2] === n ? "selected" : ""}>${escapeHtml(n || "请选择")}</option>`).join("")}
          </select></label>
        `,
      });
    }

    function tableSection({ tabId, title, note, rows, columns, emptyText, previewText, rowClassName, showAll, extraToolbar }) {
      if (!rows.length) {
        return `
          <div class="card block">
            <div class="block-head">
              <div>
                <h2>${escapeHtml(title)}</h2>
                <div class="note">${escapeHtml(note)}</div>
              </div>
            </div>
            <div class="empty-table">${escapeHtml(emptyText)}</div>
          </div>
        `;
      }

      const activeTabId = tabId || state.activeTab || "overview";
      const tableState = getTableState(activeTabId);
      const sortKey = tableState.sortKey || "";
      const sortDir = tableState.sortDir || "desc";
      const resolvedRows = applySorting(rows, columns, sortKey, sortDir);
      const totalRows = resolvedRows.length;
      const pageSize = showAll ? totalRows : (tableState.pageSize || 20);
      const columnWidths = tableState.columnWidths || {};
      const totalPages = showAll ? 1 : Math.max(1, Math.ceil(totalRows / pageSize));
      const currentPage = showAll ? 1 : Math.min(Math.max(tableState.page || 1, 1), totalPages);
      const pageRows = showAll ? resolvedRows : resolvedRows.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      const colgroup = columns.map((col) => {
        const key = getResizableColumnKey(col);
        const width = columnWidths[key];
        const style = width ? ` style="width:${Math.max(MIN_COLUMN_WIDTH, width)}px"` : "";
        return `<col${style}>`;
      }).join("");
      const body = pageRows.map((row) => `
        <tr${row.key ? ` data-row-key="${escapeHtml(row.key)}"` : ""}${rowClassName ? ` class="${escapeHtml(rowClassName(row))}"` : ""}>
          ${columns.map((col) => {
            const cellHtml = col.render(row);
            if (isProductNameColumn(col)) {
              const tooltipText = escapeHtml(row.productName || "");
              return `<td><span class="cell-clip" data-tooltip="${tooltipText}">${cellHtml}</span></td>`;
            }
            return `<td>${cellHtml}</td>`;
          }).join("")}
        </tr>
      `).join("");
      const header = columns.map((col) => {
        const key = getColumnKey(col);
        const sortable = col.sortable !== false;
        const active = sortable && sortKey === key;
        const arrow = active ? (sortDir === "asc" ? "▲" : "▼") : "";
        const resizable = isProductNameColumn(col);
        return `<th class="${sortable ? "sortable" : ""}${resizable ? " resizable" : ""}" data-sort-key="${escapeHtml(key || "")}" data-tab-id="${escapeHtml(activeTabId)}">${escapeHtml(col.label)}${arrow ? `<span class="sort-arrow">${arrow}</span>` : ""}${resizable ? `<span class="column-resizer" data-column-resize-handle data-column-key="${escapeHtml(key)}" data-tab-id="${escapeHtml(activeTabId)}" aria-hidden="true"></span>` : ""}</th>`;
      }).join("");

      const isLinkedTable = tabId === "linked" || title.includes("联动总表");
      return `
        <div class="card block" ${isLinkedTable ? 'data-linked-table="true"' : ''}>
          <div class="block-head">
            <div>
              <h2>${escapeHtml(title)}</h2>
              <div class="note">${escapeHtml(note)}</div>
            </div>
            <span class="badge neutral">${escapeHtml(previewText || `显示 ${totalRows} 条`)}</span>
          </div>
          <div class="table-toolbar">
            <p class="hint">${showAll ? "点击表头可排序，当前展示全部数据。" : "点击表头可排序，分页会记住当前页。"}</p>
            ${extraToolbar || ""}
            ${showAll ? "" : `<div class="pager">
              <select data-page-size data-tab-id="${escapeHtml(activeTabId)}" aria-label="每页条数">
                ${[20, 50, 100].map((size) => `<option value="${size}" ${pageSize === size ? "selected" : ""}>每页 ${size} 条</option>`).join("")}
              </select>
              <button class="ghost" data-page-action="prev" data-tab-id="${escapeHtml(activeTabId)}" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
              <span class="page-info">第 ${currentPage} / ${totalPages} 页</span>
              <button class="ghost" data-page-action="next" data-tab-id="${escapeHtml(activeTabId)}" ${currentPage >= totalPages ? "disabled" : ""}>下一页</button>
            </div>`}
          </div>
          <div class="table-wrap">
            <table>
              <colgroup>${colgroup}</colgroup>
              <thead><tr>${header}</tr></thead>
              <tbody>${body}</tbody>
            </table>
          </div>
        </div>
      `;
    }
    function sourcePreviewRows(source, limit = PREVIEW_LIMIT) {
      return source.rows.slice(0, limit);
    }

    function renderOverview(model) {
      const linkedPreview = model.linkedRows.slice(0, PREVIEW_LIMIT);
      const sourceTiles = SOURCE_CONFIGS.map((cfg) => {
        const source = model.sources[cfg.key];
        const ready = source.rows.length > 0;
        return `
          <div class="soft-card">
            <strong>${escapeHtml(cfg.label)}</strong>
            <div class="note">${ready ? `${formatInteger(source.rows.length)} 条记录` : "未上传"}</div>
          </div>
        `;
      }).join("");

      const warningCards = [
        { title: "建议补货", value: formatInteger(model.replenishmentRows.reduce((sum, row) => sum + (row.replenishmentQty || 0), 0)), note: "按 6 个月目标库存推算" },
        { title: "滞销风险", value: formatInteger(model.slowRows.length), note: "库存覆盖期接近或超过剩余保质期" },
        { title: "临期预警", value: formatInteger(model.expiryRows.length), note: "剩余保质期 2 年以内" },
      ].map((item) => `
        <div class="soft-card">
          <strong>${escapeHtml(item.title)}</strong>
          <div style="font-size:22px;font-weight:700;margin:8px 0 4px;">${escapeHtml(item.value)}</div>
          <div class="note">${escapeHtml(item.note)}</div>
        </div>
      `).join("");

      const columns = [
        { label: "品名", render: (row) => escapeHtml(row.productName || "-") },
        { label: "条码", render: (row) => escapeHtml(row.barcode || row.sku || "-") },
        { label: "规格", render: (row) => escapeHtml(row.spec || "-") },
        { label: "零售价", render: (row) => row.retailPrice === null || row.retailPrice === undefined ? "-" : formatCurrency(row.retailPrice) },
        { label: "仓库库存", render: (row) => formatInteger(row.warehouseAvailable || 0) },
        { label: "门店库存", render: (row) => formatInteger(row.storeAvailable || 0) },
        { label: "销售数量", render: (row) => formatInteger(row.totalSalesQty || 0) },
        { label: "库存深度", render: (row) => row.stockDepthDays === null || row.stockDepthDays === undefined ? "-" : `${formatNumber(row.stockDepthDays)} 天` },
        { label: "保质期天数", render: (row) => row.remainingDays === null || row.remainingDays === undefined ? "-" : `${formatInteger(row.remainingDays)} 天` },
        { label: "数据覆盖", render: (row) => formatInteger(row.sourceCount || 0) },
      ];

      return `
        <div class="summary-grid">
          ${warningCards}
        </div>
        <div class="summary-grid">
          ${sourceTiles}
        </div>
        ${tableSection({
          title: "联动总表预览",
          note: "条码优先，货号和规格做兜底键；这里先展示前 120 条，后续补货 / 滞销 / 临期预警都会基于这张总表继续往下做。",
          rows: linkedPreview,
          columns,
          emptyText: "请先上传文件，系统会在这里显示联动总表。",
          previewText: `前 ${linkedPreview.length} 条 / 共 ${model.linkedRows.length} 条`
        })}
      `;
    }

    function renderProductTab(model) {
      const source = model.sources.product;
      const rows = sourcePreviewRows(source);
      return tableSection({
        title: "商品资料",
        note: "商品资料建议用条码做主键，后续所有库存和销售文件都会往这里对齐。",
        rows,

          { label: "品名", render: (row) => escapeHtml(row.productName || "-") },

const matrixExportImage = event.target.closest("[data-matrix-export-image]");

const matrixExportData = event.target.closest("[data-matrix-export-data]");

const matrixFitScreen = event.target.closest("[data-matrix-fit-screen]");

              const gridTop = grid.getBoundingClientRect().top + window.scrollY;
              window.scrollTo({ top: gridTop - 10, behavior: "instant" });

        const pagerButton = event.target.closest("[data-page-action]");
        if (pagerButton) {
          const tabId = pagerButton.dataset.tabId || state.activeTab || "overview";
          const current = getTableState(tabId);
          const nextPage = pagerButton.dataset.pageAction === "next" ? current.page + 1 : current.page - 1;
          updateTableState(tabId, { page: Math.max(1, nextPage) });
          render();
          return;
        }

        const th = event.target.closest("th[data-sort-key]");
        if (th) {
          const tabId = th.dataset.tabId || state.activeTab || "overview";
          const key = th.dataset.sortKey || "";
          const current = getTableState(tabId);
          const nextDir = current.sortKey === key && current.sortDir === "asc" ? "desc" : "asc";
          updateTableState(tabId, { sortKey: key, sortDir: nextDir, page: 1 });
          render();
        }
      };

      host.addEventListener("mousemove", (event) => {
        const cell = event.target.closest("[data-tooltip]");
        if (!cell) {
          hideTableTooltip();
          return;
        }
        const text = cell.dataset.tooltip || "";
        if (!text || text === "-") {
          hideTableTooltip();
          return;
        }
        showTableTooltip(text, event.clientX, event.clientY);
      });

      host.addEventListener("mouseleave", hideTableTooltip);

      host.addEventListener("pointerdown", (event) => {
        const handle = event.target.closest("[data-column-resize-handle]");
        if (!handle) return;
        event.preventDefault();
        event.stopPropagation();

        const tabId = handle.dataset.tabId || state.activeTab || "overview";
        const columnKey = handle.dataset.columnKey || "";
        const th = handle.closest("th");
        const table = handle.closest("table");
        const colgroup = table && table.querySelector("colgroup");
        const cols = colgroup ? Array.from(colgroup.querySelectorAll("col")) : [];
        const headerCells = table ? Array.from(table.querySelectorAll("thead th")) : [];
        const columnIndex = headerCells.indexOf(th);
        const colEl = columnIndex >= 0 ? cols[columnIndex] : null;
        if (!th || !columnKey || !colEl) return;

        const startWidth = th.getBoundingClientRect().width;
        if (typeof handle.setPointerCapture === "function") {
          try {
            handle.setPointerCapture(event.pointerId);
          } catch {
            // ignore capture failures
          }
        }
        document.body.style.userSelect = "none";
        document.body.style.cursor = "col-resize";
        columnResizeState.active = {
          tabId,
          columnKey,
          startX: event.clientX,
          startWidth,
          handle,
          colEl,
          pendingWidth: startWidth,
        };
        handle.classList.add("is-dragging");
      });

      host.addEventListener("change", (event) => {
        const pageSizeSelect = event.target.closest("[data-page-size]");
        if (pageSizeSelect) {
          const tabId = pageSizeSelect.dataset.tabId || state.activeTab || "overview";
          const nextPageSize = Number(pageSizeSelect.value) || 20;
          updateTableState(tabId, { pageSize: nextPageSize, page: 1 });
          render();
          return;
        }

        const categorySelect = event.target.closest("[data-matrix-category]");
        const priceSelect = event.target.closest("[data-matrix-price]");
        const productionSelect = event.target.closest("[data-matrix-production]");
        if (categorySelect || priceSelect || productionSelect) {
          if (categorySelect) state.matrixFilters.category = categorySelect.value || "全部";
          if (priceSelect) state.matrixFilters.isRegularPrice = priceSelect.value || "全部";
          if (productionSelect) state.matrixFilters.productionNote = productionSelect.value || "全部";
          render();
        }
      });

      host.addEventListener("input", (event) => {
        // 销售时间段已改为自动读取，无需手动输入
      });

      // 绑定点击事件处理器
      host.addEventListener("click", host._tableClickHandler);

      document.addEventListener("pointermove", (event) => {
        const active = columnResizeState.active;
        if (!active) return;
        const nextWidth = Math.max(MIN_COLUMN_WIDTH, Math.round(active.startWidth + (event.clientX - active.startX)));
        active.pendingWidth = nextWidth;
        if (columnResizeState.rafId) return;
        columnResizeState.rafId = requestAnimationFrame(() => {
          columnResizeState.rafId = 0;
          const current = columnResizeState.active;
          if (!current || current.pendingWidth === null || current.pendingWidth === undefined) return;
          const widthText = `${current.pendingWidth}px`;
          current.colEl.style.width = widthText;
          current.colEl.style.minWidth = widthText;
        });
      });

      const finishResize = () => {
        const active = columnResizeState.active;
        if (!active) return;
        if (columnResizeState.rafId) {
          cancelAnimationFrame(columnResizeState.rafId);
          columnResizeState.rafId = 0;
        }
        const finalWidth = active.pendingWidth || Math.max(MIN_COLUMN_WIDTH, Math.round(active.colEl.getBoundingClientRect().width));
        updateColumnWidth(active.tabId, active.columnKey, finalWidth);
        active.handle?.classList.remove("is-dragging");
        document.body.style.userSelect = "";
        document.body.style.cursor = "";
        columnResizeState.active = null;
        render();
      };

      document.addEventListener("pointerup", finishResize);
      document.addEventListener("pointercancel", finishResize);
    }

    // ===== 销售趋势：折线图与交互 =====
    const TREND_ONLINE_COLOR = "#2563eb"; // 线上 蓝（合并模式/单商品）
    const TREND_OFFLINE_COLOR = "#f97316"; // 线下 橙（合并模式/单商品）
    const TREND_DASH_PATTERNS = ["", "6 4", "2 5", "10 4 2 4", "12 2 4 2", "4 2"];
    // 两两对比时，每个商品用一对独立颜色（线上/线下），4 条线 4 种颜色
    const TREND_PRODUCT_PAIRS = [
      { online: "#2563eb", offline: "#f97316" }, // 蓝 / 橙
      { online: "#16a34a", offline: "#9333ea" }, // 绿 / 紫
      { online: "#0ea5e9", offline: "#e11d48" }, // 天蓝 / 玫红
      { online: "#ca8a04", offline: "#0891b2" }, // 金 / 青
    ];

    // 日期 "YYYY-MM-DD" -> 季度标识 "YYYY-Qn"
    function dateToQuarter(dateStr) {
      if (!dateStr || dateStr.length < 7) return "";
      const y = dateStr.slice(0, 4);
      const m = Number(dateStr.slice(5, 7));
      if (!y || !m) return "";
      const q = Math.ceil(m / 3);
      return `${y}-Q${q}`;
    }

    // 日期 "YYYY-MM-DD" -> 月份标识 "YYYY-MM"
    function dateToMonth(dateStr) {
      if (!dateStr || dateStr.length < 7) return "";
      return dateStr.slice(0, 7);
    }

    // 线性回归（最小二乘法）：返回 { slope, intercept }，y = slope*x + intercept
    // 用于拟合长期趋势线，能反映"稳定微微向上/向下"
    function linearRegression(values) {
      const n = values.length;
      if (n < 2) return { slope: 0, intercept: values[0] || 0 };
      let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
      for (let i = 0; i < n; i++) {
        sumX += i;
        sumY += values[i];
        sumXY += i * values[i];
        sumX2 += i * i;
      }
      const denom = n * sumX2 - sumX * sumX;
      if (denom === 0) return { slope: 0, intercept: sumY / n };
      const slope = (n * sumXY - sumX * sumY) / denom;
      const intercept = (sumY - slope * sumX) / n;
      return { slope, intercept };
    }

    // 居中移动平均：平滑短期波动，凸显中期趋势
    function movingAverage(values, window = 5) {
      const n = values.length;
      if (n === 0) return [];
      const result = new Array(n).fill(0);
      const half = Math.floor(window / 2);
      for (let i = 0; i < n; i++) {
        let sum = 0, count = 0;
        for (let j = -half; j <= half; j++) {
          const k = i + j;
          if (k < 0 || k >= n) continue;
          sum += values[k];
          count++;
        }
        result[i] = count > 0 ? sum / count : 0;
      }
      return result;
    }

    // 计算趋势线数据：根据算法返回每个 x 点的趋势值
    function computeTrendValues(values, method) {
      if (!values || values.length < 2) return values ? values.slice() : [];
      if (method === "ma") {
        // 窗口随数据量自适应：日维度用 7（周），季度维度用 3
        const window = values.length <= 8 ? 3 : 7;
        return movingAverage(values, window);
      }
      // 默认线性回归
      const { slope, intercept } = linearRegression(values);
      return values.map((_, i) => slope * i + intercept);
    }

    function getTrendFilteredDates(model) {
      const trend = model.salesTrendModel;
      const f = state.salesTrendFilters;
      let dates = trend.allDates;
      if (f.startDate) dates = dates.filter((d) => d >= f.startDate);
      if (f.endDate) dates = dates.filter((d) => d <= f.endDate);
      return dates;
    }

    // 按季度聚合：返回筛选日期段内的季度列表（升序）
    function getTrendFilteredQuarters(model) {
      const trend = model.salesTrendModel;
      const f = state.salesTrendFilters;
      const qSet = new Set();
      trend.products.forEach((p) => {
        Object.keys(p.dates).forEach((d) => {
          if (f.startDate && d < f.startDate) return;
          if (f.endDate && d > f.endDate) return;
          const q = dateToQuarter(d);
          if (q) qSet.add(q);
        });
      });
      return Array.from(qSet).sort();
    }

    function getTrendSelectedProducts(model) {
      const trend = model.salesTrendModel;
      const f = state.salesTrendFilters;
      const keySet = new Set(f.selectedKeys);
      return trend.products.filter((p) => {
        if (!keySet.has(p.key)) return false;
        if (f.category && f.category !== "全部" && (p.category || "") !== f.category) return false;
        return true;
      });
    }

    // 获取销售趋势数据中出现的所有分类（来自商品资料G列），用于筛选下拉
    function getTrendCategoryOptions(model) {
      const trend = model.salesTrendModel;
      const set = new Set();
      trend.products.forEach((p) => { if (p.category) set.add(p.category); });
      return ["全部", ...Array.from(set).sort()];
    }

    function buildTrendSeries(model) {
      const f = state.salesTrendFilters;
      if (f.granularity === "quarterly") {
        return buildTrendSeriesQuarterly(model);
      }
      if (f.granularity === "monthly") {
        return buildTrendSeriesMonthly(model);
      }
      return buildTrendSeriesDaily(model);
    }

    // 每日维度系列
    function buildTrendSeriesDaily(model) {
      const dates = getTrendFilteredDates(model);
      const selected = getTrendSelectedProducts(model);
      const f = state.salesTrendFilters;
      const series = [];

      if (f.mode === "merge") {
        // 合并：把选中商品汇总成 线上 / 线下 两条线
        const onlineValues = new Array(dates.length).fill(0);
        const offlineValues = new Array(dates.length).fill(0);
        selected.forEach((p) => {
          dates.forEach((d, i) => {
            const slot = p.dates[d];
            if (slot) {
              onlineValues[i] += slot.online || 0;
              offlineValues[i] += slot.offline || 0;
            }
          });
        });
        series.push({ label: "线上(合计)", color: TREND_ONLINE_COLOR, dash: "", values: onlineValues, channel: "online" });
        series.push({ label: "线下(合计)", color: TREND_OFFLINE_COLOR, dash: "", values: offlineValues, channel: "offline" });
      } else {
        // 分商品：每个商品各画 线上 / 线下 两条线，用 dash 区分商品
        selected.forEach((p, idx) => {
          const pair = TREND_PRODUCT_PAIRS[idx % TREND_PRODUCT_PAIRS.length];
          const onlineValues = dates.map((d) => (p.dates[d] ? p.dates[d].online || 0 : 0));
          const offlineValues = dates.map((d) => (p.dates[d] ? p.dates[d].offline || 0 : 0));
          const name = shortenProductName(p.productName || p.barcode || p.sku || p.key) || (p.productName || p.barcode || p.sku || p.key);
          series.push({ label: `${name}·线上`, color: pair.online, dash: "", values: onlineValues, product: name, channel: "online" });
          series.push({ label: `${name}·线下`, color: pair.offline, dash: "", values: offlineValues, product: name, channel: "offline" });
        });
      }
      return { dates, series, selected, granularity: "daily" };
    }

    // 季度维度系列：把每日销量按季度聚合，同一产品不同季度对比
    function buildTrendSeriesQuarterly(model) {
      const quarters = getTrendFilteredQuarters(model);
      const selected = getTrendSelectedProducts(model);
      const f = state.salesTrendFilters;

      // 把商品的每日销量按季度聚合
      const aggregateQuarter = (p, q) => {
        let online = 0, offline = 0;
        for (const d in p.dates) {
          if (dateToQuarter(d) !== q) continue;
          if (f.startDate && d < f.startDate) continue;
          if (f.endDate && d > f.endDate) continue;
          online += p.dates[d].online || 0;
          offline += p.dates[d].offline || 0;
        }
        return { online, offline };
      };

      const series = [];
      if (f.mode === "merge") {
        const onlineValues = new Array(quarters.length).fill(0);
        const offlineValues = new Array(quarters.length).fill(0);
        selected.forEach((p) => {
          quarters.forEach((q, i) => {
            const agg = aggregateQuarter(p, q);
            onlineValues[i] += agg.online;
            offlineValues[i] += agg.offline;
          });
        });
        series.push({ label: "线上(合计)", color: TREND_ONLINE_COLOR, dash: "", values: onlineValues, channel: "online" });
        series.push({ label: "线下(合计)", color: TREND_OFFLINE_COLOR, dash: "", values: offlineValues, channel: "offline" });
      } else {
        selected.forEach((p, idx) => {
          const pair = TREND_PRODUCT_PAIRS[idx % TREND_PRODUCT_PAIRS.length];
          const onlineValues = quarters.map((q) => aggregateQuarter(p, q).online);
          const offlineValues = quarters.map((q) => aggregateQuarter(p, q).offline);
          const name = shortenProductName(p.productName || p.barcode || p.sku || p.key) || (p.productName || p.barcode || p.sku || p.key);
          series.push({ label: `${name}·线上`, color: pair.online, dash: "", values: onlineValues, product: name, channel: "online" });
          series.push({ label: `${name}·线下`, color: pair.offline, dash: "", values: offlineValues, product: name, channel: "offline" });
        });
      }
      return { dates: quarters, series, selected, granularity: "quarterly" };
    }

    // 按月维度系列：把每日销量按月聚合（YYYY-MM），介于每日与季度之间
    function getTrendFilteredMonths(model) {
      const trend = model.salesTrendModel;
      const f = state.salesTrendFilters;
      const mSet = new Set();
      trend.products.forEach((p) => {
        Object.keys(p.dates).forEach((d) => {
          if (f.startDate && d < f.startDate) return;
          if (f.endDate && d > f.endDate) return;
          const m = dateToMonth(d);
          if (m) mSet.add(m);
        });
      });
      return Array.from(mSet).sort();
    }

    function buildTrendSeriesMonthly(model) {
      const months = getTrendFilteredMonths(model);
      const selected = getTrendSelectedProducts(model);
      const f = state.salesTrendFilters;

      // 把商品的每日销量按月聚合
      const aggregateMonth = (p, m) => {
        let online = 0, offline = 0;
        for (const d in p.dates) {
          if (dateToMonth(d) !== m) continue;
          if (f.startDate && d < f.startDate) continue;
          if (f.endDate && d > f.endDate) continue;
          online += p.dates[d].online || 0;
          offline += p.dates[d].offline || 0;
        }
        return { online, offline };
      };

      const series = [];
      if (f.mode === "merge") {
        const onlineValues = new Array(months.length).fill(0);
        const offlineValues = new Array(months.length).fill(0);
        selected.forEach((p) => {
          months.forEach((m, i) => {
            const agg = aggregateMonth(p, m);
            onlineValues[i] += agg.online;
            offlineValues[i] += agg.offline;
          });
        });
        series.push({ label: "线上(合计)", color: TREND_ONLINE_COLOR, dash: "", values: onlineValues, channel: "online" });
        series.push({ label: "线下(合计)", color: TREND_OFFLINE_COLOR, dash: "", values: offlineValues, channel: "offline" });
      } else {
        selected.forEach((p, idx) => {
          const pair = TREND_PRODUCT_PAIRS[idx % TREND_PRODUCT_PAIRS.length];
          const onlineValues = months.map((m) => aggregateMonth(p, m).online);
          const offlineValues = months.map((m) => aggregateMonth(p, m).offline);
          const name = shortenProductName(p.productName || p.barcode || p.sku || p.key) || (p.productName || p.barcode || p.sku || p.key);
          series.push({ label: `${name}·线上`, color: pair.online, dash: "", values: onlineValues, product: name, channel: "online" });
          series.push({ label: `${name}·线下`, color: pair.offline, dash: "", values: offlineValues, product: name, channel: "offline" });
        });
      }
      return { dates: months, series, selected, granularity: "monthly" };
    }

    function niceCeil(value) {
      if (value <= 0) return 10;
      const exponent = Math.floor(Math.log10(value));
      const fraction = value / Math.pow(10, exponent);
      let niceFraction;
      if (fraction <= 1) niceFraction = 1;
      else if (fraction <= 2) niceFraction = 2;
      else if (fraction <= 5) niceFraction = 5;
      else niceFraction = 10;
      return niceFraction * Math.pow(10, exponent);
    }

    function renderTrendSvg(dates, series, opts = {}) {
      const hasData = dates.length > 0 && series.some((s) => s.values.some((v) => v > 0));
      if (!hasData) {
        return `<div class="trend-product-empty">当前筛选条件下没有销量数据，请调整商品或日期段。</div>`;
      }

      const n = dates.length;
      const granularity = opts.granularity || "daily";
      const showTrendLine = !!opts.showTrendLine;
      const trendMethod = opts.trendMethod || "linear";
      // 双纵轴：左轴=线上(蓝)，右轴=线下(橙)；右轴需要额外留白
      const dualAxis = series.some((s) => s.channel === "offline");
      const padL = 64, padR = dualAxis ? 64 : 24, padT = 20, padB = 50;
      const minW = opts.minW || 700, maxW = opts.maxW || 1600;
      const W = Math.min(maxW, Math.max(minW, n * 36 + padL + padR));
      // 固定宽高比：H 随 W 按比例计算，确保不同粒度（按天/月/季度）图表渲染大小一致
      // 配合 CSS width:100%;height:auto，viewBox 比例固定后浏览器渲染高度才会统一
      const aspectRatio = opts.aspectRatio || 4;
      const H = Math.round(W / aspectRatio);
      const pointR = opts.pointR || 2.4;
      const strokeW = opts.strokeWidth || 2;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      // 趋势线值参与 y 轴上限计算（线性回归可能略高于原始最大值）
      const trendValuesList = showTrendLine
        ? series.map((s) => computeTrendValues(s.values, trendMethod))
        : [];
      // 双纵轴：分别计算线上/线下的最大值
      const onlineVals = series.filter((s) => s.channel === "online").flatMap((s) => s.values);
      const offlineVals = series.filter((s) => s.channel === "offline").flatMap((s) => s.values);
      if (showTrendLine) {
        series.forEach((s, i) => {
          if (s.channel === "online") Array.prototype.push.apply(onlineVals, trendValuesList[i]);
          else if (s.channel === "offline") Array.prototype.push.apply(offlineVals, trendValuesList[i]);
        });
      }
      const yMaxLeft = niceCeil(Math.max(1, ...onlineVals));
      let yMaxRight;
      if (dualAxis) {
        const rawOfflineMax = Math.max(1, ...offlineVals);
        // 线下峰值低于线上50%时，右轴量程按线下峰值*2（让线下线约占图表50%高度，看得清趋势又不至于过度放大）；
        // 超过线上50%则按线下实际峰值。
        if (rawOfflineMax < yMaxLeft * 0.5) {
          yMaxRight = niceCeil(rawOfflineMax * 2);
        } else {
          yMaxRight = niceCeil(rawOfflineMax);
        }
      } else {
        yMaxRight = yMaxLeft;
      }

      const x = (i) => padL + (n <= 1 ? plotW / 2 : (i * plotW) / (n - 1));
      // 根据 channel 决定用左轴还是右轴比例
      const y = (v, channel) => {
        const yMax = channel === "offline" ? yMaxRight : yMaxLeft;
        return padT + plotH - (Math.max(0, v) / yMax) * plotH;
      };

      // 横向网格 + 左 y 轴刻度(蓝色, 线上)
      const yTicks = 5;
      let gridHtml = "";
      for (let t = 0; t <= yTicks; t++) {
        const val = (yMaxLeft / yTicks) * t;
        const yy = y(val, "online");
        gridHtml += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="#ececec" stroke-width="1"/>`;
        gridHtml += `<text x="${padL - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="${TREND_ONLINE_COLOR}">${formatInteger(val)}</text>`;
      }
      // 右 y 轴刻度(橙色, 线下)
      let rightAxisHtml = "";
      if (dualAxis) {
        rightAxisHtml += `<line x1="${W - padR}" y1="${padT}" x2="${W - padR}" y2="${padT + plotH}" stroke="#c9bdaa" stroke-width="1"/>`;
        for (let t = 0; t <= yTicks; t++) {
          const val = (yMaxRight / yTicks) * t;
          const yy = y(val, "offline");
          rightAxisHtml += `<text x="${W - padR + 8}" y="${yy + 4}" text-anchor="start" font-size="11" fill="${TREND_OFFLINE_COLOR}">${formatInteger(val)}</text>`;
        }
      }

      // x 轴刻度(日期/季度)，太多时跳着显示
      const xStep = Math.max(1, Math.ceil(n / 12));
      let xLabelsHtml = "";
      for (let i = 0; i < n; i += xStep) {
        const xx = x(i);
        // 季度显示 "YYYY-Qn"，月份显示 "YYYY-MM"，日维度显示 "MM-DD"
        const label = (granularity === "quarterly" || granularity === "monthly") ? dates[i] : dates[i].slice(5);
        xLabelsHtml += `<text x="${xx}" y="${H - padB + 18}" text-anchor="middle" font-size="11" fill="#736454">${label}</text>`;
        xLabelsHtml += `<line x1="${xx}" y1="${padT + plotH}" x2="${xx}" y2="${padT + plotH + 4}" stroke="#c9bdaa" stroke-width="1"/>`;
      }
      // 起止完整标注
      xLabelsHtml += `<text x="${padL}" y="${H - 8}" text-anchor="start" font-size="11" fill="#2d241d">${dates[0]}</text>`;
      xLabelsHtml += `<text x="${W - padR}" y="${H - 8}" text-anchor="end" font-size="11" fill="#2d241d">${dates[n - 1]}</text>`;

      // 折线
      let linesHtml = "";
      series.forEach((s, sIdx) => {
        if (!s.values.some((v) => v > 0)) return;
        const ch = s.channel || "online";
        const pts = s.values.map((v, i) => `${x(i).toFixed(1)},${y(v, ch).toFixed(1)}`).join(" ");
        const dashAttr = s.dash ? ` stroke-dasharray="${s.dash}"` : "";
        linesHtml += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${strokeW}" stroke-linejoin="round" stroke-linecap="round"${dashAttr} opacity="0.92"/>`;
        // 数据点(数据量不大时显示)
        if (n <= 60) {
          s.values.forEach((v, i) => {
            if (v > 0) {
              linesHtml += `<circle cx="${x(i).toFixed(1)}" cy="${y(v, ch).toFixed(1)}" r="${pointR}" fill="${s.color}" opacity="0.92"/>`;
            }
          });
        }
        // 起止数值标注：用该线对应的轴颜色，标在起点左侧和终点右侧
        const firstIdx = s.values.findIndex((v) => v > 0);
        const lastIdx = s.values.length - 1 - [...s.values].reverse().findIndex((v) => v > 0);
        if (firstIdx >= 0 && firstIdx < n) {
          const fv = s.values[firstIdx];
          const fx = x(firstIdx);
          const fy = y(fv, ch);
          // 起点：标在线点左侧，用同色背景块避免与网格刻度重叠
          linesHtml += `<text x="${(fx - 6).toFixed(1)}" y="${(fy - 6).toFixed(1)}" text-anchor="end" font-size="11" font-weight="600" fill="${s.color}">${formatInteger(fv)}</text>`;
        }
        if (lastIdx > firstIdx && lastIdx < n) {
          const lv = s.values[lastIdx];
          const lx = x(lastIdx);
          const ly = y(lv, ch);
          // 终点：标在线点右侧
          linesHtml += `<text x="${(lx + 6).toFixed(1)}" y="${(ly - 6).toFixed(1)}" text-anchor="start" font-size="11" font-weight="600" fill="${s.color}">${formatInteger(lv)}</text>`;
        }
        // 趋势线：用同色虚线，半透明，叠加在原折线之上
        if (showTrendLine) {
          const tv = trendValuesList[sIdx];
          if (tv && tv.length === n) {
            const tPts = tv.map((v, i) => `${x(i).toFixed(1)},${y(v, ch).toFixed(1)}`).join(" ");
            const tLabel = trendMethod === "ma" ? "移动平均" : "线性回归";
            linesHtml += `<polyline points="${tPts}" fill="none" stroke="${s.color}" stroke-width="${(strokeW * 0.8).toFixed(2)}" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 4" opacity="0.6" data-trend-line="1" data-trend-label="${tLabel}"/>`;
            // 趋势线起止数值标注：保留一位小数（避免 0.x 被取整为 0）
            // 放在图表内部（绘图区域内），避免与左右 Y 轴刻度重叠
            const tFirst = tv[0];
            const tLast = tv[n - 1];
            const tfy = y(tFirst, ch);
            const tly = y(tLast, ch);
            linesHtml += `<text x="${(x(0) + 8).toFixed(1)}" y="${(tfy + 14).toFixed(1)}" text-anchor="start" font-size="10" fill="${s.color}" opacity="0.85">${formatTrendFloat(tFirst)}</text>`;
            linesHtml += `<text x="${(x(n - 1) - 8).toFixed(1)}" y="${(tly + 14).toFixed(1)}" text-anchor="end" font-size="10" fill="${s.color}" opacity="0.85">${formatTrendFloat(tLast)}</text>`;
          }
        }
      });

      // 坐标轴
      const axesHtml = `
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#c9bdaa" stroke-width="1"/>
        <line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="#c9bdaa" stroke-width="1"/>
        <text x="${padL - 44}" y="${padT + plotH / 2}" text-anchor="middle" font-size="11" fill="${TREND_ONLINE_COLOR}" transform="rotate(-90 ${padL - 44} ${padT + plotH / 2})">线上销量</text>
        ${dualAxis ? `<text x="${W - padR + 44}" y="${padT + plotH / 2}" text-anchor="middle" font-size="11" fill="${TREND_OFFLINE_COLOR}" transform="rotate(90 ${W - padR + 44} ${padT + plotH / 2})">线下销量</text>` : ""}
      `;

      // Tooltip 交互：在 SVG 内覆盖透明层捕获鼠标，并输出 data-* 属性供 JS 读取
      let overlayHtml = "";
      if (n <= 365) {
        const colW = plotW / n;
        for (let i = 0; i < n; i++) {
          const cx = x(i);
          const rx = Math.max(colW / 2, 10);
          overlayHtml += `<rect x="${cx - rx}" y="${padT}" width="${rx * 2}" height="${plotH}" fill="white" fill-opacity="0" pointer-events="all" data-trend-tip="1" data-date="${dates[i]}" data-values="${series.map((s) => s.values[i] || 0).join(",")}" data-labels="${series.map((s) => s.label).join(",")}" data-colors="${series.map((s) => s.color).join(",")}"/>`;
        }
      }

      return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="销量趋势折线图" data-trend-svg="1">
        ${gridHtml}
        ${rightAxisHtml}
        ${axesHtml}
        ${linesHtml}
        ${xLabelsHtml}
        ${overlayHtml}
      </svg>`;
    }

    function renderTrendLegendHtml(series, selected, mode, f) {
      const items = [];
      if (mode === "merge") {
        items.push(`<span class="trend-legend-item"><span class="trend-legend-swatch" style="background:${TREND_ONLINE_COLOR}"></span>线上(合计)</span>`);
        items.push(`<span class="trend-legend-item"><span class="trend-legend-swatch" style="background:${TREND_OFFLINE_COLOR}"></span>线下(合计)</span>`);
      } else {
        // 分商品：每条折线独立颜色，两两对比时 4 条线 4 种颜色
        series.forEach((s) => {
          items.push(`<span class="trend-legend-item"><span class="trend-legend-swatch" style="background:${s.color}"></span>${escapeHtml(s.label)}</span>`);
        });
      }
      if (f && f.showTrendLine) {
        const tName = f.trendMethod === "ma" ? "移动平均" : "线性回归";
        items.push(`<span class="trend-legend-item"><span class="trend-legend-swatch trend-legend-swatch--dash" style="background:repeating-linear-gradient(90deg,#736454 0 6px,transparent 6px 10px);"></span>趋势线(${tName})</span>`);
      }
      return `<div class="trend-legend">${items.join("")}</div>`;
    }

    function renderTrendSummaryHtml(dates, series, granularity) {
      let totalOnline = 0, totalOffline = 0;
      series.forEach((s) => {
        const sum = s.values.reduce((a, b) => a + b, 0);
        if (s.channel === "online") totalOnline += sum;
        else totalOffline += sum;
      });
      // 找单点总量最高
      let peakVal = 0, peakDate = "";
      for (let i = 0; i < dates.length; i++) {
        let dayTotal = 0;
        series.forEach((s) => { dayTotal += s.values[i] || 0; });
        if (dayTotal > peakVal) { peakVal = dayTotal; peakDate = dates[i]; }
      }
      const periodCount = dates.length || 1;
      const avg = (totalOnline + totalOffline) / periodCount;
      const isQuarterly = granularity === "quarterly";
      const isMonthly = granularity === "monthly";
      const peakLabel = isQuarterly ? "单季峰值" : isMonthly ? "单月峰值" : "单日峰值";
      const avgLabel = isQuarterly ? "季均总销量" : isMonthly ? "月均总销量" : "日均总销量";
      const periodUnit = isQuarterly ? "个季度" : isMonthly ? "个月" : "天";
      return `
        <div class="trend-summary">
          <div class="trend-stat"><small>线上销量合计</small><strong style="color:${TREND_ONLINE_COLOR}">${formatInteger(totalOnline)}</strong></div>
          <div class="trend-stat"><small>线下销量合计</small><strong style="color:${TREND_OFFLINE_COLOR}">${formatInteger(totalOffline)}</strong></div>
          <div class="trend-stat"><small>${peakLabel}</small><strong>${formatInteger(peakVal)}</strong><div class="note">${escapeHtml(peakDate || "-")}</div></div>
          <div class="trend-stat"><small>${avgLabel}</small><strong>${avg.toFixed(1)}</strong><div class="note">${periodCount} ${periodUnit}</div></div>
        </div>
      `;
    }

    function renderTrendChartAreaHtml(model) {
      const { dates, series, selected, granularity } = buildTrendSeries(model);
      const f = state.salesTrendFilters;
      const svg = renderTrendSvg(dates, series, {
        granularity,
        showTrendLine: f.showTrendLine,
        trendMethod: f.trendMethod,
      });
      const legend = renderTrendLegendHtml(series, selected, f.mode, f);
      const summary = renderTrendSummaryHtml(dates, series, granularity);
      return `${summary}<div class="trend-chart-wrap" data-trend-chart="1" title="点击放大查看">${svg}<div class="trend-chart-zoom-hint">点击图表可放大查看</div></div>${legend}`;
    }

    function renderSalesTrendLoading() {
      return `
        <div class="panel trend-panel">
          <div class="block-head">
            <div>
              <h2>每日销量趋势对比</h2>
              <div class="note">正在解析销量文件，大文件可能需要数十秒，请稍候…</div>
            </div>
          </div>
          <div class="soft-card" style="text-align:center;padding:48px 16px;">
            <div class="trend-loading-spinner"></div>
            <div class="note" style="margin-top:14px;">解析中，请勿关闭或刷新页面</div>
          </div>
        </div>
      `;
    }

    function ensureTrendModal() {
      let modal = document.getElementById("trend-chart-modal");
      if (modal) return modal;
      modal = document.createElement("div");
      modal.id = "trend-chart-modal";
      modal.className = "trend-modal";
      modal.innerHTML = `
        <div class="trend-modal-back"></div>
        <div class="trend-modal-box">
          <div class="trend-modal-head">
            <strong>每日销量趋势对比（放大）</strong>

    // 销售趋势 tooltip 交互
    function bindTrendTooltip(container) {
      if (container._trendTooltipBound) return;
      container._trendTooltipBound = true;
      let tip = document.getElementById("trend-tooltip");
      if (!tip) {
        tip = document.createElement("div");
        tip.id = "trend-tooltip";
        tip.style.cssText = "position:fixed;z-index:10000;pointer-events:none;background:rgba(45,36,29,.92);color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.6;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:260px;";
        document.body.appendChild(tip);
      }
      container.addEventListener("mouseover", (e) => {
        const rect = e.target.closest("[data-trend-tip]");
        if (!rect) { tip.style.display = "none"; return; }
        const date = rect.dataset.date || "";
        const values = (rect.dataset.values || "").split(",").map((v) => Number(v) || 0);
        const labels = (rect.dataset.labels || "").split(",");
        const colors = (rect.dataset.colors || "").split(",");
        let html = `<div style="font-weight:600;margin-bottom:4px;">${escapeHtml(date)}</div>`;
        for (let i = 0; i < labels.length; i++) {
          if (!labels[i]) continue;
          const val = values[i] || 0;
          const color = colors[i] || "#fff";
          html += `<div style="display:flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:${color};display:inline-block;"></span><span>${escapeHtml(labels[i])}: <strong>${formatInteger(val)}</strong></span></div>`;
        }
        tip.innerHTML = html;
        tip.style.display = "block";
        // 立即定位到鼠标位置，避免初始出现在 (0,0)
        const px = e.clientX + 14;
        const py = e.clientY + 14;
        const maxX = window.innerWidth - tip.offsetWidth - 10;
        const maxY = window.innerHeight - tip.offsetHeight - 10;
        tip.style.left = Math.min(px, maxX) + "px";
        tip.style.top = Math.min(py, maxY) + "px";
      });
      container.addEventListener("mousemove", (e) => {
        if (tip.style.display !== "block") return;
        const x = e.clientX + 14;
        const y = e.clientY + 14;
        const maxX = window.innerWidth - tip.offsetWidth - 10;
        const maxY = window.innerHeight - tip.offsetHeight - 10;
        tip.style.left = Math.min(x, maxX) + "px";
        tip.style.top = Math.min(y, maxY) + "px";
      });
      container.addEventListener("mouseleave", () => {
        tip.style.display = "none";
      });
    }

    // ===== 快团团销售单导入 =====

    // 解析快团团聊天记录为导入行
    // 输入：多订单聊天记录文本
    // 输出：[{importNo, name, phone, address, csNote, productName, qty}]
    function parseKttChatLog(text) {
      if (!text || !text.trim()) return [];
      // 按"跟团号："分割订单块
      const blocks = text.split(/跟团号[：:]/).slice(1);
      const rows = [];
      let importNo = 0;
      blocks.forEach((block) => {
        const orderText = block.trim();
        if (!orderText) return;
        // 提取跟团号（块开头的数字）
        const groupMatch = orderText.match(/^(\d+)/);
        const groupNo = groupMatch ? groupMatch[1] : "";
        // 提取订单编号
        const orderMatch = orderText.match(/订单编号[：:]\s*([^\n\r]+)/);
        const orderNo = orderMatch ? orderMatch[1].trim() : "";
        // 提取商品信息
        const productMatch = orderText.match(/商品信息[：:]\s*\n([\s\S]*?)(?=\n快递信息[：:]|$)/);
        const productInfo = productMatch ? productMatch[1].trim() : "";
        // 提取收货信息
        const addrMatch = orderText.match(/收货信息[：:]\s*([^\n\r]+)/);
        const addrInfo = addrMatch ? addrMatch[1].trim() : "";
        // 提取团员备注
        const memberNoteMatch = orderText.match(/团员备注[：:]\s*([^\n\r]+)/);
        const memberNote = memberNoteMatch ? memberNoteMatch[1].trim() : "";

        // 解析收货信息：姓名 手机号 地址
        let name = "", phone = "", address = "";
        if (addrInfo) {
          const parts = addrInfo.split(/\s+/);
          if (parts.length >= 3) {
            name = parts[0];
            phone = parts[1];
            address = parts.slice(2).join(" ");
          } else if (parts.length === 2) {
            name = parts[0];
            phone = parts[1];
          } else {
            name = parts[0] || "";
          }
        }

        // 客服备注：跟团号 + 订单编号
        const csNote = `跟团号：${groupNo}\n订单编号：${orderNo}`;

        importNo += 1;

        // 判断是否香型备注
        const isFragranceNote = productInfo.includes("香型备注");

        if (isFragranceNote) {
          // 香型备注：从团员备注解析商品和数量
          const items = parseKttMemberNotes(memberNote);
          if (items.length === 0) {
            // 备注为"暂无"等无效内容，回退用商品信息名称
            const fallback = extractKttProductName(productInfo);
            rows.push({ importNo, name, phone, address, csNote, productName: fallback, qty: 1 });
          } else {
            items.forEach((item) => {
              rows.push({ importNo, name, phone, address, csNote, productName: item.name, qty: item.qty });
            });
          }
        } else {
          // 非香型备注：直接用商品信息
          const product = extractKttProductInfo(productInfo);
          rows.push({ importNo, name, phone, address, csNote, productName: product.name, qty: product.qty });
        }
      });
      return rows;
    }

    // 解析团员备注为商品项数组 [{name, qty}]
    // 支持分隔符：逗号(，,)、加号(+)、&、空格、中文"和"
    function parseKttMemberNotes(note) {
      if (!note || note === "暂无" || note === "无") return [];
      // 按逗号/加号/&/和 分割
      let parts = note.split(/[，,+&]|和/).map((s) => s.trim()).filter(Boolean);
      // 对每段再按空格分割（处理"月影和琥珀 薄荷"等混合分隔）
      parts = parts.flatMap((p) => p.includes(" ") ? p.split(/\s+/).map((s) => s.trim()).filter(Boolean) : [p]);
      return parts.map((part) => {
        // 解析 "xN" 或 "×N" 后缀
        const m = part.match(/^(.+?)[x×](\d+)$/);
        if (m) {
          return { name: m[1].trim(), qty: parseInt(m[2], 10) };
        }
        return { name: part, qty: 1 };
      });
    }

    // 从商品信息提取产品名（非香型备注情况）
    // 格式如 "黑爪：风雅色香水x1瓶(月影) +1" → {name: "风雅色香水(月影)", qty: 1}
    function extractKttProductInfo(info) {
      if (!info) return { name: "", qty: 1 };
      let text = info.trim();
      // 去除品牌前缀（"黑爪："等）
      const colonIdx = text.indexOf("：");
      if (colonIdx >= 0) text = text.slice(colonIdx + 1).trim();
      const colonIdx2 = text.indexOf(":");
      if (colonIdx2 >= 0 && colonIdx2 < 10) text = text.slice(colonIdx2 + 1).trim();
      // 提取括号内容（香型规格）
      const parenMatch = text.match(/[（(]([^)）]+)[)）]/);
      const fragrance = parenMatch ? parenMatch[1].trim() : "";
      // 去除括号及之后内容
      text = text.replace(/[（(][^)）]+[)）]/g, "").trim();
      // 提取数量 xN 或 ×N
      const qtyMatch = text.match(/[x×](\d+)/);
      const qty = qtyMatch ? parseInt(qtyMatch[1], 10) : 1;
      // 去除 xN 和后缀
      text = text.replace(/[x×]\d+.*$/, "").trim();
      // 拼接香型规格
      const name = fragrance ? `${text}(${fragrance})` : text;
      return { name: name || info, qty };
    }

    // 从商品信息提取产品名（简版，用于香型备注回退）
    function extractKttProductName(info) {
      if (!info) return "";
      let text = info.trim();
      const colonIdx = text.indexOf("：");
      if (colonIdx >= 0) text = text.slice(colonIdx + 1).trim();
      const qtyMatch = text.match(/[x×](\d+)/);
      text = text.replace(/[（(][^)）]+[)）]/g, "").replace(/[x×]\d+.*$/, "").trim();
      return text || info;
    }

    // 导出快团团导入数据为 Excel
    function exportKttImportExcel(rows) {
      if (!rows || !rows.length) {
        alert("没有可导出的数据，请先粘贴并解析聊天记录");
        return;
      }
      const headers = ["导入编号", "收货人", "手机", "收货地址", "客服备注", "货品名称", "数量"];
      const data = [headers];
      rows.forEach((row) => {
        data.push([
          row.importNo,
          row.name,
          row.phone,
          row.address,
          row.csNote,
          row.productName,
          row.qty,
        ]);
      });
      const ws = XLSX.utils.aoa_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "快团团导入");
      const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, "-");
      XLSX.writeFile(wb, `快团团导入_${timestamp}.xlsx`);
    }

        bindCheckboxes();
      };
      const refreshChart = () => {
        chartEl.innerHTML = renderTrendChartAreaHtml(model);
      };

      const bindCheckboxes = () => {
        listEl.querySelectorAll('input[type="checkbox"][data-trend-key]').forEach((cb) => {
          cb.addEventListener("change", () => {
            const key = cb.dataset.trendKey;
            const set = new Set(state.salesTrendFilters.selectedKeys);
            if (cb.checked) {
              set.add(key);
              // 最多两两对比：超出 2 个时移除最早选中的
              while (set.size > 2) {
                const oldest = state.salesTrendFilters.selectedKeys.find((k) => set.has(k));
                if (oldest) set.delete(oldest);
              }
            } else {
              set.delete(key);
            }
            state.salesTrendFilters.selectedKeys = Array.from(set);
            refreshList();
            refreshChart();
            cacheAppState();
          });
        });
      };

      bindCheckboxes();

      const searchEl = document.getElementById("trend-search");
      if (searchEl) {
        searchEl.addEventListener("input", () => {
          state.salesTrendFilters.search = searchEl.value || "";
          refreshList();
          cacheAppState();
        });
      }

      const startEl = document.getElementById("trend-start");
      const endEl = document.getElementById("trend-end");
      if (startEl) {
        startEl.addEventListener("change", () => {
          state.salesTrendFilters.startDate = startEl.value || "";
          refreshChart();
          cacheAppState();
        });
      }
      if (endEl) {
        endEl.addEventListener("change", () => {
          state.salesTrendFilters.endDate = endEl.value || "";
          refreshChart();
          cacheAppState();
        });
      }

      // 分类筛选（来自商品资料G列）
      const categoryEl = document.getElementById("trend-category");
      if (categoryEl) {
        categoryEl.addEventListener("change", () => {
          state.salesTrendFilters.category = categoryEl.value || "全部";
          // 切换分类后，清空已选商品中不属于该分类的项
          const keySet = new Set(state.salesTrendFilters.selectedKeys);
          const validKeys = new Set(model.salesTrendModel.products
            .filter((p) => !state.salesTrendFilters.category || state.salesTrendFilters.category === "全部" || (p.category || "") === state.salesTrendFilters.category)
            .map((p) => p.key));
          state.salesTrendFilters.selectedKeys = Array.from(keySet).filter((k) => validKeys.has(k));
          refreshList();
          refreshChart();
          cacheAppState();
        });
      }

      document.querySelectorAll(".trend-mode-btn[data-trend-mode]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.salesTrendFilters.mode = btn.dataset.trendMode || "split";
          refreshChart();
          // 更新按钮高亮
          document.querySelectorAll(".trend-mode-btn[data-trend-mode]").forEach((b) => {
            b.classList.toggle("active", b.dataset.trendMode === state.salesTrendFilters.mode);
          });
          cacheAppState();
        });
      });

      // 视图粒度切换：每日 / 按季度
      document.querySelectorAll(".trend-mode-btn[data-trend-granularity]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.salesTrendFilters.granularity = btn.dataset.trendGranularity || "daily";
          // 切换粒度时刷新整个面板（标题/提示文案需同步更新）
          render();
          cacheAppState();
        });
      });

      // 趋势线开关与算法切换
      document.querySelectorAll(".trend-mode-btn[data-trend-trendline]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const v = btn.dataset.trendTrendline;
          if (v === "off") {
            state.salesTrendFilters.showTrendLine = false;
          } else {
            state.salesTrendFilters.showTrendLine = true;
            state.salesTrendFilters.trendMethod = v === "ma" ? "ma" : "linear";
          }
          refreshChart();
          // 同步按钮高亮
          const f = state.salesTrendFilters;
          document.querySelectorAll(".trend-mode-btn[data-trend-trendline]").forEach((b) => {
            const bv = b.dataset.trendTrendline;
            const active = bv === "off" ? !f.showTrendLine
              : (f.showTrendLine && (bv === "linear" ? f.trendMethod === "linear" : f.trendMethod === "ma"));
            b.classList.toggle("active", active);
          });
          cacheAppState();
        });
      });

      const top2Btn = document.getElementById("trend-select-top2");
      if (top2Btn) {
        top2Btn.addEventListener("click", () => {
          // 前2对比：尊重当前分类筛选，取该分类下销量最高的2个商品
          const f = state.salesTrendFilters;
          const pool = model.salesTrendModel.products.filter((p) =>
            !f.category || f.category === "全部" || (p.category || "") === f.category
          );
          state.salesTrendFilters.selectedKeys = pool.slice(0, 2).map((p) => p.key);
          refreshList();
          refreshChart();
          cacheAppState();
        });
      }
      const clearBtn = document.getElementById("trend-clear");
      if (clearBtn) {
        clearBtn.addEventListener("click", () => {
          state.salesTrendFilters.selectedKeys = [];
          refreshList();
          refreshChart();
          cacheAppState();
        });
      }

// 点击折线图区域弹出放大弹窗
chartEl.addEventListener("click", (e) => {
if (e.target.closest(".trend-chart-wrap--modal")) return;
openTrendChartModal(model);
});

// 鼠标悬停 tooltip：绑定到 chartEl 利用事件委托
bindTrendTooltip(chartEl);

}

    function renderEmptyTabContent() {
      // 根据当前选中的 Tab 显示对应的空状态
      if (state.activeTab === "matrix") {
        return renderMatrixEmpty();
      }
      if (state.activeTab === "salesTrend") {
        return renderSalesTrendEmpty();
      }
      return renderCockpitEmpty();
    }

    function renderSalesTrendEmpty() {
      return `
        <div class="panel trend-panel" id="trend-empty-panel">
          <div class="block-head">
            <div>
              <h2>每日销量趋势对比</h2>
              <div class="note">请先上传一份各商品每天线上 / 线下销售数量文件，系统会绘制折线趋势图。</div>
            </div>
            <button class="primary" id="trend-upload-btn">上传每日销量文件</button>
          </div>
          <div class="soft-card">
            <div style="display:grid;gap:12px;">
              <div class="note">文件要求：</div>
              <ul style="margin:0;padding-left:20px;color:var(--muted);">
                <li>格式：Excel (.xlsx/.xls) 或 CSV</li>
                <li>必需列：商品(品名/条码/编码)、日期</li>
                <li>销量列：线上销量 + 线下销量（或「渠道 + 数量」长格式）</li>
              </ul>
              <div class="note" style="margin-top:8px;">上传后，横轴=日期、纵轴=销量，蓝色线=线上、橙色线=线下，可多商品对比、按日期段筛选。</div>
            </div>
          </div>
          <input id="trend-empty-input" type="file" accept=".xlsx,.xls,.csv" hidden>
        </div>
      `;
    }

    function renderEmptyState(model) {
      const empty = document.getElementById("empty-state");
      const anyLoading = SOURCE_CONFIGS.some((cfg) => model.sources[cfg.key].loading);
      // 只在文件加载中时显示通用加载提示，空状态由 tab-content 中的模式专属提示处理
      empty.style.display = (!model.uploadedCount && anyLoading) ? "grid" : "none";
      if (!model.uploadedCount && anyLoading) {
        empty.innerHTML = `
          <h2>正在解析文件</h2>
          <p>文件正在读取中，等它解析完成后，这里就会自动切换成数据视图。</p>
        `;
      }
    }

    function render(model = buildModel()) {
      // 侧边栏折叠/展开
      const sidebarEl = document.querySelector(".sidebar");
      const layoutEl = document.querySelector(".layout");
      const toggleBtn = document.getElementById("sidebar-toggle-btn");
      const restoreBtn = document.getElementById("restore-sidebar");
      if (sidebarEl && layoutEl) {
        const collapsed = state.sidebarCollapsed;
        sidebarEl.classList.toggle("collapsed", collapsed);
        layoutEl.classList.toggle("sidebar-hidden", collapsed);
        if (restoreBtn) restoreBtn.style.display = collapsed ? "" : "none";
      }
      if (toggleBtn && !toggleBtn.dataset.bound) {
        toggleBtn.dataset.bound = "1";
        toggleBtn.addEventListener("click", () => {
          state.sidebarCollapsed = true;
          render();
        });
      }
      if (restoreBtn && !restoreBtn.dataset.bound) {
        restoreBtn.dataset.bound = "1";
        restoreBtn.addEventListener("click", () => {
          state.sidebarCollapsed = false;
          render();
        });
      }
      renderModeSwitch(model);
      renderSidebarInfo(model);
      renderProgressPills(model);
      renderSourceList(model);
      renderDataQuality(model);
      renderEmptyState(model);

      // 按 tab 控制顶部按钮：批量上传/清空全部只在驾驶舱显示
      const batchBtn = document.getElementById("batch-upload");
      const clearBtn = document.getElementById("clear-all");
      const isCockpit = state.activeTab === "cockpit";
      if (batchBtn) batchBtn.style.display = isCockpit ? "" : "none";
      if (clearBtn) clearBtn.style.display = isCockpit ? "" : "none";

      const kpiGrid = document.getElementById("kpi-grid");
      const tabsPanel = document.getElementById("tabs-panel");
      const tabsBar = document.getElementById("tabs");

      // 始终显示内容面板
      tabsPanel.style.display = "block";

      if (state.activeTab === "cockpit") {
        // 驾驶舱模式：显示子标签栏
        tabsBar.style.display = "flex";
        renderCockpitSubtabs(model);
      } else {
        // 九宫格模式：隐藏子标签栏
        tabsBar.style.display = "none";
      }

      // 销售趋势解析中：先显示加载态，避免用户以为卡死
      if (state.activeTab === "salesTrend" && state.sources.salesTrend && state.sources.salesTrend.loading) {
        kpiGrid.style.display = "none";
        tabsBar.style.display = "none";
        document.getElementById("tab-content").innerHTML = renderSalesTrendLoading();
        return;
      }

      // 快团团导入不需要上传文件，直接渲染
      if (state.activeTab === "kttImport") {
        kpiGrid.style.display = "none";
        tabsBar.style.display = "none";
        renderTabContent(model);
        return;
      }

      if (!model.uploadedCount) {
        kpiGrid.style.display = "none";
        // 显示空状态提示
        document.getElementById("tab-content").innerHTML = renderEmptyTabContent();

        // 绑定九宫格空状态的上传按钮事件
        if (state.activeTab === "matrix") {
          const uploadBtn = document.getElementById("matrix-upload-btn");
          const fileInput = document.getElementById("matrix-empty-input");
          if (uploadBtn && fileInput) {
            uploadBtn.addEventListener("click", () => {
              fileInput.click();
            });
            fileInput.addEventListener("change", async () => {
              const file = fileInput.files && fileInput.files[0];
              if (!file) return;
              await handleUpload("matrixWorkbook", file);
              fileInput.value = "";
            });
          }
        }
        // 绑定销售趋势空状态的上传按钮事件
        if (state.activeTab === "salesTrend") {
          const uploadBtn = document.getElementById("trend-upload-btn");
          const fileInput = document.getElementById("trend-empty-input");
          if (uploadBtn && fileInput) {
            uploadBtn.addEventListener("click", () => {
              fileInput.click();
            });
            fileInput.addEventListener("change", async () => {
              const file = fileInput.files && fileInput.files[0];
              if (!file) return;
              await handleUpload("salesTrend", file);
              fileInput.value = "";
            });
          }
        }
        return;
      }

      // 驾驶舱模式才显示 KPI
      if (state.activeTab === "cockpit") {
        kpiGrid.style.display = "grid";
        renderKpis(model);
      } else {
        kpiGrid.style.display = "none";
      }

      renderTabContent(model);
      cacheAppState();
      // 联动总表滚动定位：仅在从九宫格跳转到联动总表时触发（matrixScrollTarget="table"）
      // 避免筛选/翻页等常规 render 时无脑滚动到之前聚焦的行
      if (state.matrixScrollTarget === "table" && state.matrixFocusKey) {
        requestAnimationFrame(scrollToFocusedRow);
      }
      // 清除滚动目标标记
      state.matrixScrollTarget = "";
    }

    async function handleUpload(key, file, options = {}) {
      const { skipInitialRender = false, skipFinalRender = false } = options;
      const source = state.sources[key];
      const cfg = SOURCE_CONFIGS.find((item) => item.key === key);
      source.loading = true;
      source.error = "";
      if (!skipInitialRender) render();

      try {
        if (key === "matrixWorkbook") {
          // 上传新文件时清除旧的聚焦、展开状态和筛选条件，避免渲染后被筛选条件过滤为空导致页面卡死
          state.matrixFocusKey = "";
          state.matrixExpandedCells = {};
          state.matrixFilters = { category: "全部", isRegularPrice: "全部", productionNote: "全部", kpiFilter: "all" };
          const fileData = await parseMatrixWorkbookRowsFromFile(file);
          state.sources[key] = {
            ...createEmptySourceState(cfg),
            key,
            label: cfg.label,
            fileName: file.name,
            sheetName: fileData.sheetName,
            importedAt: new Date().toISOString(),
            rows: fileData.rows,
            imageDataByTarget: fileData.imageDataByTarget || {},
            loading: false,
            error: "",
          };
          // 自动读取销售时间段
          if (fileData.salesPeriod) {
            state.salesPeriod = fileData.salesPeriod;
          }
        } else if (key === "salesTrend") {
          const fileData = await parseSalesTrendRowsFromFile(file);
          state.sources[key] = {
            ...createEmptySourceState(cfg),
            key,
            label: cfg.label,
            fileName: file.name,
            sheetName: fileData.sheetName,
            importedAt: new Date().toISOString(),
            rows: fileData.rows,
            loading: false,
            error: "",
          };
        } else {
          const fileData = await readRowsFromFile(file, cfg.preferredSheets);
          const parsed = cfg.parser(fileData.rows);
          state.sources[key] = {
            ...createEmptySourceState(cfg),
            key,
            label: cfg.label,
            fileName: file.name,
            sheetName: fileData.sheetName,
            importedAt: new Date().toISOString(),
            rows: parsed,
            loading: false,
            error: "",
          };
        }
      } catch (error) {
        state.sources[key] = {
          ...state.sources[key],
          loading: false,
          error: error && error.message ? error.message : "文件解析失败",
        };
      }

      // 如果是销售数据上传，自动更新销售时间段
      if (key === "channelSales" || key === "storeSales") {
        const periodFromData = getSalesPeriodFromData(state.sources);
        if (periodFromData) {
          state.salesPeriod = periodFromData;
        }
      }

      // 销售趋势文件上传后：自动设置日期段并默认选中销量最高的商品
      if (key === "salesTrend") {
        const trend = buildSalesTrendModel(state.sources.salesTrend.rows, state.sources.product.rows);
        state.salesTrendFilters.startDate = trend.dateMin || "";
        state.salesTrendFilters.endDate = trend.dateMax || "";
        state.salesTrendFilters.search = "";
        state.salesTrendFilters.mode = trend.products.length <= 1 ? "split" : "split";
        // 默认选中总销量(线上+线下)最高的商品
        const topKey = trend.products
          .slice()
          .sort((a, b) => (b.totalOnline + b.totalOffline) - (a.totalOnline + a.totalOffline))[0]?.key || "";
        state.salesTrendFilters.selectedKeys = topKey ? [topKey] : [];
      }

      if (!skipFinalRender) render();
    }

    async function handleBatchUpload(files) {
      const list = Array.from(files || []).filter(Boolean);
      if (!list.length) return;

      const unmatched = [];
      let matchedCount = 0;
      for (const file of list) {
        const key = inferSourceKeyFromFileName(file.name);
        if (!key) {
          unmatched.push(file.name);
          continue;
        }
        matchedCount += 1;
        await handleUpload(key, file, { skipInitialRender: true, skipFinalRender: true });
      }

      render();

      if (unmatched.length) {
        const message = `已导入 ${matchedCount} 个文件，以下文件暂时没识别出类型：${unmatched.join("、")}`;
        setBatchNote(message);
      } else {
        setBatchNote(`已批量导入 ${matchedCount} 个文件。`);
      }
    }

    function clearSource(key) {
      const cfg = SOURCE_CONFIGS.find((item) => item.key === key);
      state.sources[key] = createEmptySourceState(cfg);
      setBatchNote("");
      render();
    }

    function clearAll() {
      SOURCE_CONFIGS.forEach((cfg) => {
        state.sources[cfg.key] = createEmptySourceState(cfg);
      });
      state.activeTab = "cockpit";
      state.cockpitSubtab = "overview";
      state.matrixFocusKey = "";
      state.matrixExpandedCells = {};
      state.matrixFilters = { category: "全部", isRegularPrice: "全部", productionNote: "全部", kpiFilter: "all" };
      state.salesTrendFilters = { selectedKeys: [], startDate: "", endDate: "", search: "", mode: "split", granularity: "daily", showTrendLine: false, trendMethod: "linear", category: "全部" };
      // 注: granularity 支持 daily / monthly / quarterly
      setBatchNote("");
      render();
    }

    // 模式切换事件
    document.getElementById("mode-switch").addEventListener("click", (event) => {
      const btn = event.target.closest(".mode-btn");
      if (!btn) return;
      const mode = btn.dataset.mode;
      if (mode === state.activeTab) return;
      state.activeTab = mode;
      render();
    });

    document.getElementById("clear-all").addEventListener("click", clearAll);
    document.getElementById("batch-upload").addEventListener("click", () => {
      document.getElementById("batch-input")?.click();
    });
    document.getElementById("batch-input").addEventListener("change", async (event) => {
      const files = event.target.files || [];
      if (!files.length) return;
      await handleBatchUpload(files);
      event.target.value = "";
    });

    restoreAppState();

    // 全局错误处理
    window.addEventListener('error', (e) => {
      console.error('全局错误:', e.error);
      alert('页面加载出错: ' + (e.error?.message || '未知错误'));
    });

    try {
      render();
    } catch (err) {
      console.error('渲染失败:', err);
      alert('页面渲染失败: ' + err.message);
    }
  </script>
</body>
