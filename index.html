      }).filter((row) => (row.productName || row.barcode || row.sku) && !isAggregateLabel(row.productName) && !isAggregateLabel(row.barcode));
    }

    function aggregateRows(rows, keyFn, buildRow) {
      const map = new Map();
      rows.forEach((row) => {
        const key = keyFn(row);
        if (!key) return;
        const current = map.get(key);
        if (!current) {
          map.set(key, buildRow(row));
          return;
        }
        buildRow(row, current);
      });
      return Array.from(map.values());
    }

    function summarizeChannelSales(rows) {
      return aggregateRows(rows, (row) => keyFrom(row.channel, row.barcode, row.sku, row.productName, row.spec), (row, current) => {
        if (!current) {
          return {
            key: keyFrom(row.channel, row.barcode, row.sku, row.productName, row.spec),
            orderCount: 1,
            qty: row.qty,
            channel: row.channel,
            warehouse: row.warehouse,
            productName: row.productName,
            barcode: row.barcode,
            sku: row.sku,
            spec: row.spec,
            latestTime: row.time,
          };
        }
        current.orderCount += 1;
        current.qty += row.qty;
        current.channel = current.channel || row.channel;
        current.warehouse = current.warehouse || row.warehouse;
        current.latestTime = current.latestTime || row.time;
        return current;
      });
    }

    function summarizeStoreSales(rows) {
      return aggregateRows(rows, (row) => keyFrom(row.store, row.barcode, row.specCode, row.productCode, row.productName, row.spec), (row, current) => {
        if (!current) {
          return {
            key: keyFrom(row.store, row.barcode, row.specCode, row.productCode, row.productName, row.spec),
            orderCount: 1,
            qty: row.qty,
            store: row.store,
            productName: row.productName,
            barcode: row.barcode,
            spec: row.spec,
            specCode: row.specCode,
            productCode: row.productCode,
            unitPrice: row.unitPrice,
            finalPrice: row.finalPrice,
            status: row.status,
          };
        }
        current.orderCount += 1;
        current.qty += row.qty;
        current.unitPrice = current.unitPrice || row.unitPrice;
        current.finalPrice = current.finalPrice || row.finalPrice;
        current.status = current.status || row.status;
        return current;
      });
    }

    function buildLinkedRows(sources) {
      const map = new Map();
      const periodDays = getSalesPeriodDays();
      // 用于计算加权平均到期日期的批次数据收集
      const batchExpiryData = new Map(); // key -> [{expiryDate, availableQty}]

      const ensure = (key) => {
        if (!map.has(key)) {
          map.set(key, {
            key,
            productName: "",
            barcode: "",
            sku: "",
            spec: "",
            brand: "",
            category: "",
            retailPrice: null,
            warehouseStock: 0,
            warehouseAvailable: 0,
            storeStock: 0,
            storeAvailable: 0,
            channelSalesQty: 0,
            storeSalesQty: 0,
            totalSalesQty: 0,
            stockDepthDays: null,
            remainingDays: null,
            productionDate: "",
            expiryDate: "",
            avgExpiryDate: "", // 加权平均到期日期
            productionNote: "", // 生产备注
            sourceCount: 0,
            sourceFlags: {
              product: false,
              warehouse: false,
              storeInventory: false,
              channelSales: false,
              storeSales: false,
            },
          });
        }
        return map.get(key);
      };

      // 收集批次到期日期数据用于加权平均计算
      const collectBatchExpiry = (key, expiryDate, availableQty) => {
        if (!key || !expiryDate || !availableQty || availableQty <= 0) return;
        // 标准化日期格式
        const dateStr = String(expiryDate).trim();
        if (!dateStr) return;
        if (!batchExpiryData.has(key)) {
          batchExpiryData.set(key, []);
        }
        batchExpiryData.get(key).push({ expiryDate: dateStr, availableQty });
      };

      // 计算加权平均剩余有效期（年）
      const calculateWeightedAvgRemainingYears = (key) => {
        const batches = batchExpiryData.get(key);
        if (!batches || batches.length === 0) return null;

        const now = new Date();
        let totalWeight = 0;
        let weightedDays = 0;

        for (const batch of batches) {
          const expiryDate = new Date(batch.expiryDate);
          if (Number.isNaN(expiryDate.getTime())) continue;
          const remainingDays = Math.max(0, Math.round((expiryDate.getTime() - now.getTime()) / 86400000));
          totalWeight += batch.availableQty;
          weightedDays += remainingDays * batch.availableQty;
        }

        if (totalWeight === 0) return null;

        const avgDays = weightedDays / totalWeight;
        const years = (avgDays / 365).toFixed(1); // 保留1位小数
        return years;
      };

      const mergeIdentity = (target, row) => {
        target.productName = target.productName || row.productName || "";
        target.barcode = target.barcode || row.barcode || "";
        target.sku = target.sku || row.sku || "";
        target.spec = target.spec || row.spec || "";
        target.brand = target.brand || row.brand || "";
        target.category = target.category || row.category || row.firstCategory || "";
        target.productionNote = target.productionNote || row.productionNote || "";
        if (target.retailPrice === null && row.retailPrice !== undefined && row.retailPrice !== null) {
          target.retailPrice = row.retailPrice;
        }
      };

      sources.product.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        item.sourceFlags.product = true;
      });

      sources.warehouse.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        item.sourceFlags.warehouse = true;
        item.warehouseStock += row.stockQty || 0;
        item.warehouseAvailable += row.availableQty || 0;
        const candidateDays = row.remainingDays !== null && row.remainingDays !== undefined ? row.remainingDays : daysUntil(row.expiryDate);
        if (candidateDays !== null && candidateDays !== undefined) {
          item.remainingDays = item.remainingDays === null ? candidateDays : Math.min(item.remainingDays, candidateDays);
        }
        item.productionDate = item.productionDate || row.productionDate || "";
        item.expiryDate = item.expiryDate || row.expiryDate || "";
        // 收集批次到期日期数据用于加权平均计算（可用库存 > 0）
        collectBatchExpiry(row.key, row.expiryDate, row.availableQty);
      });

      sources.storeInventory.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        item.sourceFlags.storeInventory = true;
        item.storeStock += row.stockQty || 0;
        item.storeAvailable += row.availableQty || 0;
        const candidateDays = row.remainingDays !== null && row.remainingDays !== undefined ? row.remainingDays : daysUntil(row.expiryDate);
        if (candidateDays !== null && candidateDays !== undefined) {
          item.remainingDays = item.remainingDays === null ? candidateDays : Math.min(item.remainingDays, candidateDays);
        }
        item.productionDate = item.productionDate || row.productionDate || "";
        item.expiryDate = item.expiryDate || row.expiryDate || "";
        // 收集批次到期日期数据用于加权平均计算（可用库存 > 0）
        collectBatchExpiry(row.key, row.expiryDate, row.availableQty);
      });

      sources.channelSales.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        item.sourceFlags.channelSales = true;
        item.channelSalesQty += row.qty || 0;
      });

      sources.storeSales.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        item.sourceFlags.storeSales = true;
        item.storeSalesQty += row.qty || 0;
      });

      // 处理九宫格文件数据（matrixWorkbook），获取规格、生产备注、图片等
      sources.matrixWorkbook.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        // 从matrixWorkbook获取特有的字段
        if (row.spec) item.spec = row.spec;
        if (row.productionNote) item.productionNote = row.productionNote;
        if (row.imageUrl) item.imageUrl = row.imageUrl;
        if (row.imageTarget) item.imageTarget = row.imageTarget;
        if (row.salesBand) item.salesBand = row.salesBand;
        if (row.stockHealth) item.stockHealth = row.stockHealth;
        if (row.salesTrend) item.salesTrend = row.salesTrend;
        if (row.dailySalesCoef !== null && row.dailySalesCoef !== undefined) item.dailySalesCoef = row.dailySalesCoef;
        // 如果matrixWorkbook中有库存数据，也合并
        if (row.stockQty && row.stockQty > 0) {
          item.warehouseAvailable = item.warehouseAvailable || row.stockQty;
        }
      });

      return Array.from(map.values()).map((item) => {
        item.totalSalesQty = item.channelSalesQty + item.storeSalesQty;
        item.totalInventoryQty = item.warehouseAvailable + item.storeAvailable;
        item.salesDaily = safeDivide(item.totalSalesQty, periodDays) || 0;
        item.sales30Qty = item.totalSalesQty;
        item.inventoryQty = item.totalInventoryQty;
        item.stockDepthDays = item.salesDaily > 0 ? item.totalInventoryQty / item.salesDaily : null;
        item.coverMonths = item.salesDaily > 0 ? item.totalInventoryQty / (item.salesDaily * 30) : null;
        item.targetInventory6m = item.salesDaily > 0 ? item.salesDaily * 180 : null;
        item.replenishmentQty = item.targetInventory6m !== null ? Math.max(0, Math.round(item.targetInventory6m - item.totalInventoryQty)) : 0;
        item.expiryMinDays = item.remainingDays;
        item.slowRisk = evaluateSlowRisk(item);
        item.expiryRisk = evaluateExpiryRisk(item);
        item.sourceCount = Object.values(item.sourceFlags).filter(Boolean).length;
        // 计算加权平均到期日期
        item.avgExpiryDate = calculateWeightedAvgRemainingYears(item.key) || "";
        return item;
      }).sort((a, b) => {
        const aScore = a.totalSalesQty || a.totalInventoryQty || 0;
        const bScore = b.totalSalesQty || b.totalInventoryQty || 0;
        return bScore - aScore;
      });
    }

    function getSalesPeriodDays(period = state.salesPeriod) {
      const start = period && period.start ? new Date(period.start) : null;
      const end = period && period.end ? new Date(period.end) : null;
      if (!start || !end || Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) {
        return 180;
      }
      const diff = Math.round((end.getTime() - start.getTime()) / 86400000) + 1;
      return Math.max(diff, 1);
    }

    function makeDomId(prefix, key) {
      return `${prefix}-${String(key || "").replace(/[^a-zA-Z0-9_-]+/g, "_")}`;
    }

    function getStockHealthLabel(stockMonths) {
      if (stockMonths === null || stockMonths === undefined || Number.isNaN(stockMonths)) return "未知";
      if (stockMonths <= 12) return "健康";
      if (stockMonths <= 24) return "风险";
      return "积压";
    }

    function getSalesBandLabel(percent) {
      if (percent === null || percent === undefined || Number.isNaN(percent)) return "平销";
      if (percent <= 0.3) return "畅销";
      if (percent <= 0.7) return "平销";
      return "滞销";
    }

    function getMatrixCellMeta(row) {
      const stockBand = getStockHealthLabel(row.stockMonths);
      const salesBand = row.salesBand || "平销";
      const cellKey = `${stockBand}|${salesBand}`;
      const metaMap = {
        "健康|畅销": { title: "核心爆款区", badge: "重点保供", theme: "good" },
        "健康|平销": { title: "稳定发展区", badge: "持续关注", theme: "warm" },
        "健康|滞销": { title: "潜力优化区", badge: "优化动销", theme: "warn" },
        "风险|畅销": { title: "补货关注区", badge: "控制库存", theme: "warm" },
        "风险|平销": { title: "调整观察区", badge: "动态跟踪", theme: "warn" },
        "风险|滞销": { title: "预警处理区", badge: "促销去化", theme: "danger" },
        "积压|畅销": { title: "资金占用区", badge: "谨慎补货", theme: "danger" },
        "积压|平销": { title: "清理改善区", badge: "制定计划", theme: "danger" },
        "积压|滞销": { title: "重点清理区", badge: "清仓处理", theme: "danger" },
      };
      return metaMap[cellKey] || { title: cellKey, badge: "待判定", theme: "neutral" };
    }

    // ===== 新九宫格分类逻辑：日销系数 × 消化周期 =====
    // 消化周期(天) → X+Y系数之和
    function getDigestionSum(sellOutDays) {
      if (sellOutDays === null || sellOutDays === undefined || Number.isNaN(sellOutDays)) return 6;
      if (sellOutDays <= 90) return 2;
      if (sellOutDays <= 180) return 3;
      if (sellOutDays <= 360) return 4;
      if (sellOutDays <= 720) return 5;
      return 6;
    }

    // 消化周期标签
    function getDigestionLabel(sum) {
      const labels = { 2: "≤90天", 3: "≤180天", 4: "≤360天", 5: "≤720天", 6: ">720天" };
      return labels[sum] || "未知";
    }

    // 新九宫格单元格元数据
    // 横轴X=日销系数(1高~3低)，纵轴Y=消化周期反推(1低~3高)
    function getMatrixCellMetaNew(x, y) {
      const cellKey = `${x}|${y}`;
      const metaMap = {
        "1|1": { title: "原价/补货",   badge: "≤90天",   theme: "good" },
        "2|1": { title: "原价/关注",   badge: "≤180天",  theme: "good" },
        "3|1": { title: "原价/不补",   badge: "≤360天",  theme: "warm" },
        "1|2": { title: "原价/关注",   badge: "≤180天",  theme: "good" },
        "2|2": { title: "原价/不补",   badge: "≤360天",  theme: "warm" },
        "3|2": { title: "压力/消化",   badge: "≤720天",  theme: "danger" },
        "1|3": { title: "原价/不补",   badge: "≤360天",  theme: "warm" },
        "2|3": { title: "浮动/消化",   badge: "≤720天",  theme: "danger" },
        "3|3": { title: "折价/去库存", badge: ">720天",  theme: "danger" },
      };
      return metaMap[cellKey] || { title: cellKey, badge: "待判定", theme: "neutral" };
    }

    // 为商品分配日销系数(X)和纵轴值(Y=sum-X)
    // 1. 用O列库存月确定 X+Y 之和（库存月×30≈消化周期天数）
    // 2. 直接读取N列日销系数数值分配X：N≥10→X=1(高日销)，3≤N<10→X=2(中日销)，N<3→X=3(低日销)
    // 3. Y = sum - X（由消化周期反推，不再单独计算库存系数）
    function assignMatrixCoefficients(rows, periodDays) {
      // 计算消化周期和系数之和
      rows.forEach((row) => {
        // 优先使用库存月(O列)计算消化周期
        if (row.stockMonths !== null && row.stockMonths !== undefined && !Number.isNaN(row.stockMonths)) {
          row.sellOutDays = row.stockMonths * 30;
        } else if (row.sellOutDays !== null && row.sellOutDays !== undefined) {
          // 保留已计算的 sellOutDays（可能为 Infinity）
        } else if (row.salesQty > 0) {
          row.sellOutDays = (row.stockQty / row.salesQty) * periodDays;
        } else {
          // 有库存但无销量，消化周期无穷大
          row.sellOutDays = Infinity;
        }
        row.digestionSum = getDigestionSum(row.sellOutDays);
      });

      // 直接根据N列日销系数数值分配X（不再组内排名）
      rows.forEach((row) => {
        const n = (row.dailySalesCoef != null && !Number.isNaN(row.dailySalesCoef)) ? row.dailySalesCoef : 0;
        let x;
        if (n >= 10) {
          x = 1;  // 高日销
        } else if (n >= 3) {
          x = 2;  // 中日销
        } else {
          x = 3;  // 低日销
        }
        // 根据消化周期约束 X 的范围：X ∈ [max(1, sum-3), min(3, sum-1)]
        const sum = row.digestionSum;
        const minX = Math.max(1, sum - 3);
        const maxX = Math.min(3, sum - 1);
        x = Math.max(minX, Math.min(maxX, x));
        row.salesCoef = x;
        row.inventoryCoef = sum - x;
      });
    }

    function buildMatrixRowsFromWorkbook(source) {
      const periodMonths = 7;
      const periodDays = periodMonths * 30;
      const baseRows = Array.isArray(source?.rows) ? source.rows.slice() : [];
      const rows = baseRows
        .map((row) => {
          const salesQty = parseNumber(row.salesQty, 0);
          const stockQty = parseNumber(row.stockQty, 0);
          const retailPrice = maybeNumber(row.retailPrice);
          const inventoryAmount = maybeNumber(row.inventoryAmount);
          const stockMonths = maybeNumber(row.stockMonths);
          const remainingDays = maybeNumber(row.remainingDays);
          const sellOutDays = (stockMonths !== null && stockMonths !== undefined && !Number.isNaN(stockMonths))
            ? stockMonths * 30
            : (row.sellOutDays !== null && row.sellOutDays !== undefined
              ? row.sellOutDays
              : (salesQty > 0 ? (stockQty / salesQty) * periodDays : Infinity));
          const derivedStockMonths = stockMonths !== null && stockMonths !== undefined
            ? stockMonths
            : (salesQty > 0 ? (stockQty / salesQty) * periodMonths : null);
          const canSellBeforeExpiry = row.canSellBeforeExpiry !== null && row.canSellBeforeExpiry !== undefined
            ? row.canSellBeforeExpiry
            : (remainingDays !== null && sellOutDays !== null ? sellOutDays <= remainingDays : null);

          // 保质期：剩余天数 / 365，保留1位小数
          const remainingDaysForExpiry = maybeNumber(row.remainingDays);
          const avgExpiryDate = remainingDaysForExpiry !== null && remainingDaysForExpiry !== undefined
            ? (remainingDaysForExpiry / 365).toFixed(1)
            : "";

          return {
            ...row,
            salesQty,
            stockQty,
            retailPrice,
            inventoryAmount: inventoryAmount !== null && inventoryAmount !== undefined
              ? inventoryAmount
              : (retailPrice !== null && retailPrice !== undefined ? stockQty * retailPrice : null),
            stockMonths: derivedStockMonths,
            sellOutDays,
            canSellBeforeExpiry,
            avgExpiryDate,
            stockHealth: row.stockHealth || getStockHealthLabel(derivedStockMonths),
            salesBand: row.salesBand || "",
          };
        })
        .filter((row) => row.productName || row.barcode || row.sku);

      // 分配日销系数和纵轴值（基于消化周期反推九宫格）
      assignMatrixCoefficients(rows, periodDays);
      rows.forEach((row) => {
        row.matrixMeta = getMatrixCellMetaNew(row.salesCoef, row.inventoryCoef);
      });

      const categoryOptions = Array.from(new Set(rows.map((row) => row.category || "未分类"))).sort((a, b) => a.localeCompare(b, "zh-CN"));
      const filtered = rows.filter((row) => {
        // 即时库存为0的商品暂不计入统计
        if ((row.stockQty || 0) === 0) return false;
        const categoryFilter = state.matrixFilters.category || "全部";
        const priceFilter = state.matrixFilters.isRegularPrice || "全部";
        const kpiFilter = state.matrixFilters.kpiFilter || "all";
        if (categoryFilter !== "全部" && (row.category || "未分类") !== categoryFilter) return false;
        if (priceFilter !== "全部" && (row.isRegularPrice || "未设置") !== priceFilter) return false;
        // KPI筛选（按消化周期分类）
        if (kpiFilter !== "all") {
          if (kpiFilter === "digest2" && row.digestionSum !== 2) return false;
          if (kpiFilter === "digest3" && row.digestionSum !== 3) return false;
          if (kpiFilter === "digest4" && row.digestionSum !== 4) return false;
          if (kpiFilter === "digest5" && row.digestionSum !== 5) return false;
          if (kpiFilter === "digest6" && row.digestionSum !== 6) return false;
        }
        return true;
      });

      const gridOrder = [
        { x: 1, y: 1 }, { x: 2, y: 1 }, { x: 3, y: 1 },
        { x: 1, y: 2 }, { x: 2, y: 2 }, { x: 3, y: 2 },
        { x: 1, y: 3 }, { x: 2, y: 3 }, { x: 3, y: 3 },
      ];
      const cells = gridOrder.map(({ x, y }) => {
        const cellRows = filtered.filter((row) => row.salesCoef === x && row.inventoryCoef === y)
          .sort((a, b) => (b.salesQty || 0) - (a.salesQty || 0));
        const skuCount = cellRows.length;
        const inventoryQty = cellRows.reduce((sum, row) => sum + (row.stockQty || 0), 0);
        const inventoryAmount = cellRows.reduce((sum, row) => sum + (row.inventoryAmount || 0), 0);
        return {
          key: `${x}|${y}`,
          x,
          y,
          rows: cellRows,
          skuCount,
          inventoryQty,
          inventoryAmount,
          meta: getMatrixCellMetaNew(x, y),
        };
      });

      const summary = {
        totalSku: filtered.length,
        totalInventoryQty: filtered.reduce((sum, row) => sum + (row.stockQty || 0), 0),
        totalInventoryAmount: filtered.reduce((sum, row) => sum + (row.inventoryAmount || 0), 0),
        digest2Count: filtered.filter((row) => row.digestionSum === 2).length,
        digest3Count: filtered.filter((row) => row.digestionSum === 3).length,
        digest4Count: filtered.filter((row) => row.digestionSum === 4).length,
        digest5Count: filtered.filter((row) => row.digestionSum === 5).length,
        digest6Count: filtered.filter((row) => row.digestionSum === 6).length,
        selloutSafeCount: filtered.filter((row) => row.canSellBeforeExpiry === true).length,
        selloutRiskCount: filtered.filter((row) => row.canSellBeforeExpiry === false).length,
        categoryOptions,
      };

      return {
        rows,
        filteredRows: filtered,
        cells,
        summary,
        periodDays,
        periodLabel: "最近 7 个月净出库",
        categoryOptions,
      };
    }

    function buildMatrixRows(sources) {
      const productMap = new Map(sources.product.rows.map((row) => [row.key, row]));
      const stockMap = new Map(sources.inventorySales.rows.map((row) => [row.key, row]));
      const keys = new Set([...productMap.keys(), ...stockMap.keys()]);
      const periodDays = getSalesPeriodDays();
      const periodMonths = periodDays / 30;

      const rows = Array.from(keys).map((key) => {
        const product = productMap.get(key) || {};
        const stock = stockMap.get(key) || {};
        const productName = product.productName || stock.productName || "";
        const barcode = product.barcode || stock.barcode || "";
        const sku = product.sku || stock.sku || "";
        const spec = product.spec || stock.spec || "";
        const category = product.category || stock.category || "未分类";
        const brand = product.brand || stock.brand || "";
        const imageUrl = product.imageUrl || stock.imageUrl || "";
        const isRegularPrice = product.isRegularPrice || stock.isRegularPrice || "";
        const retailPrice = maybeNumber(product.retailPrice ?? stock.retailPrice);
        const salesQty = parseNumber(stock.salesQty, 0);
        const stockQty = parseNumber(stock.stockQty, 0);
        const inventoryAmount = maybeNumber(stock.stockAmount);
        const derivedInventoryAmount = inventoryAmount !== null && inventoryAmount !== undefined
          ? inventoryAmount
          : (retailPrice !== null && retailPrice !== undefined ? stockQty * retailPrice : null);
        const shelfLifeDays = maybeNumber(stock.shelfLifeDays);
        const expiryDate = stock.expiryDate || "";
        const currentSellDays = salesQty > 0 ? (stockQty / salesQty) * periodDays : null;
        const stockMonths = salesQty > 0 ? (stockQty / salesQty) * periodMonths : null;
        const canSellBeforeExpiry = shelfLifeDays !== null && currentSellDays !== null
          ? currentSellDays <= shelfLifeDays
          : null;
        const salesBand = "";
        const stockHealth = getStockHealthLabel(stockMonths);
        const productionNote = product.productionNote || stock.productionNote || "";
        return {
          key,
          productName,
          barcode,
          sku,
          spec,
          category,
          brand,
          imageUrl,
          isRegularPrice,
          retailPrice,
          salesQty,
          stockQty,
          inventoryAmount: derivedInventoryAmount,
          shelfLifeDays,
          expiryDate,
          sellOutDays: currentSellDays,
          stockMonths,
          stockHealth,
          canSellBeforeExpiry,
          salesBand,
          productionNote,
          rawProduct: product.raw,
          rawStock: stock.raw,
        };
      }).filter((row) => row.productName || row.barcode || row.sku);

      // 分配日销系数和纵轴值（基于消化周期反推九宫格）
      assignMatrixCoefficients(rows, periodDays);
      rows.forEach((row) => {
        row.matrixMeta = getMatrixCellMetaNew(row.salesCoef, row.inventoryCoef);
      });

      const categoryOptions = Array.from(new Set(rows.map((row) => row.category || "未分类"))).sort((a, b) => a.localeCompare(b, "zh-CN"));
      const filtered = rows.filter((row) => {
        // 即时库存为0的商品暂不计入统计
        if ((row.stockQty || 0) === 0) return false;
        const categoryFilter = state.matrixFilters.category || "全部";
        const priceFilter = state.matrixFilters.isRegularPrice || "全部";
        if (categoryFilter !== "全部" && (row.category || "未分类") !== categoryFilter) return false;
        if (priceFilter !== "全部" && (row.isRegularPrice || "未设置") !== priceFilter) return false;
        return true;
      });

      const gridOrder = [
        { x: 1, y: 1 }, { x: 2, y: 1 }, { x: 3, y: 1 },
        { x: 1, y: 2 }, { x: 2, y: 2 }, { x: 3, y: 2 },
        { x: 1, y: 3 }, { x: 2, y: 3 }, { x: 3, y: 3 },
      ];
      const cells = gridOrder.map(({ x, y }) => {
        const cellRows = filtered.filter((row) => row.salesCoef === x && row.inventoryCoef === y)
          .sort((a, b) => (b.salesQty || 0) - (a.salesQty || 0));
        const skuCount = cellRows.length;
        const inventoryQty = cellRows.reduce((sum, row) => sum + (row.stockQty || 0), 0);
        const inventoryAmount = cellRows.reduce((sum, row) => sum + (row.inventoryAmount || 0), 0);
        return {
          key: `${x}|${y}`,
          x,
          y,
          rows: cellRows,
          skuCount,
          inventoryQty,
          inventoryAmount,
          meta: getMatrixCellMetaNew(x, y),
        };
      });

      const summary = {
        totalSku: filtered.length,
        totalInventoryQty: filtered.reduce((sum, row) => sum + (row.stockQty || 0), 0),
        totalInventoryAmount: filtered.reduce((sum, row) => sum + (row.inventoryAmount || 0), 0),
        digest2Count: filtered.filter((row) => row.digestionSum === 2).length,
        digest3Count: filtered.filter((row) => row.digestionSum === 3).length,
        digest4Count: filtered.filter((row) => row.digestionSum === 4).length,
        digest5Count: filtered.filter((row) => row.digestionSum === 5).length,
        digest6Count: filtered.filter((row) => row.digestionSum === 6).length,
        selloutSafeCount: filtered.filter((row) => row.canSellBeforeExpiry === true).length,
        selloutRiskCount: filtered.filter((row) => row.canSellBeforeExpiry === false).length,
        categoryOptions,
      };

      return {
        rows,
        filteredRows: filtered,
        cells,
        summary,
        periodDays,
        periodLabel: `${state.salesPeriod.start || "未设定"} ~ ${state.salesPeriod.end || "未设定"}`,
        categoryOptions,
      };
    }

    function evaluateExpiryRisk(row) {
      if (row.remainingDays === null || row.remainingDays === undefined) return { level: "neutral", label: "未知", days: null };
      if (row.remainingDays <= 365) return { level: "danger", label: "1年内", days: row.remainingDays };
      if (row.remainingDays <= 730) return { level: "warn", label: "2年内", days: row.remainingDays };
      return { level: "good", label: "2年以上", days: row.remainingDays };
    }

    function evaluateSlowRisk(row) {
      if (!row.remainingDays || row.remainingDays <= 0) {
        return { level: "danger", label: "临期/过期", gapDays: row.remainingDays || 0 };
      }
      if (!row.stockDepthDays) return { level: "warn", label: "无销量", gapDays: null };
      if (row.stockDepthDays >= row.remainingDays) {
        return { level: "danger", label: "卖不完", gapDays: row.stockDepthDays - row.remainingDays };
      }
      if (row.stockDepthDays >= row.remainingDays - 365) {
        return { level: "warn", label: "有滞销风险", gapDays: row.stockDepthDays - (row.remainingDays - 365) };
      }
      return { level: "good", label: "正常", gapDays: row.remainingDays - row.stockDepthDays };
    }

    function getModelSignature() {
      const base = SOURCE_CONFIGS
        .map((cfg) => {
          const source = state.sources[cfg.key];
          return [
            cfg.key,
            source.fileName || "",
            source.sheetName || "",
            source.importedAt || "",
            source.rows.length,
            source.error || "",
          ].join(":");
        })
        .join("|");
      return [
        base,
        `period:${state.salesPeriod.start || ""}-${state.salesPeriod.end || ""}`,
        `filters:${state.matrixFilters.category || ""}-${state.matrixFilters.isRegularPrice || ""}-${state.matrixFilters.kpiFilter || ""}`,
        `focus:${state.matrixFocusKey || ""}`,
      ].join("|");
    }

    function buildModel() {
      const signature = getModelSignature();
      if (modelCache.signature === signature && modelCache.model) {
        return modelCache.model;
      }

      const matrixWorkbook = state.sources.matrixWorkbook;
      const product = state.sources.product;
      const inventorySales = state.sources.inventorySales;
      const warehouse = state.sources.warehouse;
      const storeInventory = state.sources.storeInventory;
      const channelSales = state.sources.channelSales;
      const storeSales = state.sources.storeSales;

      const matrix = matrixWorkbook.rows.length
        ? buildMatrixRowsFromWorkbook(matrixWorkbook)
        : buildMatrixRows(state.sources);
      const channelSalesAgg = summarizeChannelSales(channelSales.rows);
      const storeSalesAgg = summarizeStoreSales(storeSales.rows);
      const linkedRows = buildLinkedRows(state.sources);
      const productUnique = new Set(product.rows.map((row) => row.key)).size;
      const inventorySalesQty = inventorySales.rows.reduce((sum, row) => sum + (row.salesQty || 0), 0);
      const inventoryStockQty = inventorySales.rows.reduce((sum, row) => sum + (row.stockQty || 0), 0);
      const inventoryStockAmount = inventorySales.rows.reduce((sum, row) => sum + (row.stockAmount || 0), 0);
      const warehouseQty = warehouse.rows.reduce((sum, row) => sum + (row.availableQty || 0), 0);
      const storeQty = storeInventory.rows.reduce((sum, row) => sum + (row.availableQty || 0), 0);
      const channelQty = channelSales.rows.reduce((sum, row) => sum + (row.qty || 0), 0);
      const storeSalesQty = storeSales.rows.reduce((sum, row) => sum + (row.qty || 0), 0);
      const linkedCount = linkedRows.length;
      const uploadedCount = SOURCE_CONFIGS.filter((cfg) => state.sources[cfg.key].rows.length).length;
      const replenishmentRows = linkedRows
        .filter((row) => row.totalSalesQty > 0 || row.totalInventoryQty > 0)
        .map((row) => ({
          ...row,
          sales30Qty: row.totalSalesQty,
          inventoryQty: row.totalInventoryQty,
          stockMonths: row.coverMonths,
        }))
        .filter((row) => row.replenishmentQty > 0)
        .sort((a, b) => b.replenishmentQty - a.replenishmentQty);
      const slowRows = linkedRows
        .filter((row) => row.slowRisk && row.slowRisk.level !== "good")
        .sort((a, b) => (b.stockDepthDays || 0) - (a.stockDepthDays || 0));
      const expiryRows = linkedRows
        .filter((row) => row.expiryRisk && row.expiryRisk.level !== "good")
        .sort((a, b) => (a.remainingDays ?? 999999) - (b.remainingDays ?? 999999));

      const model = {
        sources: state.sources,
        productUnique,
        inventorySalesQty,
        inventoryStockQty,
        inventoryStockAmount,
        warehouseQty,
        storeQty,
        channelQty,
        storeSalesQty,
        matrixRows: matrix.rows,
        matrixFilteredRows: matrix.filteredRows,
        matrixCells: matrix.cells,
        matrixSummary: matrix.summary,
        matrixPeriodDays: matrix.periodDays,
        matrixPeriodLabel: matrix.periodLabel,
        matrixCategoryOptions: matrix.categoryOptions,
        linkedRows,
        linkedCount,
        uploadedCount,
        allUploaded: uploadedCount === SOURCE_CONFIGS.length,
        channelSalesAgg: channelSalesAgg.sort((a, b) => b.qty - a.qty),
        storeSalesAgg: storeSalesAgg.sort((a, b) => b.qty - a.qty),
        replenishmentRows,
        slowRows,
        expiryRows,
      };
      modelCache.signature = signature;
      modelCache.model = model;
      return model;
    }

    function renderCockpitSubtabs(model) {
      const host = document.getElementById("tabs");
      if (!host) return;
      // 驾驶舱模式下显示子标签
      let html = `<span class="tab-label">分析维度</span>`;
      html += `<div class="subtabs">` + COCKPIT_SUBTABS.map((tab) => `

      host.querySelectorAll(".subtab").forEach((button) => {
        button.addEventListener("click", () => {
          state.cockpitSubtab = button.dataset.subtab;
          render(model);
        });
      });
    }

    function renderSidebarInfo(model) {

        titleEl.textContent = "九宫格文件";
        subtitleEl.textContent = "九宫格模式：只需上传单个《总库存情况》文件，系统会自动读取商品资料、库存、净出库和图片，按消化周期生成日销系数×消化周期九宫格分析图。";

          <div class="note">1. 仅需上传一个 Excel 文件，包含《总库存情况》工作表。</div>
          <div class="note">2. 数据列映射：M列=即时库存、N列=日销系数(横轴)、O列=库存月(决定消化周期)、P列=保质期剩余天数。</div>
          <div class="note">3. 横轴=日销系数(1~3)，直接读取N列数值：N≥10→1(高日销)，3≤N<10→2(中日销)，N<3→3(低日销)。</div>
          <div class="note">4. 库存月≤3→系数和=2(≤90天)，≤6→3(≤180天)，≤12→4(≤360天)，≤24→5(≤720天)，>24→6(>720天)。</div>
          <div class="note">5. 纵轴=系数和-横轴，由消化周期反推，不再单独计算库存系数。</div>
          <div class="note">6. 点击商品图片可跳转到联动总表查看明细。</div>
          <div class="note">7. 点击格子可查看大宫格弹窗，含图例说明。</div>
          <div class="note">8. 页面会在本地缓存已上传文件，刷新后可自动恢复。</div>
        `;

        titleEl.textContent = "驾驶舱文件";

          <div class="note">3. 两个销售文件会分别汇总，后续补货、滞销、保质期预警都会直接复用这些标准化结果。</div>
          <div class="note">4. 页面会在本地缓存已上传文件，刷新后可自动恢复；也支持批量选择多个文件导入。</div>
        `;
      }
    }

    function renderMatrixTab(model) {
      const rows = model.matrixFilteredRows;
      const categoryOptions = ["全部", ...model.matrixCategoryOptions];
      const priceOptions = ["全部", "是", "否", "未设置"];
      if (!rows.length) {
        return `
          <div class="panel matrix-panel">
            <div class="block-head">
              <div>
                <h2>九宫格看板</h2>
                <div class="note">请先上传单文件《总库存情况》九宫格模板，系统会直接读取商品资料、库存、净出库和图片。</div>
              </div>
              <button class="primary" data-open-source="matrixWorkbook">上传九宫格文件</button>
            </div>
            <div class="soft-card">
              <div class="note">上传后，系统会根据消化周期自动将商品分配到日销系数×消化周期九宫格，并保留点击商品图片跳转明细的能力。</div>
            </div>
          </div>
        `;
      }
      // 根据生产情况获取边框样式类
      const getProductionBorderClass = (productionNote) => {
        if (!productionNote) return "";
        const note = String(productionNote).toLowerCase();
        if (note.includes("正常")) return "production-normal";
        if (note.includes("停产")) return "production-stopped";
        return "production-other";
      };

      const chipRows = (cellRows, cellKey) => {
        const isExpanded = state.matrixExpandedCells[cellKey];
        const itemsPerCell = state.matrixItemsPerCell || 4;
        const displayRows = isExpanded ? cellRows : cellRows.slice(0, itemsPerCell);
        const extra = Math.max(0, cellRows.length - displayRows.length);
        return `
          <div class="sku-strip">
            ${displayRows.map((row) => `
              <button type="button" class="sku-chip ${row.canSellBeforeExpiry === false ? 'sellout-risk' : ''}" data-matrix-jump="${escapeHtml(row.key)}" title="点击跳转到联动总表：${escapeHtml(row.productName || "")}">
                <div class="sku-thumb ${getProductionBorderClass(row.productionNote)}">${row.imageUrl ? `<img src="${escapeHtml(row.imageUrl)}" alt="${escapeHtml(shortenProductName(row.productName) || "")}" onerror="this.remove();this.parentElement.textContent='无图';">` : "无图"}</div>
                <small style="${row.canSellBeforeExpiry === false ? 'color: var(--danger); font-weight: 600;' : ''}">${escapeHtml(shortenProductName(row.productName) || "-")}</small>
              </button>
            `).join("")}
            ${extra > 0 ? `<div class="matrix-more" data-matrix-expand="${escapeHtml(cellKey)}">还有 ${extra} 个 SKU，点击展开</div>` : ""}
            ${isExpanded ? `<div class="matrix-more" data-matrix-collapse="${escapeHtml(cellKey)}">点击收起</div>` : ""}
          </div>
        `;
      };

      const cellHtml = model.matrixCells.map((cell) => {
        const theme = cell.meta.theme || "neutral";
        const itemsPerCell = state.matrixItemsPerCell || 4;
        const isExpanded = state.matrixExpandedCells[cell.key];
        const previewRows = isExpanded ? cell.rows : cell.rows.slice(0, itemsPerCell);
        return `
          <div class="matrix-cell ${theme}" data-cell-key="${escapeHtml(cell.key)}" data-matrix-big-cell="${escapeHtml(cell.key)}" style="cursor:pointer;" title="点击查看大宫格">
            <div class="matrix-cell-head">
              <div>
                <h3>${escapeHtml(cell.meta.title)}</h3>
                <div class="matrix-cell-stats">
                  <span>商品 ${formatInteger(cell.skuCount)}</span>
                  <span>库存 ${formatInteger(cell.inventoryQty)} 件</span>
                  <span>金额 ${cell.inventoryAmount === null || cell.inventoryAmount === undefined ? "-" : formatCurrency(cell.inventoryAmount)}</span>
                </div>
              </div>
              ${badge(theme === "good" ? "good" : theme === "danger" ? "danger" : "warn", cell.meta.badge)}
            </div>
            ${chipRows(previewRows, cell.key)}
          </div>
        `;
      });

      // 渲染大宫格弹窗
      const renderBigCellModal = () => {
        if (!state.matrixBigCell) return "";
        const cell = model.matrixCells.find(c => c.key === state.matrixBigCell.cellKey);
        if (!cell) return "";
        const theme = cell.meta.theme || "neutral";
        const totalAmount = cell.rows.reduce((sum, row) => sum + (row.inventoryAmount || 0), 0);
        return `
          <div class="big-cell-overlay" data-big-cell-overlay>
            <div class="big-cell-modal">
              <div class="big-cell-header">
                <h3>${escapeHtml(cell.meta.title)} <span style="font-size:14px;font-weight:normal;color:var(--muted);">(${escapeHtml(cell.meta.badge)})</span></h3>
                <button class="big-cell-close" data-big-cell-close title="关闭">&times;</button>
              </div>
              <div class="big-cell-legend">
                <span class="legend-item"><span class="legend-box legend-red"></span>停产</span>
                <span class="legend-item"><span class="legend-box legend-yellow"></span>待定</span>
                <span class="legend-item"><span class="legend-box legend-green"></span>继续生产</span>
                <span class="legend-item"><span class="legend-text-danger">红色加粗字体</span>保质期到期前消化不完</span>
              </div>
              <div class="big-cell-content">
                <div class="big-cell-stats">
                  <div class="big-cell-stat">
                    <small>商品数量</small>
                    <strong>${formatInteger(cell.skuCount)}</strong>
                  </div>
                  <div class="big-cell-stat">
                    <small>总库存</small>
                    <strong>${formatInteger(cell.inventoryQty)} 件</strong>
                  </div>
                  <div class="big-cell-stat">
                    <small>总金额</small>
                    <strong>${formatCurrency(totalAmount)}</strong>
                  </div>
                </div>
                <div class="sku-strip">
                  ${cell.rows.map((row) => `
                    <button type="button" class="sku-chip ${row.canSellBeforeExpiry === false ? 'sellout-risk' : ''}" data-matrix-jump="${escapeHtml(row.key)}" title="点击跳转到联动总表：${escapeHtml(row.productName || "")}">
                      <div class="sku-thumb ${getProductionBorderClass(row.productionNote)}">${row.imageUrl ? `<img src="${escapeHtml(row.imageUrl)}" alt="${escapeHtml(shortenProductName(row.productName) || "")}" onerror="this.remove();this.parentElement.textContent='无图';">` : "无图"}</div>
                      <small style="${row.canSellBeforeExpiry === false ? 'color: var(--danger); font-weight: 600;' : ''}">${escapeHtml(shortenProductName(row.productName) || "-")}</small>
                    </button>
                  `).join("")}
                </div>
              </div>
            </div>
          </div>
        `;
      };

      return `
        <div class="panel matrix-panel" id="matrix-panel">
          <div class="block-head">
            <div>
              <h2>SKU 九宫格分析（日销系数 × 消化周期）</h2>
              <div class="note">横轴=日销系数（N列数值：1高日销~3低日销），纵轴=消化周期反推（1低~3高）。点击商品图片会跳到联动总表对应行。</div>
            </div>
            <div style="display:flex;gap:10px;align-items:center;">
              <span class="badge neutral">共 ${formatInteger(model.matrixSummary.totalSku)} 个商品</span>
              <button class="ghost" data-matrix-fit-screen>适应屏幕</button>
              <button class="primary" data-matrix-export-image>导出图片</button>
            </div>
          </div>

          <div class="matrix-toolbar">
            <label>
              销售时间段
              <div style="display:flex;align-items:center;gap:4px;font-weight:600;color:var(--ink);">
                ${escapeHtml(state.salesPeriod.start || "自动读取")} ~ ${escapeHtml(state.salesPeriod.end || "")}
              </div>
            </label>
            <label>
              分类
              <select data-matrix-category>
                ${categoryOptions.map((item) => `<option value="${escapeHtml(item)}" ${state.matrixFilters.category === item ? "selected" : ""}>${escapeHtml(item)}</option>`).join("")}
              </select>
            </label>
            <label>
              是否正价
              <select data-matrix-price>
                ${priceOptions.map((item) => `<option value="${escapeHtml(item)}" ${state.matrixFilters.isRegularPrice === item ? "selected" : ""}>${escapeHtml(item)}</option>`).join("")}
              </select>
            </label>
            <label>
              每格显示
              <div style="display:flex;gap:4px;">
                ${[4, 8, 12].map(n => `<button type="button" class="${state.matrixItemsPerCell === n ? 'primary' : 'ghost'}" data-matrix-items="${n}" style="padding:6px 12px;font-size:12px;">${n}</button>`).join('')}
              </div>
            </label>
            <button class="ghost" data-matrix-reset>重置</button>
          </div>

          <div class="matrix-kpis">
            <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'all' ? 'active' : ''}" data-kpi-filter="all" style="cursor:pointer;" title="点击查看全部"><small>总 SKU</small><strong>${formatInteger(model.matrixSummary.totalSku)}</strong></div>
            <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'digest2' ? 'active' : ''}" data-kpi-filter="digest2" style="cursor:pointer;" title="消化周期≤90天"><small>≤90天</small><strong>${formatInteger(model.matrixSummary.digest2Count)}</strong></div>
            <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'digest3' ? 'active' : ''}" data-kpi-filter="digest3" style="cursor:pointer;" title="消化周期≤180天"><small>≤180天</small><strong>${formatInteger(model.matrixSummary.digest3Count)}</strong></div>
            <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'digest4' ? 'active' : ''}" data-kpi-filter="digest4" style="cursor:pointer;" title="消化周期≤360天"><small>≤360天</small><strong>${formatInteger(model.matrixSummary.digest4Count)}</strong></div>
            <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'digest5' ? 'active' : ''}" data-kpi-filter="digest5" style="cursor:pointer;" title="消化周期≤720天"><small>≤720天</small><strong>${formatInteger(model.matrixSummary.digest5Count)}</strong></div>
            <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'digest6' ? 'active' : ''}" data-kpi-filter="digest6" style="cursor:pointer;" title="消化周期>720天"><small>>720天</small><strong>${formatInteger(model.matrixSummary.digest6Count)}</strong></div>
          </div>

          <div class="soft-card">
              <div class="note" style="margin-bottom:10px;font-weight:700;color:var(--ink);">日销系数（横轴：1=高日销 → 3=低日销）</div>
            <div class="matrix-grid" id="matrix-grid" style="grid-template-columns:88px repeat(3, minmax(0, 1fr));">
              <div></div>
              <div class="matrix-col-head">日销系数 1<br>（高日销）</div>
              <div class="matrix-col-head">日销系数 2<br>（中日销）</div>
              <div class="matrix-col-head">日销系数 3<br>（低日销）</div>
              <div class="matrix-row-head">纵轴 1<br>（低）</div>
              ${cellHtml.slice(0, 3).join("")}
              <div class="matrix-row-head">纵轴 2<br>（中）</div>
              ${cellHtml.slice(3, 6).join("")}
              <div class="matrix-row-head">纵轴 3<br>（高）</div>
              ${cellHtml.slice(6, 9).join("")}
            </div>
          </div>

          <div class="table-toolbar">
            <p class="hint">点击任意商品图片会跳到联动总表并高亮对应行。</p>
          </div>
          ${tableSection({
            tabId: "linked",
            title: "联动总表（九宫格命中结果）",
            note: "这里展示当前筛选条件下的 SKU 明细，点击品名可跳回九宫格对应商品。",
            rows: rows,
            showAll: true,
            columns: [
              { label: "品名", key: "productName", render: (row) => `<a href="#" class="link-to-matrix" data-link-key="${escapeHtml(row.key)}" title="点击跳回九宫格">${escapeHtml(shortenProductName(row.productName) || "-")}</a>`, sortValue: (row) => row.productName || "" },
              { label: "规格", render: (row) => escapeHtml(row.spec || "-") },
              { label: "条码", key: "barcode", render: (row) => escapeHtml(row.barcode || row.sku || "-"), sortValue: (row) => row.barcode || row.sku || "" },
              { label: "分类", render: (row) => escapeHtml(row.category || "-") },
              { label: "日销系数", render: (row) => row.salesCoef ? `系数${row.salesCoef}` : "-", sortValue: (row) => row.salesCoef || 0 },
              { label: "N值", render: (row) => row.dailySalesCoef !== null && row.dailySalesCoef !== undefined ? formatNumber(row.dailySalesCoef) : "-", sortValue: (row) => row.dailySalesCoef ?? 0 },
              { label: "消化周期", render: (row) => {
                if (row.sellOutDays === Infinity) return "无法消化";
                if (row.sellOutDays !== null && row.sellOutDays !== undefined) return `${Math.round(row.sellOutDays)} 天`;
                return "-";
              }, sortValue: (row) => row.sellOutDays === Infinity ? Number.MAX_SAFE_INTEGER : (row.sellOutDays ?? 0) },
              { label: "销售数量", render: (row) => formatInteger(row.salesQty || 0) },
              { label: "即时库存", render: (row) => formatInteger(row.stockQty || 0) },
              { label: "库存月", render: (row) => row.stockMonths === null || row.stockMonths === undefined ? "-" : `${Math.round(row.stockMonths)} 个月` },
              { label: "生产备注", render: (row) => escapeHtml(row.productionNote || "-") },
              { label: "保质期", render: (row) => row.avgExpiryDate ? `${escapeHtml(row.avgExpiryDate)} 年` : "-" },
              { label: "能否卖完", render: (row) => badge(row.canSellBeforeExpiry === false ? "danger" : "good", row.canSellBeforeExpiry === false ? "卖不完" : "可卖完") },
            ],
            emptyText: "当前筛选下没有 SKU。请换个分类或放宽条件。",
            previewText: `共 ${formatInteger(rows.length)} 条`,
            rowClassName: (row) => row.key === state.matrixFocusKey ? "focus-row" : "",
          })}
          ${renderBigCellModal()}
        </div>
      `;
    }

    function tableSection({ tabId, title, note, rows, columns, emptyText, previewText, rowClassName, showAll }) {
      if (!rows.length) {
        return `
          <div class="card block">
            <div class="block-head">
              <div>
                <h2>${escapeHtml(title)}</h2>
                <div class="note">${escapeHtml(note)}</div>
              </div>
            </div>
            <div class="empty-table">${escapeHtml(emptyText)}</div>
          </div>
        `;
      }

      const activeTabId = tabId || state.activeTab || "overview";
      const tableState = getTableState(activeTabId);
      const sortKey = tableState.sortKey || "";
      const sortDir = tableState.sortDir || "desc";
      const resolvedRows = applySorting(rows, columns, sortKey, sortDir);
      const totalRows = resolvedRows.length;
      const pageSize = showAll ? totalRows : (tableState.pageSize || 20);
      const columnWidths = tableState.columnWidths || {};
      const totalPages = showAll ? 1 : Math.max(1, Math.ceil(totalRows / pageSize));
      const currentPage = showAll ? 1 : Math.min(Math.max(tableState.page || 1, 1), totalPages);
      const pageRows = showAll ? resolvedRows : resolvedRows.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      const colgroup = columns.map((col) => {
        const key = getResizableColumnKey(col);
        const width = columnWidths[key];
        const style = width ? ` style="width:${Math.max(MIN_COLUMN_WIDTH, width)}px"` : "";
        return `<col${style}>`;
      }).join("");
      const body = pageRows.map((row) => `
        <tr${row.key ? ` data-row-key="${escapeHtml(row.key)}"` : ""}${rowClassName ? ` class="${escapeHtml(rowClassName(row))}"` : ""}>
          ${columns.map((col) => {
            const cellHtml = col.render(row);
            if (isProductNameColumn(col)) {
              const tooltipText = escapeHtml(row.productName || "");
              return `<td><span class="cell-clip" data-tooltip="${tooltipText}">${cellHtml}</span></td>`;
            }
            return `<td>${cellHtml}</td>`;
          }).join("")}
        </tr>
      `).join("");
      const header = columns.map((col) => {
        const key = getColumnKey(col);
        const sortable = col.sortable !== false;
        const active = sortable && sortKey === key;
        const arrow = active ? (sortDir === "asc" ? "▲" : "▼") : "";
        const resizable = isProductNameColumn(col);
        return `<th class="${sortable ? "sortable" : ""}${resizable ? " resizable" : ""}" data-sort-key="${escapeHtml(key || "")}" data-tab-id="${escapeHtml(activeTabId)}">${escapeHtml(col.label)}${arrow ? `<span class="sort-arrow">${arrow}</span>` : ""}${resizable ? `<span class="column-resizer" data-column-resize-handle data-column-key="${escapeHtml(key)}" data-tab-id="${escapeHtml(activeTabId)}" aria-hidden="true"></span>` : ""}</th>`;
      }).join("");

      const isLinkedTable = tabId === "linked" || title.includes("联动总表");
      return `
        <div class="card block" ${isLinkedTable ? 'data-linked-table="true"' : ''}>
          <div class="block-head">
            <div>
              <h2>${escapeHtml(title)}</h2>
              <div class="note">${escapeHtml(note)}</div>
            </div>
            <span class="badge neutral">${escapeHtml(previewText || `显示 ${totalRows} 条`)}</span>
          </div>
          <div class="table-toolbar">
            <p class="hint">${showAll ? "点击表头可排序，当前展示全部数据。" : "点击表头可排序，分页会记住当前页。"}</p>
            ${showAll ? "" : `<div class="pager">
              <select data-page-size data-tab-id="${escapeHtml(activeTabId)}" aria-label="每页条数">
                ${[20, 50, 100].map((size) => `<option value="${size}" ${pageSize === size ? "selected" : ""}>每页 ${size} 条</option>`).join("")}
              </select>
              <button class="ghost" data-page-action="prev" data-tab-id="${escapeHtml(activeTabId)}" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
              <span class="page-info">第 ${currentPage} / ${totalPages} 页</span>
              <button class="ghost" data-page-action="next" data-tab-id="${escapeHtml(activeTabId)}" ${currentPage >= totalPages ? "disabled" : ""}>下一页</button>
            </div>`}
          </div>
          <div class="table-wrap">
            <table>
              <colgroup>${colgroup}</colgroup>
              <thead><tr>${header}</tr></thead>
              <tbody>${body}</tbody>
            </table>
          </div>
        </div>
      `;
    }
    function sourcePreviewRows(source, limit = PREVIEW_LIMIT) {
      return source.rows.slice(0, limit);
    }

    function renderOverview(model) {
      const linkedPreview = model.linkedRows.slice(0, PREVIEW_LIMIT);
      const sourceTiles = SOURCE_CONFIGS.map((cfg) => {
        const source = model.sources[cfg.key];
        const ready = source.rows.length > 0;
        return `
          <div class="soft-card">
            <strong>${escapeHtml(cfg.label)}</strong>
            <div class="note">${ready ? `${formatInteger(source.rows.length)} 条记录` : "未上传"}</div>
          </div>
        `;
      }).join("");

      const warningCards = [
        { title: "建议补货", value: formatInteger(model.replenishmentRows.reduce((sum, row) => sum + (row.replenishmentQty || 0), 0)), note: "按 6 个月目标库存推算" },
        { title: "滞销风险", value: formatInteger(model.slowRows.length), note: "库存覆盖期接近或超过剩余保质期" },
        { title: "临期预警", value: formatInteger(model.expiryRows.length), note: "剩余保质期 2 年以内" },
      ].map((item) => `
        <div class="soft-card">
          <strong>${escapeHtml(item.title)}</strong>
          <div style="font-size:22px;font-weight:700;margin:8px 0 4px;">${escapeHtml(item.value)}</div>
          <div class="note">${escapeHtml(item.note)}</div>
        </div>
      `).join("");

      const columns = [
        { label: "品名", render: (row) => escapeHtml(row.productName || "-") },
        { label: "条码", render: (row) => escapeHtml(row.barcode || row.sku || "-") },

    function bindTableInteractions() {
      const host = document.getElementById("tab-content");
      if (!host) return;
      // 移除旧的事件监听器（如果存在）
      if (host._tableClickHandler) {
        host.removeEventListener("click", host._tableClickHandler);
      }
      // 创建新的事件处理器
      host._tableClickHandler = (event) => {
        if (event.target.closest("[data-column-resize-handle]")) return;
        
        // KPI标签点击筛选（使用事件委托）
        const kpiFilterEl = event.target.closest("[data-kpi-filter]");
        if (kpiFilterEl) {
          const filter = kpiFilterEl.dataset.kpiFilter;
          state.matrixFilters.kpiFilter = filter;
          render();
          // 滚动到联动总表
          requestAnimationFrame(() => {
            scrollToLinkedTable();
          });
          return;
        }
        
        const matrixJump = event.target.closest("[data-matrix-jump]");
        if (matrixJump) {
          jumpToLinkedRow(matrixJump.dataset.matrixJump || "");
          return;
        }
        // 联动总表点击品名跳转到九宫格
        const linkToMatrix = event.target.closest(".link-to-matrix");
        if (linkToMatrix) {
          event.preventDefault();
          const key = linkToMatrix.dataset.linkKey;
          if (key) {
            // 设置聚焦的商品
            state.matrixFocusKey = key;
            // 标记滚动目标为九宫格（避免渲染时滚动到联动总表行）
            state.matrixScrollTarget = "grid";
            // 重置KPI筛选，确保商品能在九宫格中显示
            state.matrixFilters.kpiFilter = "all";
            if (state.activeTab !== "matrix") {
              state.activeTab = "matrix";
            }
            render();
            // 找到包含该商品的九宫格格子，滚动并高亮
            // 使用setTimeout确保DOM已经更新
            setTimeout(() => {
              // 使用属性选择器查找，避免key中的特殊字符问题
              const allChips = document.querySelectorAll("[data-matrix-jump]");
              let targetChip = null;
              let targetCell = null;
              allChips.forEach((chip) => {
                if (chip.dataset.matrixJump === key) {
                  targetChip = chip;
                  targetCell = chip.closest("[data-matrix-big-cell]");
                }
              });
              if (targetCell && targetChip) {
                targetCell.scrollIntoView({ block: "center", behavior: "smooth" });
                targetCell.classList.remove("cell-flash");
                void targetCell.offsetWidth; // 强制重排以重启动画
                targetCell.classList.add("cell-flash");
                targetChip.classList.remove("chip-flash");
                void targetChip.offsetWidth;
                targetChip.classList.add("chip-flash");
                // 2秒后移除高亮类
                setTimeout(() => {
                  targetCell.classList.remove("cell-flash");
                  targetChip.classList.remove("chip-flash");
                }, 2000);
              } else {
                // 未找到对应格子，回退到滚动到九宫格顶部
                const matrixPanel = document.getElementById("matrix-panel");
                if (matrixPanel) {
                  matrixPanel.scrollIntoView({ block: "start", behavior: "smooth" });
                }
              }
            }, 100);
          }
          return;
        }
        // 九宫格空状态上传按钮
        const openSource = event.target.closest("[data-open-source]");
        if (openSource) {
          const sourceKey = openSource.dataset.openSource;
          const input = document.getElementById(`input-${sourceKey}`);
          if (input) input.click();
          return;
        }
        const matrixReset = event.target.closest("[data-matrix-reset]");
        if (matrixReset) {
          state.matrixFocusKey = "";
          state.matrixFilters = { category: "全部", isRegularPrice: "全部", kpiFilter: "all" };
          state.salesPeriod = getDefaultSalesPeriod();
          updateTableState("linked", { page: 1, sortKey: "", sortDir: "desc" });
          render();
          return;
        }
        const matrixExportImage = event.target.closest("[data-matrix-export-image]");
        if (matrixExportImage) {
          generateMatrixImage();
          return;
        }
        const matrixFitScreen = event.target.closest("[data-matrix-fit-screen]");
        if (matrixFitScreen) {
          const panel = document.getElementById("matrix-panel");
          const grid = document.getElementById("matrix-grid");
          if (panel && grid) {
            panel.classList.toggle("fit-screen");
            const isFit = panel.classList.contains("fit-screen");
            matrixFitScreen.textContent = isFit ? "退出适应" : "适应屏幕";
            if (isFit) {
              // 先滚动到网格顶部，让网格获得整个视口空间
              const gridTop = grid.getBoundingClientRect().top + window.scrollY;
              window.scrollTo({ top: gridTop - 10, behavior: "instant" });
              // 缩放网格填满整个视口
              const viewportHeight = window.innerHeight;
              const gridHeight = grid.getBoundingClientRect().height;
              const scale = (viewportHeight - 20) / gridHeight;
              grid.style.transform = `scale(${scale})`;
              grid.style.transformOrigin = "top center";
            } else {
              grid.style.transform = "";
            }
          }
          return;
        }
        const matrixExpand = event.target.closest("[data-matrix-expand]");
        if (matrixExpand) {
          const cellKey = matrixExpand.dataset.matrixExpand;
          state.matrixExpandedCells[cellKey] = true;
          render();
          return;
        }
        const matrixCollapse = event.target.closest("[data-matrix-collapse]");
        if (matrixCollapse) {
          const cellKey = matrixCollapse.dataset.matrixCollapse;
          state.matrixExpandedCells[cellKey] = false;
          render();
          return;
        }
        const matrixItemsBtn = event.target.closest("[data-matrix-items]");
        if (matrixItemsBtn) {
          const n = parseInt(matrixItemsBtn.dataset.matrixItems, 10);
          if (n && [4, 8, 12].includes(n)) {
            state.matrixItemsPerCell = n;
            // 重置所有展开状态
            state.matrixExpandedCells = {};
            render();
          }
          return;
        }
        const pagerButton = event.target.closest("[data-page-action]");
        if (pagerButton) {
          const tabId = pagerButton.dataset.tabId || state.activeTab || "overview";
          const current = getTableState(tabId);
          const nextPage = pagerButton.dataset.pageAction === "next" ? current.page + 1 : current.page - 1;
          updateTableState(tabId, { page: Math.max(1, nextPage) });
          render();
          return;
        }

        const th = event.target.closest("th[data-sort-key]");
        if (th) {
          const tabId = th.dataset.tabId || state.activeTab || "overview";
          const key = th.dataset.sortKey || "";
          const current = getTableState(tabId);
          const nextDir = current.sortKey === key && current.sortDir === "asc" ? "desc" : "asc";
          updateTableState(tabId, { sortKey: key, sortDir: nextDir, page: 1 });
          render();
        }
      };

      host.addEventListener("mousemove", (event) => {
        const cell = event.target.closest("[data-tooltip]");
        if (!cell) {
          hideTableTooltip();
          return;
        }
        const text = cell.dataset.tooltip || "";
        if (!text || text === "-") {
          hideTableTooltip();
          return;
        }
        showTableTooltip(text, event.clientX, event.clientY);
      });

      host.addEventListener("mouseleave", hideTableTooltip);

      host.addEventListener("pointerdown", (event) => {
        const handle = event.target.closest("[data-column-resize-handle]");
        if (!handle) return;
        event.preventDefault();
        event.stopPropagation();

        const tabId = handle.dataset.tabId || state.activeTab || "overview";
        const columnKey = handle.dataset.columnKey || "";
        const th = handle.closest("th");
        const table = handle.closest("table");
        const colgroup = table && table.querySelector("colgroup");
        const cols = colgroup ? Array.from(colgroup.querySelectorAll("col")) : [];
        const headerCells = table ? Array.from(table.querySelectorAll("thead th")) : [];
        const columnIndex = headerCells.indexOf(th);
        const colEl = columnIndex >= 0 ? cols[columnIndex] : null;
        if (!th || !columnKey || !colEl) return;

        const startWidth = th.getBoundingClientRect().width;
        if (typeof handle.setPointerCapture === "function") {
          try {
            handle.setPointerCapture(event.pointerId);
          } catch {
            // ignore capture failures
          }
        }
        document.body.style.userSelect = "none";
        document.body.style.cursor = "col-resize";
        columnResizeState.active = {
          tabId,
          columnKey,
          startX: event.clientX,
          startWidth,
          handle,
          colEl,
          pendingWidth: startWidth,
        };
        handle.classList.add("is-dragging");
      });

      host.addEventListener("change", (event) => {
        const pageSizeSelect = event.target.closest("[data-page-size]");
        if (pageSizeSelect) {
          const tabId = pageSizeSelect.dataset.tabId || state.activeTab || "overview";
          const nextPageSize = Number(pageSizeSelect.value) || 20;
          updateTableState(tabId, { pageSize: nextPageSize, page: 1 });
          render();
          return;
        }

        const categorySelect = event.target.closest("[data-matrix-category]");
        const priceSelect = event.target.closest("[data-matrix-price]");
        if (categorySelect || priceSelect) {
          if (categorySelect) state.matrixFilters.category = categorySelect.value || "全部";
          if (priceSelect) state.matrixFilters.isRegularPrice = priceSelect.value || "全部";
          render();
        }
      });

      host.addEventListener("input", (event) => {
        // 销售时间段已改为自动读取，无需手动输入
      });

      // 绑定点击事件处理器
      host.addEventListener("click", host._tableClickHandler);

      document.addEventListener("pointermove", (event) => {
        const active = columnResizeState.active;
        if (!active) return;
        const nextWidth = Math.max(MIN_COLUMN_WIDTH, Math.round(active.startWidth + (event.clientX - active.startX)));
        active.pendingWidth = nextWidth;
        if (columnResizeState.rafId) return;
        columnResizeState.rafId = requestAnimationFrame(() => {
          columnResizeState.rafId = 0;
          const current = columnResizeState.active;
          if (!current || current.pendingWidth === null || current.pendingWidth === undefined) return;
          const widthText = `${current.pendingWidth}px`;
          current.colEl.style.width = widthText;
          current.colEl.style.minWidth = widthText;
        });
      });

      const finishResize = () => {
        const active = columnResizeState.active;
        if (!active) return;
        if (columnResizeState.rafId) {
          cancelAnimationFrame(columnResizeState.rafId);
          columnResizeState.rafId = 0;
        }
        const finalWidth = active.pendingWidth || Math.max(MIN_COLUMN_WIDTH, Math.round(active.colEl.getBoundingClientRect().width));
        updateColumnWidth(active.tabId, active.columnKey, finalWidth);
        active.handle?.classList.remove("is-dragging");
        document.body.style.userSelect = "";
        document.body.style.cursor = "";
        columnResizeState.active = null;
        render();
      };

      document.addEventListener("pointerup", finishResize);
      document.addEventListener("pointercancel", finishResize);
    }

    function jumpToLinkedRow(key) {

      state.matrixScrollTarget = "table";

    function bindMatrixInteractions() {
      const host = document.getElementById("tab-content");
      if (!host) return;
      
      // 分类筛选
      const categorySelect = host.querySelector("[data-matrix-category]");
      if (categorySelect) {
        categorySelect.addEventListener("change", (e) => {

      if (priceSelect) {
        priceSelect.addEventListener("change", (e) => {
          state.matrixFilters.isRegularPrice = e.target.value || "全部";

        });

      // 每格显示数量按钮
      host.querySelectorAll("[data-matrix-items]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const n = parseInt(btn.dataset.matrixItems, 10);
          if (n && [4, 8, 12].includes(n)) {
            state.matrixItemsPerCell = n;
            state.matrixExpandedCells = {};
            render();
          }
        });
      });
      
      // 展开/收起按钮
      host.querySelectorAll("[data-matrix-expand]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const cellKey = btn.dataset.matrixExpand;
          state.matrixExpandedCells[cellKey] = true;
          render();
        });
      });
      host.querySelectorAll("[data-matrix-collapse]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const cellKey = btn.dataset.matrixCollapse;
          state.matrixExpandedCells[cellKey] = false;
          render();
        });
      });
      
      // 重置按钮
      const resetBtn = host.querySelector("[data-matrix-reset]");
      if (resetBtn) {
        resetBtn.addEventListener("click", () => {
          state.matrixFilters = { category: "全部", isRegularPrice: "全部", kpiFilter: "all" };
          state.salesPeriod = getDefaultSalesPeriod();
          state.matrixItemsPerCell = 4;
          state.matrixExpandedCells = {};
          render();
        });
      }
      
      // 导出图片按钮
      const exportBtn = host.querySelector("[data-matrix-export-image]");
      if (exportBtn) {
        exportBtn.addEventListener("click", generateMatrixImage);
      }
      
      // 大宫格点击展开
      host.querySelectorAll("[data-matrix-big-cell]").forEach((cell) => {
        cell.addEventListener("click", (e) => {
          // 如果点击的是商品芯片或展开按钮，不触发大宫格
          if (e.target.closest("[data-matrix-jump]") || e.target.closest("[data-matrix-expand]") || e.target.closest("[data-matrix-collapse]")) {
            return;
          }
          const cellKey = cell.dataset.matrixBigCell;
          state.matrixBigCell = { cellKey };
          render();
        });
      });
      
      // 大宫格关闭按钮
      const bigCellClose = host.querySelector("[data-big-cell-close]");
      if (bigCellClose) {
        bigCellClose.addEventListener("click", () => {
          state.matrixBigCell = null;
          render();
        });
      }
      
      // 大宫格遮罩层点击关闭
      const bigCellOverlay = host.querySelector("[data-big-cell-overlay]");
      if (bigCellOverlay) {
        bigCellOverlay.addEventListener("click", (e) => {
          if (e.target === bigCellOverlay) {
            state.matrixBigCell = null;
            render();
          }
        });
      }
      
      // ESC 键关闭大宫格
      if (state.matrixBigCell) {
        const escHandler = (e) => {
          if (e.key === "Escape") {
            state.matrixBigCell = null;
            render();
            document.removeEventListener("keydown", escHandler);
          }
        };
        document.addEventListener("keydown", escHandler);
      }
    }

    async function generateMatrixImage() {
      const panel = document.getElementById("matrix-panel");
      if (!panel) {
        alert("未找到九宫格面板，请确保已上传文件并切换到九宫格看板");
        return;
      }
      const exportBtn = panel.querySelector("[data-matrix-export-image]");
      if (exportBtn) exportBtn.textContent = "生成中...";
      try {
        const canvas = await html2canvas(panel, {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: "#fbf8f2",
          logging: false,
          foreignObjectRendering: false,
          onclone: (clonedDoc) => {
            const clonedPanel = clonedDoc.getElementById("matrix-panel");
            if (clonedPanel) {
              clonedPanel.style.boxShadow = "none";
              clonedPanel.style.border = "1px solid #d8cdbf";
              clonedPanel.style.fontFamily = '"Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif';
            }
            const allElements = clonedDoc.querySelectorAll("*");
            allElements.forEach((el) => {
              if (el.style) {
                el.style.fontFamily = '"Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif';
              }
            });
          }
        });
        const link = document.createElement("a");
        const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, "-");
        link.download = `九宫格库存分析_${timestamp}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      } catch (err) {
        console.error("生成图片失败:", err);
        alert("生成图片失败: " + (err.message || "未知错误"));
      } finally {
        if (exportBtn) exportBtn.textContent = "导出图片";
      }
    }

              break;
            case "product":
              host.innerHTML = model.uploadedCount ? renderProductTab(model) : renderCockpitEmpty();
              break;
            case "warehouse":
              host.innerHTML = model.uploadedCount ? renderWarehouseTab(model) : renderCockpitEmpty();
              break;
            case "storeInventory":
              host.innerHTML = model.uploadedCount ? renderStoreInventoryTab(model) : renderCockpitEmpty();
              break;
            case "channelSales":
              host.innerHTML = model.uploadedCount ? renderChannelSalesTab(model) : renderCockpitEmpty();
              break;
            case "storeSales":
              host.innerHTML = model.uploadedCount ? renderStoreSalesTab(model) : renderCockpitEmpty();
              break;
            case "replenishment":
              host.innerHTML = model.uploadedCount ? renderReplenishmentTab(model) : renderCockpitEmpty();
              break;

              break;

          host.innerHTML = renderCockpitEmpty();

    }

      const toggleBtn = document.getElementById("sidebar-toggle-btn");

          render();
        });
      }
      if (restoreBtn && !restoreBtn.dataset.bound) {
        restoreBtn.dataset.bound = "1";

          state.sidebarCollapsed = false;
          render();
        });

      renderSidebarInfo(model);
      renderProgressPills(model);
      renderSourceList(model);
      renderDataQuality(model);

      const tabsPanel = document.getElementById("tabs-panel");

              fileInput.click();
            });
            fileInput.addEventListener("change", async () => {
              const file = fileInput.files && fileInput.files[0];

        requestAnimationFrame(scrollToFocusedRow);

    async function handleUpload(key, file, options = {}) {
      const { skipInitialRender = false, skipFinalRender = false } = options;
      const source = state.sources[key];
      const cfg = SOURCE_CONFIGS.find((item) => item.key === key);
      source.loading = true;
      source.error = "";
      if (!skipInitialRender) render();

      try {
        if (key === "matrixWorkbook") {
          // 上传新文件时清除旧的聚焦和展开状态，避免渲染后触发 scrollIntoView 导致页面跳动
          state.matrixFocusKey = "";
          state.matrixExpandedCells = {};
          const fileData = await parseMatrixWorkbookRowsFromFile(file);
          state.sources[key] = {
            ...createEmptySourceState(cfg),
            key,
            label: cfg.label,
            fileName: file.name,
            sheetName: fileData.sheetName,
            importedAt: new Date().toISOString(),
            rows: fileData.rows,
            imageDataByTarget: fileData.imageDataByTarget || {},
            loading: false,
            error: "",
          };
          // 自动读取销售时间段
          if (fileData.salesPeriod) {
            state.salesPeriod = fileData.salesPeriod;
          }
        } else {
          const fileData = await readRowsFromFile(file, cfg.preferredSheets);
          const parsed = cfg.parser(fileData.rows);
          state.sources[key] = {
            ...createEmptySourceState(cfg),
            key,
            label: cfg.label,
            fileName: file.name,
            sheetName: fileData.sheetName,
            importedAt: new Date().toISOString(),
            rows: parsed,
            loading: false,
            error: "",
          };
        }
      } catch (error) {
        state.sources[key] = {
          ...state.sources[key],
          loading: false,
          error: error && error.message ? error.message : "文件解析失败",
        };
      }

      // 如果是销售数据上传，自动更新销售时间段
      if (key === "channelSales" || key === "storeSales") {
        const periodFromData = getSalesPeriodFromData(state.sources);
        if (periodFromData) {
          state.salesPeriod = periodFromData;
        }
      }

      if (!skipFinalRender) render();
    }

    async function handleBatchUpload(files) {
      const list = Array.from(files || []).filter(Boolean);
      if (!list.length) return;

      const unmatched = [];
      let matchedCount = 0;
      for (const file of list) {
        const key = inferSourceKeyFromFileName(file.name);
        if (!key) {
          unmatched.push(file.name);
          continue;
        }
        matchedCount += 1;
        await handleUpload(key, file, { skipInitialRender: true, skipFinalRender: true });
      }

      render();

      if (unmatched.length) {
        const message = `已导入 ${matchedCount} 个文件，以下文件暂时没识别出类型：${unmatched.join("、")}`;
        setBatchNote(message);
      } else {
        setBatchNote(`已批量导入 ${matchedCount} 个文件。`);
      }
    }

    function clearSource(key) {
      const cfg = SOURCE_CONFIGS.find((item) => item.key === key);
      state.sources[key] = createEmptySourceState(cfg);
      setBatchNote("");
      render();
    }

    function clearAll() {
      SOURCE_CONFIGS.forEach((cfg) => {
        state.sources[cfg.key] = createEmptySourceState(cfg);
      });
      state.activeTab = "cockpit";
      state.cockpitSubtab = "overview";
      state.matrixFocusKey = "";
      state.matrixExpandedCells = {};
      setBatchNote("");
      render();
    }

    // 模式切换事件

      const btn = event.target.closest(".mode-btn");
      if (!btn) return;
      const mode = btn.dataset.mode;
      if (mode === state.activeTab) return;
      state.activeTab = mode;
      render();
    });

    document.getElementById("clear-all").addEventListener("click", clearAll);
    document.getElementById("batch-upload").addEventListener("click", () => {
      document.getElementById("batch-input")?.click();
    });
    document.getElementById("batch-input").addEventListener("change", async (event) => {
      const files = event.target.files || [];
      if (!files.length) return;
      await handleBatchUpload(files);
      event.target.value = "";
    });

    restoreAppState();

    // 全局错误处理
    window.addEventListener('error', (e) => {
      console.error('全局错误:', e.error);
      alert('页面加载出错: ' + (e.error?.message || '未知错误'));
    });

    try {
      render();
    } catch (err) {
      console.error('渲染失败:', err);
      alert('页面渲染失败: ' + err.message);
    }
  </script>
