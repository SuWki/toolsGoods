    // 解析门店销售明细（《店铺销售》表）：一行一条订单商品，按商品名称合并规格
    function parseStoreSalesTrendRows(rows) {
      const cleaned = cleanSheetRows(rows || []);
      if (!cleaned.length) return [];
      let headerRowIndex = -1;
      let map = null;
      for (let i = 0; i < Math.min(5, cleaned.length); i += 1) {
        const candidate = headerIndex(cleaned[i]);
        if (candidate.has(normalizeText("商品名称")) &&
          (candidate.has(normalizeText("归属店铺")) || candidate.has(normalizeText("店铺")) || candidate.has(normalizeText("门店")))) {
          headerRowIndex = i;
          map = candidate;
          break;
        }
      }
      if (headerRowIndex < 0) return [];

      const items = [];
      for (let i = headerRowIndex + 1; i < cleaned.length; i += 1) {
        const row = cleaned[i];
        const status = normalizeText(getCell(row, map, ["订单商品状态", "商品状态", "订单状态"]));
        if (status === "关闭" || status === "取消" || status === "退款成功" || status === "已退款" || status === "交易关闭") continue;
        const rawName = String(getCell(row, map, ["商品名称", "商品"]) || "").replace(/\s+/g, " ").trim();
        if (!rawName) continue;
        const nameKey = normalizeText(rawName);
        if (!nameKey) continue;
        const giftFlag = normalizeText(getCell(row, map, ["小样/赠品", "小样赠品", "赠品/小样", "赠品小样"]));
        if (giftFlag === "赠品" || giftFlag === "小样") continue;
        const qty = parseNumber(getCell(row, map, ["商品数量", "数量", "销量", "销售数量"]), 0);
        if (!(qty > 0)) continue;
        const date = parseSeasonDate(getCell(row, map, ["日期", "销售日期", "下单日期", "订单日期"]));
        if (!date) continue;
        const store = normalizeText(getCell(row, map, ["归属店铺", "店铺", "门店", "门店名称"])) || "未归属门店";
        const category = String(getCell(row, map, ["商品类目", "品类", "商品分类", "分类"]) || "").replace(/\s+/g, " ").trim() || "未分类";
        items.push({ productName: rawName, nameKey: nameKey, store: store, qty: qty, date: date, category: category });
      }
      return items;
    }

    function parseSeasonDate(value) {
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        return value.getFullYear() + "-" + String(value.getMonth() + 1).padStart(2, "0") + "-" + String(value.getDate()).padStart(2, "0");
      }
      if (typeof value === "number" && value > 20000 && value < 70000) {
        const serial = new Date(Date.UTC(1899, 11, 30));
        serial.setUTCDate(serial.getUTCDate() + Math.floor(value));
        return serial.toISOString().slice(0, 10);
      }
      const text = String(value == null ? "" : value).trim();
      if (!text) return "";
      let match = /^(\d{4})(\d{2})(\d{2})$/.exec(text);
      if (match) return match[1] + "-" + match[2] + "-" + match[3];
      match = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(text);
      if (match) {
        return match[1] + "-" + String(Number(match[2])).padStart(2, "0") + "-" + String(Number(match[3])).padStart(2, "0");
      }
      return "";
    }

    async function parseSalesTrendRowsFromFile(file) {
      if (!window.XLSX) throw new Error("Excel 解析库未加载，请刷新页面后重试。");
      const fileData = await readRowsFromFile(file, ["店铺销售"]);
      const parsed = parseStoreSalesTrendRows(fileData.rows);
      if (!parsed.length) {
        throw new Error("未解析到门店销售数据，请确认文件包含《店铺销售》工作表，且含日期、商品名称、归属店铺、商品数量列。");
      }
      return { sheetName: fileData.sheetName, rows: parsed };
    }

    function parseInventorySalesRows(rows) {
      const [headers, ...body] = rows;
      const map = headerIndex(headers || []);
      return body.map((row) => {
        const productName = getCell(row, map, ["品名", "货品名称", "商品名称", "SKU名称"]);
        const barcode = getCell(row, map, ["条码", "商品条码", "规格条码"]);
        const sku = getCell(row, map, ["货品编号", "商品编码", "规格编号", "商品/规格编码"]);
        const spec = getCell(row, map, ["规格"]);
        const category = getCell(row, map, ["分类", "商品类目", "一级分类"]);
        const brand = getCell(row, map, ["品牌"]);
        const imageUrl = getCell(row, map, ["图片", "图片链接", "主图", "SKU图片", "image", "imageUrl"]);
        const salesQty = parseNumber(getCell(row, map, ["销售数量", "今年销量", "销量", "近90天销量", "销售量"]), 0);
        const stockQty = parseNumber(getCell(row, map, ["即时库存", "当前库存", "库存数量", "库存"]), 0);
        const stockAmount = maybeNumber(getCell(row, map, ["库存金额", "库存金额(元)", "库存总金额", "库存货值"]));
        const remainingDays = maybeNumber(getCell(row, map, ["库存保质期", "保质期", "剩余保质期", "剩余天数"]));
        const expiryDate = formatDateValue(getCell(row, map, ["到期日期", "有效期至", "截止日期"]));
        const isRegularPrice = parseYesNo(getCell(row, map, ["是否正价", "是否正价品", "正价", "是否正价商品"]));
        const retailPrice = maybeNumber(getCell(row, map, ["零售价", "建议零售价(元)", "最新零售价"]));
        return {
          key: makeBarcodeKey({ barcode, sku, specCode: sku, productCode: sku, productName, spec }),
          productName,
          barcode,
          sku,
          spec,
          category,
          brand,
          imageUrl,
          salesQty,
          stockQty,
          stockAmount,
          remainingDays,
          shelfLifeDays: remainingDays,
          expiryDate,
          isRegularPrice,
          retailPrice,
          raw: row,
        };
      }).filter((row) => (row.productName || row.barcode || row.sku) && !isAggregateLabel(row.productName) && !isAggregateLabel(row.barcode));
    }

    function aggregateRows(rows, keyFn, buildRow) {
      const map = new Map();
      rows.forEach((row) => {
        const key = keyFn(row);
        if (!key) return;
        const current = map.get(key);
        if (!current) {
          map.set(key, buildRow(row));
          return;
        }
        buildRow(row, current);
      });
      return Array.from(map.values());
    }

    function summarizeChannelSales(rows) {
      return aggregateRows(rows, (row) => keyFrom(row.channel, row.barcode, row.sku, row.productName, row.spec), (row, current) => {
        if (!current) {
          return {
            key: keyFrom(row.channel, row.barcode, row.sku, row.productName, row.spec),
            orderCount: 1,
            qty: row.qty,
            channel: row.channel,
            warehouse: row.warehouse,
            productName: row.productName,
            barcode: row.barcode,
            sku: row.sku,
            spec: row.spec,
            latestTime: row.time,
          };
        }
        current.orderCount += 1;
        current.qty += row.qty;
        current.channel = current.channel || row.channel;
        current.warehouse = current.warehouse || row.warehouse;
        current.latestTime = current.latestTime || row.time;
        return current;
      });
    }

    function summarizeStoreSales(rows) {
      return aggregateRows(rows, (row) => keyFrom(row.store, row.barcode, row.specCode, row.productCode, row.productName, row.spec), (row, current) => {
        if (!current) {
          return {
            key: keyFrom(row.store, row.barcode, row.specCode, row.productCode, row.productName, row.spec),
            orderCount: 1,
            qty: row.qty,
            store: row.store,
            productName: row.productName,
            barcode: row.barcode,
            spec: row.spec,
            specCode: row.specCode,
            productCode: row.productCode,
            unitPrice: row.unitPrice,
            finalPrice: row.finalPrice,
            status: row.status,
          };
        }
        current.orderCount += 1;
        current.qty += row.qty;
        current.unitPrice = current.unitPrice || row.unitPrice;
        current.finalPrice = current.finalPrice || row.finalPrice;
        current.status = current.status || row.status;
        return current;
      });
    }

    function buildLinkedRows(sources) {
      const map = new Map();
      const periodDays = getSalesPeriodDays();
      // 用于计算加权平均到期日期的批次数据收集
      const batchExpiryData = new Map(); // key -> [{expiryDate, availableQty}]

      const ensure = (key) => {
        if (!map.has(key)) {
          map.set(key, {
            key,
            productName: "",
            barcode: "",
            sku: "",
            spec: "",
            brand: "",
            category: "",
            retailPrice: null,
            warehouseStock: 0,
            warehouseAvailable: 0,
            storeStock: 0,
            storeAvailable: 0,
            channelSalesQty: 0,
            storeSalesQty: 0,
            totalSalesQty: 0,
            stockDepthDays: null,
            remainingDays: null,
            productionDate: "",
            expiryDate: "",
            avgExpiryDate: "", // 加权平均到期日期
            productionNote: "", // 生产备注
            reorderNote: "", // 补单备注
            sourceCount: 0,
            sourceFlags: {
              product: false,
              warehouse: false,
              storeInventory: false,
              channelSales: false,
              storeSales: false,
            },
          });
        }
        return map.get(key);
      };

      // 收集批次到期日期数据用于加权平均计算
      const collectBatchExpiry = (key, expiryDate, availableQty) => {
        if (!key || !expiryDate || !availableQty || availableQty <= 0) return;
        // 标准化日期格式
        const dateStr = String(expiryDate).trim();
        if (!dateStr) return;
        if (!batchExpiryData.has(key)) {
          batchExpiryData.set(key, []);
        }
        batchExpiryData.get(key).push({ expiryDate: dateStr, availableQty });
      };

      // 计算加权平均剩余有效期（年）
      const calculateWeightedAvgRemainingYears = (key) => {
        const batches = batchExpiryData.get(key);
        if (!batches || batches.length === 0) return null;

        const now = new Date();
        let totalWeight = 0;
        let weightedDays = 0;

        for (const batch of batches) {
          const expiryDate = new Date(batch.expiryDate);
          if (Number.isNaN(expiryDate.getTime())) continue;
          const remainingDays = Math.max(0, Math.round((expiryDate.getTime() - now.getTime()) / 86400000));
          totalWeight += batch.availableQty;
          weightedDays += remainingDays * batch.availableQty;
        }

        if (totalWeight === 0) return null;

        const avgDays = weightedDays / totalWeight;
        const years = (avgDays / 365).toFixed(1); // 保留1位小数
        return years;
      };

      const mergeIdentity = (target, row) => {
        target.productName = target.productName || row.productName || "";
        target.barcode = target.barcode || row.barcode || "";
        target.sku = target.sku || row.sku || "";
        target.spec = target.spec || row.spec || "";
        target.brand = target.brand || row.brand || "";
        target.category = target.category || row.category || row.firstCategory || "";
        target.productionNote = target.productionNote || row.productionNote || "";
        target.reorderNote = target.reorderNote || row.reorderNote || "";
        if (target.retailPrice === null && row.retailPrice !== undefined && row.retailPrice !== null) {
          target.retailPrice = row.retailPrice;
        }
      };

      sources.product.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        item.sourceFlags.product = true;
      });

      sources.warehouse.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        item.sourceFlags.warehouse = true;
        item.warehouseStock += row.stockQty || 0;
        item.warehouseAvailable += row.availableQty || 0;
        const candidateDays = row.remainingDays !== null && row.remainingDays !== undefined ? row.remainingDays : daysUntil(row.expiryDate);
        if (candidateDays !== null && candidateDays !== undefined) {
          item.remainingDays = item.remainingDays === null ? candidateDays : Math.min(item.remainingDays, candidateDays);
        }
        item.productionDate = item.productionDate || row.productionDate || "";
        item.expiryDate = item.expiryDate || row.expiryDate || "";
        // 收集批次到期日期数据用于加权平均计算（可用库存 > 0）
        collectBatchExpiry(row.key, row.expiryDate, row.availableQty);
      });

      sources.storeInventory.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        item.sourceFlags.storeInventory = true;
        item.storeStock += row.stockQty || 0;
        item.storeAvailable += row.availableQty || 0;
        const candidateDays = row.remainingDays !== null && row.remainingDays !== undefined ? row.remainingDays : daysUntil(row.expiryDate);
        if (candidateDays !== null && candidateDays !== undefined) {
          item.remainingDays = item.remainingDays === null ? candidateDays : Math.min(item.remainingDays, candidateDays);
        }
        item.productionDate = item.productionDate || row.productionDate || "";
        item.expiryDate = item.expiryDate || row.expiryDate || "";
        // 收集批次到期日期数据用于加权平均计算（可用库存 > 0）
        collectBatchExpiry(row.key, row.expiryDate, row.availableQty);
      });

      sources.channelSales.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        item.sourceFlags.channelSales = true;
        item.channelSalesQty += row.qty || 0;
      });

      sources.storeSales.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        item.sourceFlags.storeSales = true;
        item.storeSalesQty += row.qty || 0;
      });

      // 处理九宫格文件数据（matrixWorkbook），获取规格、生产备注、图片等
      sources.matrixWorkbook.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        // 从matrixWorkbook获取特有的字段
        if (row.spec) item.spec = row.spec;
        if (row.productionNote) item.productionNote = row.productionNote;
        if (row.reorderNote) item.reorderNote = row.reorderNote;
        if (row.imageUrl) item.imageUrl = row.imageUrl;
        if (row.imageTarget) item.imageTarget = row.imageTarget;
        if (row.salesBand) item.salesBand = row.salesBand;
        if (row.stockHealth) item.stockHealth = row.stockHealth;
        if (row.salesTrend) item.salesTrend = row.salesTrend;
        if (row.dailySalesCoef !== null && row.dailySalesCoef !== undefined) item.dailySalesCoef = row.dailySalesCoef;
        // 如果matrixWorkbook中有库存数据，也合并
        if (row.stockQty && row.stockQty > 0) {
          item.warehouseAvailable = item.warehouseAvailable || row.stockQty;
        }
      });

      return Array.from(map.values()).map((item) => {
        item.totalSalesQty = item.channelSalesQty + item.storeSalesQty;
        item.totalInventoryQty = item.warehouseAvailable + item.storeAvailable;
        item.salesDaily = safeDivide(item.totalSalesQty, periodDays) || 0;
        item.sales30Qty = item.totalSalesQty;
        item.inventoryQty = item.totalInventoryQty;
        item.stockDepthDays = item.salesDaily > 0 ? item.totalInventoryQty / item.salesDaily : null;
        item.coverMonths = item.salesDaily > 0 ? item.totalInventoryQty / (item.salesDaily * 30) : null;
        item.targetInventory6m = item.salesDaily > 0 ? item.salesDaily * 180 : null;
        item.replenishmentQty = item.targetInventory6m !== null ? Math.max(0, Math.round(item.targetInventory6m - item.totalInventoryQty)) : 0;
        item.expiryMinDays = item.remainingDays;
        item.slowRisk = evaluateSlowRisk(item);
        item.expiryRisk = evaluateExpiryRisk(item);
        item.sourceCount = Object.values(item.sourceFlags).filter(Boolean).length;
        // 计算加权平均到期日期
        item.avgExpiryDate = calculateWeightedAvgRemainingYears(item.key) || "";
        return item;
      }).sort((a, b) => {
        const aScore = a.totalSalesQty || a.totalInventoryQty || 0;
        const bScore = b.totalSalesQty || b.totalInventoryQty || 0;
        return bScore - aScore;
      });
    }

    function getSalesPeriodDays(period = state.salesPeriod) {
      const start = period && period.start ? new Date(period.start) : null;
      const end = period && period.end ? new Date(period.end) : null;
      if (!start || !end || Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) {
        return 180;
      }
      const diff = Math.round((end.getTime() - start.getTime()) / 86400000) + 1;
      return Math.max(diff, 1);
    }

    function makeDomId(prefix, key) {
      return `${prefix}-${String(key || "").replace(/[^a-zA-Z0-9_-]+/g, "_")}`;
    }

    function getStockHealthLabel(stockMonths) {
      if (stockMonths === null || stockMonths === undefined || Number.isNaN(stockMonths)) return "未知";
      if (stockMonths <= 12) return "健康";
      if (stockMonths <= 24) return "风险";
      return "积压";
    }

    function getSalesBandLabel(percent) {
      if (percent === null || percent === undefined || Number.isNaN(percent)) return "平销";
      if (percent <= 0.3) return "畅销";
      if (percent <= 0.7) return "平销";
      return "滞销";
    }

    function getMatrixCellMeta(row) {
      const stockBand = getStockHealthLabel(row.stockMonths);
      const salesBand = row.salesBand || "平销";
      const cellKey = `${stockBand}|${salesBand}`;
      const metaMap = {
        "健康|畅销": { title: "核心爆款区", badge: "重点保供", theme: "good" },
        "健康|平销": { title: "稳定发展区", badge: "持续关注", theme: "warm" },
        "健康|滞销": { title: "潜力优化区", badge: "优化动销", theme: "warn" },
        "风险|畅销": { title: "补货关注区", badge: "控制库存", theme: "warm" },
        "风险|平销": { title: "调整观察区", badge: "动态跟踪", theme: "warn" },
        "风险|滞销": { title: "预警处理区", badge: "促销去化", theme: "danger" },
        "积压|畅销": { title: "资金占用区", badge: "谨慎补货", theme: "danger" },
        "积压|平销": { title: "清理改善区", badge: "制定计划", theme: "danger" },
        "积压|滞销": { title: "重点清理区", badge: "清仓处理", theme: "danger" },
      };
      return metaMap[cellKey] || { title: cellKey, badge: "待判定", theme: "neutral" };
    }

    // ===== 新九宫格分类逻辑：日销系数 × 消化周期 =====
    // 消化周期(天) → X+Y系数之和
    function getDigestionSum(sellOutDays) {
      if (sellOutDays === null || sellOutDays === undefined || Number.isNaN(sellOutDays)) return 6;
      // 负数消化周期为异常情况（如库存或销量为负），当作无法消化丢到9号位（sum=6）
      if (sellOutDays < 0) return 6;
      if (sellOutDays <= 90) return 2;
      if (sellOutDays <= 180) return 3;
      if (sellOutDays <= 360) return 4;
      if (sellOutDays <= 720) return 5;
      return 6;
    }

    // 消化周期标签
    function getDigestionLabel(sum) {
      const labels = { 2: "≤90天", 3: "≤180天", 4: "≤360天", 5: "≤720天", 6: ">720天" };
      return labels[sum] || "未知";
    }

    // 判断消化周期是否"无法消化"：负数（异常）或 Infinity（有库存无销量）
    // 用于表格统一显示"无法消化"，避免负数被显示为"-100 天"
    function isIndigestible(sellOutDays) {
      return sellOutDays === Infinity
        || (typeof sellOutDays === "number" && sellOutDays < 0)
        || (sellOutDays !== null && sellOutDays !== undefined && Number(sellOutDays) < 0);
    }

    // 九宫格位置编号：先横再竖，1~9号位
    // gridOrder: (1,1)=1号位 (2,1)=2号位 (3,1)=3号位 (1,2)=4号位 ... (3,3)=9号位
    const GRID_ORDER = [
      { x: 1, y: 1 }, { x: 2, y: 1 }, { x: 3, y: 1 },
      { x: 1, y: 2 }, { x: 2, y: 2 }, { x: 3, y: 2 },
      { x: 1, y: 3 }, { x: 2, y: 3 }, { x: 3, y: 3 },
    ];

    function getMatrixPosition(x, y) {
      const idx = GRID_ORDER.findIndex(p => p.x === x && p.y === y);
      if (idx < 0) return "-";
      const nums = ["一", "二", "三", "四", "五", "六", "七", "八", "九"];
      return `${nums[idx]}号位`;
    }

    function getMatrixPositionShort(x, y) {
      const idx = GRID_ORDER.findIndex(p => p.x === x && p.y === y);
      if (idx < 0) return "-";
      return `${idx + 1}号位`;
    }

    // 九宫格位置优劣等级映射（1=最优，5=最差）
    // 规则：1号位最优；2号位=4号位；3号位=5号位=7号位；6号位=8号位；9号位最差
    // 等级数值越小表示位置越好
    const POSITION_RANK_MAP = { 1: 1, 2: 2, 3: 3, 4: 2, 5: 3, 6: 4, 7: 3, 8: 4, 9: 5 };

    // 从位置字符串（如"3号位"）提取等级；无效位置返回 null
    function getPositionRank(posStr) {
      if (!posStr) return null;
      const m = String(posStr).match(/(\d+)号位/);
      if (!m) return null;
      const num = parseInt(m[1], 10);
      return POSITION_RANK_MAP[num] != null ? POSITION_RANK_MAP[num] : null;
    }

    // 计算两个位置之间的趋势箭头（HTML）
    // 变好=绿色↑，变差=红色↓，持平=灰色→，无法比较=空
    function getPositionTrendArrow(fromPos, toPos) {
      const fromRank = getPositionRank(fromPos);
      const toRank = getPositionRank(toPos);
      if (fromRank == null || toRank == null) return "";
      if (toRank < fromRank) {
        // 等级数值变小=位置变好
        return `<span style="color:#16a34a;font-weight:600;" title="位置变好：${fromPos} → ${toPos}">↑</span>`;
      } else if (toRank > fromRank) {
        // 等级数值变大=位置变差
        return `<span style="color:#dc2626;font-weight:600;" title="位置变差：${fromPos} → ${toPos}">↓</span>`;
      } else {
        // 等级相同=持平
        return `<span style="color:#9ca3af;font-weight:600;" title="位置持平：${fromPos} → ${toPos}">→</span>`;
      }
    }

    // 获取当前数据源的时间节点标签
    function getCurrentNodeLabel() {
      const source = state.sources.matrixWorkbook;
      if (source && source.fileName) {
        // 从文件名中提取日期信息
        const match = source.fileName.match(/(\d{2,4}[-.]?\d{1,2}[-.]?\d{0,2})/);
        if (match) return match[1].replace(/[.-]/g, ".");
      }
      if (state.salesPeriod && state.salesPeriod.end) {
        return state.salesPeriod.end;
      }
      return new Date().toISOString().slice(0, 10);
    }

    // 保存当前九宫格位置到历史记录
    function saveMatrixHistory(rows) {
      const nodeLabel = getCurrentNodeLabel();
      if (!nodeLabel) return;
      rows.forEach((row) => {
        if (!row.key) return;
        if (!state.matrixHistory[row.key]) {
          state.matrixHistory[row.key] = {};
        }
        state.matrixHistory[row.key][nodeLabel] = getMatrixPositionShort(row.salesCoef, row.inventoryCoef);
      });
      if (!state.matrixHistoryNodes.includes(nodeLabel)) {
        state.matrixHistoryNodes.push(nodeLabel);
      }
      // 自动填充未设置的对比节点
      for (let i = 0; i < 3; i++) {
        if (!state.historyCompareNodes[i] && state.matrixHistoryNodes[i]) {
          state.historyCompareNodes[i] = state.matrixHistoryNodes[i];
        }
      }
    }

    // 新九宫格单元格元数据
    // 横轴X=日销系数(1高~3低)，纵轴Y=消化周期反推(1低~3高)
    function getMatrixCellMetaNew(x, y) {
      const cellKey = `${x}|${y}`;
      const metaMap = {
        "1|1": { title: "原价/补货",   badge: "≤90天",   theme: "good" },
        "2|1": { title: "原价/关注",   badge: "≤180天",  theme: "good" },
        "3|1": { title: "原价/不补",   badge: "≤360天",  theme: "warm" },
        "1|2": { title: "原价/关注",   badge: "≤180天",  theme: "good" },
        "2|2": { title: "原价/不补",   badge: "≤360天",  theme: "warm" },
        "3|2": { title: "活动/消化",   badge: "≤720天",  theme: "danger" },
        "1|3": { title: "原价/不补",   badge: "≤360天",  theme: "warm" },
        "2|3": { title: "活动/消化",   badge: "≤720天",  theme: "danger" },
        "3|3": { title: "折价/去库存", badge: ">720天",  theme: "danger" },
      };
      return metaMap[cellKey] || { title: cellKey, badge: "待判定", theme: "neutral" };
    }

    // 宫格总消化天数：总库存 ÷ 总日销吞吐（日销吞吐 = Σ 单品库存/单品消化天数）
    // 即把宫格内所有库存合并后按整体销售速度卖完所需的天数；全部无法消化时返回 null
    function computeCellDigestionDays(cellRows) {
      let throughput = 0;
      cellRows.forEach((row) => {
        const qty = parseNumber(row.stockQty, 0);
        const days = row.sellOutDays;
        if (qty > 0 && days !== null && days !== undefined && Number.isFinite(days) && days > 0) {
          throughput += qty / days;
        }
      });
      if (throughput <= 0) return null;
      const totalQty = cellRows.reduce((sum, row) => sum + parseNumber(row.stockQty, 0), 0);
      return totalQty / throughput;
    }

    // 为商品分配日销系数(X)和纵轴值(Y=sum-X)
    // 1. 用O列库存月确定 X+Y 之和（库存月×30≈消化周期天数）
    // 2. 直接读取日销系数列数值分配X：N≥10→X=1(高日销)，3≤N<10→X=2(中日销)，N<3→X=3(低日销)
    // 3. Y = sum - X（由消化周期反推，不再单独计算库存系数）
    function assignMatrixCoefficients(rows, periodDays) {
      // 计算消化周期和系数之和
      rows.forEach((row) => {
        // 优先使用库存月(O列)计算消化周期
        if (row.stockMonths !== null && row.stockMonths !== undefined && !Number.isNaN(row.stockMonths)) {
          row.sellOutDays = row.stockMonths * 30;
        } else if (row.sellOutDays !== null && row.sellOutDays !== undefined) {
          // 保留已计算的 sellOutDays（可能为 Infinity）
        } else if (row.salesQty > 0) {
          row.sellOutDays = (row.stockQty / row.salesQty) * periodDays;
        } else {
          // 有库存但无销量，消化周期无穷大
          row.sellOutDays = Infinity;
        }
        row.digestionSum = getDigestionSum(row.sellOutDays);
      });

      // 直接根据N列日销系数数值分配X（不再组内排名）
      rows.forEach((row) => {
        const n = (row.dailySalesCoef != null && !Number.isNaN(row.dailySalesCoef)) ? row.dailySalesCoef : 0;
        let x;
        if (n >= 10) {
          x = 1;  // 高日销
        } else if (n >= 3) {
          x = 2;  // 中日销
        } else {
          x = 3;  // 低日销
        }
        // 根据消化周期约束 X 的范围：X ∈ [max(1, sum-3), min(3, sum-1)]
        const sum = row.digestionSum;
        const minX = Math.max(1, sum - 3);
        const maxX = Math.min(3, sum - 1);
        x = Math.max(minX, Math.min(maxX, x));
        row.salesCoef = x;
        row.inventoryCoef = sum - x;
      });
    }

    // 生产属性归一化：将生产备注文本归为 正常生产 / 停产 / 待定 / 其他 / 未设置
    function getProductionStatus(productionNote) {
      const note = String(productionNote || "").trim();
      if (!note) return "未设置";
      if (note.includes("正常")) return "正常生产";
      if (note.includes("停产")) return "停产";
      if (note.includes("待定")) return "待定";
      return "其他";
    }

    // 判断补单备注是否为在途（用于⭐补单在途标记）
    function isReorderInTransit(reorderNote) {
      return String(reorderNote || "").includes("在途");
    }

    function buildMatrixRowsFromWorkbook(source) {
      const periodMonths = source?.periodMonths || 7;
      const periodDays = periodMonths * 30;
      const baseRows = Array.isArray(source?.rows) ? source.rows.slice() : [];
      const rows = baseRows
        .map((row) => {
          const salesQty = parseNumber(row.salesQty, 0);
          const stockQty = parseNumber(row.stockQty, 0);
          const retailPrice = maybeNumber(row.retailPrice);
          const inventoryAmount = maybeNumber(row.inventoryAmount);
          const stockMonths = maybeNumber(row.stockMonths);
          const remainingDays = maybeNumber(row.remainingDays);
          const sellOutDays = (stockMonths !== null && stockMonths !== undefined && !Number.isNaN(stockMonths))
            ? stockMonths * 30
            : (row.sellOutDays !== null && row.sellOutDays !== undefined
              ? row.sellOutDays
              : (salesQty > 0 ? (stockQty / salesQty) * periodDays : Infinity));
          const derivedStockMonths = stockMonths !== null && stockMonths !== undefined
            ? stockMonths
            : (salesQty > 0 ? (stockQty / salesQty) * periodMonths : null);
          // 负数消化周期为异常情况：能否卖完直接判定为 false（卖不完）
          const canSellBeforeExpiry = (sellOutDays !== null && sellOutDays < 0)
            ? false
            : (row.canSellBeforeExpiry !== null && row.canSellBeforeExpiry !== undefined
              ? row.canSellBeforeExpiry
              : (remainingDays !== null && sellOutDays !== null ? sellOutDays <= remainingDays : null));

          // 保质期：剩余天数 / 365，保留1位小数
          const remainingDaysForExpiry = maybeNumber(row.remainingDays);
          const avgExpiryDate = remainingDaysForExpiry !== null && remainingDaysForExpiry !== undefined
            ? (remainingDaysForExpiry / 365).toFixed(1)
            : "";

          return {
            ...row,
            salesQty,
            stockQty,
            retailPrice,
            inventoryAmount: inventoryAmount !== null && inventoryAmount !== undefined
              ? inventoryAmount
              : (retailPrice !== null && retailPrice !== undefined ? stockQty * retailPrice : null),
            stockMonths: derivedStockMonths,
            sellOutDays,
            canSellBeforeExpiry,
            avgExpiryDate,
            stockHealth: row.stockHealth || getStockHealthLabel(derivedStockMonths),
            salesBand: row.salesBand || "",
          };
        })
        .filter((row) => row.productName || row.barcode || row.sku);

      // 分配日销系数和纵轴值（基于消化周期反推九宫格）
      assignMatrixCoefficients(rows, periodDays);
      rows.forEach((row) => {
        row.matrixMeta = getMatrixCellMetaNew(row.salesCoef, row.inventoryCoef);
      });

      const categoryOptions = Array.from(new Set(rows.map((row) => row.category || "未分类"))).sort((a, b) => a.localeCompare(b, "zh-CN"));
      const filtered = rows.filter((row) => {
        // 即时库存为0的商品暂不计入统计
        if ((row.stockQty || 0) === 0) return false;
        const categoryFilter = state.matrixFilters.category || "全部";
        const priceFilter = state.matrixFilters.isRegularPrice || "全部";
        const productionFilter = state.matrixFilters.productionNote || "全部";
        const kpiFilter = state.matrixFilters.kpiFilter || "all";
        if (categoryFilter !== "全部" && (row.category || "未分类") !== categoryFilter) return false;
        if (priceFilter !== "全部" && (row.isRegularPrice || "未设置") !== priceFilter) return false;
        if (productionFilter !== "全部" && getProductionStatus(row.productionNote) !== productionFilter) return false;
        // KPI筛选（按消化周期分类）
        if (kpiFilter !== "all") {
          if (kpiFilter === "digest2" && row.digestionSum !== 2) return false;
          if (kpiFilter === "digest3" && row.digestionSum !== 3) return false;
          if (kpiFilter === "digest4" && row.digestionSum !== 4) return false;
          if (kpiFilter === "digest5" && row.digestionSum !== 5) return false;
          if (kpiFilter === "digest6" && row.digestionSum !== 6) return false;
        }
        return true;
      });

      const gridOrder = [
        { x: 1, y: 1 }, { x: 2, y: 1 }, { x: 3, y: 1 },
        { x: 1, y: 2 }, { x: 2, y: 2 }, { x: 3, y: 2 },
        { x: 1, y: 3 }, { x: 2, y: 3 }, { x: 3, y: 3 },
      ];
      const cells = gridOrder.map(({ x, y }) => {
const cellRows = filtered.filter((row) => row.salesCoef === x && row.inventoryCoef === y)
.sort((a, b) => {
const ai = parseInt(a.id, 10); const bi = parseInt(b.id, 10);
if (!isNaN(ai) && !isNaN(bi)) return ai - bi;
return String(a.id || "").localeCompare(String(b.id || ""), "zh");
});
const skuCount = cellRows.length;
const inventoryQty = cellRows.reduce((sum, row) => sum + (row.stockQty || 0), 0);
const inventoryAmount = cellRows.reduce((sum, row) => sum + (row.inventoryAmount || 0), 0);
return {
key: `${x}|${y}`,
x,
y,
rows: cellRows,
skuCount,
inventoryQty,
          inventoryAmount,
          meta: getMatrixCellMetaNew(x, y),
        };
      });
      // 各宫格库存占比（分母=当前筛选下九宫格总库存）与总消化天数
      const totalCellInventoryQty = cells.reduce((sum, c) => sum + c.inventoryQty, 0);
      cells.forEach((c) => {
        c.stockShare = totalCellInventoryQty > 0 ? c.inventoryQty / totalCellInventoryQty : null;
        c.totalDigestDays = computeCellDigestionDays(c.rows);
      });

      const summary = {
        totalSku: filtered.length,
        totalInventoryQty: filtered.reduce((sum, row) => sum + (row.stockQty || 0), 0),
        totalInventoryAmount: filtered.reduce((sum, row) => sum + (row.inventoryAmount || 0), 0),
        digest2Count: filtered.filter((row) => row.digestionSum === 2).length,
        digest3Count: filtered.filter((row) => row.digestionSum === 3).length,
        digest4Count: filtered.filter((row) => row.digestionSum === 4).length,
        digest5Count: filtered.filter((row) => row.digestionSum === 5).length,
        digest6Count: filtered.filter((row) => row.digestionSum === 6).length,
        selloutSafeCount: filtered.filter((row) => row.canSellBeforeExpiry === true).length,
        selloutRiskCount: filtered.filter((row) => row.canSellBeforeExpiry === false).length,
        categoryOptions,
      };

      return {
        rows,
        filteredRows: filtered,
        cells,
        summary,
        periodDays,
        periodLabel: source?.salesPeriod ? `${source.salesPeriod.start} ~ ${source.salesPeriod.end}` : `最近 ${periodMonths} 个月净出库`,
        categoryOptions,
      };
    }

    function buildMatrixRows(sources) {
      const productMap = new Map(sources.product.rows.map((row) => [row.key, row]));
      const stockMap = new Map(sources.inventorySales.rows.map((row) => [row.key, row]));
      const keys = new Set([...productMap.keys(), ...stockMap.keys()]);
      const periodDays = getSalesPeriodDays();
      const periodMonths = periodDays / 30;

      const rows = Array.from(keys).map((key) => {
        const product = productMap.get(key) || {};
        const stock = stockMap.get(key) || {};
        const productName = product.productName || stock.productName || "";
        const barcode = product.barcode || stock.barcode || "";
        const sku = product.sku || stock.sku || "";
        const spec = product.spec || stock.spec || "";
        const category = product.category || stock.category || "未分类";
        const brand = product.brand || stock.brand || "";
        const imageUrl = product.imageUrl || stock.imageUrl || "";
        const isRegularPrice = product.isRegularPrice || stock.isRegularPrice || "";
        const retailPrice = maybeNumber(product.retailPrice ?? stock.retailPrice);
        const salesQty = parseNumber(stock.salesQty, 0);
        const stockQty = parseNumber(stock.stockQty, 0);
        const inventoryAmount = maybeNumber(stock.stockAmount);
        const derivedInventoryAmount = inventoryAmount !== null && inventoryAmount !== undefined
          ? inventoryAmount
          : (retailPrice !== null && retailPrice !== undefined ? stockQty * retailPrice : null);
        const shelfLifeDays = maybeNumber(stock.shelfLifeDays);
        const expiryDate = stock.expiryDate || "";
        const currentSellDays = salesQty > 0 ? (stockQty / salesQty) * periodDays : null;
        const stockMonths = salesQty > 0 ? (stockQty / salesQty) * periodMonths : null;
        const canSellBeforeExpiry = shelfLifeDays !== null && currentSellDays !== null
          ? currentSellDays <= shelfLifeDays
          : null;
        const salesBand = "";
        const stockHealth = getStockHealthLabel(stockMonths);
        const productionNote = product.productionNote || stock.productionNote || "";
        const reorderNote = product.reorderNote || stock.reorderNote || "";
        return {
          key,
          productName,
          barcode,
          sku,
          spec,
          category,
          brand,
          imageUrl,
          isRegularPrice,
          retailPrice,
          salesQty,
          stockQty,
          inventoryAmount: derivedInventoryAmount,
          shelfLifeDays,
          expiryDate,
          sellOutDays: currentSellDays,
          stockMonths,
          stockHealth,
          canSellBeforeExpiry,
          salesBand,
          productionNote,
          reorderNote,
          rawProduct: product.raw,
          rawStock: stock.raw,
        };
      }).filter((row) => row.productName || row.barcode || row.sku);

      // 分配日销系数和纵轴值（基于消化周期反推九宫格）
      assignMatrixCoefficients(rows, periodDays);
      rows.forEach((row) => {
        row.matrixMeta = getMatrixCellMetaNew(row.salesCoef, row.inventoryCoef);
      });

      const categoryOptions = Array.from(new Set(rows.map((row) => row.category || "未分类"))).sort((a, b) => a.localeCompare(b, "zh-CN"));
      const filtered = rows.filter((row) => {
        // 即时库存为0的商品暂不计入统计
        if ((row.stockQty || 0) === 0) return false;
        const categoryFilter = state.matrixFilters.category || "全部";
        const priceFilter = state.matrixFilters.isRegularPrice || "全部";
        const productionFilter = state.matrixFilters.productionNote || "全部";
        if (categoryFilter !== "全部" && (row.category || "未分类") !== categoryFilter) return false;
        if (priceFilter !== "全部" && (row.isRegularPrice || "未设置") !== priceFilter) return false;
        if (productionFilter !== "全部" && getProductionStatus(row.productionNote) !== productionFilter) return false;
        return true;
      });

      const gridOrder = [
        { x: 1, y: 1 }, { x: 2, y: 1 }, { x: 3, y: 1 },
        { x: 1, y: 2 }, { x: 2, y: 2 }, { x: 3, y: 2 },
        { x: 1, y: 3 }, { x: 2, y: 3 }, { x: 3, y: 3 },
      ];
      const cells = gridOrder.map(({ x, y }) => {
const cellRows = filtered.filter((row) => row.salesCoef === x && row.inventoryCoef === y)
.sort((a, b) => {
const ai = parseInt(a.id, 10); const bi = parseInt(b.id, 10);
if (!isNaN(ai) && !isNaN(bi)) return ai - bi;
return String(a.id || "").localeCompare(String(b.id || ""), "zh");
});
const skuCount = cellRows.length;
const inventoryQty = cellRows.reduce((sum, row) => sum + (row.stockQty || 0), 0);
const inventoryAmount = cellRows.reduce((sum, row) => sum + (row.inventoryAmount || 0), 0);
return {
key: `${x}|${y}`,
x,
y,
rows: cellRows,
skuCount,
inventoryQty,
          inventoryAmount,
          meta: getMatrixCellMetaNew(x, y),
        };
      });
      // 各宫格库存占比（分母=当前筛选下九宫格总库存）与总消化天数
      const totalCellInventoryQty = cells.reduce((sum, c) => sum + c.inventoryQty, 0);
      cells.forEach((c) => {
        c.stockShare = totalCellInventoryQty > 0 ? c.inventoryQty / totalCellInventoryQty : null;
        c.totalDigestDays = computeCellDigestionDays(c.rows);
      });

      const summary = {
        totalSku: filtered.length,
        totalInventoryQty: filtered.reduce((sum, row) => sum + (row.stockQty || 0), 0),
        totalInventoryAmount: filtered.reduce((sum, row) => sum + (row.inventoryAmount || 0), 0),
        digest2Count: filtered.filter((row) => row.digestionSum === 2).length,
        digest3Count: filtered.filter((row) => row.digestionSum === 3).length,
        digest4Count: filtered.filter((row) => row.digestionSum === 4).length,
        digest5Count: filtered.filter((row) => row.digestionSum === 5).length,
        digest6Count: filtered.filter((row) => row.digestionSum === 6).length,
        selloutSafeCount: filtered.filter((row) => row.canSellBeforeExpiry === true).length,
        selloutRiskCount: filtered.filter((row) => row.canSellBeforeExpiry === false).length,
        categoryOptions,
      };

      return {
        rows,
        filteredRows: filtered,
        cells,
        summary,
        periodDays,
        periodLabel: `${state.salesPeriod.start || "未设定"} ~ ${state.salesPeriod.end || "未设定"}`,
        categoryOptions,
      };
    }

    function evaluateExpiryRisk(row) {
      if (row.remainingDays === null || row.remainingDays === undefined) return { level: "neutral", label: "未知", days: null };
      if (row.remainingDays <= 365) return { level: "danger", label: "1年内", days: row.remainingDays };
      if (row.remainingDays <= 730) return { level: "warn", label: "2年内", days: row.remainingDays };
      return { level: "good", label: "2年以上", days: row.remainingDays };
    }

    function evaluateSlowRisk(row) {
      if (!row.remainingDays || row.remainingDays <= 0) {
        return { level: "danger", label: "临期/过期", gapDays: row.remainingDays || 0 };
      }
      if (!row.stockDepthDays) return { level: "warn", label: "无销量", gapDays: null };
      if (row.stockDepthDays >= row.remainingDays) {
        return { level: "danger", label: "卖不完", gapDays: row.stockDepthDays - row.remainingDays };
      }
      if (row.stockDepthDays >= row.remainingDays - 365) {
        return { level: "warn", label: "有滞销风险", gapDays: row.stockDepthDays - (row.remainingDays - 365) };
      }
      return { level: "good", label: "正常", gapDays: row.remainingDays - row.stockDepthDays };
    }

    function getModelSignature() {
      const base = SOURCE_CONFIGS
        .map((cfg) => {
          const source = state.sources[cfg.key];
          return [
            cfg.key,
            source.fileName || "",
            source.sheetName || "",
            source.importedAt || "",
            source.rows.length,
            source.error || "",
          ].join(":");
        })
        .join("|");
      return [
        base,
        `period:${state.salesPeriod.start || ""}-${state.salesPeriod.end || ""}`,
        `filters:${state.matrixFilters.category || ""}-${state.matrixFilters.isRegularPrice || ""}-${state.matrixFilters.productionNote || ""}-${state.matrixFilters.kpiFilter || ""}`,
        `focus:${state.matrixFocusKey || ""}`,
      ].join("|");
    }

    /* ===== 门店单品季节分析 ===== */
    const SEASON_EVEN_THRESHOLD = 0.15;
    const SEASON_MIN_COVER_DAYS = 30;

    function isSpringMonth(month) {
      return month >= 3 && month <= 8;
    }

    function isoDateValue(date) {
      return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
    }

    function parseIsoDateValue(text) {
      return new Date(text + "T00:00:00");
    }

    function daysBetweenIso(startIso, endIso) {
      if (!startIso || !endIso) return 0;
      return Math.round((parseIsoDateValue(endIso) - parseIsoDateValue(startIso)) / 86400000);
    }

    function buildSeasonCalendar(dateMin, dateMax) {
      const result = {
        springDays: 0,
        autumnDays: 0,
        springSegments: [],
        autumnSegments: [],
      };
      if (!dateMin || !dateMax) return result;
      const start = parseIsoDateValue(dateMin);
      const end = parseIsoDateValue(dateMax);
      if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || start > end) return result;
      const cursor = new Date(start.getTime());
      let segment = null;
      while (cursor <= end) {
        const spring = isSpringMonth(cursor.getMonth() + 1);
        const iso = isoDateValue(cursor);
        if (spring) result.springDays += 1;
        else result.autumnDays += 1;
        if (!segment || segment.spring !== spring) {
          if (segment) (segment.spring ? result.springSegments : result.autumnSegments).push(segment);
          segment = { spring: spring, start: iso, end: iso };
        } else {
          segment.end = iso;
        }
        cursor.setDate(cursor.getDate() + 1);
      }
      if (segment) (segment.spring ? result.springSegments : result.autumnSegments).push(segment);
      return result;
    }

    function seasonRangesText(segments) {
      return (segments || []).map((item) => (item.start === item.end ? item.start : item.start + " ~ " + item.end)).join("、");
    }

    // 店天数：门店从首次销售日起算，季节区段内与首次销售日之后的重叠自然天数
    function countStoreDays(segments, storeNames, storeFirstDate) {
      let total = 0;
      (segments || []).forEach((segment) => {
        (storeNames || []).forEach((store) => {
          const first = storeFirstDate[store] || segment.start;
          const begin = first > segment.start ? first : segment.start;
          if (begin > segment.end) return;
          total += daysBetweenIso(begin, segment.end) + 1;
        });
      });
      return total;
    }

    function buildSalesTrendModel(rows) {
      const valid = [];
      const storeSet = new Set();
      const categorySet = new Set();
      const storeFirstDate = {};
      const productFirstDate = {};
      let dateMin = "";
      let dateMax = "";
      (rows || []).forEach((row) => {
        if (!row || !/^\d{4}-\d{2}-\d{2}$/.test(row.date || "")) return;
        if (!row.productName || !(row.qty > 0)) return;
        valid.push(row);
        if (row.store) {
          storeSet.add(row.store);
          const prevStore = storeFirstDate[row.store];
          if (!prevStore || row.date < prevStore) storeFirstDate[row.store] = row.date;
        }
        if (row.category) categorySet.add(row.category);
        const key = row.nameKey || normalizeText(row.productName);
        const prevProduct = productFirstDate[key];
        if (!prevProduct || row.date < prevProduct) productFirstDate[key] = row.date;
        if (!dateMin || row.date < dateMin) dateMin = row.date;
        if (!dateMax || row.date > dateMax) dateMax = row.date;
      });

      return {
        rows: valid,
        dateMin: dateMin,
        dateMax: dateMax,
        storeNames: Array.from(storeSet).sort((a, b) => a.localeCompare(b, "zh-Hans-CN")),
        categoryOptions: Array.from(categorySet).sort((a, b) => a.localeCompare(b, "zh-Hans-CN")),
        storeFirstDate: storeFirstDate,
        productFirstDate: productFirstDate,
        productCount: new Set(valid.map((row) => row.nameKey || normalizeText(row.productName))).size,
        recordCount: valid.length,
      };
    }

    function buildModel() {
      const signature = getModelSignature();
      if (modelCache.signature === signature && modelCache.model) {
        return modelCache.model;
      }

      const matrixWorkbook = state.sources.matrixWorkbook;
      const product = state.sources.product;
      const inventorySales = state.sources.inventorySales;
      const warehouse = state.sources.warehouse;
      const storeInventory = state.sources.storeInventory;
      const channelSales = state.sources.channelSales;
      const storeSales = state.sources.storeSales;

const matrix = matrixWorkbook.rows.length
? buildMatrixRowsFromWorkbook(matrixWorkbook)
: buildMatrixRows(state.sources);
// 保存当前九宫格位置到历史记录
if (matrix.rows && matrix.rows.length) {
saveMatrixHistory(matrix.rows);
}
const channelSalesAgg = summarizeChannelSales(channelSales.rows);
      const storeSalesAgg = summarizeStoreSales(storeSales.rows);
      const linkedRows = buildLinkedRows(state.sources);
      const productUnique = new Set(product.rows.map((row) => row.key)).size;
      const inventorySalesQty = inventorySales.rows.reduce((sum, row) => sum + (row.salesQty || 0), 0);
      const inventoryStockQty = inventorySales.rows.reduce((sum, row) => sum + (row.stockQty || 0), 0);
      const inventoryStockAmount = inventorySales.rows.reduce((sum, row) => sum + (row.stockAmount || 0), 0);
      const warehouseQty = warehouse.rows.reduce((sum, row) => sum + (row.availableQty || 0), 0);
      const storeQty = storeInventory.rows.reduce((sum, row) => sum + (row.availableQty || 0), 0);
      const channelQty = channelSales.rows.reduce((sum, row) => sum + (row.qty || 0), 0);
      const storeSalesQty = storeSales.rows.reduce((sum, row) => sum + (row.qty || 0), 0);
      const linkedCount = linkedRows.length;
      const uploadedCount = SOURCE_CONFIGS.filter((cfg) => state.sources[cfg.key].rows.length).length;
      const replenishmentRows = linkedRows
        .filter((row) => row.totalSalesQty > 0 || row.totalInventoryQty > 0)
        .map((row) => ({
          ...row,
          sales30Qty: row.totalSalesQty,
          inventoryQty: row.totalInventoryQty,
          stockMonths: row.coverMonths,
        }))
        .filter((row) => row.replenishmentQty > 0)
        .sort((a, b) => b.replenishmentQty - a.replenishmentQty);
      const slowRows = linkedRows
        .filter((row) => row.slowRisk && row.slowRisk.level !== "good")
        .sort((a, b) => (b.stockDepthDays || 0) - (a.stockDepthDays || 0));
      const expiryRows = linkedRows
        .filter((row) => row.expiryRisk && row.expiryRisk.level !== "good")
        .sort((a, b) => (a.remainingDays ?? 999999) - (b.remainingDays ?? 999999));

      const model = {
        sources: state.sources,
        productUnique,
        inventorySalesQty,
        inventoryStockQty,
        inventoryStockAmount,
        warehouseQty,
        storeQty,
        channelQty,
        storeSalesQty,
        matrixRows: matrix.rows,
        matrixFilteredRows: matrix.filteredRows,
        matrixCells: matrix.cells,
        matrixSummary: matrix.summary,
        matrixPeriodDays: matrix.periodDays,
        matrixPeriodLabel: matrix.periodLabel,
        matrixCategoryOptions: matrix.categoryOptions,
        linkedRows,
        linkedCount,
        uploadedCount,
        allUploaded: uploadedCount === SOURCE_CONFIGS.length,
        channelSalesAgg: channelSalesAgg.sort((a, b) => b.qty - a.qty),
        storeSalesAgg: storeSalesAgg.sort((a, b) => b.qty - a.qty),
        replenishmentRows,
        slowRows,
        expiryRows,
        salesTrendModel: buildSalesTrendModel(state.sources.salesTrend.rows),
      };
      modelCache.signature = signature;
      modelCache.model = model;
      return model;
    }

    const GEAR_ICON = modeIcon('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/>');

    let modeDragId = "";

    function getDefaultModeSettings() {
      return {
        version: 1,
        order: MODE_CONFIG.map((m) => m.id),
        hidden: Object.fromEntries(MODE_CONFIG.map((m) => [m.id, false])),
        colors: Object.fromEntries(MODE_CONFIG.map((m) => [m.id, m.defaultColor])),
      };
    }

    // 兼容旧存储：只认已知模式，未知 id 丢弃；新出现的模式追加到末尾、默认可见、默认颜色
    function normalizeModeSettings(raw) {
      const ids = MODE_CONFIG.map((m) => m.id);
      const order = [];
      if (raw && Array.isArray(raw.order)) {
        raw.order.forEach((id) => {
          if (ids.includes(id) && !order.includes(id)) order.push(id);
        });
      }
      ids.forEach((id) => {
        if (!order.includes(id)) order.push(id);
      });
      const hidden = {};
      ids.forEach((id) => {
        hidden[id] = Boolean(raw && raw.hidden && raw.hidden[id]);
      });
      if (!ids.some((id) => !hidden[id])) hidden[order[0]] = false;
      const colors = {};
      ids.forEach((id) => {
        const cfg = MODE_CONFIG.find((m) => m.id === id);
        const value = raw && raw.colors ? raw.colors[id] : "";
        colors[id] = /^#[0-9a-f]{6}$/i.test(String(value || "")) ? String(value).toLowerCase() : cfg.defaultColor;
      });
      return { version: 1, order, hidden, colors };
    }

    function loadModeSettings() {
      try {
        const raw = localStorage.getItem(MODE_SETTINGS_KEY);
        return normalizeModeSettings(raw ? JSON.parse(raw) : null);
      } catch {
        return normalizeModeSettings(null);
      }
    }

    let modeSettings = loadModeSettings();

    function persistModeSettings() {
      try {
        localStorage.setItem(MODE_SETTINGS_KEY, JSON.stringify(modeSettings));
      } catch {
        // best-effort
      }
    }

    function getModeConfig(id) {
      return MODE_CONFIG.find((m) => m.id === id) || null;
    }

    function getVisibleModeIds() {
      return modeSettings.order.filter((id) => !modeSettings.hidden[id]);
    }

    function getVisibleModeCount() {
      return getVisibleModeIds().length;
    }

    function getModeColor(id) {
      const cfg = getModeConfig(id);
      return modeSettings.colors[id] || (cfg ? cfg.defaultColor : "#0969DA");
    }

    function ensureActiveModeVisible() {
      if (!modeSettings.hidden[state.activeTab]) return;
      const first = getVisibleModeIds()[0];
      if (first) state.activeTab = first;
    }

    function renderModeSettingsDrawer() {
      const list = document.getElementById("ms-list");
      if (!list) return;
      const visibleCount = getVisibleModeCount();
      list.innerHTML = modeSettings.order.map((id, index) => {
        const cfg = getModeConfig(id);
        if (!cfg) return "";
        const hidden = Boolean(modeSettings.hidden[id]);
        const color = getModeColor(id);
        const lastVisible = !hidden && visibleCount <= 1;
        const swatches = MODE_PALETTE.map((c) => `<button type="button" class="ms-swatch${c.toLowerCase() === color.toLowerCase() ? " selected" : ""}" data-ms-swatch="${c}" data-mode-id="${id}" style="--swatch:${c}" title="${c}" aria-label="使用颜色 ${c}"></button>`).join("");
        return `
          <div class="ms-row${hidden ? " is-hidden" : ""}" data-mode-id="${id}" draggable="true">
            <div class="ms-row-main">
              <span class="ms-drag" title="拖拽排序" aria-hidden="true">⋮⋮</span>
              <span class="ms-icon" style="--mode-color:${color}">${modeIcon(cfg.icon)}</span>
              <span class="ms-name">${escapeHtml(cfg.label)}<small>${hidden ? "已隐藏" : `${index + 1} / ${modeSettings.order.length}`}</small></span>
              <span class="ms-move">
                <button type="button" data-ms-up="${id}" ${index === 0 ? "disabled" : ""} title="上移">↑</button>
                <button type="button" data-ms-down="${id}" ${index === modeSettings.order.length - 1 ? "disabled" : ""} title="下移">↓</button>
              </span>
              <label class="ms-toggle" title="${lastVisible ? "至少保留一个可见模式" : hidden ? "显示该模式" : "隐藏该模式"}">
                <input type="checkbox" data-ms-toggle="${id}" ${hidden ? "" : "checked"} ${lastVisible ? "disabled" : ""}>
                <span class="ms-toggle-track"></span>
              </label>
            </div>
            <div class="ms-row-colors">
              <span class="ms-color-label">图标颜色</span>
              ${swatches}
              <label class="ms-picker" title="自定义颜色">
                <input type="color" data-ms-color="${id}" value="${color}">
              </label>
              <button type="button" class="ms-color-reset" data-ms-color-reset="${id}" title="恢复该模式默认色">默认</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function openModeSettingsDrawer() {
      renderModeSettingsDrawer();
      const mask = document.getElementById("mode-settings-mask");
      const drawer = document.getElementById("mode-settings-drawer");
      if (!mask || !drawer) return;
      mask.classList.add("open");
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
    }

    function closeModeSettingsDrawer() {
      const mask = document.getElementById("mode-settings-mask");
      const drawer = document.getElementById("mode-settings-drawer");
      if (!mask || !drawer) return;
      mask.classList.remove("open");
      drawer.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
    }

    function setModeColor(id, value) {
      if (!getModeConfig(id)) return;
      const hex = String(value || "").toLowerCase();
      if (!/^#[0-9a-f]{6}$/.test(hex)) return;
      modeSettings.colors[id] = hex;
      persistModeSettings();
      renderModeSwitch();
      renderModeSettingsDrawer();
    }

    function moveModeBy(id, delta) {
      const order = modeSettings.order.slice();
      const from = order.indexOf(id);
      const to = from + delta;
      if (from < 0 || to < 0 || to >= order.length) return;
      order.splice(from, 1);
      order.splice(to, 0, id);
      modeSettings.order = order;
      persistModeSettings();
      renderModeSwitch();
      renderModeSettingsDrawer();
    }

    function moveModeBefore(dragId, targetId) {
      if (!dragId || !targetId || dragId === targetId) return;
      const order = modeSettings.order.filter((id) => id !== dragId);
      const index = order.indexOf(targetId);
      if (index < 0) return;
      order.splice(index, 0, dragId);
      modeSettings.order = order;
      persistModeSettings();
      renderModeSwitch();
      renderModeSettingsDrawer();
    }

    function toggleModeVisibility(id, visible) {
      if (!getModeConfig(id)) return;
      if (!visible) {
        // 边界：至少保留一个可见模式
        if (getVisibleModeCount() <= 1) {
          renderModeSettingsDrawer();
          return;
        }
        modeSettings.hidden[id] = true;
        // 边界：隐藏的正是当前模式时，自动切到剩余第一个可见模式
        if (state.activeTab === id) {
          const first = getVisibleModeIds()[0];
          if (first) state.activeTab = first;
        }
      } else {
        modeSettings.hidden[id] = false;
      }
      persistModeSettings();
      render();
      renderModeSettingsDrawer();
    }

    function resetModeSettings() {
      if (!window.confirm("恢复默认设置会重置所有模式的显示/隐藏、排序和图标颜色，确定继续吗？")) return;
      modeSettings = getDefaultModeSettings();
      persistModeSettings();
      ensureActiveModeVisible();
      render();
      renderModeSettingsDrawer();
    }

    function bindModeSettingsEvents() {
      const switchHost = document.getElementById("mode-switch");
      if (switchHost && !switchHost.dataset.customBound) {
        switchHost.dataset.customBound = "1";
        switchHost.addEventListener("click", (event) => {
          if (event.target.closest("#mode-customize-btn")) openModeSettingsDrawer();
        });
      }

      const mask = document.getElementById("mode-settings-mask");
      const drawer = document.getElementById("mode-settings-drawer");
      const list = document.getElementById("ms-list");
      if (!drawer || !list || drawer.dataset.bound) return;
      drawer.dataset.bound = "1";

      if (mask) mask.addEventListener("click", closeModeSettingsDrawer);

      drawer.addEventListener("click", (event) => {
        if (event.target.closest("[data-ms-close]")) {
          closeModeSettingsDrawer();
          return;
        }
        if (event.target.closest("[data-ms-reset-all]")) {
          resetModeSettings();
          return;
        }
        const upBtn = event.target.closest("[data-ms-up]");
        if (upBtn) {
          moveModeBy(upBtn.dataset.msUp, -1);
          return;
        }
        const downBtn = event.target.closest("[data-ms-down]");
        if (downBtn) {
          moveModeBy(downBtn.dataset.msDown, 1);
          return;
        }
        const swatch = event.target.closest("[data-ms-swatch]");
        if (swatch) {
          setModeColor(swatch.dataset.modeId, swatch.dataset.msSwatch);
          return;
        }
        const resetColor = event.target.closest("[data-ms-color-reset]");
        if (resetColor) {
          const cfg = getModeConfig(resetColor.dataset.msColorReset);
          if (cfg) setModeColor(cfg.id, cfg.defaultColor);
        }
      });

      drawer.addEventListener("change", (event) => {
        const toggle = event.target.closest("input[data-ms-toggle]");
        if (toggle) {
          toggleModeVisibility(toggle.dataset.msToggle, toggle.checked);
          return;
        }
        const colorInput = event.target.closest("input[data-ms-color]");
        if (colorInput) {
          setModeColor(colorInput.dataset.msColor, colorInput.value);
        }
      });

      list.addEventListener("dragstart", (event) => {
        const row = event.target.closest(".ms-row");
        if (!row) return;
        modeDragId = row.dataset.modeId;
        row.classList.add("dragging");
        try {
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", modeDragId);
        } catch {
          // ignore
        }
      });

      list.addEventListener("dragend", () => {
        modeDragId = "";
        list.querySelectorAll(".ms-row").forEach((row) => row.classList.remove("dragging", "drag-over"));
      });

      list.addEventListener("dragover", (event) => {
        const row = event.target.closest(".ms-row");
        if (!row || !modeDragId) return;
        event.preventDefault();
        list.querySelectorAll(".ms-row").forEach((item) => {
          item.classList.toggle("drag-over", item === row && item.dataset.modeId !== modeDragId);
        });
      });

      list.addEventListener("drop", (event) => {
        const row = event.target.closest(".ms-row");
        if (!row || !modeDragId) return;
        event.preventDefault();
        moveModeBefore(modeDragId, row.dataset.modeId);
        modeDragId = "";
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeModeSettingsDrawer();
      });
    }

    function renderModeSwitch(model) {
      const host = document.getElementById("mode-switch");
      if (!host) return;
      ensureActiveModeVisible();
      const buttons = getVisibleModeIds().map((id) => {
        const cfg = getModeConfig(id);
        if (!cfg) return "";
        const active = id === state.activeTab ? " active" : "";
        return `<button class="mode-btn${active}" data-mode="${id}" style="--mode-color:${getModeColor(id)}" title="${escapeHtml(cfg.label)}">${modeIcon(cfg.icon)}<span>${escapeHtml(cfg.label)}</span></button>`;
      }).join("");
      host.innerHTML = `${buttons}<button type="button" class="mode-customize-btn" id="mode-customize-btn" title="自定义模式" aria-label="自定义模式">${GEAR_ICON}</button>`;
    }

              <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'digest6' ? 'active' : ''}" data-kpi-filter="digest6" style="cursor:pointer;" title="消化周期>720天"><small>>720天</small><strong>${formatInteger(model.matrixSummary.digest6Count)}</strong></div>

        const extra = Math.max(0, cellRows.length - displayRows.length);

          <div class="sku-strip">
            ${displayRows.map((row) => `
              <button type="button" class="sku-chip ${row.canSellBeforeExpiry === false ? 'sellout-risk' : ''}" data-matrix-jump="${escapeHtml(row.key)}" title="点击跳转到联动总表：${escapeHtml(row.productName || "")}${row.reorderNote ? '\n补单备注：' + row.reorderNote : ''}">

      const cellHtml = model.matrixCells.map((cell) => {

        const isExpanded = state.matrixExpandedCells[cell.key];
        const previewRows = isExpanded ? cell.rows : cell.rows.slice(0, itemsPerCell);
        return `
          <div class="matrix-cell ${theme}" data-cell-key="${escapeHtml(cell.key)}" data-matrix-big-cell="${escapeHtml(cell.key)}" style="cursor:pointer;" title="点击查看大宫格与品类构成">

              </div>
              ${badge(theme === "good" ? "good" : theme === "danger" ? "danger" : "warn", cell.meta.badge)}
            </div>
            ${chipRows(previewRows, cell.key)}
          </div>
        `;
      });

      // 渲染大宫格弹窗
      const renderBigCellModal = () => {
        if (!state.matrixBigCell) return "";
        const cell = model.matrixCells.find(c => c.key === state.matrixBigCell.cellKey);
        if (!cell) return "";
        const theme = cell.meta.theme || "neutral";
        const totalAmount = cell.rows.reduce((sum, row) => sum + (row.inventoryAmount || 0), 0);
        // 品类构成：按库存数量统计各品类占比
        const categoryMap = {};
        cell.rows.forEach((row) => {
          const cat = row.category || "未分类";
          if (!categoryMap[cat]) categoryMap[cat] = { category: cat, skuCount: 0, stockQty: 0 };
          categoryMap[cat].skuCount += 1;
          categoryMap[cat].stockQty += (row.stockQty || 0);
        });
        const categoryList = Object.values(categoryMap).sort((a, b) => b.stockQty - a.stockQty);
        return `
          <div class="big-cell-overlay" data-big-cell-overlay>
            <div class="big-cell-modal">
              <div class="big-cell-header">
                <h3>${escapeHtml(cell.meta.title)} <span style="font-size:14px;font-weight:normal;color:var(--muted);">(${escapeHtml(cell.meta.badge)})</span></h3>

              </div>
              <div class="big-cell-legend">
<span class="legend-item"><span class="legend-box legend-red"></span>停产</span>
<span class="legend-item"><span class="legend-box legend-yellow"></span>待定</span>
<span class="legend-item"><span class="legend-box legend-green"></span>继续生产</span>
<span class="legend-item"><span class="legend-text-danger">红色加粗字体</span>保质期到期前消化不完</span>
<span class="legend-item"><span style="color:#ffc107;font-size:16px;">⭐</span>补单在途</span>

                  <div class="big-cell-stat">
                    <small>总库存</small>
                    <strong>${formatInteger(cell.inventoryQty)} 件</strong>
                  </div>

                  <div class="big-cell-stat">
                    <small>总金额</small>
                    <strong>${formatCurrency(totalAmount)}</strong>
                  </div>
                </div>
                <div class="big-cell-categories">
                  <div class="big-cell-cat-title">品类构成（按库存数量占比）</div>
                  ${categoryList.map((cat) => {
                    const share = cell.inventoryQty > 0 ? cat.stockQty / cell.inventoryQty : 0;
                    return `
                      <div class="big-cell-cat-row">
                        <span class="big-cell-cat-name" title="${escapeHtml(cat.category)}">${escapeHtml(cat.category)}</span>

                      <small style="${row.canSellBeforeExpiry === false ? 'color: var(--danger); font-weight: 600;' : ''}">${escapeHtml(shortenProductName(row.productName) || "-")}</small>

                </div>
              </div>

      return `
        <div class="panel matrix-panel" id="matrix-panel">

              <h2>SKU 九宫格分析（日销系数 × 消化周期）</h2>

            </div>
            <div style="display:flex;gap:10px;align-items:center;">
              <span class="badge neutral">共 ${formatInteger(model.matrixSummary.totalSku)} 个商品</span>
              <button class="ghost" data-matrix-fit-screen>适应屏幕</button>
              <button class="ghost" data-matrix-export-data>导出数据</button>
              <button class="primary" data-matrix-export-image>导出图片</button>
            </div>
          </div>

          <div class="matrix-toolbar">
            <label>
              销售时间段
              <div style="display:flex;align-items:center;gap:4px;font-weight:600;color:var(--ink);">
                ${escapeHtml(state.salesPeriod.start || "自动读取")} ~ ${escapeHtml(state.salesPeriod.end || "")}
              </div>
            </label>
            <label>
              分类
              <select data-matrix-category>
                ${categoryOptions.map((item) => `<option value="${escapeHtml(item)}" ${state.matrixFilters.category === item ? "selected" : ""}>${escapeHtml(item)}</option>`).join("")}
              </select>
            </label>
            <label>
              是否正价
              <select data-matrix-price>
                ${priceOptions.map((item) => `<option value="${escapeHtml(item)}" ${state.matrixFilters.isRegularPrice === item ? "selected" : ""}>${escapeHtml(item)}</option>`).join("")}
              </select>
            </label>
            <label>
              生产属性
              <select data-matrix-production>
                ${productionOptions.map((item) => `<option value="${escapeHtml(item)}" ${state.matrixFilters.productionNote === item ? "selected" : ""}>${escapeHtml(item)}</option>`).join("")}
              </select>
            </label>
            <label>
              每格显示
              <div style="display:flex;gap:4px;">
                ${[4, 8, 12].map(n => `<button type="button" class="${state.matrixItemsPerCell === n ? 'primary' : 'ghost'}" data-matrix-items="${n}" style="padding:6px 12px;font-size:12px;">${n}</button>`).join('')}
              </div>
            </label>
            <button class="ghost" data-matrix-reset>重置</button>
          </div>

          <div class="matrix-kpis">
            <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'all' ? 'active' : ''}" data-kpi-filter="all" style="cursor:pointer;" title="点击查看全部"><small>总 SKU</small><strong>${formatInteger(model.matrixSummary.totalSku)}</strong></div>
            <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'digest2' ? 'active' : ''}" data-kpi-filter="digest2" style="cursor:pointer;" title="消化周期≤90天"><small>≤90天</small><strong>${formatInteger(model.matrixSummary.digest2Count)}</strong></div>
            <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'digest3' ? 'active' : ''}" data-kpi-filter="digest3" style="cursor:pointer;" title="消化周期≤180天"><small>≤180天</small><strong>${formatInteger(model.matrixSummary.digest3Count)}</strong></div>
            <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'digest4' ? 'active' : ''}" data-kpi-filter="digest4" style="cursor:pointer;" title="消化周期≤360天"><small>≤360天</small><strong>${formatInteger(model.matrixSummary.digest4Count)}</strong></div>
            <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'digest5' ? 'active' : ''}" data-kpi-filter="digest5" style="cursor:pointer;" title="消化周期≤720天"><small>≤720天</small><strong>${formatInteger(model.matrixSummary.digest5Count)}</strong></div>
            <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'digest6' ? 'active' : ''}" data-kpi-filter="digest6" style="cursor:pointer;" title="消化周期>720天"><small>>720天</small><strong>${formatInteger(model.matrixSummary.digest6Count)}</strong></div>
          </div>

          <div class="soft-card">
              <div class="note" style="margin-bottom:10px;font-weight:700;color:var(--ink);">日销系数（横轴：1=高日销 → 3=低日销）</div>
            <div class="matrix-grid" id="matrix-grid" style="grid-template-columns:88px repeat(3, minmax(0, 1fr));">
              <div></div>
              <div class="matrix-col-head">日销系数 1<br>（高日销）</div>
              <div class="matrix-col-head">日销系数 2<br>（中日销）</div>
              <div class="matrix-col-head">日销系数 3<br>（低日销）</div>
              <div class="matrix-row-head">库存系数 1<br>（低库存）</div>
              ${cellHtml.slice(0, 3).join("")}
              <div class="matrix-row-head">库存系数 2<br>（中库存）</div>
              ${cellHtml.slice(3, 6).join("")}
              <div class="matrix-row-head">库存系数 3<br>（高库存）</div>
              ${cellHtml.slice(6, 9).join("")}
            </div>
          </div>

          <div class="table-toolbar">
            <p class="hint">点击任意商品图片会跳到联动总表并高亮对应行。</p>
          </div>
          ${tableSection({
            tabId: "linked",
            title: "联动总表（九宫格命中结果）",
            note: "这里展示当前筛选条件下的 SKU 明细，点击品名可跳回九宫格对应商品。",
            rows: rows,
            showAll: true,
            columns: [
              { label: "品名", key: "productName", render: (row) => `<a href="#" class="link-to-matrix" data-link-key="${escapeHtml(row.key)}" title="点击跳回九宫格">${escapeHtml(shortenProductName(row.productName) || "-")}</a>`, sortValue: (row) => row.productName || "" },
              { label: "规格", render: (row) => escapeHtml(row.spec || "-") },
              { label: "条码", key: "barcode", render: (row) => escapeHtml(row.barcode || row.sku || "-"), sortValue: (row) => row.barcode || row.sku || "" },
              { label: "分类", render: (row) => escapeHtml(row.category || "-") },
              { label: "日销系数", render: (row) => row.dailySalesCoef !== null && row.dailySalesCoef !== undefined ? formatNumber(row.dailySalesCoef) : "-", sortValue: (row) => row.dailySalesCoef ?? 0 },
              { label: "消化周期", render: (row) => {
                if (isIndigestible(row.sellOutDays)) return "无法消化";
                if (row.sellOutDays !== null && row.sellOutDays !== undefined) return `${Math.round(row.sellOutDays)} 天`;
                return "-";
              }, sortValue: (row) => row.sellOutDays === Infinity ? Number.MAX_SAFE_INTEGER : (row.sellOutDays ?? 0) },
              { label: "即时库存", render: (row) => formatInteger(row.stockQty || 0) },
              { label: "生产备注", render: (row) => escapeHtml(row.productionNote || "-") },
              { label: "补单备注", render: (row) => escapeHtml(row.reorderNote || "-") },
              { label: "保质期", render: (row) => row.avgExpiryDate ? `${escapeHtml(row.avgExpiryDate)} 年` : "-" },
              { label: "能否卖完", render: (row) => badge(row.canSellBeforeExpiry === false ? "danger" : "good", row.canSellBeforeExpiry === false ? "卖不完" : "可卖完") },
              { label: "九宫格位置", key: "matrixPos", render: (row) => escapeHtml(isIndigestible(row.sellOutDays) ? "九号位" : getMatrixPosition(row.salesCoef, row.inventoryCoef)), sortValue: (row) => { const idx = GRID_ORDER.findIndex(p => p.x === row.salesCoef && p.y === row.inventoryCoef); return idx >= 0 ? idx + 1 : 0; } },
            ],
            emptyText: "当前筛选下没有 SKU。请换个分类或放宽条件。",
            previewText: `共 ${formatInteger(rows.length)} 条`,
            rowClassName: (row) => row.key === state.matrixFocusKey ? "focus-row" : "",
          })}
          ${renderHistoryCompareTable(rows)}
          ${renderBigCellModal()}
        </div>
      `;
    }

    // 渲染历史位置对比子表
    function renderHistoryCompareTable(rows) {
      if (!state.matrixHistoryNodes.length) return "";
      const nodeOptions = ["", ...state.matrixHistoryNodes];
      const compareNodes = state.historyCompareNodes;
      const compareRows = rows.filter(row => row.key && state.matrixHistory[row.key]).map(row => {
        const hist = state.matrixHistory[row.key] || {};
        const positions = compareNodes.map(node => node ? (hist[node] || "-") : "-");
        return {
          key: row.key,
          productName: row.productName,
          spec: row.spec,
          category: row.category,
          sellOutDays: row.sellOutDays,
          positions,

    function tableSection({ tabId, title, note, rows, columns, emptyText, previewText, rowClassName, showAll, extraToolbar }) {
      if (!rows.length) {
        return `
          <div class="card block">
            <div class="block-head">
              <div>
                <h2>${escapeHtml(title)}</h2>
                <div class="note">${escapeHtml(note)}</div>
              </div>
            </div>
            <div class="empty-table">${escapeHtml(emptyText)}</div>
          </div>
        `;
      }

      const activeTabId = tabId || state.activeTab || "overview";
      const tableState = getTableState(activeTabId);
      const sortKey = tableState.sortKey || "";
      const sortDir = tableState.sortDir || "desc";
      const resolvedRows = applySorting(rows, columns, sortKey, sortDir);
      const totalRows = resolvedRows.length;
      const pageSize = showAll ? totalRows : (tableState.pageSize || 20);
      const columnWidths = tableState.columnWidths || {};
      const totalPages = showAll ? 1 : Math.max(1, Math.ceil(totalRows / pageSize));
      const currentPage = showAll ? 1 : Math.min(Math.max(tableState.page || 1, 1), totalPages);
      const pageRows = showAll ? resolvedRows : resolvedRows.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      const colgroup = columns.map((col) => {
        const key = getResizableColumnKey(col);
        const width = columnWidths[key];
        const style = width ? ` style="width:${Math.max(MIN_COLUMN_WIDTH, width)}px"` : "";
        return `<col${style}>`;
      }).join("");
      const body = pageRows.map((row) => `
        <tr${row.key ? ` data-row-key="${escapeHtml(row.key)}"` : ""}${rowClassName ? ` class="${escapeHtml(rowClassName(row))}"` : ""}>
          ${columns.map((col) => {
            const cellHtml = col.render(row);
            if (isProductNameColumn(col)) {
              const tooltipText = escapeHtml(row.productName || "");
              return `<td><span class="cell-clip" data-tooltip="${tooltipText}">${cellHtml}</span></td>`;
            }
            return `<td>${cellHtml}</td>`;
          }).join("")}
        </tr>
      `).join("");
      const header = columns.map((col) => {
        const key = getColumnKey(col);
        const sortable = col.sortable !== false;
        const active = sortable && sortKey === key;
        const arrow = active ? (sortDir === "asc" ? "▲" : "▼") : "";
        const resizable = isProductNameColumn(col);
        return `<th class="${sortable ? "sortable" : ""}${resizable ? " resizable" : ""}" data-sort-key="${escapeHtml(key || "")}" data-tab-id="${escapeHtml(activeTabId)}">${escapeHtml(col.label)}${arrow ? `<span class="sort-arrow">${arrow}</span>` : ""}${resizable ? `<span class="column-resizer" data-column-resize-handle data-column-key="${escapeHtml(key)}" data-tab-id="${escapeHtml(activeTabId)}" aria-hidden="true"></span>` : ""}</th>`;
      }).join("");

      const isLinkedTable = tabId === "linked" || title.includes("联动总表");
      return `
        <div class="card block" ${isLinkedTable ? 'data-linked-table="true"' : ''}>
          <div class="block-head">
            <div>
              <h2>${escapeHtml(title)}</h2>
              <div class="note">${escapeHtml(note)}</div>
            </div>
            <span class="badge neutral">${escapeHtml(previewText || `显示 ${totalRows} 条`)}</span>
          </div>
          <div class="table-toolbar">
            <p class="hint">${showAll ? "点击表头可排序，当前展示全部数据。" : "点击表头可排序，分页会记住当前页。"}</p>
            ${extraToolbar || ""}
            ${showAll ? "" : `<div class="pager">
              <select data-page-size data-tab-id="${escapeHtml(activeTabId)}" aria-label="每页条数">
                ${[20, 50, 100].map((size) => `<option value="${size}" ${pageSize === size ? "selected" : ""}>每页 ${size} 条</option>`).join("")}
              </select>
              <button class="ghost" data-page-action="prev" data-tab-id="${escapeHtml(activeTabId)}" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
              <span class="page-info">第 ${currentPage} / ${totalPages} 页</span>
              <button class="ghost" data-page-action="next" data-tab-id="${escapeHtml(activeTabId)}" ${currentPage >= totalPages ? "disabled" : ""}>下一页</button>
            </div>`}
          </div>
          <div class="table-wrap">
            <table>
              <colgroup>${colgroup}</colgroup>
              <thead><tr>${header}</tr></thead>
              <tbody>${body}</tbody>
            </table>
          </div>
        </div>
      `;
    }
    function sourcePreviewRows(source, limit = PREVIEW_LIMIT) {
      return source.rows.slice(0, limit);
    }

        const th = handle.closest("th");

        const cols = colgroup ? Array.from(colgroup.querySelectorAll("col")) : [];
        const headerCells = table ? Array.from(table.querySelectorAll("thead th")) : [];
        const columnIndex = headerCells.indexOf(th);
        const colEl = columnIndex >= 0 ? cols[columnIndex] : null;
        if (!th || !columnKey || !colEl) return;

        const startWidth = th.getBoundingClientRect().width;
        if (typeof handle.setPointerCapture === "function") {
          try {
            handle.setPointerCapture(event.pointerId);
          } catch {
            // ignore capture failures
          }
        }
        document.body.style.userSelect = "none";
        document.body.style.cursor = "col-resize";
        columnResizeState.active = {
          tabId,
          columnKey,
          startX: event.clientX,
          startWidth,
          handle,
          colEl,
          pendingWidth: startWidth,
        };
        handle.classList.add("is-dragging");
      });
