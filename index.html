      });

      // 绑定点击事件处理器
      host.addEventListener("click", host._tableClickHandler);

      document.addEventListener("pointermove", (event) => {
        const active = columnResizeState.active;
        if (!active) return;
        const nextWidth = Math.max(MIN_COLUMN_WIDTH, Math.round(active.startWidth + (event.clientX - active.startX)));
        active.pendingWidth = nextWidth;
        if (columnResizeState.rafId) return;
        columnResizeState.rafId = requestAnimationFrame(() => {
          columnResizeState.rafId = 0;
          const current = columnResizeState.active;
          if (!current || current.pendingWidth === null || current.pendingWidth === undefined) return;
          const widthText = `${current.pendingWidth}px`;
          current.colEl.style.width = widthText;
          current.colEl.style.minWidth = widthText;
        });
      });

      const finishResize = () => {
        const active = columnResizeState.active;
        if (!active) return;
        if (columnResizeState.rafId) {
          cancelAnimationFrame(columnResizeState.rafId);
          columnResizeState.rafId = 0;
        }
        const finalWidth = active.pendingWidth || Math.max(MIN_COLUMN_WIDTH, Math.round(active.colEl.getBoundingClientRect().width));
        updateColumnWidth(active.tabId, active.columnKey, finalWidth);
        active.handle?.classList.remove("is-dragging");
        document.body.style.userSelect = "";
        document.body.style.cursor = "";
        columnResizeState.active = null;
        render();
      };

      document.addEventListener("pointerup", finishResize);
      document.addEventListener("pointercancel", finishResize);
    }

    // ===== 旧版趋势图辅助函数（保留供历史缓存兼容，页面已不再使用） =====
    const TREND_ONLINE_COLOR = "#2563eb"; // 线上 蓝（合并模式/单商品）
    const TREND_OFFLINE_COLOR = "#f97316"; // 线下 橙（合并模式/单商品）
    const TREND_DASH_PATTERNS = ["", "6 4", "2 5", "10 4 2 4", "12 2 4 2", "4 2"];
    // 两两对比时，每个商品用一对独立颜色（线上/线下），4 条线 4 种颜色
    const TREND_PRODUCT_PAIRS = [
      { online: "#2563eb", offline: "#f97316" }, // 蓝 / 橙
      { online: "#16a34a", offline: "#9333ea" }, // 绿 / 紫
      { online: "#0ea5e9", offline: "#e11d48" }, // 天蓝 / 玫红
      { online: "#ca8a04", offline: "#0891b2" }, // 金 / 青
    ];

    // 日期 "YYYY-MM-DD" -> 季度标识 "YYYY-Qn"
    function dateToQuarter(dateStr) {
      if (!dateStr || dateStr.length < 7) return "";
      const y = dateStr.slice(0, 4);
      const m = Number(dateStr.slice(5, 7));
      if (!y || !m) return "";
      const q = Math.ceil(m / 3);
      return `${y}-Q${q}`;
    }

    // 日期 "YYYY-MM-DD" -> 月份标识 "YYYY-MM"
    function dateToMonth(dateStr) {
      if (!dateStr || dateStr.length < 7) return "";
      return dateStr.slice(0, 7);
    }

    // 线性回归（最小二乘法）：返回 { slope, intercept }，y = slope*x + intercept
    // 用于拟合长期趋势线，能反映"稳定微微向上/向下"
    function linearRegression(values) {
      const n = values.length;
      if (n < 2) return { slope: 0, intercept: values[0] || 0 };
      let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
      for (let i = 0; i < n; i++) {
        sumX += i;
        sumY += values[i];
        sumXY += i * values[i];
        sumX2 += i * i;
      }
      const denom = n * sumX2 - sumX * sumX;
      if (denom === 0) return { slope: 0, intercept: sumY / n };
      const slope = (n * sumXY - sumX * sumY) / denom;
      const intercept = (sumY - slope * sumX) / n;
      return { slope, intercept };
    }

    // 居中移动平均：平滑短期波动，凸显中期趋势
    function movingAverage(values, window = 5) {
      const n = values.length;
      if (n === 0) return [];
      const result = new Array(n).fill(0);
      const half = Math.floor(window / 2);
      for (let i = 0; i < n; i++) {
        let sum = 0, count = 0;
        for (let j = -half; j <= half; j++) {
          const k = i + j;
          if (k < 0 || k >= n) continue;
          sum += values[k];
          count++;
        }
        result[i] = count > 0 ? sum / count : 0;
      }
      return result;
    }

    // 计算趋势线数据：根据算法返回每个 x 点的趋势值
    function computeTrendValues(values, method) {
      if (!values || values.length < 2) return values ? values.slice() : [];
      if (method === "ma") {
        // 窗口随数据量自适应：日维度用 7（周），季度维度用 3
        const window = values.length <= 8 ? 3 : 7;
        return movingAverage(values, window);
      }
      // 默认线性回归
      const { slope, intercept } = linearRegression(values);
      return values.map((_, i) => slope * i + intercept);
    }

    // ===== 门店单品季节分析：视图与交互 =====
    const SEASON_TREND_COLOR = "#0969DA";

    function getSeasonFilters(model) {
      const filters = state.salesTrendFilters;
      if (typeof filters.search !== "string") filters.search = "";
      if (typeof filters.store !== "string") filters.store = "";
      if (typeof filters.category !== "string") filters.category = "";
      if (typeof filters.startDate !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(filters.startDate)) filters.startDate = "";
      if (typeof filters.endDate !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(filters.endDate)) filters.endDate = "";
      if (["total", "springDaily", "autumnDaily", "diff"].indexOf(filters.sort) === -1) filters.sort = "total";
      if (!Array.isArray(filters.hiddenKeys)) filters.hiddenKeys = [];
      if (["daily", "monthly"].indexOf(filters.granularity) === -1) filters.granularity = "daily";
      if (["linear", "ma"].indexOf(filters.trendMethod) === -1) filters.trendMethod = "linear";
      filters.showTrendLine = !!filters.showTrendLine;
      filters.showHidden = !!filters.showHidden;
      if (model) {
        if (model.storeNames.indexOf(filters.store) === -1) filters.store = "";
        if (filters.category && model.categoryOptions.indexOf(filters.category) === -1) filters.category = "";
        if (filters.startDate && model.dateMin && filters.startDate < model.dateMin) filters.startDate = model.dateMin;
        if (filters.endDate && model.dateMax && filters.endDate > model.dateMax) filters.endDate = model.dateMax;
        if (filters.startDate && filters.endDate && filters.startDate > filters.endDate) filters.endDate = filters.startDate;
        filters.hiddenKeys = filters.hiddenKeys.filter((key) => typeof key === "string" && model.productFirstDate[key]);
      }
      return filters;
    }

    function getSeasonRangeBounds(model, filters) {
      const start = filters.startDate || model.dateMin;
      const end = filters.endDate || model.dateMax;
      if (!start || !end) return { start: "", end: "" };
      return start <= end ? { start: start, end: end } : { start: end, end: start };
    }

    // 所选区间内各月的覆盖情况（缺失月 / 不完整月）
    function getSeasonCoverage(rows, start, end) {
      const monthDays = new Map();
      (rows || []).forEach((row) => {
        if (!start || !end || row.date < start || row.date > end) return;
        const key = row.date.slice(0, 7);
        if (!monthDays.has(key)) monthDays.set(key, new Set());
        monthDays.get(key).add(row.date);
      });
      const missing = [];
      const partial = [];
      if (!start || !end) return { missing: missing, partial: partial };
      const startDate = parseIsoDateValue(start);
      const endDate = parseIsoDateValue(end);
      let cursor = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
      while (cursor <= endDate) {
        const key = isoDateValue(cursor).slice(0, 7);
        const monthStart = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
        const monthEnd = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0);
        const rangeStart = monthStart < startDate ? startDate : monthStart;
        const rangeEnd = monthEnd > endDate ? endDate : monthEnd;
        const totalDays = Math.round((rangeEnd - rangeStart) / 86400000) + 1;
        const covered = monthDays.has(key) ? monthDays.get(key).size : 0;
        if (covered === 0) missing.push(key);
        else if (covered < totalDays) partial.push({ key: key, days: covered, total: totalDays });
        cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
      }
      return { missing: missing, partial: partial };
    }

    // 五段连续色阶：红（最强春夏）→ 橙（偏春夏）→ 绿（均匀）→ 蓝（偏秋冬）→ 紫（最强秋冬）
    const SEASON_COLOR_STOPS = [
      { t: 0, h: 355, s: 76, l: 42 },   // 红
      { t: 0.25, h: 26, s: 88, l: 38 }, // 橙
      { t: 0.5, h: 145, s: 60, l: 31 }, // 绿
      { t: 0.75, h: 217, s: 85, l: 43 },// 蓝
      { t: 1, h: 277, s: 62, l: 41 },   // 紫
    ];

    function seasonScaleT(verdict, ratio) {
      if (verdict === "none") return null;
      if (verdict === "even") return 0.5;
      const above = Math.max(0, Math.min(1, (ratio - SEASON_EVEN_THRESHOLD) / (1 - SEASON_EVEN_THRESHOLD)));
      // 用幂函数让「偏春夏/偏秋冬」更快离开均匀绿，强弱差异在橙/蓝段内连续体现
      const eased = Math.pow(above, 0.55);
      return verdict === "spring" ? 0.5 * (1 - eased) : 0.5 + 0.5 * eased;
    }

    function hslToHex(hue, saturation, lightness) {
      const h = ((hue % 360) + 360) % 360;
      const s = saturation / 100;
      const l = lightness / 100;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const hp = h / 60;
      const x = c * (1 - Math.abs((hp % 2) - 1));
      let r = 0;
      let g = 0;
      let b = 0;
      if (hp < 1) { r = c; g = x; }
      else if (hp < 2) { r = x; g = c; }
      else if (hp < 3) { g = c; b = x; }
      else if (hp < 4) { g = x; b = c; }
      else if (hp < 5) { r = x; b = c; }
      else { r = c; b = x; }
      const m = l - c / 2;
      const toHex = (value) => Math.round((value + m) * 255).toString(16).padStart(2, "0");
      return "#" + toHex(r) + toHex(g) + toHex(b);
    }

    function hexLuminance(hex) {
      const rgb = [1, 3, 5].map((index) => parseInt(hex.slice(index, index + 2), 16) / 255);
      const channel = (value) => (value <= 0.03928 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4));
      const r = channel(rgb[0]);
      const g = channel(rgb[1]);
      const b = channel(rgb[2]);
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }

    function contrastOnWhite(hex) {
      return 1.05 / (hexLuminance(hex) + 0.05);
    }

    function seasonScaleColor(t) {
      if (t === null) return "";
      const clamped = Math.max(0, Math.min(1, t));
      for (let i = 0; i < SEASON_COLOR_STOPS.length - 1; i += 1) {
        const from = SEASON_COLOR_STOPS[i];
        const to = SEASON_COLOR_STOPS[i + 1];
        if (clamped <= to.t) {
          const f = (clamped - from.t) / (to.t - from.t);
          let hueDelta = to.h - from.h;
          if (hueDelta > 180) hueDelta -= 360;
          if (hueDelta < -180) hueDelta += 360;
          const hue = from.h + hueDelta * f;
          const saturation = from.s + (to.s - from.s) * f;
          let lightness = from.l + (to.l - from.l) * f;
          let hex = hslToHex(hue, saturation, lightness);
          // 橙→绿过渡会经过偏黄的色相，按需压低明度，保证白底可读（对比度 ≥ 4.5）
          while (contrastOnWhite(hex) < 4.5 && lightness > 16) {
            lightness -= 1;
            hex = hslToHex(hue, saturation, lightness);
          }
          return hex;
        }
      }
      const last = SEASON_COLOR_STOPS[SEASON_COLOR_STOPS.length - 1];
      return hslToHex(last.h, last.s, last.l);
    }

    function seasonFontColor(verdict, ratio) {
      return seasonScaleColor(seasonScaleT(verdict, ratio));
    }

    function renderSeasonLegendHtml() {
      const stops = SEASON_COLOR_STOPS.map((stop) => seasonScaleColor(stop.t) + " " + Math.round(stop.t * 100) + "%").join(", ");
      return `
        <div class="season-legend">
          <span class="season-legend-end is-spring">春夏偏好</span>
          <span class="season-legend-bar" style="background:linear-gradient(90deg, ${stops});"></span>
          <span class="season-legend-end is-autumn">秋冬偏好</span>
        </div>
        <div class="season-legend-ticks">
          <span>强春夏</span><span>偏春夏</span><span>均匀（差异 &lt; 15%）</span><span>偏秋冬</span><span>强秋冬</span>
        </div>`;
    }

    function buildSeasonView(model, filters) {
      const bounds = getSeasonRangeBounds(model, filters);
      const start = bounds.start;
      const end = bounds.end;
      const calendar = buildSeasonCalendar(start, end);
      const storeNames = filters.store ? model.storeNames.filter((name) => name === filters.store) : model.storeNames;
      const springStoreDays = countStoreDays(calendar.springSegments, storeNames, model.storeFirstDate);
      const autumnStoreDays = countStoreDays(calendar.autumnSegments, storeNames, model.storeFirstDate);
      const springAvgStores = calendar.springDays > 0 ? springStoreDays / calendar.springDays : 0;
      const autumnAvgStores = calendar.autumnDays > 0 ? autumnStoreDays / calendar.autumnDays : 0;

      const rows = [];
      const map = new Map();
      (model.rows || []).forEach((row) => {
        if (!start || !end || row.date < start || row.date > end) return;
        if (filters.store && row.store !== filters.store) return;
        if (filters.category && (row.category || "未分类") !== filters.category) return;
        rows.push(row);
        const key = row.nameKey || normalizeText(row.productName);
        let item = map.get(key);
        if (!item) {
          item = { key: key, name: row.productName, springQty: 0, autumnQty: 0, total: 0 };
          map.set(key, item);
        }
        if (isSpringMonth(Number(row.date.slice(5, 7)))) item.springQty += row.qty;
        else item.autumnQty += row.qty;
        item.total += row.qty;
      });

      const seasonUnavailable = calendar.springDays === 0 || calendar.autumnDays === 0 || springStoreDays === 0 || autumnStoreDays === 0;
      const products = Array.from(map.values()).map((item) => {
        const springDaily = springStoreDays > 0 ? item.springQty / springStoreDays : 0;
        const autumnDaily = autumnStoreDays > 0 ? item.autumnQty / autumnStoreDays : 0;
        const springDailyOld = calendar.springDays > 0 ? item.springQty / calendar.springDays : 0;
        const autumnDailyOld = calendar.autumnDays > 0 ? item.autumnQty / calendar.autumnDays : 0;
        const larger = Math.max(springDaily, autumnDaily);
        const ratio = larger > 0 ? Math.abs(springDaily - autumnDaily) / larger : 0;
        let verdict = "none";
        if (!seasonUnavailable) verdict = ratio < SEASON_EVEN_THRESHOLD ? "even" : (springDaily > autumnDaily ? "spring" : "autumn");
        return {
          ...item,
          springDaily: springDaily,
          autumnDaily: autumnDaily,
          springDailyOld: springDailyOld,
          autumnDailyOld: autumnDailyOld,
          ratio: ratio,
          firstSale: model.productFirstDate[item.key] || "",
          verdict: verdict,
          verdictText: verdict === "spring" ? "春夏更好" : (verdict === "autumn" ? "秋冬更好" : (verdict === "even" ? "均匀" : "无法判定")),
          color: seasonFontColor(verdict, ratio),
        };
      });
      products.sort((a, b) => b.total - a.total || a.name.localeCompare(b.name, "zh-Hans-CN"));

      // 数据缺口只看门店/时间，不受品类与隐藏影响
      const coverageRows = (model.rows || []).filter((row) => {
        if (!start || !end || row.date < start || row.date > end) return false;
        if (filters.store && row.store !== filters.store) return false;
        return true;
      });
      const coverage = getSeasonCoverage(coverageRows, start, end);

      const warnings = [];
      if (calendar.springDays === 0) warnings.push("所选区间不含春夏（3–8 月）数据，春夏无法对比，结论显示为「无法判定」。");
      else if (calendar.springDays < SEASON_MIN_COVER_DAYS) warnings.push("春夏仅覆盖 " + calendar.springDays + " 天，样本偏少，结论波动可能较大。");
      if (calendar.autumnDays === 0) warnings.push("所选区间不含秋冬（9–2 月）数据，秋冬无法对比，结论显示为「无法判定」。");
      else if (calendar.autumnDays < SEASON_MIN_COVER_DAYS) warnings.push("秋冬仅覆盖 " + calendar.autumnDays + " 天，样本偏少，结论波动可能较大。");
      if (calendar.springDays > 0 && springStoreDays === 0) warnings.push("所选门店在春夏区间内没有营业天数，春夏无法对比。");
      if (calendar.autumnDays > 0 && autumnStoreDays === 0) warnings.push("所选门店在秋冬区间内没有营业天数，秋冬无法对比。");

      return {
        start: start,
        end: end,
        calendar: calendar,
        springStoreDays: springStoreDays,
        autumnStoreDays: autumnStoreDays,
        springAvgStores: springAvgStores,
        autumnAvgStores: autumnAvgStores,
        products: products,
        rows: rows,
        coverage: coverage,
        warnings: warnings,
        seasonUnavailable: seasonUnavailable,
      };
    }

    function getSeasonViewProducts(view, filters) {
      const hidden = new Set(filters.hiddenKeys);
      let list = view.products.filter((item) => (filters.showHidden ? hidden.has(item.key) : !hidden.has(item.key)));
      const keyword = normalizeText(filters.search);
      if (keyword) list = list.filter((item) => normalizeText(item.name).indexOf(keyword) !== -1);
      if (filters.sort === "springDaily") {
        list.sort((a, b) => b.springDaily - a.springDaily || b.total - a.total);
      } else if (filters.sort === "autumnDaily") {
        list.sort((a, b) => b.autumnDaily - a.autumnDaily || b.total - a.total);
      } else if (filters.sort === "diff") {
        list.sort((a, b) => b.ratio - a.ratio || b.total - a.total);
      }
      return list;
    }

        `<div class="trend-stat"><small>秋冬表现更好</small><strong style="color:#1D4ED8">${formatInteger(counts.autumn)}</strong><span class="note">个</span></div>`,
        `<div class="trend-stat"><small>两季均匀</small><strong>${formatInteger(counts.even)}</strong><span class="note">个</span></div>`,

    function buildSeasonGapText(view) {
      if (!view.start || !view.end) return "未选择区间";
      const parts = [];
      if (view.coverage.missing.length) {
        parts.push(view.coverage.missing.map((key) => Number(key.slice(5, 7)) + " 月无数据").join("、"));
      }
      if (view.coverage.partial.length) {
        parts.push(view.coverage.partial.map((item) => item.key + " 仅覆盖 " + item.days + "/" + item.total + " 天").join("、"));
      }
      return parts.length ? parts.join("；") : "所选区间各月均有数据";

    function renderSeasonWarningsHtml(view) {
      if (!view.warnings.length) return "";

    }

    // ---- 时间趋势图 ----
    function getSeasonChartData(view, filters) {
      const hidden = new Set(filters.hiddenKeys);
      const granularity = filters.granularity === "monthly" ? "monthly" : "daily";
      const bucketMap = new Map();
      (view.rows || []).forEach((row) => {
        const key = row.nameKey || normalizeText(row.productName);
        if (hidden.has(key)) return;
        const bucket = granularity === "monthly" ? row.date.slice(0, 7) : row.date;
        bucketMap.set(bucket, (bucketMap.get(bucket) || 0) + row.qty);
      });
      const dates = [];
      if (view.start && view.end) {
        if (granularity === "monthly") {
          const startDate = parseIsoDateValue(view.start);
          const endDate = parseIsoDateValue(view.end);
          let cursor = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
          while (cursor <= endDate) {
            dates.push(isoDateValue(cursor).slice(0, 7));
            cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
          }
        } else {
          const cursor = parseIsoDateValue(view.start);
          const endDate = parseIsoDateValue(view.end);
          while (cursor <= endDate) {
            dates.push(isoDateValue(cursor));
            cursor.setDate(cursor.getDate() + 1);
          }
        }
      }
      const values = dates.map((key) => bucketMap.get(key) || 0);
      return { dates: dates, values: values, granularity: granularity };
    }

    function niceCeil(value) {
      if (value <= 0) return 10;
      const exponent = Math.floor(Math.log10(value));
      const fraction = value / Math.pow(10, exponent);
      let niceFraction;
      if (fraction <= 1) niceFraction = 1;
      else if (fraction <= 2) niceFraction = 2;
      else if (fraction <= 5) niceFraction = 5;
      else niceFraction = 10;
      return niceFraction * Math.pow(10, exponent);
    }

    function renderSeasonTrendSvg(dates, values, opts) {
      const options = opts || {};
      const hasData = dates.length > 0 && values.some((value) => value > 0);
      if (!hasData) {
        return '<div class="trend-product-empty">当前筛选条件下没有销量数据，试试调整门店、品类或时间区间。</div>';
      }
      const n = dates.length;
      const granularity = options.granularity || "daily";
      const showTrendLine = !!options.showTrendLine;
      const trendValues = showTrendLine ? computeTrendValues(values, options.trendMethod || "linear") : [];
      const padL = 64;
      const padR = 28;
      const padT = 20;
      const padB = 50;
      const minW = options.big ? 1100 : 700;
      const maxW = options.big ? 2000 : 1600;
      const step = granularity === "monthly" ? 46 : 26;
      const W = Math.min(maxW, Math.max(minW, n * step + padL + padR));
      const H = Math.round(W / (options.big ? 3.4 : 3.8));
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const yMax = niceCeil(Math.max(1, ...values, ...trendValues));
      const x = (i) => padL + (n <= 1 ? plotW / 2 : (i * plotW) / (n - 1));
      const y = (value) => padT + plotH - (Math.max(0, value) / yMax) * plotH;

      let gridHtml = "";
      for (let t = 0; t <= 5; t += 1) {
        const value = (yMax / 5) * t;
        const yy = y(value);
        gridHtml += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W - padR}" y2="${yy.toFixed(1)}" stroke="#ececec" stroke-width="1"/>`;
        gridHtml += `<text x="${padL - 8}" y="${(yy + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#67717F">${formatInteger(value)}</text>`;
      }

      const xStep = Math.max(1, Math.ceil(n / 12));
      let xLabelsHtml = "";
      for (let i = 0; i < n; i += xStep) {
        const xx = x(i);
        const label = granularity === "monthly" ? dates[i] : dates[i].slice(5);
        xLabelsHtml += `<text x="${xx.toFixed(1)}" y="${H - padB + 18}" text-anchor="middle" font-size="11" fill="#67717F">${label}</text>`;
        xLabelsHtml += `<line x1="${xx.toFixed(1)}" y1="${padT + plotH}" x2="${xx.toFixed(1)}" y2="${padT + plotH + 4}" stroke="#C6D2E2" stroke-width="1"/>`;
      }
      xLabelsHtml += `<text x="${padL}" y="${H - 8}" text-anchor="start" font-size="11" fill="#1F2937">${dates[0]}</text>`;
      xLabelsHtml += `<text x="${W - padR}" y="${H - 8}" text-anchor="end" font-size="11" fill="#1F2937">${dates[n - 1]}</text>`;

      const points = values.map((value, i) => `${x(i).toFixed(1)},${y(value).toFixed(1)}`).join(" ");
      let linesHtml = `<polyline points="${points}" fill="none" stroke="${SEASON_TREND_COLOR}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.92"/>`;
      if (n <= 62) {
        values.forEach((value, i) => {
          if (value > 0) linesHtml += `<circle cx="${x(i).toFixed(1)}" cy="${y(value).toFixed(1)}" r="2.4" fill="${SEASON_TREND_COLOR}" opacity="0.92"/>`;
        });
      }
      if (showTrendLine && trendValues.length === n) {
        const trendPoints = trendValues.map((value, i) => `${x(i).toFixed(1)},${y(value).toFixed(1)}`).join(" ");
        linesHtml += `<polyline points="${trendPoints}" fill="none" stroke="#67717F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 4" opacity="0.75"/>`;
      }

      const axesHtml = `
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#C6D2E2" stroke-width="1"/>
        <line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="#C6D2E2" stroke-width="1"/>
        <text x="${padL - 44}" y="${padT + plotH / 2}" text-anchor="middle" font-size="11" fill="#67717F" transform="rotate(-90 ${padL - 44} ${padT + plotH / 2})">销量（件）</text>
      `;

      let overlayHtml = "";
      if (n <= 400) {
        const colW = plotW / Math.max(1, n);
        const rx = Math.max(colW / 2, 6);
        for (let i = 0; i < n; i += 1) {
          overlayHtml += `<rect x="${(x(i) - rx).toFixed(1)}" y="${padT}" width="${(rx * 2).toFixed(1)}" height="${plotH}" fill="white" fill-opacity="0" pointer-events="all"><title>${dates[i]}：${formatInteger(values[i])} 件</title></rect>`;
        }
      }

      return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="门店销量趋势折线图">
        ${gridHtml}
        ${axesHtml}
        ${linesHtml}
        ${xLabelsHtml}
        ${overlayHtml}
      </svg>`;
    }

    function renderSeasonChartAreaHtml(view, filters) {
      const data = getSeasonChartData(view, filters);
      const total = data.values.reduce((sum, value) => sum + value, 0);
      let peakValue = 0;
      let peakDate = "-";
      data.values.forEach((value, i) => {
        if (value > peakValue) { peakValue = value; peakDate = data.dates[i]; }
      });
      const isMonthly = data.granularity === "monthly";
      const avg = data.dates.length ? total / data.dates.length : 0;
      const svg = renderSeasonTrendSvg(data.dates, data.values, {
        granularity: data.granularity,
        showTrendLine: filters.showTrendLine,
        trendMethod: filters.trendMethod,
      });
      const trendName = filters.trendMethod === "ma" ? "移动平均" : "线性回归";
      const legend = `<div class="trend-legend">
        <span class="trend-legend-item"><span class="trend-legend-swatch" style="background:${SEASON_TREND_COLOR}"></span>门店销量合计</span>
        ${filters.showTrendLine ? `<span class="trend-legend-item"><span class="trend-legend-swatch trend-legend-swatch--dash" style="background:repeating-linear-gradient(90deg,#67717F 0 6px,transparent 6px 10px);"></span>趋势线（${trendName}）</span>` : ""}
      </div>`;
      return `
        <div class="season-chart-head">
          <div>
            <div class="season-chart-title">销量时间趋势</div>
            <div class="note">按${isMonthly ? "月" : "日"}汇总当前筛选（门店 / 品类 / 时间区间，不含已隐藏单品）的销量，点击图表可放大查看。</div>
          </div>
          <div class="season-chart-controls">
            <label>粒度<select id="season-granularity">
              <option value="daily"${data.granularity === "daily" ? " selected" : ""}>按日</option>
              <option value="monthly"${data.granularity === "monthly" ? " selected" : ""}>按月</option>
            </select></label>
            <label class="season-check"><input type="checkbox" id="season-trend-toggle"${filters.showTrendLine ? " checked" : ""}>趋势线</label>
            <label>算法<select id="season-trend-method"${filters.showTrendLine ? "" : " disabled"}>
              <option value="linear"${filters.trendMethod === "linear" ? " selected" : ""}>线性回归</option>
              <option value="ma"${filters.trendMethod === "ma" ? " selected" : ""}>移动平均</option>
            </select></label>
          </div>
        </div>
        <div class="trend-summary season-stats" style="margin-bottom:10px;">
          <div class="trend-stat"><small>区间销量合计</small><strong>${formatInteger(total)}</strong></div>
          <div class="trend-stat"><small>${isMonthly ? "单月峰值" : "单日峰值"}</small><strong>${formatInteger(peakValue)}</strong><div class="note">${escapeHtml(peakDate)}</div></div>
          <div class="trend-stat"><small>${isMonthly ? "月均销量" : "日均销量"}</small><strong>${avg.toFixed(1)}</strong><div class="note">${data.dates.length} ${isMonthly ? "个月" : "天"}</div></div>
        </div>
        <div class="trend-chart-wrap" data-season-chart="1" title="点击放大查看">${svg}<div class="trend-chart-zoom-hint">点击图表可放大查看</div></div>
        ${legend}
      `;
    }

    function ensureSeasonChartModal() {
      let modal = document.getElementById("season-chart-modal");
      if (modal) return modal;
      modal = document.createElement("div");
      modal.id = "season-chart-modal";
      modal.className = "trend-modal";
      modal.innerHTML = `<div class="trend-modal-back"></div>
        <div class="trend-modal-box">
          <div class="trend-modal-head"><strong>门店销量时间趋势</strong><button type="button" class="ghost" id="season-chart-modal-close">关闭</button></div>
          <div class="trend-modal-body" id="season-chart-modal-body"></div>
        </div>`;
      document.body.appendChild(modal);
      modal.addEventListener("click", (event) => {
        if (event.target.closest(".trend-modal-back") || event.target.id === "season-chart-modal-close") {
          modal.classList.remove("open");
        }
      });
      return modal;
    }

    function openSeasonChartModal() {
      const model = modelCache.model;
      if (!model || !model.salesTrendModel) return;
      const filters = getSeasonFilters(model.salesTrendModel);
      const view = buildSeasonView(model.salesTrendModel, filters);
      const data = getSeasonChartData(view, filters);
      const svg = renderSeasonTrendSvg(data.dates, data.values, {
        granularity: data.granularity,
        showTrendLine: filters.showTrendLine,
        trendMethod: filters.trendMethod,
        big: true,
      });
      const modal = ensureSeasonChartModal();
      document.getElementById("season-chart-modal-body").innerHTML = `<div class="trend-chart-wrap trend-chart-wrap--modal">${svg}</div>`;
      modal.classList.add("open");
    }

    function renderSalesTrendTab(model) {
      const trend = model.salesTrendModel;
      if (!trend || !trend.productCount) {
        return renderSalesTrendEmpty();
      }
      const filters = getSeasonFilters(trend);

      const categoryOptions = ['<option value="">全部品类</option>'].concat(
        trend.categoryOptions.map((name) => `<option value="${escapeHtml(name)}"${filters.category === name ? " selected" : ""}>${escapeHtml(name)}</option>`)
      ).join("");
      const sortOptions = [
        ["total", "总销量优先"],
        ["springDaily", "春夏日均优先"],
        ["autumnDaily", "秋冬日均优先"],
        ["diff", "季节差异优先"],
      ].map((option) => `<option value="${option[0]}"${filters.sort === option[0] ? " selected" : ""}>${option[1]}</option>`).join("");
      const startValue = filters.startDate || trend.dateMin;
      const endValue = filters.endDate || trend.dateMax;
      const hiddenCount = filters.hiddenKeys.length;

      return `
        <div class="panel trend-panel">
          <div class="block-head">
            <div>
              <h2>门店单品季节分析</h2>
              <div class="note">数据源：门店销售明细（《店铺销售》）· ${trend.dateMin} ~ ${trend.dateMax} · ${formatInteger(trend.recordCount)} 条销售记录</div>

            <button class="primary" data-open-source="salesTrend">重新上传门店销售明细</button>
          </div>

          <div class="season-note">
            <div><b>季节划分</b>春夏 3–8 月；秋冬 9、10、11、12、1、2 月。</div>
            <div><b>日均归一</b>日均 = 该季销量 ÷ 该季「店天数」（各门店从在本数据里的首次销售日起、落在该季区间内的自然天数之和），等价于平均每家营业门店每天卖多少，剔除门店数量变化的影响；表内同时给出原口径（÷自然天数）便于对比。</div>
            <div><b>当前区间</b><span id="season-range">${view.start} ~ ${view.end}</span>；<span id="season-gap">${buildSeasonGapText(view)}</span>。全量数据 2026-01-01 ~ 2026-11-15（12 月无数据、11 月截至 15 日）。</div>
            <div><b>判定规则</b>赠品与小样不计入；品类取《店铺销售》「商品类目」；|春夏日均 − 秋冬日均| ÷ 两者较大值 &lt; 15% 记为「均匀」，否则判给较高的一方。</div>
            <div><b>单品提示</b>未做逐品归一；若单品首次销售日晚于所选区间起点，名称后标注「首销 M-DD」，表示该单品在区间内覆盖不足。</div>
            <div><b>颜色</b>商品名称与季节结论使用同一条五段连续色阶：红（最强春夏）→ 橙（偏春夏）→ 绿（均匀）→ 蓝（偏秋冬）→ 紫（最强秋冬），同一色相内颜色越深表示差异越大。</div>
            <div class="season-warn" id="season-warn">${renderSeasonWarningsHtml(view)}</div>
          </div>

          <div class="season-section" id="season-chart-area">${renderSeasonChartAreaHtml(view, filters)}</div>

          <div class="trend-summary season-stats" id="season-summary">${renderSeasonSummaryHtml(list, view)}</div>

          <div class="season-compare-wrap" id="season-compare">${renderSeasonCompareHtml(list, view)}</div>

          <div class="season-legend-wrap">${renderSeasonLegendHtml()}</div>

          <div class="season-toolbar">
            <label>门店<select id="season-store">${storeOptions}</select></label>
            <label>品类<select id="season-category">${categoryOptions}</select></label>
            <label>开始日期<input id="season-start" type="date" min="${trend.dateMin}" max="${trend.dateMax}" value="${startValue}"></label>
            <label>结束日期<input id="season-end" type="date" min="${trend.dateMin}" max="${trend.dateMax}" value="${endValue}"></label>
            <button type="button" class="ghost season-reset-btn" id="season-reset-dates">重置区间</button>
            <label>商品搜索<input id="season-search" type="search" placeholder="输入商品名称关键词" value="${escapeHtml(filters.search)}"></label>
            <label>排序<select id="season-sort">${sortOptions}</select></label>
            <span class="note season-count-note">当前 <b id="season-count">${list.length}</b> 个单品</span>
            <button type="button" class="ghost season-hidden-btn${filters.showHidden ? " is-active" : ""}" id="season-hidden-toggle">${filters.showHidden ? "返回全部单品" : "已隐藏 " + hiddenCount}</button>
          </div>

          <div class="table-wrap">
            <table class="season-table">
              <thead>
                <tr>
                  <th style="width:34%">商品名称</th>
                  <th style="width:110px;">季节结论</th>
                  <th class="season-num">春夏销量</th>
                  <th class="season-num">春夏日均<span class="season-th-note">÷店天数</span></th>
                  <th class="season-num">秋冬销量</th>
                  <th class="season-num">秋冬日均<span class="season-th-note">÷店天数</span></th>
                  <th class="season-num">日均差异</th>
                  <th style="width:64px;">操作</th>
                </tr>
              </thead>
              <tbody id="season-body">${renderSeasonRowsHtml(list, view, filters)}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderSalesTrendLoading() {
      return `
        <div class="panel trend-panel">
          <div class="block-head">
            <div>
              <h2>门店单品季节分析</h2>
              <div class="note">正在解析门店销售明细，大文件可能需要数十秒，请稍候…</div>
            </div>
          </div>
          <div class="soft-card" style="text-align:center;padding:48px 16px;">
            <div class="trend-loading-spinner"></div>
            <div class="note" style="margin-top:14px;">解析中，请勿关闭或刷新页面</div>
          </div>
        </div>
      `;
    }

    function updateSeasonView() {
      const model = modelCache.model;
      const trend = model && model.salesTrendModel;
      if (!trend) return;
      const filters = getSeasonFilters(trend);
      const view = buildSeasonView(trend, filters);
      const list = getSeasonViewProducts(view, filters);

      const chartArea = document.getElementById("season-chart-area");
      if (chartArea) chartArea.innerHTML = renderSeasonChartAreaHtml(view, filters);
      const summary = document.getElementById("season-summary");
      if (summary) summary.innerHTML = renderSeasonSummaryHtml(list, view);
      const compare = document.getElementById("season-compare");
      if (compare) compare.innerHTML = renderSeasonCompareHtml(list, view);
      const range = document.getElementById("season-range");
      if (range) range.textContent = view.start + " ~ " + view.end;
      const gap = document.getElementById("season-gap");
      if (gap) gap.textContent = buildSeasonGapText(view);
      const warn = document.getElementById("season-warn");
      if (warn) warn.innerHTML = renderSeasonWarningsHtml(view);
      const body = document.getElementById("season-body");
      if (body) body.innerHTML = renderSeasonRowsHtml(list, view, filters);
      const count = document.getElementById("season-count");
      if (count) count.textContent = String(list.length);
      const hiddenToggle = document.getElementById("season-hidden-toggle");
      if (hiddenToggle) {
        hiddenToggle.textContent = filters.showHidden ? "返回全部单品" : "已隐藏 " + filters.hiddenKeys.length;
        hiddenToggle.classList.toggle("is-active", filters.showHidden);
      }
      cacheAppState();
    }

    function toggleSeasonHidden(key, hidden) {
      const filters = state.salesTrendFilters;
      const set = new Set(filters.hiddenKeys);
      if (hidden) set.add(key);
      else set.delete(key);
      filters.hiddenKeys = Array.from(set);
    }

    function bindTrendInteractions() {
      const model = modelCache.model;
      if (!model || !model.salesTrendModel) return;
      const filters = getSeasonFilters(model.salesTrendModel);

      const storeEl = document.getElementById("season-store");
      if (storeEl) {
        storeEl.addEventListener("change", () => {
          filters.store = storeEl.value;
          updateSeasonView();
        });
      }

      const categoryEl = document.getElementById("season-category");
      if (categoryEl) {
        categoryEl.addEventListener("change", () => {
          filters.category = categoryEl.value;
          updateSeasonView();
        });
      }

      const startEl = document.getElementById("season-start");
      if (startEl) {
        startEl.addEventListener("change", () => {
          filters.startDate = startEl.value || "";
          if (filters.startDate && filters.endDate && filters.startDate > filters.endDate) {
            filters.endDate = filters.startDate;
            const endEl = document.getElementById("season-end");
            if (endEl) endEl.value = filters.endDate;
          }
          updateSeasonView();
        });
      }

      const endEl = document.getElementById("season-end");
      if (endEl) {
        endEl.addEventListener("change", () => {
          filters.endDate = endEl.value || "";
          if (filters.startDate && filters.endDate && filters.startDate > filters.endDate) {
            filters.startDate = filters.endDate;
            if (startEl) startEl.value = filters.startDate;
          }
          updateSeasonView();
        });
      }

      const resetEl = document.getElementById("season-reset-dates");
      if (resetEl) {
        resetEl.addEventListener("click", () => {
          filters.startDate = "";
          filters.endDate = "";
          if (startEl) startEl.value = model.salesTrendModel.dateMin;
          if (endEl) endEl.value = model.salesTrendModel.dateMax;
          updateSeasonView();
        });
      }

      const searchEl = document.getElementById("season-search");
      if (searchEl) {
        searchEl.addEventListener("input", () => {
          filters.search = searchEl.value;
          updateSeasonView();
        });
      }

      const sortEl = document.getElementById("season-sort");
      if (sortEl) {
        sortEl.addEventListener("change", () => {
          filters.sort = sortEl.value;
          updateSeasonView();
        });
      }

      const hiddenToggle = document.getElementById("season-hidden-toggle");
      if (hiddenToggle) {
        hiddenToggle.addEventListener("click", () => {
          filters.showHidden = !filters.showHidden;
          updateSeasonView();
        });
      }

      const body = document.getElementById("season-body");
      if (body) {
        body.addEventListener("click", (event) => {
          const hideBtn = event.target.closest("[data-hide-key]");
          if (hideBtn) {
            toggleSeasonHidden(hideBtn.dataset.hideKey, true);
            updateSeasonView();
            return;
          }
          const restoreBtn = event.target.closest("[data-restore-key]");
          if (restoreBtn) {
            toggleSeasonHidden(restoreBtn.dataset.restoreKey, false);
            updateSeasonView();
          }
        });
      }

      const chartArea = document.getElementById("season-chart-area");
      if (chartArea) {
        chartArea.addEventListener("change", (event) => {
          if (event.target.id === "season-granularity") {
            filters.granularity = event.target.value;
            updateSeasonView();
          } else if (event.target.id === "season-trend-toggle") {
            filters.showTrendLine = event.target.checked;
            updateSeasonView();
          } else if (event.target.id === "season-trend-method") {
            filters.trendMethod = event.target.value;
            updateSeasonView();
          }
        });
        chartArea.addEventListener("click", (event) => {
          if (event.target.closest(".trend-chart-wrap") && !event.target.closest("select")) {
            openSeasonChartModal();
          }
        });
      }
    }

    function renderEmptyTabContent() {
      // 根据当前选中的 Tab 显示对应的空状态
      if (state.activeTab === "matrix") {
        return renderMatrixEmpty();
      }
      if (state.activeTab === "salesTrend") {
        return renderSalesTrendEmpty();
      }
      return renderCockpitEmpty();
    }

    function renderSalesTrendEmpty() {
      return `
        <div class="panel trend-panel" id="trend-empty-panel">
          <div class="block-head">
            <div>
              <h2>门店单品季节分析</h2>
              <div class="note">上传《门店销售明细》后，按单品对比春夏 / 秋冬的日均销量，判断季节倾向并用色阶标注强弱。</div>
            </div>
            <button class="primary" data-open-source="salesTrend">上传门店销售明细</button>
          </div>
          <div class="soft-card">
            <div style="display:grid;gap:12px;">
              <div class="note">文件要求：</div>
              <ul style="margin:0;padding-left:20px;color:var(--muted);">
                <li>格式：Excel (.xlsx/.xls) 或 CSV</li>
                <li>工作表：包含《店铺销售》（仅一张销售表也可）</li>
                <li>必需列：日期、商品名称、归属店铺、商品数量</li>
                <li>建议保留「订单商品状态」「小样/赠品」列，用于排除非完成单与赠品、小样</li>
              </ul>
              <div class="note" style="margin-top:8px;">季节：春夏 3–8 月，秋冬 9、10、11、12、1、2 月；按实际覆盖天数的日均销量对比；|日均差| ÷ 较大值 &lt; 15% 记为「均匀」。</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderEmptyState(model) {
      const empty = document.getElementById("empty-state");
      const anyLoading = SOURCE_CONFIGS.some((cfg) => model.sources[cfg.key].loading);
      // 只在文件加载中时显示通用加载提示，空状态由 tab-content 中的模式专属提示处理
      empty.style.display = (!model.uploadedCount && anyLoading) ? "grid" : "none";
      if (!model.uploadedCount && anyLoading) {
        empty.innerHTML = `
          <h2>正在解析文件</h2>
          <p>文件正在读取中，等它解析完成后，这里就会自动切换成数据视图。</p>
        `;
      }
    }

    function render(model = buildModel()) {
      // 侧边栏折叠/展开
      const sidebarEl = document.querySelector(".sidebar");
      const layoutEl = document.querySelector(".layout");
      const toggleBtn = document.getElementById("sidebar-toggle-btn");
      const restoreBtn = document.getElementById("restore-sidebar");
      if (sidebarEl && layoutEl) {
        const collapsed = state.sidebarCollapsed;
        sidebarEl.classList.toggle("collapsed", collapsed);
        layoutEl.classList.toggle("sidebar-hidden", collapsed);
        if (restoreBtn) restoreBtn.style.display = collapsed ? "" : "none";
      }
      if (toggleBtn && !toggleBtn.dataset.bound) {
        toggleBtn.dataset.bound = "1";
        toggleBtn.addEventListener("click", () => {
          state.sidebarCollapsed = true;
          render();
        });
      }
      if (restoreBtn && !restoreBtn.dataset.bound) {
        restoreBtn.dataset.bound = "1";
        restoreBtn.addEventListener("click", () => {
          state.sidebarCollapsed = false;
          render();
        });
      }
      renderModeSwitch(model);
      renderSidebarInfo(model);
      renderProgressPills(model);
      renderSourceList(model);
      renderDataQuality(model);
      renderEmptyState(model);

      // 按 tab 控制顶部按钮：批量上传/清空全部只在驾驶舱显示
      const batchBtn = document.getElementById("batch-upload");
      const clearBtn = document.getElementById("clear-all");
      const isCockpit = state.activeTab === "cockpit";
      if (batchBtn) batchBtn.style.display = isCockpit ? "" : "none";
      if (clearBtn) clearBtn.style.display = isCockpit ? "" : "none";

      const kpiGrid = document.getElementById("kpi-grid");
      const tabsPanel = document.getElementById("tabs-panel");
      const tabsBar = document.getElementById("tabs");

      // 始终显示内容面板
      tabsPanel.style.display = "block";

      // 门店SKU排名看板：iframe 嵌入独立页面（首次进入懒加载，切换 Tab 状态保留）
      const skuRankPanel = document.getElementById("sku-rank-panel");
      const waterlinePanel = document.getElementById("waterline-panel");
      const sellOutPanel = document.getElementById("sell-out-panel");
      const inventoryPanel = document.getElementById("inventory-analysis-panel");
      const newStorePanel = document.getElementById("new-store-panel");
      const productDocsPanel = document.getElementById("product-docs-panel");
      const consignmentPanel = document.getElementById("consignment-panel");
      if (inventoryPanel) inventoryPanel.style.display = "none";
      if (newStorePanel) newStorePanel.style.display = "none";
      if (productDocsPanel) productDocsPanel.style.display = "none";
      if (consignmentPanel) consignmentPanel.style.display = "none";
      if (state.activeTab === "skuRank") {
        kpiGrid.style.display = "none";
        tabsBar.style.display = "none";
        tabsPanel.style.display = "none";
        if (skuRankPanel) {
          skuRankPanel.style.display = "block";
          const skuFrame = document.getElementById("sku-rank-frame");
          if (skuFrame && !skuFrame.getAttribute("src")) {
            skuFrame.src = skuFrame.dataset.src;
          }
        }
        if (waterlinePanel) waterlinePanel.style.display = "none";
        if (sellOutPanel) sellOutPanel.style.display = "none";
        return;
      }
      if (skuRankPanel) skuRankPanel.style.display = "none";

      // 库存水位线工具：iframe 嵌入独立页面（首次进入懒加载，切换 Tab 状态保留）
      if (state.activeTab === "stockWaterline") {
        kpiGrid.style.display = "none";
        tabsBar.style.display = "none";
        tabsPanel.style.display = "none";
        if (waterlinePanel) {
          waterlinePanel.style.display = "block";
          const wlFrame = document.getElementById("waterline-frame");
          if (wlFrame && !wlFrame.getAttribute("src")) {
            wlFrame.src = wlFrame.dataset.src;
          }
        }
        if (sellOutPanel) sellOutPanel.style.display = "none";
        return;
      }
      if (waterlinePanel) waterlinePanel.style.display = "none";

      // 商品售罄预估看板：iframe 嵌入独立页面（首次进入懒加载，切换 Tab 状态保留）
      if (state.activeTab === "sellOut") {
        kpiGrid.style.display = "none";
        tabsBar.style.display = "none";
        tabsPanel.style.display = "none";
        if (sellOutPanel) {
          sellOutPanel.style.display = "block";
          const soFrame = document.getElementById("sell-out-frame");
          if (soFrame && !soFrame.getAttribute("src")) {
            soFrame.src = soFrame.dataset.src;
          }
        }
        return;
      }
      if (sellOutPanel) sellOutPanel.style.display = "none";

      // 库存分析看板：iframe 嵌入独立页面（首次进入懒加载，切换 Tab 状态保留）
      if (state.activeTab === "inventoryAnalysis") {
        kpiGrid.style.display = "none";
        tabsBar.style.display = "none";
        tabsPanel.style.display = "none";
        if (inventoryPanel) {
          inventoryPanel.style.display = "block";
          const invFrame = document.getElementById("inventory-analysis-frame");
          if (invFrame && !invFrame.getAttribute("src")) {
            invFrame.src = invFrame.dataset.src;
          }
        }
        return;
      }
      if (inventoryPanel) inventoryPanel.style.display = "none";

      // 新店时间表：纯前端录入，无需上传文件（首次进入懒加载，切换 Tab 状态保留）
      if (state.activeTab === "newStore") {
        kpiGrid.style.display = "none";
        tabsBar.style.display = "none";
        tabsPanel.style.display = "none";
        if (newStorePanel) {
          newStorePanel.style.display = "block";
          const nsFrame = document.getElementById("new-store-frame");
          if (nsFrame && !nsFrame.getAttribute("src")) {
            nsFrame.src = nsFrame.dataset.src;
          }
        }
        return;
      }
      if (newStorePanel) newStorePanel.style.display = "none";

      // 商品文档：内置资料库，无需上传文件（首次进入懒加载，切换 Tab 状态保留）
      if (state.activeTab === "productDocs") {
        kpiGrid.style.display = "none";
        tabsBar.style.display = "none";
        tabsPanel.style.display = "none";
        if (productDocsPanel) {
          productDocsPanel.style.display = "block";
          const pdFrame = document.getElementById("product-docs-frame");
          if (pdFrame && !pdFrame.getAttribute("src")) {
            pdFrame.src = pdFrame.dataset.src;
          }
        }
        return;
      }
      if (productDocsPanel) productDocsPanel.style.display = "none";

      // 寄售库存：内置导入 + 手工录入（首次进入懒加载，切换 Tab 状态保留）
      if (state.activeTab === "consignment") {
        kpiGrid.style.display = "none";
        tabsBar.style.display = "none";
        tabsPanel.style.display = "none";
        if (consignmentPanel) {
          consignmentPanel.style.display = "block";
          const csFrame = document.getElementById("consignment-frame");
          if (csFrame && !csFrame.getAttribute("src")) {
            csFrame.src = csFrame.dataset.src;
          }
        }
        return;
      }
      if (consignmentPanel) consignmentPanel.style.display = "none";

      if (state.activeTab === "cockpit") {
        // 驾驶舱模式：显示子标签栏
        tabsBar.style.display = "flex";
        renderCockpitSubtabs(model);
      } else {
        // 九宫格模式：隐藏子标签栏
        tabsBar.style.display = "none";
      }

      // 门店销售明细解析中：先显示加载态，避免用户以为卡死
      if (state.activeTab === "salesTrend" && state.sources.salesTrend && state.sources.salesTrend.loading) {
        kpiGrid.style.display = "none";
        tabsBar.style.display = "none";
        document.getElementById("tab-content").innerHTML = renderSalesTrendLoading();
        return;
      }

      // 快团团导入不需要上传文件，直接渲染
      if (state.activeTab === "kttImport") {
        kpiGrid.style.display = "none";
        tabsBar.style.display = "none";
        renderTabContent(model);
        return;
      }

      if (!model.uploadedCount) {
        kpiGrid.style.display = "none";
        // 显示空状态提示
        document.getElementById("tab-content").innerHTML = renderEmptyTabContent();

        // 绑定九宫格空状态的上传按钮事件
        if (state.activeTab === "matrix") {
          const uploadBtn = document.getElementById("matrix-upload-btn");
          const fileInput = document.getElementById("matrix-empty-input");
          if (uploadBtn && fileInput) {
            uploadBtn.addEventListener("click", () => {
              fileInput.click();
            });
            fileInput.addEventListener("change", async () => {
              const file = fileInput.files && fileInput.files[0];
              if (!file) return;
              await handleUpload("matrixWorkbook", file);
              fileInput.value = "";
            });
          }
        }
        // 门店单品季节分析的空状态上传由全局 data-open-source 处理
        return;
      }

      // 驾驶舱模式才显示 KPI
      if (state.activeTab === "cockpit") {
        kpiGrid.style.display = "grid";
        renderKpis(model);
      } else {
        kpiGrid.style.display = "none";
      }

      renderTabContent(model);
      cacheAppState();
      // 联动总表滚动定位：仅在从九宫格跳转到联动总表时触发（matrixScrollTarget="table"）
      // 避免筛选/翻页等常规 render 时无脑滚动到之前聚焦的行
      if (state.matrixScrollTarget === "table" && state.matrixFocusKey) {
        requestAnimationFrame(scrollToFocusedRow);
      }
      // 清除滚动目标标记
      state.matrixScrollTarget = "";
    }

    async function handleUpload(key, file, options = {}) {
      const { skipInitialRender = false, skipFinalRender = false } = options;
      const source = state.sources[key];
      const cfg = SOURCE_CONFIGS.find((item) => item.key === key);
      source.loading = true;
      source.error = "";
      if (!skipInitialRender) render();

      try {
        if (key === "matrixWorkbook") {
          // 上传新文件时清除旧的聚焦、展开状态和筛选条件，避免渲染后被筛选条件过滤为空导致页面卡死
          state.matrixFocusKey = "";
          state.matrixExpandedCells = {};
          state.matrixFilters = { category: "全部", isRegularPrice: "全部", productionNote: "全部", kpiFilter: "all" };
          const fileData = await parseMatrixWorkbookRowsFromFile(file);
          state.sources[key] = {
            ...createEmptySourceState(cfg),
            key,
            label: cfg.label,
            fileName: file.name,
            sheetName: fileData.sheetName,
            importedAt: new Date().toISOString(),
            rows: fileData.rows,
            imageDataByTarget: fileData.imageDataByTarget || {},
            salesPeriod: fileData.salesPeriod || null,
            periodMonths: fileData.periodMonths || 7,
            loading: false,
            error: "",
          };
          // 自动读取销售时间段
          if (fileData.salesPeriod) {
            state.salesPeriod = fileData.salesPeriod;
          }
        } else if (key === "salesTrend") {
          const fileData = await parseSalesTrendRowsFromFile(file);
          state.sources[key] = {
            ...createEmptySourceState(cfg),
            key,
            label: cfg.label,
            fileName: file.name,
            sheetName: fileData.sheetName,
            importedAt: new Date().toISOString(),
            rows: fileData.rows,
            loading: false,
            error: "",
          };
          state.salesTrendFilters = {
            store: "",
            category: "",
            search: "",
            sort: "total",
            startDate: "",
            endDate: "",
            hiddenKeys: [],
            granularity: "daily",
            showTrendLine: false,
            trendMethod: "linear",
            showHidden: false,
          };
        } else {
          const fileData = await readRowsFromFile(file, cfg.preferredSheets);
          const parsed = cfg.parser(fileData.rows);
          state.sources[key] = {
            ...createEmptySourceState(cfg),
            key,
            label: cfg.label,
            fileName: file.name,
            sheetName: fileData.sheetName,
            importedAt: new Date().toISOString(),
            rows: parsed,
            loading: false,
            error: "",
          };
        }
      } catch (error) {
        state.sources[key] = {
          ...state.sources[key],
          loading: false,
          error: error && error.message ? error.message : "文件解析失败",
        };
      }

      // 如果是销售数据上传，自动更新销售时间段
      if (key === "channelSales" || key === "storeSales") {
        const periodFromData = getSalesPeriodFromData(state.sources);
        if (periodFromData) {
          state.salesPeriod = periodFromData;
        }
      }

      // 门店单品季节分析文件上传后：重置筛选
      if (key === "salesTrend") {
        state.salesTrendFilters.store = "";
        state.salesTrendFilters.search = "";
        state.salesTrendFilters.sort = "total";
      }

      if (!skipFinalRender) render();
    }

    async function handleBatchUpload(files) {
      const list = Array.from(files || []).filter(Boolean);
      if (!list.length) return;

      const unmatched = [];
      let matchedCount = 0;
      for (const file of list) {
        const key = inferSourceKeyFromFileName(file.name);
        if (!key) {
          unmatched.push(file.name);
          continue;
        }
        matchedCount += 1;
        await handleUpload(key, file, { skipInitialRender: true, skipFinalRender: true });
      }

      render();

      if (unmatched.length) {
        const message = `已导入 ${matchedCount} 个文件，以下文件暂时没识别出类型：${unmatched.join("、")}`;
        setBatchNote(message);
      } else {
        setBatchNote(`已批量导入 ${matchedCount} 个文件。`);
      }
    }

    function clearSource(key) {
      const cfg = SOURCE_CONFIGS.find((item) => item.key === key);
      state.sources[key] = createEmptySourceState(cfg);
      setBatchNote("");
      render();
    }

    function clearAll() {
      SOURCE_CONFIGS.forEach((cfg) => {
        state.sources[cfg.key] = createEmptySourceState(cfg);
      });
      state.activeTab = "cockpit";
      state.cockpitSubtab = "overview";
      state.matrixFocusKey = "";
      state.matrixExpandedCells = {};
      state.matrixFilters = { category: "全部", isRegularPrice: "全部", productionNote: "全部", kpiFilter: "all" };
      state.salesTrendFilters = {
        store: "",
        category: "",
        search: "",
        sort: "total",
        startDate: "",
        endDate: "",
        hiddenKeys: [],
        granularity: "daily",
        showTrendLine: false,
        trendMethod: "linear",
        showHidden: false,
      };
      setBatchNote("");
      render();
    }

    // 模式切换事件
    document.getElementById("mode-switch").addEventListener("click", (event) => {
      const btn = event.target.closest(".mode-btn");
      if (!btn) return;
      const mode = btn.dataset.mode;
      if (mode === state.activeTab) return;
      state.activeTab = mode;
      render();
    });

    document.getElementById("clear-all").addEventListener("click", clearAll);
    document.getElementById("batch-upload").addEventListener("click", () => {
      document.getElementById("batch-input")?.click();
    });
    document.getElementById("batch-input").addEventListener("change", async (event) => {
      const files = event.target.files || [];
      if (!files.length) return;
      await handleBatchUpload(files);
      event.target.value = "";
    });

    restoreAppState();
    ensureActiveModeVisible();
    bindModeSettingsEvents();

    // 全局错误处理
    window.addEventListener('error', (e) => {
      console.error('全局错误:', e.error);
      alert('页面加载出错: ' + (e.error?.message || '未知错误'));
    });

    try {
      render();
    } catch (err) {
      console.error('渲染失败:', err);
      alert('页面渲染失败: ' + err.message);
    }

  </script>
</body>
</html>
