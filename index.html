<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>黑爪商品驾驶舱 v2.1</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="theme.css">
  <style>
    :root {
      --panel: var(--surface);
      --panel-strong: var(--surface);
      --ink: var(--text);
      --muted: var(--text-muted);
      --line: var(--border);
      --warn: var(--warning-text);
      --warn-soft: var(--warning-soft);
      --danger: var(--danger-text);
      --danger-soft: var(--danger-soft);
      --good: var(--positive-text);
      --good-soft: var(--positive-soft);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(9, 105, 218, 0.08), transparent 34%),
        linear-gradient(180deg, rgba(9, 105, 218, 0.05), rgba(9, 105, 218, 0) 180px),
        var(--bg);
    }

    .shell {
      max-width: 1600px;
      margin: 0 auto;
      padding: 28px 24px 36px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .topbar-left {
      flex: 1;
      min-width: 300px;
    }

    .topbar-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 8px 0 0;
      max-width: 1040px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 13px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .mode-switch {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2px;
      max-width: min(100vw - 48px, 1220px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 4px;
      box-shadow: 0 2px 8px rgba(31, 41, 55, 0.06);
    }

    .mode-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 13px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      transition: all .2s ease;
      white-space: nowrap;
    }

    .mode-btn .mode-icon {
      width: 15px;
      height: 15px;
      flex: none;
      color: var(--mode-color, var(--accent));
    }

    .mode-btn:hover {
      color: var(--mode-color, var(--accent));
    }

    .mode-btn.active {
      background: var(--mode-color, var(--accent));
      color: #fff;
      box-shadow: 0 2px 10px rgba(31, 41, 55, 0.24);
    }

    .mode-btn.active .mode-icon {
      color: #fff;
    }

    .mode-customize-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
      margin-left: 2px;
      border: none;
      border-left: 1px solid var(--line);
      border-radius: 0 999px 999px 0;
      background: transparent;
      color: var(--muted);
    }

    .mode-customize-btn .mode-icon {
      width: 17px;
      height: 17px;
    }

    .mode-customize-btn:hover {
      color: var(--accent);
      background: rgba(9, 105, 218, 0.08);
      border-color: var(--line);
      transform: none;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      min-width: 220px;
    }

    button, input, select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-strong);
      color: var(--ink);
      padding: 10px 14px;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: #B7C4D6;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.ghost {
      background: transparent;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .64);
      border: 1px solid rgba(223, 229, 238, .92);
      color: var(--muted);
      font-size: 12px;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .panel,
    .source-card,
    .empty-state,
    .status-item {
      background: var(--panel);
      border: 1px solid rgba(223, 229, 238, .9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .sidebar {
      position: sticky;
      top: 20px;
      padding: 0;
      display: grid;
      gap: 0;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .sidebar-toggle-bar {
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
    }

    .sidebar-toggle-btn {
      font-size: 13px;
      padding: 4px 12px;
      cursor: pointer;
    }

    .sidebar-body {
      padding: 18px;
      display: grid;
      gap: 18px;
    }

    .sidebar.collapsed {
      display: none;
    }

    .layout.sidebar-hidden {
      grid-template-columns: 1fr;
    }

    .restore-sidebar-btn {
      font-size: 13px;
      padding: 6px 14px;
      cursor: pointer;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .source-grid {
      display: grid;
      gap: 12px;
    }

    .source-card {
      padding: 14px;
      display: grid;
      gap: 12px;
      background: rgba(255, 255, 255, .64);
    }

    .source-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .source-head strong {
      display: block;
      font-size: 15px;
      margin-bottom: 3px;
    }

    .source-meta {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .link-to-matrix {
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer;
    }

    .link-to-matrix:hover {
      color: #0757B5;
    }

    .source-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .source-actions button {
      padding: 8px 12px;
      font-size: 12px;
    }

    .note,
    .hint,
    .footer-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .error-text {
      color: var(--danger);
      background: var(--danger-soft);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.5;
    }

    .status-grid {
      display: grid;
      gap: 10px;
    }

    .status-item {
      padding: 10px 12px;
      background: rgba(255, 255, 255, .58);
    }

    .status-item strong {
      display: block;
      margin-top: 6px;
      font-size: 18px;
    }

    .main {
      display: grid;
      gap: 16px;
    }

    .view-section {
      display: grid;
      gap: 16px;
    }

    .empty-state {
      padding: 24px;
      min-height: 280px;
      display: grid;
      align-content: center;
      gap: 14px;
    }

    .empty-state h2 {
      margin: 0;
      font-size: 20px;
    }

    .empty-state p {
      margin: 0;
      max-width: 820px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }

    /* 门店SKU排名看板：iframe 嵌入独立页面 */
    .sku-rank-panel {
      padding: 0;
      overflow: hidden;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .sku-rank-panel iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 130px);
      min-height: 560px;
      border: 0;
      border-radius: var(--radius);
      background: #f5f7fa;
    }

    .kpi {
      padding: 18px;
      min-height: 118px;
    }

    .kpi small {
      display: block;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .kpi strong {
      display: block;
      font-size: 30px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .kpi p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 13px;
    }

    .kpi.good { background: linear-gradient(180deg, rgba(76, 122, 31, .08), rgba(76, 122, 31, 0)); }
    .kpi.warn { background: linear-gradient(180deg, rgba(217, 119, 6, .08), rgba(217, 119, 6, 0)); }
    .kpi.danger { background: linear-gradient(180deg, rgba(185, 35, 24, .08), rgba(185, 35, 24, 0)); }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px;
      border-bottom: 1px solid rgba(223, 229, 238, .85);
      background: rgba(255, 255, 255, .36);
    }

    .tabs .tab-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      align-self: center;
      margin-right: 4px;
    }

    .tab {
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
    }

    .tab.active {
      background: var(--accent-soft);
      border-color: rgba(9, 105, 218, .22);
      color: var(--accent);
      font-weight: 700;
    }

    .tab-content {
      padding: 16px;
      display: grid;
      gap: 16px;
    }

    .block {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .block-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .block-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .table-wrap {
      max-height: 620px;
      overflow: auto;
      border-radius: 8px;
      border: 1px solid rgba(223, 229, 238, .72);
      background: rgba(255, 255, 255, .55);
    }

    .table-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 0 2px;
    }

    .table-toolbar .hint {
      margin: 0;
    }

    .pager {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pager select {
      height: 32px;
      border-radius: 999px;
      border: 1px solid rgba(223, 229, 238, .92);
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      font: inherit;
    }

    .pager .page-info {
      color: var(--muted);
      font-size: 12px;
    }

    .pager button.sort-active {
      border-color: rgba(9, 105, 218, .35);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .pager button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    th.sortable {
      cursor: pointer;
      user-select: none;
    }

    th.sortable:hover {
      background: rgba(9, 105, 218, .06);
    }

    .sort-arrow {
      color: var(--accent);
      margin-left: 4px;
      font-size: 11px;
    }

    th.resizable {
      position: relative;
      padding-right: 20px;
    }

    .column-resizer {
      position: absolute;
      top: 0;
      right: 0;
      width: 12px;
      height: 100%;
      cursor: col-resize;
      touch-action: none;
    }

    .column-resizer::after {
      content: "";
      position: absolute;
      top: 18%;
      right: 5px;
      width: 2px;
      height: 64%;
      border-radius: 999px;
      background: rgba(9, 105, 218, .18);
    }

    .column-resizer:hover::after,
    .column-resizer.is-dragging::after {
      background: rgba(9, 105, 218, .52);
    }

    .cell-clip {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .table-tooltip {
      position: fixed;
      z-index: 2000;
      max-width: 320px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(18, 24, 22, .94);
      color: #fff;
      font-size: 12px;
      line-height: 1.45;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .18);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .12s ease, transform .12s ease;
    }

    .table-tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
    }

    th,
    td {
      border-bottom: 1px solid rgba(223, 229, 238, .72);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, .92);
      color: var(--muted);
      font-size: 12px;
      z-index: 1;
    }

    tr:last-child td { border-bottom: 0; }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.good { color: var(--good); background: var(--good-soft); }
    .badge.warn { color: var(--warn); background: var(--warn-soft); }
    .badge.danger { color: var(--danger); background: var(--danger-soft); }
    .badge.neutral { color: #3D4757; background: #EAEFF6; }
    .badge.busy { color: #0B4A94; background: #EAF2FC; }

    .empty-table {
      padding: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .soft-card {
      border: 1px solid rgba(223, 229, 238, .72);
      border-radius: 8px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, .6);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .matrix-panel {
      display: grid;
      gap: 16px;
      padding: 18px;
      border: 1px solid rgba(9, 105, 218, .12);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .82), rgba(255, 255, 255, .72)),
        radial-gradient(circle at top right, rgba(9, 105, 218, .06), transparent 28%);
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    .matrix-panel.fullscreen {
      position: fixed;
      inset: 0;
      z-index: 2000;
      max-width: 100vw;
      max-height: 100vh;
      overflow: auto;
      border-radius: 0;
    }

    .matrix-panel.fullscreen .matrix-grid {
      grid-template-columns: 100px repeat(3, 1fr);
    }

    .matrix-panel.fullscreen .matrix-cell {
      min-height: calc((100vh - 200px) / 3);
    }

    .matrix-toolbar {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .matrix-toolbar label {
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .matrix-toolbar input,
    .matrix-toolbar select {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 10px;
      background: #fff;
      color: var(--ink);
    }

    .matrix-kpis {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
    }

    .matrix-mini {
      padding: 14px;
      border: 1px solid rgba(223, 229, 238, .8);
      border-radius: 10px;
      background: rgba(255, 255, 255, .7);
      transition: all 0.2s ease;
    }
    .matrix-mini:hover {
      background: rgba(255, 255, 255, .9);
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(9, 105, 218, 0.15);
    }
    .matrix-mini.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .matrix-mini strong {
      display: block;
      font-size: 22px;
      margin-top: 4px;
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: 88px repeat(3, minmax(0, 1fr));
      gap: 12px;
      align-items: stretch;
    }

    .matrix-axis-y {
      display: grid;
      grid-template-rows: repeat(3, minmax(180px, 1fr));
      gap: 10px;
    }

    .matrix-axis-label {
      display: grid;
      align-content: center;
      justify-items: center;
      text-align: center;
      font-weight: 700;
      border-radius: 12px;
      border: 1px solid rgba(223, 229, 238, .8);
      background: rgba(255, 255, 255, .58);
      color: var(--ink);
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 0;
      min-height: 100%;
    }

    .matrix-col-head,
    .matrix-row-head {
      display: grid;
      place-items: center;
      min-height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(223, 229, 238, .8);
      background: rgba(255, 255, 255, .8);
      font-weight: 700;
      color: var(--ink);
    }

    .matrix-row-head {
      writing-mode: horizontal-tb;
      text-orientation: mixed;
      min-height: 100%;
      border-style: dashed;
    }

    .matrix-cells {
      display: grid;
      gap: 10px;
    }

    .matrix-cell {
      border: 1px solid rgba(223, 229, 238, .86);
      border-radius: 14px;
      background: rgba(255, 255, 255, .72);
      padding: 14px;
      aspect-ratio: 1 / 1;
      min-height: 0;
      display: grid;
      gap: 12px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .matrix-cell::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, rgba(9, 105, 218, .7), rgba(9, 105, 218, .08));
    }

    .matrix-cell.good { background: linear-gradient(180deg, rgba(76, 122, 31, .08), rgba(255,255,255,.82)); }
    .matrix-cell.warn { background: linear-gradient(180deg, rgba(217, 119, 6, .08), rgba(255,255,255,.82)); }
    .matrix-cell.danger { background: linear-gradient(180deg, rgba(185, 35, 24, .08), rgba(255,255,255,.82)); }

    /* 联动总表跳回九宫格时的高亮效果 */
    .matrix-cell.cell-flash {
      animation: cell-flash-anim 2s ease-out;
    }
    @keyframes cell-flash-anim {
      0%   { box-shadow: 0 0 0 4px rgba(9, 105, 218, .9), 0 0 24px rgba(9, 105, 218, .6); }
      100% { box-shadow: var(--shadow); }
    }
    .sku-chip.chip-flash {
      animation: chip-flash-anim 2s ease-out;
    }
    @keyframes chip-flash-anim {
      0%   { box-shadow: 0 0 0 3px rgba(9, 105, 218, .9); transform: scale(1.15); }
      100% { box-shadow: none; transform: scale(1); }
    }

    .matrix-cell-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .matrix-cell-head h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.3;
    }

    .matrix-cell-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .sku-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      align-items: start;
    }

    .sku-chip {
      display: grid;
      gap: 4px;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid rgba(223, 229, 238, .8);
      background: rgba(255, 255, 255, .84);
      cursor: pointer;
      text-align: left;
    }

    .sku-chip:hover {
      border-color: rgba(9, 105, 218, .35);
      transform: translateY(-1px);
    }

    .sku-thumb {
      width: 100%;
      aspect-ratio: 1 / 1; /* 正方形 */
      border-radius: 10px;
      overflow: hidden;
      background: #EEF3FA;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      border: 3px solid #333; /* 默认黑色边框 */
      box-sizing: border-box;
    }

    .sku-thumb.production-normal {
      border-color: #28a745; /* 正常 - 绿色 */
    }

    .sku-thumb.production-stopped {
      border-color: #dc3545; /* 停产 - 红色 */
    }

    .sku-thumb.production-other {
      border-color: #ffc107; /* 其他 - 黄色 */
    }

    .sku-thumb img {
      max-width: 90%; /* 缩小图片宽度，留边距 */

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    const PREVIEW_LIMIT = 120;

    const APP_CACHE_KEY = "toolsGoods.dashboardCache.v1";
    const SOURCE_CONFIGS = [
      {
        key: "matrixWorkbook",
        label: "九宫格文件",
        hint: "商品资料 + 销存数据，一张表直接生成九宫格",

      {
        key: "product",
        label: "商品资料",
        hint: "图片 / 品名 / 规格 / 条码 / 分类 / 是否正价 / 零售价",

        parser: parseProductRows,
      },
      {
        key: "inventorySales",
        label: "销存数据",
        hint: "销售数量 / 即时库存 / 库存保质期",

      {
        key: "warehouse",
        label: "仓库库存和保质期",
        hint: "仓库-商品-数量-保质期-生产日期-到期日期",
        preferredSheets: ["sheetTitle"],
        parser: parseWarehouseRows,
      },
      {
        key: "storeInventory",
        label: "门店库存",
        hint: "门店-商品-数量-保质期-生产日期-到期日期",
        preferredSheets: ["商品库存"],
        parser: parseStoreInventoryRows,
      },
      {
        key: "channelSales",
        label: "渠道销售",
        hint: "线上 / 批发 / 经销商",
        preferredSheets: ["近30天销售出库"],
        parser: parseChannelSalesRows,
      },
      {
        key: "storeSales",
        label: "门店销售",
        hint: "自营门店销售",
        preferredSheets: ["近30天店铺销售"],
        parser: parseStoreSalesRows,
      },
      {
        key: "salesTrend",
        label: "门店单品季节分析",
        hint: "门店销售明细（店铺销售），按单品对比春夏 / 秋冬日均销量",
        preferredSheets: ["店铺销售"],
        parser: parseStoreSalesTrendRows,
      },
    ];

const TABS = [
  { id: "cockpit", label: "驾驶舱" },
  { id: "matrix", label: "九宫格 SKU" },
];

const COCKPIT_SUBTABS = [
  { id: "overview", label: "总览" },
  { id: "product", label: "商品资料" },
  { id: "warehouse", label: "仓库库存" },
  { id: "storeInventory", label: "门店库存" },
  { id: "channelSales", label: "渠道销售" },
  { id: "storeSales", label: "门店销售" },
  { id: "replenishment", label: "补货预警" },
  { id: "slowmoving", label: "滞销预警" },
  { id: "expiry", label: "保质期预警" },
  { id: "linked", label: "联动总表" },
];

    const state = {
      activeTab: "cockpit",
      cockpitSubtab: "overview",
      sources: Object.fromEntries(SOURCE_CONFIGS.map((cfg) => [cfg.key, createEmptySourceState(cfg)])),
      tableState: {},
      matrixFocusKey: "",
      matrixScrollTarget: "", // "table" = scroll to linked table row, "grid" = scroll to matrix grid
      sidebarCollapsed: false, // 侧边栏是否折叠
      matrixFilters: {
        category: "全部",
        isRegularPrice: "全部",
        productionNote: "全部", // 全部 / 正常生产 / 停产 / 待定 / 其他 / 未设置
        kpiFilter: "all", // all, digest2, digest3, digest4, digest5, digest6
      },
      salesPeriod: getDefaultSalesPeriod(),
matrixExpandedCells: {}, // 记录哪些格子展开
matrixItemsPerCell: 4, // 每个格子显示商品数量
matrixBigCell: null, // 当前展开的大宫格 {cellKey, cellData}
      matrixHistory: {}, // 商品九宫格位置历史 {key: {nodeLabel: position}}
      matrixHistoryNodes: [], // 所有历史时间节点标签列表
      historyCompareNodes: ["", "", ""], // 用户选择对比的三个时间节点
      salesTrendFilters: {
        store: "", // 门店筛选，空=全部门店合计
        category: "", // 品类筛选（商品类目），空=全部品类
        search: "", // 商品名称搜索
        sort: "total", // total=总销量, springDaily=春夏日均, autumnDaily=秋冬日均, diff=差异度
        startDate: "", // 时间区间起，空=数据最早日期
        endDate: "", // 时间区间止，空=数据最晚日期
        hiddenKeys: [], // 已隐藏单品的 nameKey 列表
        granularity: "daily", // 趋势图粒度 daily / monthly
        showTrendLine: false, // 趋势图趋势线
        trendMethod: "linear", // linear / ma
        showHidden: false, // 是否处于「已隐藏」视图（仅内存态）
      },
      kttImportData: [], // 快团团导入解析结果 [{importNo, name, phone, address, csNote, productName, qty}]
    };

    const columnResizeState = {
      active: null,
      rafId: 0,
      pendingWidth: null,
    };

    const modelCache = {
      signature: "",
      model: null,
    };

    const tooltipState = {
      el: null,
    };

    function createEmptySourceState(cfg) {
      return {
        key: cfg.key,
        label: cfg.label,
        fileName: "",
        sheetName: "",
        importedAt: "",
        rows: [],
        imageDataByTarget: {},
        error: "",
        loading: false,
      };
    }

    function cloneSourceForCache(source) {
      return {
        key: source.key,
        label: source.label,
        fileName: source.fileName,
        sheetName: source.sheetName,
        importedAt: source.importedAt,
        rows: Array.isArray(source.rows)
          ? source.rows.map((row) => {
              if (source.key !== "matrixWorkbook") return row;
              const { imageDataByTarget, imageUrl, ...safeRow } = row || {};
              return safeRow;
            })
          : [],
        error: source.error,
      };
    }

    function cacheAppState() {
      try {
        const payload = {
          version: 1,
          activeTab: state.activeTab,
          cockpitSubtab: state.cockpitSubtab,
          tableState: state.tableState,
matrixFocusKey: state.matrixFocusKey,
matrixFilters: state.matrixFilters,
salesPeriod: state.salesPeriod,
sidebarCollapsed: state.sidebarCollapsed,
matrixHistory: state.matrixHistory,
matrixHistoryNodes: state.matrixHistoryNodes,
historyCompareNodes: state.historyCompareNodes,
salesTrendFilters: state.salesTrendFilters,
sources: Object.fromEntries(
            Object.entries(state.sources).map(([key, source]) => [key, cloneSourceForCache(source)])
          ),
        };
        localStorage.setItem(APP_CACHE_KEY, JSON.stringify(payload));
      } catch {
        // local cache is best-effort
      }
    }

    function restoreAppState() {
      try {
        const raw = localStorage.getItem(APP_CACHE_KEY);
        if (!raw) return;
        const payload = JSON.parse(raw);
        if (payload && payload.sources) {
          for (const cfg of SOURCE_CONFIGS) {
            const saved = payload.sources[cfg.key];
            if (!saved || !Array.isArray(saved.rows)) continue;
              state.sources[cfg.key] = {
                ...createEmptySourceState(cfg),
                ...saved,
                key: cfg.key,
                label: cfg.label,
                imageDataByTarget: saved.imageDataByTarget || {},
                loading: false,
              };
            }
          }
        if (payload && payload.tableState && typeof payload.tableState === "object") {
          state.tableState = payload.tableState;
        }
        if (payload && payload.matrixFocusKey) {
          state.matrixFocusKey = payload.matrixFocusKey;
        }
        if (payload && payload.matrixFilters && typeof payload.matrixFilters === "object") {
          state.matrixFilters = {
            ...state.matrixFilters,
            ...payload.matrixFilters,
          };
        }
        if (payload && payload.salesPeriod && typeof payload.salesPeriod === "object") {
          state.salesPeriod = {
            ...state.salesPeriod,
            ...payload.salesPeriod,
          };
        }
        if (payload && payload.matrixHistory && typeof payload.matrixHistory === "object") {
          state.matrixHistory = payload.matrixHistory;
        }
        if (payload && Array.isArray(payload.matrixHistoryNodes)) {
          state.matrixHistoryNodes = payload.matrixHistoryNodes;
        }
        if (payload && Array.isArray(payload.historyCompareNodes)) {
          state.historyCompareNodes = payload.historyCompareNodes;
        }
        if (payload && payload.salesTrendFilters && typeof payload.salesTrendFilters === "object") {
          const savedFilters = payload.salesTrendFilters;
          const isoDatePattern = /^\d{4}-\d{2}-\d{2}$/;
          state.salesTrendFilters = {
            store: typeof savedFilters.store === "string" ? savedFilters.store : "",
            category: typeof savedFilters.category === "string" ? savedFilters.category : "",
            search: typeof savedFilters.search === "string" ? savedFilters.search : "",
            sort: ["total", "springDaily", "autumnDaily", "diff"].indexOf(savedFilters.sort) !== -1 ? savedFilters.sort : "total",
            startDate: typeof savedFilters.startDate === "string" && isoDatePattern.test(savedFilters.startDate) ? savedFilters.startDate : "",
            endDate: typeof savedFilters.endDate === "string" && isoDatePattern.test(savedFilters.endDate) ? savedFilters.endDate : "",
            hiddenKeys: Array.isArray(savedFilters.hiddenKeys) ? savedFilters.hiddenKeys.filter((key) => typeof key === "string") : [],
            granularity: savedFilters.granularity === "monthly" ? "monthly" : "daily",
            showTrendLine: !!savedFilters.showTrendLine,
            trendMethod: savedFilters.trendMethod === "ma" ? "ma" : "linear",
            showHidden: false,
          };
        }
        if (payload && payload.activeTab) {
          state.activeTab = payload.activeTab;
        }
        if (payload && payload.cockpitSubtab) {
          state.cockpitSubtab = payload.cockpitSubtab;
        }
        if (payload && typeof payload.sidebarCollapsed === "boolean") {
          state.sidebarCollapsed = payload.sidebarCollapsed;
        }
      } catch {
        // ignore corrupted cache
      }
    }

    function setBatchNote(text = "") {
      const current = document.getElementById("batch-note");
      if (current) current.textContent = text;
    }

    function normalizeText(value) {
      return String(value ?? "")
        .trim()
        .replace(/\s+/g, "")
        .replace(/[()（）【】\[\]\/\\,，。:：;；._-]/g, "")
        .toLowerCase();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // 缩短香水名称，省略 BLACK PAW 黑爪
    function shortenProductName(name) {
      if (!name) return name;
      return String(name)
        .replace(/BLACK\s*PAW\s*黑爪/gi, "")
        .replace(/\d{6,}/g, "") // 移除6位以上的数字（条码）
        .replace(/^\s+|\s+$/g, "")
        .replace(/\s+/g, " "); // 合并多个空格
    }

    function formatNumber(value) {
      if (value === null || value === undefined || value === "") return "-";
      return new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 2 }).format(Number(value));
    }

    function formatInteger(value) {
      if (value === null || value === undefined || value === "") return "-";
      return new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 0 }).format(Math.round(Number(value)));
    }

    // 趋势线数值格式化：保留一位小数（避免 0.x 被取整为 0）
    function formatTrendFloat(value) {
      if (value === null || value === undefined || value === "") return "-";
      return new Intl.NumberFormat("zh-CN", { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(Number(value));
    }

    function formatCurrency(value) {
      if (value === null || value === undefined || value === "") return "-";
      return "¥" + new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 2 }).format(Number(value));
    }

    function stripHtmlTags(value) {
      return String(value ?? "")
        .replace(/<[^>]*>/g, " ")
        .replace(/&nbsp;/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function formatDateValue(value) {
      if (!value) return "";
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        return value.toISOString().slice(0, 10);
      }
      if (typeof value === "number" && value > 20000 && value < 70000) {
        const base = new Date(Date.UTC(1899, 11, 30));
        base.setUTCDate(base.getUTCDate() + value);
        return base.toISOString().slice(0, 10);
      }
      const text = String(value).trim();
      const match = text.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
      if (match) {
        const [, y, m, d] = match;
        return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      }
      return text;
    }

    function formatDateInputValue(value) {
      if (!value) return "";
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        const offset = value.getTimezoneOffset() * 60000;
        return new Date(value.getTime() - offset).toISOString().slice(0, 10);
      }
      const text = String(value).trim();
      if (!text) return "";
      const match = text.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
      if (match) {
        const [, y, m, d] = match;
        return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      }
      return "";
    }

    function getDefaultSalesPeriod() {
      const end = new Date();
      const start = new Date(end.getFullYear(), 0, 1);
      return {
        start: formatDateInputValue(start),
        end: formatDateInputValue(end),
      };
    }

    // 从销售数据中自动读取时间范围
    function getSalesPeriodFromData(sources) {
      const dates = [];

      // 从渠道销售数据读取时间
      if (sources.channelSales && sources.channelSales.rows) {
        sources.channelSales.rows.forEach(row => {
          if (row.time) {
            const date = new Date(row.time);
            if (!Number.isNaN(date.getTime())) {
              dates.push(date);
            }
          }
        });
      }

      // 从门店销售数据读取时间（需要添加时间字段）
      if (sources.storeSales && sources.storeSales.rows) {
        sources.storeSales.rows.forEach(row => {
          if (row.time) {
            const date = new Date(row.time);
            if (!Number.isNaN(date.getTime())) {
              dates.push(date);
            }
          }
        });
      }

      if (dates.length === 0) return null;

      // 找出最早和最晚的日期
      const minDate = new Date(Math.min(...dates.map(d => d.getTime())));
      const maxDate = new Date(Math.max(...dates.map(d => d.getTime())));

      return {
        start: formatDateInputValue(minDate),
        end: formatDateInputValue(maxDate),
      };
    }

    function parseYesNo(value) {
      const text = normalizeText(value);
      if (!text) return "";
      if (["是", "yes", "y", "true", "1", "正价", "在售"].some((item) => text === normalizeText(item) || text.includes(normalizeText(item)))) {
        return "是";
      }
      if (["否", "no", "n", "false", "0", "非正价", "促销"].some((item) => text === normalizeText(item) || text.includes(normalizeText(item)))) {
        return "否";
      }
      return String(value).trim();
    }

    function formatDateTime(value) {
      if (!value) return "未上传";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "未上传";
      return date.toLocaleString("zh-CN", { hour12: false });
    }

    function daysUntil(dateText) {
      if (!dateText) return null;
      const date = new Date(dateText);
      if (Number.isNaN(date.getTime())) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      date.setHours(0, 0, 0, 0);
      return Math.round((date - today) / 86400000);
    }

    function parseNumber(value, fallback = 0) {
      if (value === null || value === undefined || value === "") return fallback;
      const text = String(value).replace(/,/g, "").trim();
      const match = text.match(/-?\d+(?:\.\d+)?/);
      if (!match) return fallback;
      const num = Number(match[0]);
      return Number.isFinite(num) ? num : fallback;
    }

    function maybeNumber(value) {
      if (value === null || value === undefined || value === "") return null;
      const text = String(value).replace(/,/g, "").trim();
      const match = text.match(/-?\d+(?:\.\d+)?/);
      if (!match) return null;
      const num = Number(match[0]);
      return Number.isFinite(num) ? num : null;
    }

    function firstNonEmpty(...values) {
      for (const value of values) {
        if (value !== null && value !== undefined && String(value).trim() !== "") {
          return value;
        }
      }
      return "";
    }

    function isAggregateLabel(value) {
      const text = normalizeText(value);
      if (!text) return false;
      return ["总计", "合计", "小计", "汇总", "总合计"].some((label) => text.startsWith(normalizeText(label)));
    }

    function safeDivide(numerator, denominator) {
      if (!denominator) return null;
      return numerator / denominator;
    }

    function toFixedNumber(value, digits = 1) {
      if (value === null || value === undefined || Number.isNaN(value)) return null;
      return Number(Number(value).toFixed(digits));
    }

    function latestDate(existing, candidate) {
      if (!candidate) return existing || "";
      if (!existing) return candidate;
      const existingDate = new Date(existing);
      const candidateDate = new Date(candidate);
      if (Number.isNaN(existingDate.getTime())) return candidate;
      if (Number.isNaN(candidateDate.getTime())) return existing;
      return candidateDate > existingDate ? candidate : existing;
    }

    function riskBadgeType(level) {
      if (level === "danger") return "danger";
      if (level === "warn") return "warn";
      if (level === "neutral") return "neutral";
      return "good";
    }

    function getTableState(tabId) {
      if (!state.tableState[tabId]) {
        state.tableState[tabId] = {
          page: 1,
          pageSize: 20,
          sortKey: "",
          sortDir: "desc",
          columnWidths: {},
        };
      }
      return state.tableState[tabId];
    }

    function updateTableState(tabId, patch) {
      state.tableState[tabId] = {
        ...getTableState(tabId),
        ...patch,
      };
    }

    function getColumnKey(col) {
      return col.key || col.label;
    }

    function isProductNameColumn(col) {
      if (col.key === "productName") return true;
      return typeof col.render === "function" && String(col.render).includes("row.productName");
    }

    function getResizableColumnKey(col) {
      return isProductNameColumn(col) ? "productName" : getColumnKey(col);
    }

    function updateColumnWidth(tabId, columnKey, width) {
      const current = getTableState(tabId);
      state.tableState[tabId] = {
        ...current,
        columnWidths: {
          ...(current.columnWidths || {}),
          [columnKey]: width,
        },
      };
    }

    function ensureTableTooltip() {
      if (tooltipState.el) return tooltipState.el;
      const el = document.createElement("div");
      el.className = "table-tooltip";
      el.setAttribute("role", "tooltip");
      document.body.appendChild(el);
      tooltipState.el = el;
      return el;
    }

    function showTableTooltip(text, x, y) {
      if (!text) return hideTableTooltip();
      const el = ensureTableTooltip();
      el.textContent = text;
      el.classList.add("visible");
      const offset = 14;
      const rect = el.getBoundingClientRect();
      let left = x + offset;
      let top = y + offset;
      if (left + rect.width + 16 > window.innerWidth) {
        left = Math.max(12, x - rect.width - offset);
      }
      if (top + rect.height + 16 > window.innerHeight) {
        top = Math.max(12, y - rect.height - offset);
      }
      el.style.left = `${left}px`;
      el.style.top = `${top}px`;
    }

    function hideTableTooltip() {
      if (!tooltipState.el) return;
      tooltipState.el.classList.remove("visible");
    }

    function parseComparable(value) {
      if (typeof value === "number" && Number.isFinite(value)) {
        return { kind: "number", value };
      }
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        return { kind: "number", value: value.getTime() };
      }
      if (typeof value === "string") {
        const text = value.replace(/,/g, "").trim();
        if (!text) return { kind: "string", value: "" };
        const dateLike = text.match(/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/);
        if (dateLike) {
          const date = new Date(text);
          if (!Number.isNaN(date.getTime())) {
            return { kind: "number", value: date.getTime() };
          }
        }
        const numberLike = text.match(/^[-+]?\d+(?:\.\d+)?/);
        if (numberLike) {
          return { kind: "number", value: Number(numberLike[0]) };
        }
        return { kind: "string", value: text };
      }
      if (value === null || value === undefined) {
        return { kind: "string", value: "" };
      }
      return { kind: "string", value: String(value) };
    }

    function inferSourceKeyFromFileName(fileName) {
      const text = normalizeText(fileName);
      const rules = [
        ["salesTrend", ["每日销量", "销量趋势", "销售趋势", "线上线下销量", "每日销售", "线上线下一周", "趋势"]],
        ["storeSales", ["门店销售", "自营门店销售", "门店销售数据"]],
        ["channelSales", ["渠道销售", "线上销售", "批发销售", "经销商销售"]],
        ["warehouse", ["仓库库存和保质期", "仓库库存", "保质期数据", "仓库库存数据"]],
        ["storeInventory", ["门店库存", "店铺库存", "门店库存数据"]],
        ["product", ["商品资料", "商品资料表", "商品信息", "商品主数据"]],
      ];
      for (const [key, keywords] of rules) {
        if (keywords.some((keyword) => text.includes(normalizeText(keyword)))) {
          return key;
        }
      }
      return "";
    }

    function compareValues(a, b) {
      const aNull = a === null || a === undefined || a === "";
      const bNull = b === null || b === undefined || b === "";
      if (aNull && bNull) return 0;
      if (aNull) return 1;
      if (bNull) return -1;
      const normalizedA = parseComparable(a);
      const normalizedB = parseComparable(b);
      if (normalizedA.kind === "number" && normalizedB.kind === "number") {
        return normalizedA.value - normalizedB.value;
      }
      if (normalizedA.kind === "number") return -1;
      if (normalizedB.kind === "number") return 1;
      if (normalizedA.kind === "string" && normalizedB.kind === "string") {
        return normalizedA.value.localeCompare(normalizedB.value, "zh-CN");
      }
      return String(a).localeCompare(String(b), "zh-CN");
    }

    function getColumnValue(row, col) {
      if (typeof col.sortValue === "function") return col.sortValue(row);
      if (isProductNameColumn(col)) return row.productName || "";
      const value = col.value ? col.value(row) : col.render(row);
      return typeof value === "string" ? stripHtmlTags(value) : value;
    }

    function applySorting(rows, columns, sortKey, sortDir) {
      if (!sortKey) return rows.slice();
      const column = columns.find((col) => getColumnKey(col) === sortKey);
      if (!column) return rows.slice();
      const dir = sortDir === "asc" ? 1 : -1;
      return rows.slice().sort((a, b) => compareValues(getColumnValue(a, column), getColumnValue(b, column)) * dir);
    }

    function keyFrom(...parts) {
      const cleaned = parts
        .map((part) => normalizeText(part))
        .filter(Boolean);
      return cleaned.join("|");
    }

    function makeBarcodeKey(row) {
      // 以条码为唯一主键
      return normalizeText(row.barcode) || keyFrom(
        row.sku,
        row.specCode,
        row.productCode,
        row.productName,
        row.spec
      );
    }

    function headerIndex(headers) {
      const map = new Map();
      (headers || []).forEach((header, index) => {
        map.set(normalizeText(header), index);
      });
      return map;
    }

    function getCell(row, map, aliases) {
      for (const alias of aliases) {
        const idx = map.get(normalizeText(alias));
        if (idx !== undefined) {
          const value = row[idx];
          if (value !== undefined && value !== null && String(value).trim() !== "") {
            return value;
          }
        }
      }
      return "";
    }

    function cleanSheetRows(rows) {
      return (rows || []).filter((row) => Array.isArray(row) && row.some((cell) => String(cell ?? "").trim() !== ""));
    }

    function getSheetRowCount(sheet) {
      if (!sheet || !sheet["!ref"]) return 0;
      try {
        const range = XLSX.utils.decode_range(sheet["!ref"]);
        return range.e.r - range.s.r + 1;
      } catch {
        return 0;
      }
    }

    function getSheetRows(sheet) {
      return cleanSheetRows(
        XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: "" })
      );
    }

    function findPreferredSheetName(sheetNames, preferredSheets) {
      const preferred = (preferredSheets || []).map(normalizeText).filter(Boolean);
      if (!preferred.length) return "";
      for (const name of sheetNames || []) {
        const normalizedName = normalizeText(name);
        if (preferred.includes(normalizedName)) return name;
        if (preferred.some((sheet) => normalizedName.includes(sheet) || sheet.includes(normalizedName))) return name;
      }
      return "";
    }

    function parseCsvText(text) {
      const rows = [];
      let current = "";
      let line = [];
      let inQuotes = false;

      const pushCell = () => {
        line.push(current);
        current = "";
      };

      const pushLine = () => {
        if (line.length) rows.push(line);
        line = [];
      };

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];
        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          pushCell();
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") i += 1;
          pushCell();
          pushLine();
        } else {
          current += char;
        }
      }

      pushCell();
      pushLine();
      return rows.filter((row) => row.some((cell) => String(cell ?? "").trim() !== ""));
    }

    async function readRowsFromFile(file, preferredSheets = []) {
      const lower = file.name.toLowerCase();
      if (lower.endsWith(".csv")) {
        const text = await file.text();
        return { sheetName: file.name, rows: parseCsvText(text) };
      }

      if (!window.XLSX) {
        throw new Error("Excel 解析库没有加载成功，请刷新页面后重试。");
      }

      const buffer = await file.arrayBuffer();
      const workbook = XLSX.read(buffer, { type: "array", cellDates: true, raw: true, cellFormula: false });
      const sheetNames = workbook.SheetNames || [];
      if (!sheetNames.length) {
        throw new Error("没有读到有效工作表。");
      }

      const preferredSheetName = findPreferredSheetName(sheetNames, preferredSheets);
      if (preferredSheetName) {
        return { sheetName: preferredSheetName, rows: getSheetRows(workbook.Sheets[preferredSheetName]) };
      }

      let chosenSheetName = "";
      let chosenSheetCount = 0;
      for (const name of sheetNames) {
        const count = getSheetRowCount(workbook.Sheets[name]);
        if (count > chosenSheetCount) {
          chosenSheetCount = count;
          chosenSheetName = name;
        }
      }
      if (!chosenSheetName || !chosenSheetCount) {
        throw new Error("没有读到有效工作表。");
      }
      return { sheetName: chosenSheetName, rows: getSheetRows(workbook.Sheets[chosenSheetName]) };
    }

    const MATRIX_IMAGE_MIME = {
      png: "image/png",
      jpg: "image/jpeg",
      jpeg: "image/jpeg",
      webp: "image/webp",
      gif: "image/gif",
      bmp: "image/bmp",
      tif: "image/tiff",
      tiff: "image/tiff",
    };

    function getSheetCell(sheet, rowNumber, colNumber) {
      const cell = sheet?.[XLSX.utils.encode_cell({ r: rowNumber - 1, c: colNumber - 1 })];
      return cell || null;
    }

    function getSheetCellValue(sheet, rowNumber, colNumber) {
      const cell = getSheetCell(sheet, rowNumber, colNumber);
      if (!cell) return "";
      const value = cell.v;
      return value === null || value === undefined ? "" : value;
    }

    function getSheetCellText(sheet, rowNumber, colNumber) {
      const value = getSheetCellValue(sheet, rowNumber, colNumber);
      return String(value ?? "").trim();
    }

    function extractDispImgId(cell) {
      const text = String(cell?.f || cell?.v || cell?.w || "").trim();
      const match = text.match(/ID_[0-9A-F]+/i);
      return match ? match[0] : "";
    }

    function getMimeFromTarget(target) {
      const ext = String(target || "").split(".").pop().toLowerCase();
      return MATRIX_IMAGE_MIME[ext] || "image/png";
    }

    function parseXmlDocument(xmlText) {
      const parser = new DOMParser();
      return parser.parseFromString(xmlText, "application/xml");
    }

    async function buildMatrixImageLookup(zip) {
      const imageIdToTarget = new Map();
      const relText = await zip.file("xl/_rels/cellimages.xml.rels")?.async("string");
      const xmlText = await zip.file("xl/cellimages.xml")?.async("string");
      if (!relText || !xmlText) return imageIdToTarget;

      const relDoc = parseXmlDocument(relText);
      const xmlDoc = parseXmlDocument(xmlText);
      const relNodes = Array.from(relDoc.getElementsByTagName("Relationship"));
      const targetByRelId = new Map(relNodes.map((node) => [node.getAttribute("Id") || "", node.getAttribute("Target") || ""]));
      const cellImages = Array.from(xmlDoc.getElementsByTagNameNS("*", "cellImage"));

      cellImages.forEach((cellImage) => {
        const cNvPr = cellImage.getElementsByTagNameNS("*", "cNvPr")[0];
        const blip = cellImage.getElementsByTagNameNS("*", "blip")[0];
        const imageId = cNvPr?.getAttribute("name") || "";
        const relId = blip?.getAttribute("r:embed") || blip?.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "embed") || "";
        const target = targetByRelId.get(relId) || "";
        if (imageId && target) {
          imageIdToTarget.set(imageId, target);
        }
      });

      return imageIdToTarget;
    }

    async function buildMatrixImageData(zip, target) {
      if (!target) return "";
      const normalizedTarget = target.startsWith("xl/") ? target : `xl/${target}`;
      const file = zip.file(normalizedTarget);
      if (!file) return "";
      const base64 = await file.async("base64");
      return `data:${getMimeFromTarget(target)};base64,${base64}`;
    }

    async function parseMatrixWorkbookRowsFromFile(file) {
      const buffer = await file.arrayBuffer();
      const zip = await JSZip.loadAsync(buffer);
      // raw:true 跳过单元格格式化，大幅提升解析速度
      const workbook = XLSX.read(buffer, { type: "array", cellDates: true, raw: true, cellFormula: false });
      const sheetName = findPreferredSheetName(workbook.SheetNames || [], ["总库存情况", "商品总览"]) || workbook.SheetNames?.[0] || "";
      if (!sheetName) {
        throw new Error("未找到总库存情况/商品总览工作表");
      }

      const sheet = workbook.Sheets[sheetName];
      if (!sheet || !sheet["!ref"]) {
        throw new Error("九宫格文件没有可读取的数据");
      }

      const imageLookup = await buildMatrixImageLookup(zip);

      // 一次性将工作表转为二维数组，避免逐单元格 encode_cell 调用
      const sheetRows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: "" });
      const imageTargets = new Map();
      const rows = [];

      // 销售时间段识别：扫描第1行找日期单元格（0926版在E1，1018版在F1）
      // 终点取识别到的日期，起点取终点当年的1月1日（对应「今年日销系数」口径）
      // 第1行无日期时回退到净出库列扫描
      let salesPeriod = null;
      let periodMonths = 7;
      for (let c = 0; c < (sheetRows[0] || []).length; c += 1) {
        const parsed = parseSalesPeriodFromCell(sheet[XLSX.utils.encode_cell({ r: 0, c })]);
        if (parsed && parsed.end) {
          const year = parsed.end.slice(0, 4);
          salesPeriod = { start: `${year}-01-01`, end: parsed.end };
          break;
        }
      }
      // 回退：从AP列扫描净出库数据确定终点（起点取当年1月1日）
      if (!salesPeriod) {
        const headerRow = sheetRows[2] || [];
        const totalsRow = sheetRows[1] || [];
        let netOutboundMonths = [];
        for (let c = 41; c < headerRow.length; c++) {
          const headerText = String(headerRow[c] || "").trim();
          if (headerText.includes("净出库")) {
            const monthMatch = headerText.match(/(\d+)月/);
            const month = monthMatch ? parseInt(monthMatch[1]) : (c - 41 + 1);
            const total = Number(totalsRow[c]) || 0;
            if (total > 0) {
              netOutboundMonths.push(month);
            }
          }
        }
        if (netOutboundMonths.length > 0) {
          const endMonth = Math.max(...netOutboundMonths);
          const year = new Date().getFullYear();
          const endDay = new Date(year, endMonth, 0).getDate();
          salesPeriod = {
            start: `${year}-01-01`,
            end: `${year}-${String(endMonth).padStart(2, "0")}-${String(endDay).padStart(2, "0")}`,
          };
        }
      }
      // 根据 start~end 计算 periodMonths
      if (salesPeriod && salesPeriod.start && salesPeriod.end) {
        const start = new Date(salesPeriod.start);
        const end = new Date(salesPeriod.end);
        if (!isNaN(start) && !isNaN(end)) {
          periodMonths = Math.max(1, Math.round((end - start) / (30 * 24 * 60 * 60 * 1000)));
        }
      }

      // 表头行（第3行，索引2）动态定位关键列，兼容不同版本数据源列位置变化
      // 1018版：A=条码, B=id, C=线下, D=图片, E=产品名称, F=货号, G=净含量/规格, H=分类, I=零售价,
      //         J=生产备注, P=剩余天数, R=在仓库存, S=门店库存, T=总库存数量, U=在途库存, V=今年日销系数
      // 0926版：固定列 A~H 与1018版整体错位1列（C=图片, D=品名, E=货号, F=规格, G=分类, H=零售价），
      //         J=生产备注, O=剩余天数, Q=在仓库存, U=日销系数, V=补单备注
      // 0816版回退索引：I(8)=生产备注, N(13)=剩余天数, O(14)=即时库存, P(15)=日销系数
      const headerRowCells = sheetRows[2] || [];
      const findColIdx = (exactKeywords, fuzzyKeywords, fallbackIdx) => {
        // 第一遍：表头完全相等（避免「规格」误命中「规格编码」等长表头）
        for (let c = 0; c < headerRowCells.length; c += 1) {
          const headerText = String(headerRowCells[c] ?? "").trim().toLowerCase();
          if (exactKeywords.some((kw) => headerText === String(kw).toLowerCase())) return c;
        }
        // 第二遍：表头包含关键词
        for (let c = 0; c < headerRowCells.length; c += 1) {
          const headerText = String(headerRowCells[c] ?? "").trim().toLowerCase();
          if (fuzzyKeywords.some((kw) => headerText.includes(String(kw).toLowerCase()))) return c;
        }
        return fallbackIdx;
      };
      const barcodeColIdx = findColIdx(["条码"], ["条码", "商品条码", "规格条码"], 0);
      const idColIdx = findColIdx(["id"], ["id"], 1);
      const imageColIdx = findColIdx(["图片"], ["图片", "主图", "SKU图片"], 2);
      const productNameColIdx = findColIdx(["产品名称", "品名", "货品名称", "商品名称"], ["产品名称", "品名", "货品名称", "商品名称", "SKU名称"], 3);
      const skuColIdx = findColIdx(["货号", "规格编码", "货品编号", "商品编码"], ["货号", "规格编码", "货品编号", "商品编码"], 4);
      const specColIdx = findColIdx(["规格", "净含量/规格", "净含量"], ["净含量/规格", "规格项1"], 5);
      const categoryColIdx = findColIdx(["分类"], ["分类", "类目", "类别"], 6);
      const retailPriceColIdx = findColIdx(["零售价"], ["零售价", "建议零售价", "采购单价"], 7);
      const productionNoteColIdx = findColIdx(["生产备注", "生产情况", "生产状态"], ["生产备注", "生产情况", "生产状态"], 8);
      const reorderNoteColIdx = findColIdx(["补单备注", "补单"], ["补单"], -1);
      const remainingDaysColIdx = findColIdx(["剩余天数"], ["剩余天数", "剩余有效天数"], 13);
      const stockColIdx = findColIdx(["在仓库存", "即时库存"], ["即时库存", "在仓库存"], 14);
      const dailySalesCoefColIdx = findColIdx(["日销系数", "今年日销系数"], ["日销系数"], 15);
      // 1018版新增「在途库存」数值列：无补单备注文字时映射为「在途N件」保留⭐在途标记
      const inTransitColIdx = findColIdx(["在途库存"], ["在途库存", "在途"], -1);
      // 线上月均/线下月均/库存判断/销量趋势：0926版已删除，仅表头存在时读取
      const onlineMonthlyAvgColIdx = findColIdx(["线上月均"], ["线上月均"], -1);
      const offlineMonthlyAvgColIdx = findColIdx(["线下月均"], ["线下月均"], -1);
      const stockHealthColIdx = findColIdx(["库存判断"], ["库存判断"], -1);
      const salesTrendColIdx = findColIdx(["销量趋势"], ["销量趋势"], -1);

      // 数据从第4行开始（索引3）
      for (let rowIdx = 3; rowIdx < sheetRows.length; rowIdx += 1) {
        const r = sheetRows[rowIdx] || [];
        const productName = String(r[productNameColIdx] ?? "").trim();
        const barcode = String(r[barcodeColIdx] ?? "").trim();
        const sku = String(r[skuColIdx] ?? "").trim();
        if (!productName && !barcode && !sku) continue;

        const spec = String(r[specColIdx] ?? "").trim();
        const category = String(r[categoryColIdx] ?? "").trim();
        const retailPrice = maybeNumber(r[retailPriceColIdx]);
        // 生产备注：按表头动态定位，区分正常、停产、待定（其他）
        const productionNote = String(r[productionNoteColIdx] ?? "").trim();
        // 补单备注：按表头动态定位，用于识别“在途”补单
        let reorderNote = reorderNoteColIdx >= 0 ? String(r[reorderNoteColIdx] ?? "").trim() : "";
        // 1018版新增「在途库存」数值列：无补单备注文字时映射为「在途N件」，保留⭐在途标记
        if (!reorderNote && inTransitColIdx >= 0) {
          const inTransitQty = parseNumber(r[inTransitColIdx], 0);
          if (inTransitQty > 0) reorderNote = `在途${formatInteger(inTransitQty)}件`;
        }
        const isRegularPrice = ""; // 新版无此列，留空
        const remainingDays = maybeNumber(r[remainingDaysColIdx]);
        const currentStock = parseNumber(r[stockColIdx], 0);
        const dailySalesCoef = maybeNumber(r[dailySalesCoefColIdx]);
        // 库存月 = 即时库存 / (日销系数 * 30)，由库存列和日销系数列计算
        const stockMonths = (dailySalesCoef !== null && dailySalesCoef > 0)
          ? currentStock / (dailySalesCoef * 30)
          : null;
        // 兼容旧版：线上月均+线下月均计算月均销量，0926版已无此列则为0
        const onlineMonthlyAvg = onlineMonthlyAvgColIdx >= 0 ? parseNumber(r[onlineMonthlyAvgColIdx], 0) : 0;
        const offlineMonthlyAvg = offlineMonthlyAvgColIdx >= 0 ? parseNumber(r[offlineMonthlyAvgColIdx], 0) : 0;
        const monthlyAverage = onlineMonthlyAvg + offlineMonthlyAvg;
        const stockHealth = String(r[stockHealthColIdx] ?? "").trim() || getStockHealthLabel(stockMonths);
        const salesTrend = String(r[salesTrendColIdx] ?? "").trim();
        // periodMonths 由第1行日期或净出库列扫描得出
        const salesQty = Math.round(monthlyAverage * periodMonths);
        const derivedStockMonths = stockMonths;
        const sellOutDays = (stockMonths !== null && stockMonths !== undefined)
          ? stockMonths * 30
          : (monthlyAverage > 0 ? (currentStock / monthlyAverage) * 30 : Infinity);
        // 负数消化周期为异常情况：能否卖完直接判定为 false（卖不完）
        const canSellBeforeExpiry = (sellOutDays !== null && sellOutDays < 0)
          ? false
          : (sellOutDays !== null && remainingDays !== null ? sellOutDays <= remainingDays : null);

        // 图片：DISPIMG 公式存在 cell.f 或 cell.v 中（0926版C列，1018版D列，按表头动态定位）
        const imageCell = sheet[XLSX.utils.encode_cell({ r: rowIdx, c: imageColIdx })];
        const imageId = extractDispImgId(imageCell);
        const imageTarget = imageLookup.get(imageId) || "";
        if (imageId && imageTarget) {
          imageTargets.set(imageId, imageTarget);
        }

        rows.push({
          key: makeBarcodeKey({ barcode, sku, specCode: sku, productCode: sku, productName, spec }),
          barcode,
          id: String(r[idColIdx] ?? "").trim(),
          imageId,
          imageTarget,
          productName,
          spec,
          category,
          productionNote,
          reorderNote,
          isRegularPrice,
          retailPrice,
          sku,
          stockQty: currentStock,
          stockMonths: derivedStockMonths,
          remainingDays,
          dailySalesCoef,
          stockHealth,
          salesTrend,
          salesQty,
          monthlyAverageSales: monthlyAverage,
          sellOutDays,
          canSellBeforeExpiry,
          raw: r.slice(0, 30),
        });
      }

      // 图片分批加载，避免一次性 Promise.all 创建过多并发
      const uniqueTargets = Array.from(new Set(Array.from(imageTargets.values())));
      const imageDataByTarget = {};
      const BATCH_SIZE = 20;
      for (let i = 0; i < uniqueTargets.length; i += BATCH_SIZE) {
        const batch = uniqueTargets.slice(i, i + BATCH_SIZE);
        await Promise.all(batch.map(async (target) => {
          imageDataByTarget[target] = await buildMatrixImageData(zip, target);
        }));
      }

      rows.forEach((row) => {
        row.imageUrl = row.imageTarget ? imageDataByTarget[row.imageTarget] || "" : "";
      });

      return {
        sheetName,
        rows,
        imageDataByTarget,
        salesPeriod,
        periodMonths,
      };
    }

    function parseMatrixWorkbookRows(rows) {
      return Array.isArray(rows) ? rows : [];
    }

    function parseProductRows(rows) {
      const [headers, ...body] = rows;
      const map = headerIndex(headers || []);
      return body.map((row) => {
        const productName = getCell(row, map, ["货品名称", "商品名称", "品名", "SKU名称", "商品名"]);
        const barcode = getCell(row, map, ["条码", "商品条码", "规格条码"]);
        const sku = getCell(row, map, ["货品编号", "规格编号", "商品编码", "商品/规格编码"]);
        const spec = getCell(row, map, ["规格"]);
        const imageUrl = getCell(row, map, ["图片", "图片链接", "主图", "SKU图片", "image", "imageUrl"]);
        return {
          key: makeBarcodeKey({ barcode, sku, specCode: sku, productCode: sku, productName, spec }),
          productName,
          barcode,
          sku,
          spec,
          imageUrl,
          scentFamily: getCell(row, map, ["香型"]),
          category: getCell(row, map, ["分类", "商品类目", "一级分类", "类别", "商品分类", "类目"]),
          brand: getCell(row, map, ["品牌"]),
          unit: getCell(row, map, ["基础单位", "单位"]),
          retailPrice: maybeNumber(getCell(row, map, ["零售价", "建议零售价(元)", "最新采购单价(元)"])),
          isRegularPrice: parseYesNo(getCell(row, map, ["是否正价", "是否正价品", "正价", "是否正价商品"])),
          shelfLifeDays: maybeNumber(getCell(row, map, ["保质期"])),
          batchManaged: getCell(row, map, ["批次管理"]),
          owner: getCell(row, map, ["货主"]),
          productionNote: getCell(row, map, ["生产情况", "生产备注", "生产状态"]),
          raw: row,
        };
      }).filter((row) => (row.productName || row.barcode || row.sku) && !isAggregateLabel(row.productName) && !isAggregateLabel(row.barcode));
    }

    function parseWarehouseRows(rows) {
      const [headers, ...body] = rows;
      const map = headerIndex(headers || []);
      return body.map((row) => {
        const warehouse = getCell(row, map, ["仓库", "门店/仓库", "门店", "店铺"]);
        const batchNo = getCell(row, map, ["批次"]);
        const productName = getCell(row, map, ["货品名称", "商品名称"]);
        const sku = getCell(row, map, ["货品编号", "商品编码", "规格编码", "商品/规格编码"]);
        const spec = getCell(row, map, ["规格", "商品/规格条码", "规格项1"]);
        const barcode = getCell(row, map, ["条码", "商品条码", "规格条码"]);
        const stockQty = parseNumber(getCell(row, map, ["库存数量", "实物库存", "库存"]), 0);
        const availableQty = parseNumber(getCell(row, map, ["可用库存", "实物库存", "库存数量"]), stockQty);
        const productionDate = formatDateValue(getCell(row, map, ["生产日期"]));
        const expiryDate = formatDateValue(getCell(row, map, ["到期日期"]));
        return {
          key: makeBarcodeKey({ barcode, sku, specCode: sku, productCode: sku, productName, spec }),
          location: warehouse,
          batchNo,
          productName,
          barcode,
          sku,
          spec,
          stockQty,
          availableQty,
          frozenQty: parseNumber(getCell(row, map, ["批次冻结库存"]), 0),
          productionDate,
          shelfLifeDays: maybeNumber(getCell(row, map, ["保质期"])),
          shelfLifeUnit: getCell(row, map, ["保质期单位"]),
          remainingDays: maybeNumber(getCell(row, map, ["剩余有效天数"])),
          expiryDate,
          company: getCell(row, map, ["业务员"]),
          batchRemark: getCell(row, map, ["批次备注"]),
          raw: row,
        };
      }).filter((row) => (row.productName || row.barcode || row.sku || row.location) && !isAggregateLabel(row.productName) && !isAggregateLabel(row.barcode));
    }

    function parseStoreInventoryRows(rows) {
      const [headers, ...body] = rows;
      const map = headerIndex(headers || []);
      return body.map((row) => {
        const location = getCell(row, map, ["门店/仓库", "门店", "店铺"]);
        const batchNo = getCell(row, map, ["批次"]);
        const productName = getCell(row, map, ["商品名称"]);
        const sku = getCell(row, map, ["商品编码(SPU)", "商品/规格编码", "规格编码", "商品编码"]);
        const spec = getCell(row, map, ["商品/规格条码", "商品/规格编码", "规格项1", "规格项2", "规格项3"]);
        const barcode = getCell(row, map, ["商品/规格条码", "商品条码", "规格条码"]);
        const stockQty = parseNumber(getCell(row, map, ["实物库存", "库存数量", "可用库存"]), 0);
        const availableQty = parseNumber(getCell(row, map, ["可用库存", "实物库存", "库存数量"]), stockQty);
        const productionDate = formatDateValue(getCell(row, map, ["生产日期"]));
        const expiryDate = formatDateValue(getCell(row, map, ["到期日期"]));
        return {
          key: makeBarcodeKey({ barcode, sku, specCode: sku, productCode: sku, productName, spec }),
          location,
          batchNo,
          productName,
          barcode,
          sku,
          spec,
          stockQty,
          availableQty,
          frozenQty: parseNumber(getCell(row, map, ["批次冻结库存"]), 0),
          productionDate,
          shelfLifeDays: maybeNumber(getCell(row, map, ["保质期"])),
          shelfLifeUnit: getCell(row, map, ["保质期单位"]),
          remainingDays: maybeNumber(getCell(row, map, ["剩余有效天数"])),
          expiryDate,
          raw: row,
        };
      }).filter((row) => (row.productName || row.barcode || row.sku || row.location) && !isAggregateLabel(row.productName) && !isAggregateLabel(row.barcode));
    }

    function parseChannelSalesRows(rows) {
      const [headers, ...body] = rows;
      const map = headerIndex(headers || []);
      return body.map((row) => {
        const qty = parseNumber(getCell(row, map, ["数量", "商品数量"]), 0);
        const productName = getCell(row, map, ["货品名称", "商品名称"]);
        const sku = getCell(row, map, ["货品编号", "商品编码", "规格编码"]);
        const spec = getCell(row, map, ["规格"]);
        const barcode = getCell(row, map, ["条码", "商品条码", "规格条码"]);
        const channel = getCell(row, map, ["销售渠道"]);
        return {
          key: makeBarcodeKey({ barcode, sku, specCode: sku, productCode: sku, productName, spec }),
          orderNo: getCell(row, map, ["出库单号", "单号"]),
          time: formatDateValue(getCell(row, map, ["出库时间"])),
          type: getCell(row, map, ["出库类型"]),
          warehouse: getCell(row, map, ["出库仓库"]),
          channel,
          productName,
          barcode,
          sku,
          spec,
          qty,
          unit: getCell(row, map, ["单位"]),
          costPrice: maybeNumber(getCell(row, map, ["出库成本单价"])),
          costAmount: maybeNumber(getCell(row, map, ["出库成本金额"])),
          raw: row,
        };
      }).filter((row) => row.qty > 0 && (row.productName || row.barcode || row.sku) && !isAggregateLabel(row.productName) && !isAggregateLabel(row.barcode));
    }

    function parseStoreSalesRows(rows) {
      const [headers, ...body] = rows;
      const map = headerIndex(headers || []);
      return body.map((row) => {
        const status = getCell(row, map, ["订单商品状态"]);
        const qty = parseNumber(getCell(row, map, ["商品数量"]), 0);
        const productName = getCell(row, map, ["商品名称"]);
        const store = getCell(row, map, ["归属店铺"]);
        const spec = getCell(row, map, ["商品规格"]);
        const specCode = getCell(row, map, ["规格编码"]);
        const productCode = getCell(row, map, ["商品编码"]);
        const barcode = getCell(row, map, ["商品条码", "规格条码"]);
        return {
          key: makeBarcodeKey({ barcode, sku: specCode || productCode, specCode, productCode, productName, spec }),
          orderNo: getCell(row, map, ["订单号"]),
          time: formatDateValue(getCell(row, map, ["订单创建时间", "下单时间", "成交时间", "支付时间"])),
          brand: getCell(row, map, ["商品品牌"]),
          status,
          productName,
          type: getCell(row, map, ["商品类型"]),
          category: getCell(row, map, ["商品类目"]),
          firstCategory: getCell(row, map, ["商品一级分类"]),
          store,
          spec,
          specCode,
          productCode,
          barcode,
          unitPrice: maybeNumber(getCell(row, map, ["商品单价"])),
          finalPrice: maybeNumber(getCell(row, map, ["商品优惠后价格", "商品实际成交金额"])),
          qty,
          unit: getCell(row, map, ["商品单位"]),
          raw: row,
        };
      }).filter((row) => row.qty > 0 && row.status !== "关闭" && row.status !== "取消" && row.status !== "退款成功" && (row.productName || row.barcode || row.specCode) && !isAggregateLabel(row.productName) && !isAggregateLabel(row.barcode));
    }

    // 解析「每日销量趋势」文件：每行一个商品某天的线上/线下销量
    // 兼容两种格式：
    //   1) 宽格式：含「线上销量/线下销量」两列
    //   2) 长格式：含「渠道」列(线上/线下) + 「数量」列
    function parseSalesTrendRows(rows) {
      const [headers, ...body] = rows;
      const map = headerIndex(headers || []);
      const result = [];
      for (const row of body) {
        const productName = getCell(row, map, ["品名", "商品名称", "货品名称", "SKU名称", "商品"]);
        const barcode = getCell(row, map, ["条码", "商品条码", "规格条码"]);
        const sku = getCell(row, map, ["货品编号", "商品编码", "规格编码", "规格编号", "SKU", "商品/规格编码"]);
        const spec = getCell(row, map, ["规格", "商品规格"]);
        const date = formatDateValue(getCell(row, map, ["日期", "销售日期", "统计日期", "时间", "出库时间", "下单时间", "date"]));
        if (!date || !/^\d{4}-\d{2}-\d{2}/.test(date)) continue;
        if (!productName && !barcode && !sku) continue;
        if (isAggregateLabel(productName) || isAggregateLabel(barcode)) continue;

        const key = makeBarcodeKey({ barcode, sku, specCode: sku, productCode: sku, productName, spec });
        const channelRaw = String(getCell(row, map, ["渠道", "销售渠道", "渠道类型", "线上/线下"])).trim();
        const qty = parseNumber(getCell(row, map, ["数量", "销售数量", "销量", "销售量"]), 0);

        let onlineQty = 0;
        let offlineQty = 0;

        const channelNorm = normalizeText(channelRaw);
        if (channelNorm) {
          // 长格式：按渠道归类
          if (channelNorm.includes("线上") || channelNorm.includes("online") || channelNorm.includes("电商") || channelNorm.includes("淘宝") || channelNorm.includes("天猫") || channelNorm.includes("抖音") || channelNorm.includes("京东")) {
            onlineQty = qty;
          } else if (channelNorm.includes("线下") || channelNorm.includes("offline") || channelNorm.includes("门店") || channelNorm.includes("实体") || channelNorm.includes("自营")) {
            offlineQty = qty;
          } else {
            // 未知渠道，默认计入线下
            offlineQty = qty;
          }
        } else {
          // 宽格式：直接读取线上/线下两列
          onlineQty = parseNumber(getCell(row, map, ["线上销量", "线上销售数量", "线上数量", "线上", "线上销售", "online", "电商销量"]), 0);
          offlineQty = parseNumber(getCell(row, map, ["线下销量", "线下销售数量", "线下数量", "线下", "线下销售", "offline", "门店销量"]), 0);
        }

        if (onlineQty <= 0 && offlineQty <= 0) continue;

        result.push({
          key,
          productName,
          barcode,
          sku,
          spec,
          date,
          onlineQty: Math.max(0, onlineQty),
          offlineQty: Math.max(0, offlineQty),
          raw: row,
        });
      }
      return result;
    }

    // 每日销量趋势文件解析见 parseSalesTrendRowsFromFile（主线程，复用已加载的 XLSX）
    // 兼容多种日期格式：Date / Excel 序号 / YYYY-MM-DD / YYYY/MM/DD / YYYYMMDD(紧凑)
    // 解析第1行日期单元格（0926版E1，1018版F1）为销售时间段 {start, end}
    // 支持：Date对象、Excel日期序列号、字符串（单日期或日期范围）
    function parseSalesPeriodFromCell(cell) {
      if (!cell) return null;
      const v = cell.v;
      if (v == null) return null;

      // Date 对象（cellDates:true 时）：按本地时区格式化
      // 注意：SheetJS 解析 1900 日期系统存在已知伪影，午夜日期可能偏差至多 44 秒（如 23:59:17），
      // 加 45 秒补偿后再取本地日期，避免差一天
      if (v instanceof Date && !Number.isNaN(v.getTime())) {
        const shifted = new Date(v.getTime() + 45 * 1000);
        const dateStr = `${shifted.getFullYear()}-${String(shifted.getMonth() + 1).padStart(2, "0")}-${String(shifted.getDate()).padStart(2, "0")}`;
        return { start: dateStr, end: dateStr };
      }

      // Excel 日期序列号
      if (typeof v === "number" && v > 20000 && v < 70000) {
        const base = new Date(Date.UTC(1899, 11, 30));
        base.setUTCDate(base.getUTCDate() + v);
        const dateStr = base.toISOString().slice(0, 10);
        return { start: dateStr, end: dateStr };
      }

      // 字符串
      const text = String(v).trim();
      if (!text) return null;

      // 日期范围：如 "2024-01-01~2024-07-31"、"2024/1/1 - 2024/7/31"、"2024.01.01至2024.07.31"
      const rangeMatch = text.match(/(\d{4}[-./]\d{1,2}[-./]\d{1,2})\s*[~\-至到~]+\s*(\d{4}[-./]\d{1,2}[-./]\d{1,2})/);
      if (rangeMatch) {
        return { start: normalizeDateStr(rangeMatch[1]), end: normalizeDateStr(rangeMatch[2]) };
      }

      // 单个日期
      const dateMatch = text.match(/(\d{4}[-./]\d{1,2}[-./]\d{1,2})/);
      if (dateMatch) {
        const dateStr = normalizeDateStr(dateMatch[1]);
        return { start: dateStr, end: dateStr };
      }

      return null;
    }

    // 统一日期字符串为 "YYYY-MM-DD" 格式
    function normalizeDateStr(s) {
      const m = String(s).match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
      if (!m) return String(s);
      return `${m[1]}-${String(m[2]).padStart(2, "0")}-${String(m[3]).padStart(2, "0")}`;
    }

    function parseTrendDate(value) {
      if (!value) return "";
      if (value instanceof Date && !Number.isNaN(value.getTime())) return value.toISOString().slice(0, 10);
      if (typeof value === "number" && value > 20000 && value < 70000) {
        const base = new Date(Date.UTC(1899, 11, 30));
        base.setUTCDate(base.getUTCDate() + value);
        return base.toISOString().slice(0, 10);
      }
      const text = String(value).trim();
      let m = text.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
      if (m) return `${m[1]}-${String(m[2]).padStart(2, "0")}-${String(m[3]).padStart(2, "0")}`;
      m = text.match(/^(\d{4})(\d{2})(\d{2})$/);
      if (m) return `${m[1]}-${m[2]}-${m[3]}`;
      return "";
    }

    // 优先 69 码(EAN-13) 作为商品主键，和九宫格保持一致，避免线下 P 码与线上 69 码对不上
    function pickTrendBarcode(...cands) {
      const list = cands.map((v) => (v == null ? "" : String(v).trim())).filter(Boolean);
      return list.find((v) => /^69\d{11}$/.test(v)) || list.find((v) => /^\d{13}$/.test(v)) || list[0] || "";
    }

    // 旧版趋势文件解析（已停用，保留以兼容历史缓存）
    function makeTrendKey(row) {
      const barcode = pickTrendBarcode(row.barcode, row.sku, row.specCode, row.productCode);
      if (barcode) return barcode;
      return keyFrom(row.productName, row.spec);
    }

    // 用 Web Worker + JSZip + 正则解析 xlsx，比 SheetJS 快 30 倍

    function parseSalesTrendWorker(buffer) {

          "function unesc(s){return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'\"').replace(/&#39;/g,\"'\");}",

          "function parseWB(wbXml,relsXml){var sheets=[];var rels={};var rm;var rr=/<Relationship\\s+Id=\"([^\"]+)\"[^>]*Target=\"([^\"]+)\"/g;while((rm=rr.exec(relsXml))!==null)rels[rm[1]]=rm[2];var sm;var sr=/<sheet\\s+name=\"([^\"]+)\"[^>]*r:id=\"([^\"]+)\"/g;while((sm=sr.exec(wbXml))!==null){sheets.push({name:sm[1],file:rels[sm[2]]||('worksheets/sheet'+(sheets.length+1)+'.xml')});}return sheets;}",

        let done = false;

          if (done) return; done = true;
          try {
            const wb = XLSX.read(buffer, { type: "array", cellDates: false, raw: true, cellFormula: false });
            const sheets = {};
            wb.SheetNames.forEach((sn) => { sheets[sn] = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: "" }); });

            else reject(new Error(e.data.err || "worker error"));
          };
          worker.onerror = (err) => { clearTimeout(timer); try { worker.terminate(); } catch (_) {} fallback(); };

    // 保留旧函数名兼容（主线程 fallback 用）
    function parseWorkbookAsync(buffer) {
