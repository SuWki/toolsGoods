<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>黑爪商品驾驶舱 v2.1</title>
  <link rel="icon" href="icon.png">
  <style>
    :root {
      --bg: #f4f1ea;
      --panel: #fbf8f2;
      --panel-strong: #fffdf8;
      --ink: #2d241d;
      --muted: #736454;
      --line: #d8cdbf;
      --accent: #146356;
      --accent-soft: #d8ece7;
      --warn: #d97706;
      --warn-soft: #fce9ce;
      --danger: #b42318;
      --danger-soft: #f9dfdb;
      --good: #4c7a1f;
      --good-soft: #e4efd4;
      --shadow: 0 10px 30px rgba(45, 36, 29, 0.08);
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(20, 99, 86, 0.08), transparent 34%),
        linear-gradient(180deg, rgba(20, 99, 86, 0.05), rgba(20, 99, 86, 0) 180px),
        var(--bg);
    }

    .shell {
      max-width: 1600px;
      margin: 0 auto;
      padding: 28px 24px 36px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .topbar-left {
      flex: 1;
      min-width: 300px;
    }

    .topbar-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 8px 0 0;
      max-width: 1040px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 13px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .mode-switch {
      display: inline-flex;
      gap: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px;
      box-shadow: 0 2px 8px rgba(45, 36, 29, 0.06);
    }

    .mode-btn {
      padding: 9px 22px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      transition: all .2s ease;
      white-space: nowrap;
    }

    .mode-btn:hover {
      color: var(--accent);
    }

    .mode-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px rgba(20, 99, 86, 0.28);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      min-width: 220px;
    }

    button, input, select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-strong);
      color: var(--ink);
      padding: 10px 14px;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: #bfae9a;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.ghost {
      background: transparent;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .64);
      border: 1px solid rgba(216, 205, 191, .92);
      color: var(--muted);
      font-size: 12px;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .panel,
    .source-card,
    .empty-state,
    .status-item {
      background: var(--panel);
      border: 1px solid rgba(216, 205, 191, .9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .sidebar {
      position: sticky;
      top: 20px;
      padding: 0;
      display: grid;
      gap: 0;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .sidebar-toggle-bar {
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
    }

    .sidebar-toggle-btn {
      font-size: 13px;
      padding: 4px 12px;
      cursor: pointer;
    }

    .sidebar-body {
      padding: 18px;
      display: grid;
      gap: 18px;
    }

    .sidebar.collapsed {
      display: none;
    }

    .layout.sidebar-hidden {
      grid-template-columns: 1fr;
    }

    .restore-sidebar-btn {
      font-size: 13px;
      padding: 6px 14px;
      cursor: pointer;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .source-grid {
      display: grid;
      gap: 12px;
    }

    .source-card {
      padding: 14px;
      display: grid;
      gap: 12px;
      background: rgba(255, 255, 255, .64);
    }

    .source-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .source-head strong {
      display: block;
      font-size: 15px;
      margin-bottom: 3px;
    }

    .source-meta {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .link-to-matrix {
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer;
    }

    .link-to-matrix:hover {
      color: #0d3b33;
    }

    .source-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .source-actions button {
      padding: 8px 12px;
      font-size: 12px;
    }

    .note,
    .hint,
    .footer-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .error-text {
      color: var(--danger);
      background: var(--danger-soft);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.5;
    }

    .status-grid {
      display: grid;
      gap: 10px;
    }

    .status-item {
      padding: 10px 12px;
      background: rgba(255, 255, 255, .58);
    }

    .status-item strong {
      display: block;
      margin-top: 6px;
      font-size: 18px;
    }

    .main {
      display: grid;
      gap: 16px;
    }

    .view-section {
      display: grid;
      gap: 16px;
    }

    .empty-state {
      padding: 24px;
      min-height: 280px;
      display: grid;
      align-content: center;
      gap: 14px;
    }

    .empty-state h2 {
      margin: 0;
      font-size: 20px;
    }

    .empty-state p {
      margin: 0;
      max-width: 820px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }

    .kpi {
      padding: 18px;
      min-height: 118px;
    }

    .kpi small {
      display: block;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .kpi strong {
      display: block;
      font-size: 30px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .kpi p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 13px;
    }

    .kpi.good { background: linear-gradient(180deg, rgba(76, 122, 31, .08), rgba(76, 122, 31, 0)); }
    .kpi.warn { background: linear-gradient(180deg, rgba(217, 119, 6, .08), rgba(217, 119, 6, 0)); }
    .kpi.danger { background: linear-gradient(180deg, rgba(185, 35, 24, .08), rgba(185, 35, 24, 0)); }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px;
      border-bottom: 1px solid rgba(216, 205, 191, .85);
      background: rgba(255, 255, 255, .36);
    }

    .tabs .tab-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      align-self: center;
      margin-right: 4px;
    }

    .tab {
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
    }

    .tab.active {
      background: var(--accent-soft);
      border-color: rgba(20, 99, 86, .22);
      color: var(--accent);
      font-weight: 700;
    }

    .tab-content {
      padding: 16px;
      display: grid;
      gap: 16px;
    }

    .block {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .block-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .block-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .table-wrap {
      max-height: 620px;
      overflow: auto;
      border-radius: 8px;
      border: 1px solid rgba(216, 205, 191, .72);
      background: rgba(255, 255, 255, .55);
    }

    .table-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 0 2px;
    }

    .table-toolbar .hint {
      margin: 0;
    }

    .pager {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pager select {
      height: 32px;
      border-radius: 999px;
      border: 1px solid rgba(216, 205, 191, .92);
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      font: inherit;
    }

    .pager .page-info {
      color: var(--muted);
      font-size: 12px;
    }

    .pager button.sort-active {
      border-color: rgba(20, 99, 86, .35);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .pager button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    th.sortable {
      cursor: pointer;
      user-select: none;
    }

    th.sortable:hover {
      background: rgba(20, 99, 86, .06);
    }

    .sort-arrow {
      color: var(--accent);
      margin-left: 4px;
      font-size: 11px;
    }

    th.resizable {
      position: relative;
      padding-right: 20px;
    }

    .column-resizer {
      position: absolute;
      top: 0;
      right: 0;
      width: 12px;
      height: 100%;
      cursor: col-resize;
      touch-action: none;
    }

    .column-resizer::after {
      content: "";
      position: absolute;
      top: 18%;
      right: 5px;
      width: 2px;
      height: 64%;
      border-radius: 999px;
      background: rgba(20, 99, 86, .18);
    }

    .column-resizer:hover::after,
    .column-resizer.is-dragging::after {
      background: rgba(20, 99, 86, .52);
    }

    .cell-clip {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .table-tooltip {
      position: fixed;
      z-index: 2000;
      max-width: 320px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(18, 24, 22, .94);
      color: #fff;
      font-size: 12px;
      line-height: 1.45;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .18);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .12s ease, transform .12s ease;
    }

    .table-tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
    }

    th,
    td {
      border-bottom: 1px solid rgba(216, 205, 191, .72);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, .92);
      color: var(--muted);
      font-size: 12px;
      z-index: 1;
    }

    tr:last-child td { border-bottom: 0; }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.good { color: var(--good); background: var(--good-soft); }
    .badge.warn { color: var(--warn); background: var(--warn-soft); }
    .badge.danger { color: var(--danger); background: var(--danger-soft); }
    .badge.neutral { color: #5b4d42; background: #ece4d7; }
    .badge.busy { color: #0f5e57; background: #d7f0ec; }

    .empty-table {
      padding: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .soft-card {
      border: 1px solid rgba(216, 205, 191, .72);
      border-radius: 8px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, .6);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .matrix-panel {
      display: grid;
      gap: 16px;
      padding: 18px;
      border: 1px solid rgba(20, 99, 86, .12);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .82), rgba(255, 255, 255, .72)),
        radial-gradient(circle at top right, rgba(20, 99, 86, .06), transparent 28%);
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    .matrix-panel.fullscreen {
      position: fixed;
      inset: 0;
      z-index: 2000;
      max-width: 100vw;
      max-height: 100vh;
      overflow: auto;
      border-radius: 0;
    }

    .matrix-panel.fullscreen .matrix-grid {
      grid-template-columns: 100px repeat(3, 1fr);
    }

    .matrix-panel.fullscreen .matrix-cell {
      min-height: calc((100vh - 200px) / 3);
    }

    .matrix-toolbar {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .matrix-toolbar label {
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .matrix-toolbar input,
    .matrix-toolbar select {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 10px;
      background: #fff;
      color: var(--ink);
    }

    .matrix-kpis {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
    }

    .matrix-mini {
      padding: 14px;
      border: 1px solid rgba(216, 205, 191, .8);
      border-radius: 10px;
      background: rgba(255, 255, 255, .7);
      transition: all 0.2s ease;
    }
    .matrix-mini:hover {
      background: rgba(255, 255, 255, .9);
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(20, 99, 86, 0.15);
    }
    .matrix-mini.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .matrix-mini strong {
      display: block;
      font-size: 22px;
      margin-top: 4px;
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: 88px repeat(3, minmax(0, 1fr));
      gap: 12px;
      align-items: stretch;
    }

    .matrix-axis-y {
      display: grid;
      grid-template-rows: repeat(3, minmax(180px, 1fr));
      gap: 10px;
    }

    .matrix-axis-label {
      display: grid;
      align-content: center;
      justify-items: center;
      text-align: center;
      font-weight: 700;
      border-radius: 12px;
      border: 1px solid rgba(216, 205, 191, .8);
      background: rgba(255, 255, 255, .58);
      color: var(--ink);
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 0;
      min-height: 100%;
    }

    .matrix-col-head,
    .matrix-row-head {
      display: grid;
      place-items: center;
      min-height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(216, 205, 191, .8);
      background: rgba(255, 255, 255, .8);
      font-weight: 700;
      color: var(--ink);
    }

    .matrix-row-head {
      writing-mode: horizontal-tb;
      text-orientation: mixed;
      min-height: 100%;
      border-style: dashed;
    }

    .matrix-cells {
      display: grid;
      gap: 10px;
    }

    .matrix-cell {
      border: 1px solid rgba(216, 205, 191, .86);
      border-radius: 14px;
      background: rgba(255, 255, 255, .72);
      padding: 14px;
      aspect-ratio: 1 / 1;
      min-height: 0;
      display: grid;
      gap: 12px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .matrix-cell::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, rgba(20, 99, 86, .7), rgba(20, 99, 86, .08));
    }

    .matrix-cell.good { background: linear-gradient(180deg, rgba(76, 122, 31, .08), rgba(255,255,255,.82)); }
    .matrix-cell.warn { background: linear-gradient(180deg, rgba(217, 119, 6, .08), rgba(255,255,255,.82)); }
    .matrix-cell.danger { background: linear-gradient(180deg, rgba(185, 35, 24, .08), rgba(255,255,255,.82)); }

    /* 联动总表跳回九宫格时的高亮效果 */
    .matrix-cell.cell-flash {
      animation: cell-flash-anim 2s ease-out;
    }
    @keyframes cell-flash-anim {
      0%   { box-shadow: 0 0 0 4px rgba(20, 99, 86, .9), 0 0 24px rgba(20, 99, 86, .6); }
      100% { box-shadow: var(--shadow); }
    }
    .sku-chip.chip-flash {
      animation: chip-flash-anim 2s ease-out;
    }
    @keyframes chip-flash-anim {
      0%   { box-shadow: 0 0 0 3px rgba(20, 99, 86, .9); transform: scale(1.15); }
      100% { box-shadow: none; transform: scale(1); }
    }

    .matrix-cell-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .matrix-cell-head h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.3;
    }

    .matrix-cell-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .sku-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      align-items: start;
    }

    .sku-chip {
      display: grid;
      gap: 4px;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid rgba(216, 205, 191, .8);
      background: rgba(255, 255, 255, .84);
      cursor: pointer;
      text-align: left;
    }

    .sku-chip:hover {
      border-color: rgba(20, 99, 86, .35);
      transform: translateY(-1px);
    }

    .sku-thumb {
      width: 100%;
      aspect-ratio: 1 / 1; /* 正方形 */
      border-radius: 10px;
      overflow: hidden;
      background: #f4efe8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      border: 3px solid #333; /* 默认黑色边框 */
      box-sizing: border-box;
    }

    .sku-thumb.production-normal {
      border-color: #28a745; /* 正常 - 绿色 */
    }

    .sku-thumb.production-stopped {
      border-color: #dc3545; /* 停产 - 红色 */
    }

    .sku-thumb.production-other {
      border-color: #ffc107; /* 其他 - 黄色 */
    }

    .sku-thumb img {
      max-width: 90%; /* 缩小图片宽度，留边距 */
      max-height: 90%; /* 相对于容器高度的百分比 */
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      background: #f4efe8;
    }

.sku-chip small {
display: block;
color: var(--muted);
font-size: 11px;
line-height: 1.4;
overflow: hidden;
text-overflow: ellipsis;
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
white-space: normal;
max-height: 2.8em;
}

.sku-chip {
position: relative;
}

.sku-chip .reorder-star {
position: absolute;
top: 2px;
right: 2px;
font-size: 16px;
color: #ffc107;
text-shadow: 0 0 2px rgba(0,0,0,0.3);
z-index: 5;
line-height: 1;
pointer-events: none;
}

    .matrix-more {
      display: grid;
      place-items: center;
      border: 1px dashed rgba(20, 99, 86, .24);
      border-radius: 12px;
      background: rgba(20, 99, 86, .04);
      color: var(--accent);
      font-size: 12px;
      padding: 8px;
      min-height: 120px;
    }

    .focus-row td {
      background: rgba(20, 99, 86, .08);
    }

    /* 大宫格弹窗样式 */
    .big-cell-overlay {
      position: fixed;
      inset: 0;
      background: rgba(45, 36, 29, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .big-cell-modal {
      background: var(--panel-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 900px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .big-cell-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
    }

    .big-cell-header h3 {
      margin: 0;
      font-size: 20px;
    }

    .big-cell-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--panel-strong);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      line-height: 1;
      color: var(--muted);
      transition: all .15s ease;
      padding: 0;
      margin: 0;
    }

    .big-cell-close:hover {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: var(--danger);
    }

    .big-cell-content {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }

    .big-cell-content .sku-strip {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .big-cell-content .sku-chip {
      padding: 12px;
    }

    .big-cell-content .sku-thumb {
      height: 100px;
      width: 100px;
      overflow: hidden;
      background: #f4efe8;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      border-radius: 10px;
    }

    .big-cell-content .sku-thumb img {
      max-width: 90%;
      max-height: 90px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .big-cell-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      padding: 16px;
      background: var(--bg);
      border-radius: 10px;
    }

    .big-cell-stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .big-cell-stat small {
      color: var(--muted);
      font-size: 12px;
    }

    .big-cell-stat strong {
      font-size: 18px;
      color: var(--ink);
    }

    /* 大宫格图例 */
    .big-cell-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
      font-size: 13px;
      color: var(--muted);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-box {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 3px solid;
      background: #f4efe8;
    }

    .legend-box.legend-red { border-color: #dc3545; }
    .legend-box.legend-yellow { border-color: #ffc107; }
    .legend-box.legend-green { border-color: #28a745; }

    .legend-text-danger {
      color: var(--danger);
      font-weight: 700;
    }

    @media (max-width: 1200px) {
      .layout,
      .kpis,
      .summary-grid,
      .matrix-kpis,
      .matrix-toolbar { grid-template-columns: 1fr 1fr; }
      .sidebar { position: static; max-height: none; }
      .topbar { flex-direction: column; }
      .topbar-right { align-items: flex-start; flex-direction: row; flex-wrap: wrap; gap: 12px; }
      .actions { justify-content: flex-start; }
    }

    @media (max-width: 760px) {
      .layout,
      .kpis,
      .summary-grid,
      .matrix-kpis,
      .matrix-toolbar,
      .matrix-grid { grid-template-columns: 1fr; }
      .shell { padding: 20px 14px 28px; }
      th, td { white-space: normal; }
      .source-head,
      .block-head { flex-direction: column; }
      .matrix-axis-label { writing-mode: horizontal-tb; }
    }

    .subtabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 0;
      border-top: none;
      align-items: center;
    }

    .subtab {
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-strong);
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      transition: all .15s ease;
    }

    .subtab:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .subtab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ===== 销售趋势 ===== */
    .trend-panel {
      display: grid;
      gap: 16px;
      padding: 18px;
      border: 1px solid rgba(20, 99, 86, .12);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .82), rgba(255, 255, 255, .72)),
        radial-gradient(circle at top right, rgba(20, 99, 86, .06), transparent 28%);
    }

    .trend-toolbar {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .trend-view-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px dashed rgba(20, 99, 86, .18);
      border-radius: 10px;
      background: rgba(20, 99, 86, .04);
    }

    .trend-view-bar-hint {
      font-size: 11px;
      color: var(--muted);
    }

    .trend-toolbar label {
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .trend-toolbar input,
    .trend-toolbar select {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 10px;
      background: #fff;
      color: var(--ink);
    }

    .trend-picker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    .trend-picker-col {
      display: grid;
      gap: 10px;
    }

    .trend-search {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 12px;
      background: #fff;
      color: var(--ink);
    }

    .trend-product-list {
      max-height: 280px;
      overflow: auto;
      border: 1px solid rgba(216, 205, 191, .72);
      border-radius: 10px;
      background: rgba(255, 255, 255, .7);
      padding: 6px 8px;
      display: grid;
      gap: 4px;
    }

    .trend-product-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.4;
    }

    .trend-product-item:hover {
      background: rgba(20, 99, 86, .06);
    }

    .trend-product-item input {
      cursor: pointer;
    }

    .trend-product-item .trend-product-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .trend-product-item .trend-product-sub {
      color: var(--muted);
      font-size: 11px;
    }

    .trend-product-empty {
      padding: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .trend-chart-wrap {
      border: 1px solid rgba(216, 205, 191, .72);
      border-radius: 10px;
      background: #fff;
      padding: 12px;
      overflow: auto;
    }

    .trend-chart-wrap svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .trend-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }

    .trend-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .trend-legend-swatch {
      display: inline-block;
      width: 22px;
      height: 3px;
      border-radius: 2px;
    }

    .trend-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .trend-stat {
      border: 1px solid rgba(216, 205, 191, .72);
      border-radius: 10px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, .7);
    }

    .trend-stat small {
      color: var(--muted);
      font-size: 12px;
    }

    .trend-stat strong {
      display: block;
      font-size: 20px;
      margin-top: 4px;
    }

    .trend-mode-toggle {
      display: inline-flex;
      gap: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px;
    }

    .trend-mode-toggle button {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
    }

    .trend-mode-toggle button.active {
      background: var(--accent);
      color: #fff;
    }

    .trend-chart-wrap {
      position: relative;
      cursor: pointer;
    }
    .trend-chart-zoom-hint {
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 11px;
      color: var(--muted);
      background: rgba(255,255,255,.85);
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(216,205,191,.6);
      pointer-events: none;
    }
    .trend-chart-wrap--modal {
      cursor: default;
    }

    .trend-loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(20,99,86,.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: trend-spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes trend-spin {
      to { transform: rotate(360deg); }
    }

    .trend-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
    }
    .trend-modal.open {
      display: block;
    }
    .trend-modal-back {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.45);
    }
    .trend-modal-box {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(98vw, 1600px);
      max-height: 96vh;
      overflow: auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      display: grid;
      gap: 12px;
      padding: 18px;
    }
    .trend-modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .trend-modal-body .trend-chart-wrap {
      max-height: 78vh;
      overflow: auto;
    }

    @media (max-width: 1100px) {
      .trend-toolbar { grid-template-columns: 1fr 1fr; }
      .trend-picker { grid-template-columns: 1fr; }
      .trend-summary { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="topbar-left">
        <h1>香水商品分析工具</h1>
        <p class="subtitle" id="page-subtitle">选择上方模式开始分析：驾驶舱需要上传多个文件进行综合分析；九宫格只需上传单个《总库存情况》文件即可生成九宫格分析图。重新上传同一位置会直接覆盖刷新。</p>
        <div id="progress-pills" class="pill-row"></div>
      </div>
      <div class="topbar-right">
        <div class="mode-switch" id="mode-switch">
          <button class="mode-btn active" data-mode="cockpit">驾驶舱</button>
          <button class="mode-btn" data-mode="matrix">九宫格</button>
          <button class="mode-btn" data-mode="salesTrend">销售趋势</button>
          <button class="mode-btn" data-mode="kttImport">快团团导入</button>
        </div>
        <div class="actions">
          <button id="batch-upload" class="ghost">批量上传</button>
          <button id="clear-all" class="ghost">清空全部</button>
          <button id="restore-sidebar" class="ghost restore-sidebar-btn" style="display:none;">恢复侧边栏</button>
          <input id="batch-input" type="file" accept=".xlsx,.xls,.csv" multiple hidden>
          <div id="batch-note" class="note" style="margin-top:4px;max-width:240px;text-align:right;"></div>
        </div>
      </div>
    </div>

    <div class="layout">
      <aside class="panel sidebar">
        <div class="sidebar-toggle-bar">
          <button id="sidebar-toggle-btn" class="ghost sidebar-toggle-btn" title="折叠/展开侧边栏">
            <span id="sidebar-toggle-icon">收起 &laquo;</span>
          </button>
        </div>
        <div id="sidebar-body" class="sidebar-body">
          <section>
            <h2 class="section-title" id="sidebar-file-title">驾驶舱文件</h2>
            <div id="source-list" class="source-grid"></div>
          </section>

          <section>
            <h2 class="section-title">处理说明</h2>
            <div class="soft-card" id="sidebar-notes"></div>
          </section>

          <section>
            <h2 class="section-title">数据概况</h2>
            <div id="data-quality" class="status-grid"></div>
          </section>
        </div>
      </aside>

      <main class="main">
        <section id="empty-state" class="empty-state">
          <h2>先上传文件，再开始展示</h2>
          <p>当前页面没有示例数据。请先上传至少一个文件，系统会按模板自动识别并展示对应内容；如果你换了一版文件，直接重新上传同一位置即可刷新展示。</p>
          <p>等核心表都补齐后，我们就能在这套标准化数据上继续做补货预警、滞销预警和保质期预警。</p>
        </section>

        <section id="kpi-grid" class="kpis" style="display:none;"></section>

        <section id="tabs-panel" class="panel" style="display:none;">
          <div id="tabs" class="tabs"></div>
          <div id="tab-content" class="tab-content"></div>
        </section>
      </main>

  </div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const PREVIEW_LIMIT = 120;
    const MIN_COLUMN_WIDTH = 72;
    const APP_CACHE_KEY = "toolsGoods.dashboardCache.v1";
    const SOURCE_CONFIGS = [
      {
        key: "matrixWorkbook",
        label: "九宫格文件",
        hint: "商品资料 + 销存数据，一张表直接生成九宫格",
        preferredSheets: ["总库存情况"],
        parser: parseMatrixWorkbookRows,
      },
      {
        key: "product",
        label: "商品资料",
        hint: "图片 / 品名 / 规格 / 条码 / 分类 / 是否正价 / 零售价",
        preferredSheets: ["手动简称！别覆盖！"],
        parser: parseProductRows,
      },
      {
        key: "inventorySales",
        label: "销存数据",
        hint: "销售数量 / 即时库存 / 库存保质期",
        preferredSheets: ["销存数据"],
        parser: parseInventorySalesRows,
      },
      {
        key: "warehouse",
        label: "仓库库存和保质期",
        hint: "仓库-商品-数量-保质期-生产日期-到期日期",
        preferredSheets: ["sheetTitle"],
        parser: parseWarehouseRows,
      },
      {
        key: "storeInventory",
        label: "门店库存",
        hint: "门店-商品-数量-保质期-生产日期-到期日期",
        preferredSheets: ["商品库存"],
        parser: parseStoreInventoryRows,
      },
      {
        key: "channelSales",
        label: "渠道销售",
        hint: "线上 / 批发 / 经销商",
        preferredSheets: ["近30天销售出库"],
        parser: parseChannelSalesRows,
      },
      {
        key: "storeSales",
        label: "门店销售",
        hint: "自营门店销售",
        preferredSheets: ["近30天店铺销售"],
        parser: parseStoreSalesRows,
      },
      {
        key: "salesTrend",
        label: "每日销量趋势",
        hint: "各商品每天线上 / 线下销售数量，用于趋势对比",
        preferredSheets: [],
        parser: parseSalesTrendRows,
      },
    ];

const TABS = [
  { id: "cockpit", label: "驾驶舱" },
  { id: "matrix", label: "九宫格 SKU" },
];

const COCKPIT_SUBTABS = [
  { id: "overview", label: "总览" },
  { id: "product", label: "商品资料" },
  { id: "warehouse", label: "仓库库存" },
  { id: "storeInventory", label: "门店库存" },
  { id: "channelSales", label: "渠道销售" },
  { id: "storeSales", label: "门店销售" },
  { id: "replenishment", label: "补货预警" },
  { id: "slowmoving", label: "滞销预警" },
  { id: "expiry", label: "保质期预警" },
  { id: "linked", label: "联动总表" },
];

    const state = {
      activeTab: "cockpit",
      cockpitSubtab: "overview",
      sources: Object.fromEntries(SOURCE_CONFIGS.map((cfg) => [cfg.key, createEmptySourceState(cfg)])),
      tableState: {},
      matrixFocusKey: "",
      matrixScrollTarget: "", // "table" = scroll to linked table row, "grid" = scroll to matrix grid
      sidebarCollapsed: false, // 侧边栏是否折叠
      matrixFilters: {
        category: "全部",
        isRegularPrice: "全部",
        productionNote: "全部", // 全部 / 正常生产 / 停产 / 待定 / 其他 / 未设置
        kpiFilter: "all", // all, digest2, digest3, digest4, digest5, digest6
      },
      salesPeriod: getDefaultSalesPeriod(),
matrixExpandedCells: {}, // 记录哪些格子展开
matrixItemsPerCell: 4, // 每个格子显示商品数量
matrixBigCell: null, // 当前展开的大宫格 {cellKey, cellData}
      matrixHistory: {}, // 商品九宫格位置历史 {key: {nodeLabel: position}}
      matrixHistoryNodes: [], // 所有历史时间节点标签列表
      historyCompareNodes: ["", "", ""], // 用户选择对比的三个时间节点
      salesTrendFilters: {
        selectedKeys: [], // 选中的商品 key，空表示未选(渲染时自动取全部)
        startDate: "",
        endDate: "",
        search: "", // 商品搜索文本
        mode: "split", // split=分商品对比, merge=合并求和
        granularity: "daily", // daily=每日, monthly=按月, quarterly=按季度
        showTrendLine: false, // 是否叠加趋势线
        trendMethod: "linear", // linear=线性回归, ma=移动平均
        category: "全部", // 分类筛选（来自商品资料G列）
      },
      kttImportData: [], // 快团团导入解析结果 [{importNo, name, phone, address, csNote, productName, qty}]
    };

    const columnResizeState = {
      active: null,
      rafId: 0,
      pendingWidth: null,
    };

    const modelCache = {
      signature: "",
      model: null,
    };

    const tooltipState = {
      el: null,
    };

    function createEmptySourceState(cfg) {
      return {
        key: cfg.key,
        label: cfg.label,
        fileName: "",
        sheetName: "",
        importedAt: "",
        rows: [],
        imageDataByTarget: {},
        error: "",
        loading: false,
      };
    }

    function cloneSourceForCache(source) {
      return {
        key: source.key,
        label: source.label,
        fileName: source.fileName,
        sheetName: source.sheetName,
        importedAt: source.importedAt,
        rows: Array.isArray(source.rows)
          ? source.rows.map((row) => {
              if (source.key !== "matrixWorkbook") return row;
              const { imageDataByTarget, imageUrl, ...safeRow } = row || {};
              return safeRow;
            })
          : [],
        error: source.error,
      };
    }

    function cacheAppState() {
      try {
        const payload = {
          version: 1,
          activeTab: state.activeTab,
          cockpitSubtab: state.cockpitSubtab,
          tableState: state.tableState,
matrixFocusKey: state.matrixFocusKey,
matrixFilters: state.matrixFilters,
salesPeriod: state.salesPeriod,
sidebarCollapsed: state.sidebarCollapsed,
matrixHistory: state.matrixHistory,
matrixHistoryNodes: state.matrixHistoryNodes,
historyCompareNodes: state.historyCompareNodes,
salesTrendFilters: state.salesTrendFilters,
sources: Object.fromEntries(
            Object.entries(state.sources).map(([key, source]) => [key, cloneSourceForCache(source)])
          ),
        };
        localStorage.setItem(APP_CACHE_KEY, JSON.stringify(payload));
      } catch {
        // local cache is best-effort
      }
    }

    function restoreAppState() {
      try {
        const raw = localStorage.getItem(APP_CACHE_KEY);
        if (!raw) return;
        const payload = JSON.parse(raw);
        if (payload && payload.sources) {
          for (const cfg of SOURCE_CONFIGS) {
            const saved = payload.sources[cfg.key];
            if (!saved || !Array.isArray(saved.rows)) continue;
              state.sources[cfg.key] = {
                ...createEmptySourceState(cfg),
                ...saved,
                key: cfg.key,
                label: cfg.label,
                imageDataByTarget: saved.imageDataByTarget || {},
                loading: false,
              };
            }
          }
        if (payload && payload.tableState && typeof payload.tableState === "object") {
          state.tableState = payload.tableState;
        }
        if (payload && payload.matrixFocusKey) {
          state.matrixFocusKey = payload.matrixFocusKey;
        }
        if (payload && payload.matrixFilters && typeof payload.matrixFilters === "object") {
          state.matrixFilters = {
            ...state.matrixFilters,
            ...payload.matrixFilters,
          };
        }

    function setBatchNote(text = "") {

    function normalizeText(value) {
      return String(value ?? "")
        .trim()
        .replace(/\s+/g, "")
        .replace(/[()（）【】\[\]\/\\,，。:：;；._-]/g, "")
        .toLowerCase();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

    // 缩短香水名称，省略 BLACK PAW 黑爪
    function shortenProductName(name) {
      if (!name) return name;
      return String(name)
        .replace(/BLACK\s*PAW\s*黑爪/gi, "")
        .replace(/\d{6,}/g, "") // 移除6位以上的数字（条码）

    function formatNumber(value) {
      if (value === null || value === undefined || value === "") return "-";

    function formatInteger(value) {
      if (value === null || value === undefined || value === "") return "-";

    }

    // 趋势线数值格式化：保留一位小数（避免 0.x 被取整为 0）
    function formatTrendFloat(value) {
      if (value === null || value === undefined || value === "") return "-";
      return new Intl.NumberFormat("zh-CN", { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(Number(value));
    }

    function formatCurrency(value) {
      if (value === null || value === undefined || value === "") return "-";
      return "¥" + new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 2 }).format(Number(value));
    }

    function stripHtmlTags(value) {
      return String(value ?? "")
        .replace(/<[^>]*>/g, " ")
        .replace(/&nbsp;/g, " ")

    function formatDateValue(value) {
      if (!value) return "";
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        return value.toISOString().slice(0, 10);
      }
      if (typeof value === "number" && value > 20000 && value < 70000) {
        const base = new Date(Date.UTC(1899, 11, 30));
        base.setUTCDate(base.getUTCDate() + value);
        return base.toISOString().slice(0, 10);
      }
      const text = String(value).trim();
      const match = text.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
      if (match) {
        const [, y, m, d] = match;
        return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      }
      return text;
    }

    function formatDateInputValue(value) {
      if (!value) return "";
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        const offset = value.getTimezoneOffset() * 60000;
        return new Date(value.getTime() - offset).toISOString().slice(0, 10);
      }
      const text = String(value).trim();
      if (!text) return "";
      const match = text.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
      if (match) {
        const [, y, m, d] = match;
        return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      }
      return "";
    }

    function getDefaultSalesPeriod() {

    // 从销售数据中自动读取时间范围
    function getSalesPeriodFromData(sources) {
      const dates = [];

      // 从渠道销售数据读取时间
      if (sources.channelSales && sources.channelSales.rows) {
        sources.channelSales.rows.forEach(row => {
          if (row.time) {
            const date = new Date(row.time);
            if (!Number.isNaN(date.getTime())) {
              dates.push(date);
            }
          }
        });
      }

      // 从门店销售数据读取时间（需要添加时间字段）
      if (sources.storeSales && sources.storeSales.rows) {
        sources.storeSales.rows.forEach(row => {
          if (row.time) {
            const date = new Date(row.time);
            if (!Number.isNaN(date.getTime())) {
              dates.push(date);
            }
          }
        });
      }

      if (dates.length === 0) return null;

      // 找出最早和最晚的日期
      const minDate = new Date(Math.min(...dates.map(d => d.getTime())));
      const maxDate = new Date(Math.max(...dates.map(d => d.getTime())));

      return {
        start: formatDateInputValue(minDate),
        end: formatDateInputValue(maxDate),
      };
    }

    function parseYesNo(value) {
      const text = normalizeText(value);
      if (!text) return "";
      if (["是", "yes", "y", "true", "1", "正价", "在售"].some((item) => text === normalizeText(item) || text.includes(normalizeText(item)))) {
        return "是";
      }
      if (["否", "no", "n", "false", "0", "非正价", "促销"].some((item) => text === normalizeText(item) || text.includes(normalizeText(item)))) {
        return "否";
      }
      return String(value).trim();

    function formatDateTime(value) {
      if (!value) return "未上传";
      const date = new Date(value);

    function daysUntil(dateText) {
      if (!dateText) return null;
      const date = new Date(dateText);
      if (Number.isNaN(date.getTime())) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      date.setHours(0, 0, 0, 0);
      return Math.round((date - today) / 86400000);
    }

    function parseNumber(value, fallback = 0) {
      if (value === null || value === undefined || value === "") return fallback;
      const text = String(value).replace(/,/g, "").trim();
      const match = text.match(/-?\d+(?:\.\d+)?/);
      if (!match) return fallback;
      const num = Number(match[0]);
      return Number.isFinite(num) ? num : fallback;
    }

    function maybeNumber(value) {
      if (value === null || value === undefined || value === "") return null;
      const text = String(value).replace(/,/g, "").trim();
      const match = text.match(/-?\d+(?:\.\d+)?/);
      if (!match) return null;
      const num = Number(match[0]);
      return Number.isFinite(num) ? num : null;

    function firstNonEmpty(...values) {

    function safeDivide(numerator, denominator) {

    function latestDate(existing, candidate) {
      if (!candidate) return existing || "";
      if (!existing) return candidate;
      const existingDate = new Date(existing);
      const candidateDate = new Date(candidate);
      if (Number.isNaN(existingDate.getTime())) return candidate;
      if (Number.isNaN(candidateDate.getTime())) return existing;
      return candidateDate > existingDate ? candidate : existing;

    function ensureTableTooltip() {
      if (tooltipState.el) return tooltipState.el;

    function showTableTooltip(text, x, y) {
      if (!text) return hideTableTooltip();
      const el = ensureTableTooltip();
      el.textContent = text;
      el.classList.add("visible");
      const offset = 14;
      const rect = el.getBoundingClientRect();
      let left = x + offset;
      let top = y + offset;
      if (left + rect.width + 16 > window.innerWidth) {
        left = Math.max(12, x - rect.width - offset);
      }
      if (top + rect.height + 16 > window.innerHeight) {
        top = Math.max(12, y - rect.height - offset);
      }
      el.style.left = `${left}px`;
      el.style.top = `${top}px`;
    }

    function hideTableTooltip() {
      if (!tooltipState.el) return;

    function parseComparable(value) {
      if (typeof value === "number" && Number.isFinite(value)) {
        return { kind: "number", value };
      }
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        return { kind: "number", value: value.getTime() };
      }
      if (typeof value === "string") {
        const text = value.replace(/,/g, "").trim();
        if (!text) return { kind: "string", value: "" };
        const dateLike = text.match(/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/);
        if (dateLike) {
          const date = new Date(text);
          if (!Number.isNaN(date.getTime())) {
            return { kind: "number", value: date.getTime() };
          }
        }
        const numberLike = text.match(/^[-+]?\d+(?:\.\d+)?/);
        if (numberLike) {
          return { kind: "number", value: Number(numberLike[0]) };
        }
        return { kind: "string", value: text };
      }
      if (value === null || value === undefined) {
        return { kind: "string", value: "" };
      }
      return { kind: "string", value: String(value) };
    }

    function inferSourceKeyFromFileName(fileName) {
      const text = normalizeText(fileName);
      const rules = [
        ["salesTrend", ["每日销量", "销量趋势", "销售趋势", "线上线下销量", "每日销售", "线上线下一周", "趋势"]],
        ["storeSales", ["门店销售", "自营门店销售", "门店销售数据"]],
        ["channelSales", ["渠道销售", "线上销售", "批发销售", "经销商销售"]],
        ["warehouse", ["仓库库存和保质期", "仓库库存", "保质期数据", "仓库库存数据"]],
        ["storeInventory", ["门店库存", "店铺库存", "门店库存数据"]],
        ["product", ["商品资料", "商品资料表", "商品信息", "商品主数据"]],
      ];
      for (const [key, keywords] of rules) {
        if (keywords.some((keyword) => text.includes(normalizeText(keyword)))) {
          return key;
        }
      }
      return "";
    }

    function compareValues(a, b) {
      const aNull = a === null || a === undefined || a === "";
      const bNull = b === null || b === undefined || b === "";
      if (aNull && bNull) return 0;
      if (aNull) return 1;
      if (bNull) return -1;
      const normalizedA = parseComparable(a);
      const normalizedB = parseComparable(b);
      if (normalizedA.kind === "number" && normalizedB.kind === "number") {
        return normalizedA.value - normalizedB.value;
      }
      if (normalizedA.kind === "number") return -1;
      if (normalizedB.kind === "number") return 1;
      if (normalizedA.kind === "string" && normalizedB.kind === "string") {
        return normalizedA.value.localeCompare(normalizedB.value, "zh-CN");
      }
      return String(a).localeCompare(String(b), "zh-CN");
    }

    function getColumnValue(row, col) {
      if (typeof col.sortValue === "function") return col.sortValue(row);
      if (isProductNameColumn(col)) return row.productName || "";
      const value = col.value ? col.value(row) : col.render(row);
      return typeof value === "string" ? stripHtmlTags(value) : value;
    }

    function applySorting(rows, columns, sortKey, sortDir) {
      if (!sortKey) return rows.slice();
      const column = columns.find((col) => getColumnKey(col) === sortKey);
      if (!column) return rows.slice();
      const dir = sortDir === "asc" ? 1 : -1;
      return rows.slice().sort((a, b) => compareValues(getColumnValue(a, column), getColumnValue(b, column)) * dir);
    }

    function keyFrom(...parts) {
      const cleaned = parts
        .map((part) => normalizeText(part))
        .filter(Boolean);
      return cleaned.join("|");
    }

    function makeBarcodeKey(row) {
      // 以条码为唯一主键
      return normalizeText(row.barcode) || keyFrom(
        row.sku,
        row.specCode,
        row.productCode,
        row.productName,
        row.spec
      );
    }

    function headerIndex(headers) {
      const map = new Map();
      (headers || []).forEach((header, index) => {
        map.set(normalizeText(header), index);
      });
      return map;
    }

    function getCell(row, map, aliases) {
      for (const alias of aliases) {
        const idx = map.get(normalizeText(alias));
        if (idx !== undefined) {
          const value = row[idx];
          if (value !== undefined && value !== null && String(value).trim() !== "") {
            return value;
          }
        }
      }
      return "";
    }

    function cleanSheetRows(rows) {
      return (rows || []).filter((row) => Array.isArray(row) && row.some((cell) => String(cell ?? "").trim() !== ""));
    }

    function getSheetRowCount(sheet) {
      if (!sheet || !sheet["!ref"]) return 0;
      try {
        const range = XLSX.utils.decode_range(sheet["!ref"]);
        return range.e.r - range.s.r + 1;
      } catch {
        return 0;
      }
    }

    function getSheetRows(sheet) {
      return cleanSheetRows(
        XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: "" })
      );
    }

    function findPreferredSheetName(sheetNames, preferredSheets) {
      const preferred = (preferredSheets || []).map(normalizeText).filter(Boolean);
      if (!preferred.length) return "";
      for (const name of sheetNames || []) {
        const normalizedName = normalizeText(name);
        if (preferred.includes(normalizedName)) return name;
        if (preferred.some((sheet) => normalizedName.includes(sheet) || sheet.includes(normalizedName))) return name;
      }
      return "";
    }

    function parseCsvText(text) {
      const rows = [];
      let current = "";
      let line = [];
      let inQuotes = false;

      const pushCell = () => {
        line.push(current);
        current = "";
      };

      const pushLine = () => {
        if (line.length) rows.push(line);
        line = [];
      };

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];
        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          pushCell();
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") i += 1;
          pushCell();
          pushLine();
        } else {
          current += char;
        }
      }

      pushCell();
      pushLine();
      return rows.filter((row) => row.some((cell) => String(cell ?? "").trim() !== ""));
    }

    async function readRowsFromFile(file, preferredSheets = []) {
      const lower = file.name.toLowerCase();
      if (lower.endsWith(".csv")) {
        const text = await file.text();
        return { sheetName: file.name, rows: parseCsvText(text) };
      }

      if (!window.XLSX) {
        throw new Error("Excel 解析库没有加载成功，请刷新页面后重试。");
      }

      const buffer = await file.arrayBuffer();
      const workbook = XLSX.read(buffer, { type: "array", cellDates: true, raw: true, cellFormula: false });
      const sheetNames = workbook.SheetNames || [];
      if (!sheetNames.length) {
        throw new Error("没有读到有效工作表。");
      }

      const preferredSheetName = findPreferredSheetName(sheetNames, preferredSheets);
      if (preferredSheetName) {
        return { sheetName: preferredSheetName, rows: getSheetRows(workbook.Sheets[preferredSheetName]) };
      }

      let chosenSheetName = "";
      let chosenSheetCount = 0;
      for (const name of sheetNames) {
        const count = getSheetRowCount(workbook.Sheets[name]);
        if (count > chosenSheetCount) {
          chosenSheetCount = count;
          chosenSheetName = name;
        }
      }
      if (!chosenSheetName || !chosenSheetCount) {
        throw new Error("没有读到有效工作表。");
      }
      return { sheetName: chosenSheetName, rows: getSheetRows(workbook.Sheets[chosenSheetName]) };
    }

    const MATRIX_IMAGE_MIME = {
      png: "image/png",
      jpg: "image/jpeg",
      jpeg: "image/jpeg",

      gif: "image/gif",
      bmp: "image/bmp",

    function getSheetCell(sheet, rowNumber, colNumber) {

      return cell || null;

    function getSheetCellValue(sheet, rowNumber, colNumber) {
      const cell = getSheetCell(sheet, rowNumber, colNumber);
      if (!cell) return "";
      const value = cell.v;
      return value === null || value === undefined ? "" : value;
    }

    function getSheetCellText(sheet, rowNumber, colNumber) {
      const value = getSheetCellValue(sheet, rowNumber, colNumber);

    function extractDispImgId(cell) {
      const text = String(cell?.f || cell?.v || cell?.w || "").trim();
      const match = text.match(/ID_[0-9A-F]+/i);
      return match ? match[0] : "";
    }

    function getMimeFromTarget(target) {
      const ext = String(target || "").split(".").pop().toLowerCase();
      return MATRIX_IMAGE_MIME[ext] || "image/png";
    }

    function parseXmlDocument(xmlText) {
      const parser = new DOMParser();
      return parser.parseFromString(xmlText, "application/xml");
    }

    async function buildMatrixImageLookup(zip) {
      const imageIdToTarget = new Map();
      const relText = await zip.file("xl/_rels/cellimages.xml.rels")?.async("string");
      const xmlText = await zip.file("xl/cellimages.xml")?.async("string");
      if (!relText || !xmlText) return imageIdToTarget;

      const relDoc = parseXmlDocument(relText);
      const xmlDoc = parseXmlDocument(xmlText);
      const relNodes = Array.from(relDoc.getElementsByTagName("Relationship"));
      const targetByRelId = new Map(relNodes.map((node) => [node.getAttribute("Id") || "", node.getAttribute("Target") || ""]));
      const cellImages = Array.from(xmlDoc.getElementsByTagNameNS("*", "cellImage"));

      cellImages.forEach((cellImage) => {
        const cNvPr = cellImage.getElementsByTagNameNS("*", "cNvPr")[0];
        const blip = cellImage.getElementsByTagNameNS("*", "blip")[0];
        const imageId = cNvPr?.getAttribute("name") || "";
        const relId = blip?.getAttribute("r:embed") || blip?.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "embed") || "";
        const target = targetByRelId.get(relId) || "";
        if (imageId && target) {
          imageIdToTarget.set(imageId, target);
        }
      });

      return imageIdToTarget;
    }

    async function buildMatrixImageData(zip, target) {
      if (!target) return "";
      const normalizedTarget = target.startsWith("xl/") ? target : `xl/${target}`;
      const file = zip.file(normalizedTarget);
      if (!file) return "";
      const base64 = await file.async("base64");
      return `data:${getMimeFromTarget(target)};base64,${base64}`;
    }

    async function parseMatrixWorkbookRowsFromFile(file) {
      const buffer = await file.arrayBuffer();
      const zip = await JSZip.loadAsync(buffer);
      // raw:true 跳过单元格格式化，大幅提升解析速度
      const workbook = XLSX.read(buffer, { type: "array", cellDates: true, raw: true, cellFormula: false });
      const sheetName = findPreferredSheetName(workbook.SheetNames || [], ["总库存情况"]) || workbook.SheetNames?.[0] || "";
      if (!sheetName) {
        throw new Error("未找到总库存情况工作表");
      }

      const sheet = workbook.Sheets[sheetName];
      if (!sheet || !sheet["!ref"]) {
        throw new Error("九宫格文件没有可读取的数据");
      }

      const imageLookup = await buildMatrixImageLookup(zip);

      // 一次性将工作表转为二维数组，避免逐单元格 encode_cell 调用
      const sheetRows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: "" });
      const imageTargets = new Map();
      const rows = [];

      // 销售时间段识别：起点固定 2026-01-01，终点读取 E1 单元格日期（c=4, r=0）
      // E1 解析失败时回退到净出库列扫描
      let salesPeriod = null;
      let periodMonths = 7;
      const FIXED_START = "2026-01-01";
      const e1Cell = sheet[XLSX.utils.encode_cell({ r: 0, c: 4 })];
      if (e1Cell) {
        const parsed = parseSalesPeriodFromCell(e1Cell);
        if (parsed && parsed.end) {
          // 起点固定，终点取 E1 解析出的 end
          salesPeriod = { start: FIXED_START, end: parsed.end };
        }
      }
      // 回退：从AP列扫描净出库数据确定终点（起点仍固定）
      if (!salesPeriod) {
        const headerRow = sheetRows[2] || [];
        const totalsRow = sheetRows[1] || [];
        let netOutboundMonths = [];
        for (let c = 41; c < headerRow.length; c++) {
          const headerText = String(headerRow[c] || "").trim();
          if (headerText.includes("净出库")) {
            const monthMatch = headerText.match(/(\d+)月/);
            const month = monthMatch ? parseInt(monthMatch[1]) : (c - 41 + 1);
            const total = Number(totalsRow[c]) || 0;
            if (total > 0) {
              netOutboundMonths.push(month);
            }
          }
        }
        if (netOutboundMonths.length > 0) {
          const endMonth = Math.max(...netOutboundMonths);
          const year = new Date().getFullYear();
          const endDay = new Date(year, endMonth, 0).getDate();
          salesPeriod = {
            start: FIXED_START,
            end: `${year}-${String(endMonth).padStart(2, "0")}-${String(endDay).padStart(2, "0")}`,
          };
        }
      }
      // 根据 start~end 计算 periodMonths
      if (salesPeriod && salesPeriod.start && salesPeriod.end) {
        const start = new Date(salesPeriod.start);
        const end = new Date(salesPeriod.end);
        if (!isNaN(start) && !isNaN(end)) {
          periodMonths = Math.max(1, Math.round((end - start) / (30 * 24 * 60 * 60 * 1000)));
        }
      }

      // 表头行（第3行，索引2）动态定位“补单备注”列，兼容该列位置变化
      const headerRowCells = sheetRows[2] || [];
      let reorderNoteColIdx = -1;
      for (let c = 0; c < headerRowCells.length; c += 1) {
        if (String(headerRowCells[c] || "").trim().includes("补单")) {
          reorderNoteColIdx = c;
          break;
        }
      }

      // 数据从第4行开始（索引3）
      for (let rowIdx = 3; rowIdx < sheetRows.length; rowIdx += 1) {
        const r = sheetRows[rowIdx] || [];
        const productName = String(r[3] ?? "").trim();
        const barcode = String(r[0] ?? "").trim();
        const sku = String(r[4] ?? "").trim();
        if (!productName && !barcode && !sku) continue;

        const spec = String(r[5] ?? "").trim();
        const category = String(r[6] ?? "").trim();
        const retailPrice = maybeNumber(r[7]);
        // I列(8)=生产备注，区分正常、停产、待定（其他）
        const productionNote = String(r[8] ?? "").trim();
        // 补单备注：按表头动态定位，用于识别“在途”补单
        const reorderNote = reorderNoteColIdx >= 0 ? String(r[reorderNoteColIdx] ?? "").trim() : "";
        const isRegularPrice = ""; // 新版无此列，留空
        // M列(12)=到期日期, N列(13)=剩余天数（等价）, O列(14)=即时库存, P列(15)=日销系数
        const remainingDays = maybeNumber(r[13]);
        const currentStock = parseNumber(r[14], 0);
        const dailySalesCoef = maybeNumber(r[15]);
        // 库存月 = 即时库存 / (日销系数 * 30)，由O列和P列计算
        const stockMonths = (dailySalesCoef !== null && dailySalesCoef > 0)
          ? currentStock / (dailySalesCoef * 30)
          : null;
        // 兼容旧版：线上月均(21)+线下月均(24)计算月均销量，新版无此列则为0
        const onlineMonthlyAvg = parseNumber(r[20], 0);
        const offlineMonthlyAvg = parseNumber(r[23], 0);
        const monthlyAverage = onlineMonthlyAvg + offlineMonthlyAvg;
        const stockHealth = String(r[26] ?? "").trim() || getStockHealthLabel(stockMonths);
        const salesTrend = String(r[27] ?? "").trim();
        // periodMonths 由净出库列数据扫描得出（后续会延长）
        const salesQty = Math.round(monthlyAverage * periodMonths);
        const derivedStockMonths = stockMonths;
        const sellOutDays = (stockMonths !== null && stockMonths !== undefined)
          ? stockMonths * 30
          : (monthlyAverage > 0 ? (currentStock / monthlyAverage) * 30 : Infinity);
        // 负数消化周期为异常情况：能否卖完直接判定为 false（卖不完）
        const canSellBeforeExpiry = (sellOutDays !== null && sellOutDays < 0)
          ? false
          : (sellOutDays !== null && remainingDays !== null ? sellOutDays <= remainingDays : null);

        // 图片：DISPIMG 公式存在 cell.f 或 cell.v 中
        const imageCell = sheet[XLSX.utils.encode_cell({ r: rowIdx, c: 2 })];
        const imageId = extractDispImgId(imageCell);
        const imageTarget = imageLookup.get(imageId) || "";
        if (imageId && imageTarget) {
          imageTargets.set(imageId, imageTarget);
        }

        rows.push({
          key: makeBarcodeKey({ barcode, sku, specCode: sku, productCode: sku, productName, spec }),
          barcode,
          id: String(r[1] ?? "").trim(),
          imageId,
          imageTarget,
          productName,
          spec,
          category,
          productionNote,
          reorderNote,
          isRegularPrice,
          retailPrice,
          sku,
          stockQty: currentStock,
          stockMonths: derivedStockMonths,
          remainingDays,
          dailySalesCoef,
          stockHealth,
          salesTrend,
          salesQty,
          monthlyAverageSales: monthlyAverage,
          sellOutDays,
          canSellBeforeExpiry,
          raw: r.slice(0, 30),
        });
      }

      // 图片分批加载，避免一次性 Promise.all 创建过多并发
      const uniqueTargets = Array.from(new Set(Array.from(imageTargets.values())));
      const imageDataByTarget = {};
      const BATCH_SIZE = 20;
      for (let i = 0; i < uniqueTargets.length; i += BATCH_SIZE) {
        const batch = uniqueTargets.slice(i, i + BATCH_SIZE);
        await Promise.all(batch.map(async (target) => {
          imageDataByTarget[target] = await buildMatrixImageData(zip, target);
        }));
      }

      rows.forEach((row) => {
        row.imageUrl = row.imageTarget ? imageDataByTarget[row.imageTarget] || "" : "";
      });

      return {
        sheetName,
        rows,
        imageDataByTarget,
        salesPeriod,
        periodMonths,
      };
    }

    function parseMatrixWorkbookRows(rows) {
      return Array.isArray(rows) ? rows : [];
    }

    function parseProductRows(rows) {
      const [headers, ...body] = rows;
      const map = headerIndex(headers || []);
      return body.map((row) => {
        const productName = getCell(row, map, ["货品名称", "商品名称", "品名", "SKU名称", "商品名"]);
        const barcode = getCell(row, map, ["条码", "商品条码", "规格条码"]);
        const sku = getCell(row, map, ["货品编号", "规格编号", "商品编码", "商品/规格编码"]);
        const spec = getCell(row, map, ["规格"]);
        const imageUrl = getCell(row, map, ["图片", "图片链接", "主图", "SKU图片", "image", "imageUrl"]);
        return {
          key: makeBarcodeKey({ barcode, sku, specCode: sku, productCode: sku, productName, spec }),
          productName,
          barcode,
          sku,
          spec,
          imageUrl,
          scentFamily: getCell(row, map, ["香型"]),
          category: getCell(row, map, ["分类", "商品类目", "一级分类", "类别", "商品分类", "类目"]),
          brand: getCell(row, map, ["品牌"]),
          unit: getCell(row, map, ["基础单位", "单位"]),
          retailPrice: maybeNumber(getCell(row, map, ["零售价", "建议零售价(元)", "最新采购单价(元)"])),
          isRegularPrice: parseYesNo(getCell(row, map, ["是否正价", "是否正价品", "正价", "是否正价商品"])),
          shelfLifeDays: maybeNumber(getCell(row, map, ["保质期"])),
          batchManaged: getCell(row, map, ["批次管理"]),
          owner: getCell(row, map, ["货主"]),
          productionNote: getCell(row, map, ["生产情况", "生产备注", "生产状态"]),
          raw: row,
        };
      }).filter((row) => (row.productName || row.barcode || row.sku) && !isAggregateLabel(row.productName) && !isAggregateLabel(row.barcode));
    }

    function parseWarehouseRows(rows) {
      const [headers, ...body] = rows;
      const map = headerIndex(headers || []);
      return body.map((row) => {
        const warehouse = getCell(row, map, ["仓库", "门店/仓库", "门店", "店铺"]);
        const batchNo = getCell(row, map, ["批次"]);
        const productName = getCell(row, map, ["货品名称", "商品名称"]);
        const sku = getCell(row, map, ["货品编号", "商品编码", "规格编码", "商品/规格编码"]);
        const spec = getCell(row, map, ["规格", "商品/规格条码", "规格项1"]);
        const barcode = getCell(row, map, ["条码", "商品条码", "规格条码"]);
        const stockQty = parseNumber(getCell(row, map, ["库存数量", "实物库存", "库存"]), 0);
        const availableQty = parseNumber(getCell(row, map, ["可用库存", "实物库存", "库存数量"]), stockQty);
        const productionDate = formatDateValue(getCell(row, map, ["生产日期"]));
        const expiryDate = formatDateValue(getCell(row, map, ["到期日期"]));
        return {
          key: makeBarcodeKey({ barcode, sku, specCode: sku, productCode: sku, productName, spec }),
          location: warehouse,
          batchNo,
          productName,
          barcode,
          sku,
          spec,
          stockQty,
          availableQty,
          frozenQty: parseNumber(getCell(row, map, ["批次冻结库存"]), 0),
          productionDate,
          shelfLifeDays: maybeNumber(getCell(row, map, ["保质期"])),
          shelfLifeUnit: getCell(row, map, ["保质期单位"]),
          remainingDays: maybeNumber(getCell(row, map, ["剩余有效天数"])),
          expiryDate,
          company: getCell(row, map, ["业务员"]),
          batchRemark: getCell(row, map, ["批次备注"]),
          raw: row,
        };
      }).filter((row) => (row.productName || row.barcode || row.sku || row.location) && !isAggregateLabel(row.productName) && !isAggregateLabel(row.barcode));
    }

    function parseStoreInventoryRows(rows) {
      const [headers, ...body] = rows;
      const map = headerIndex(headers || []);
      return body.map((row) => {
        const location = getCell(row, map, ["门店/仓库", "门店", "店铺"]);
        const batchNo = getCell(row, map, ["批次"]);

        const sku = getCell(row, map, ["商品编码(SPU)", "商品/规格编码", "规格编码", "商品编码"]);
        const spec = getCell(row, map, ["商品/规格条码", "商品/规格编码", "规格项1", "规格项2", "规格项3"]);
        const barcode = getCell(row, map, ["商品/规格条码", "商品条码", "规格条码"]);
        const stockQty = parseNumber(getCell(row, map, ["实物库存", "库存数量", "可用库存"]), 0);
        const availableQty = parseNumber(getCell(row, map, ["可用库存", "实物库存", "库存数量"]), stockQty);
        const productionDate = formatDateValue(getCell(row, map, ["生产日期"]));
        const expiryDate = formatDateValue(getCell(row, map, ["到期日期"]));
        return {
          key: makeBarcodeKey({ barcode, sku, specCode: sku, productCode: sku, productName, spec }),
          location,
          batchNo,
          productName,
          barcode,
          sku,
          spec,
          stockQty,
          availableQty,
          frozenQty: parseNumber(getCell(row, map, ["批次冻结库存"]), 0),
          productionDate,
          shelfLifeDays: maybeNumber(getCell(row, map, ["保质期"])),
          shelfLifeUnit: getCell(row, map, ["保质期单位"]),
          remainingDays: maybeNumber(getCell(row, map, ["剩余有效天数"])),
          expiryDate,
          raw: row,
        };
      }).filter((row) => (row.productName || row.barcode || row.sku || row.location) && !isAggregateLabel(row.productName) && !isAggregateLabel(row.barcode));
    }

    function parseChannelSalesRows(rows) {
      const [headers, ...body] = rows;
      const map = headerIndex(headers || []);
      return body.map((row) => {
        const qty = parseNumber(getCell(row, map, ["数量", "商品数量"]), 0);
        const productName = getCell(row, map, ["货品名称", "商品名称"]);
        const sku = getCell(row, map, ["货品编号", "商品编码", "规格编码"]);

        return {

          type: getCell(row, map, ["出库类型"]),

          channel,

          costAmount: maybeNumber(getCell(row, map, ["出库成本金额"])),
