      }).filter((row) => row.qty > 0 && (row.productName || row.barcode || row.sku) && !isAggregateLabel(row.productName) && !isAggregateLabel(row.barcode));
    }

    function parseStoreSalesRows(rows) {
      const [headers, ...body] = rows;
      const map = headerIndex(headers || []);
      return body.map((row) => {
        const status = getCell(row, map, ["订单商品状态"]);
        const qty = parseNumber(getCell(row, map, ["商品数量"]), 0);
        const productName = getCell(row, map, ["商品名称"]);
        const store = getCell(row, map, ["归属店铺"]);
        const spec = getCell(row, map, ["商品规格"]);
        const specCode = getCell(row, map, ["规格编码"]);
        const productCode = getCell(row, map, ["商品编码"]);
        const barcode = getCell(row, map, ["商品条码", "规格条码"]);
        return {
          key: makeBarcodeKey({ barcode, sku: specCode || productCode, specCode, productCode, productName, spec }),
          orderNo: getCell(row, map, ["订单号"]),
          time: formatDateValue(getCell(row, map, ["订单创建时间", "下单时间", "成交时间", "支付时间"])),
          brand: getCell(row, map, ["商品品牌"]),
          status,
          productName,
          type: getCell(row, map, ["商品类型"]),
          category: getCell(row, map, ["商品类目"]),
          firstCategory: getCell(row, map, ["商品一级分类"]),
          store,
          spec,
          specCode,
          productCode,
          barcode,
          unitPrice: maybeNumber(getCell(row, map, ["商品单价"])),
          finalPrice: maybeNumber(getCell(row, map, ["商品优惠后价格", "商品实际成交金额"])),
          qty,
          unit: getCell(row, map, ["商品单位"]),
          raw: row,
        };
      }).filter((row) => row.qty > 0 && row.status !== "关闭" && row.status !== "取消" && row.status !== "退款成功" && (row.productName || row.barcode || row.specCode) && !isAggregateLabel(row.productName) && !isAggregateLabel(row.barcode));
    }

    // 解析「每日销量趋势」文件：每行一个商品某天的线上/线下销量
    // 兼容两种格式：
    //   1) 宽格式：含「线上销量/线下销量」两列
    //   2) 长格式：含「渠道」列(线上/线下) + 「数量」列
    function parseSalesTrendRows(rows) {
      const [headers, ...body] = rows;
      const map = headerIndex(headers || []);
      const result = [];
      for (const row of body) {
        const productName = getCell(row, map, ["品名", "商品名称", "货品名称", "SKU名称", "商品"]);
        const barcode = getCell(row, map, ["条码", "商品条码", "规格条码"]);
        const sku = getCell(row, map, ["货品编号", "商品编码", "规格编码", "规格编号", "SKU", "商品/规格编码"]);
        const spec = getCell(row, map, ["规格", "商品规格"]);
        const date = formatDateValue(getCell(row, map, ["日期", "销售日期", "统计日期", "时间", "出库时间", "下单时间", "date"]));
        if (!date || !/^\d{4}-\d{2}-\d{2}/.test(date)) continue;
        if (!productName && !barcode && !sku) continue;
        if (isAggregateLabel(productName) || isAggregateLabel(barcode)) continue;

        const key = makeBarcodeKey({ barcode, sku, specCode: sku, productCode: sku, productName, spec });
        const channelRaw = String(getCell(row, map, ["渠道", "销售渠道", "渠道类型", "线上/线下"])).trim();
        const qty = parseNumber(getCell(row, map, ["数量", "销售数量", "销量", "销售量"]), 0);

        let onlineQty = 0;
        let offlineQty = 0;

        const channelNorm = normalizeText(channelRaw);
        if (channelNorm) {
          // 长格式：按渠道归类
          if (channelNorm.includes("线上") || channelNorm.includes("online") || channelNorm.includes("电商") || channelNorm.includes("淘宝") || channelNorm.includes("天猫") || channelNorm.includes("抖音") || channelNorm.includes("京东")) {
            onlineQty = qty;
          } else if (channelNorm.includes("线下") || channelNorm.includes("offline") || channelNorm.includes("门店") || channelNorm.includes("实体") || channelNorm.includes("自营")) {
            offlineQty = qty;
          } else {
            // 未知渠道，默认计入线下
            offlineQty = qty;
          }
        } else {
          // 宽格式：直接读取线上/线下两列
          onlineQty = parseNumber(getCell(row, map, ["线上销量", "线上销售数量", "线上数量", "线上", "线上销售", "online", "电商销量"]), 0);
          offlineQty = parseNumber(getCell(row, map, ["线下销量", "线下销售数量", "线下数量", "线下", "线下销售", "offline", "门店销量"]), 0);
        }

        if (onlineQty <= 0 && offlineQty <= 0) continue;

        result.push({
          key,
          productName,
          barcode,
          sku,
          spec,
          date,
          onlineQty: Math.max(0, onlineQty),
          offlineQty: Math.max(0, offlineQty),
          raw: row,
        });
      }
      return result;
    }

    // 每日销量趋势文件解析见 parseSalesTrendRowsFromFile（主线程，复用已加载的 XLSX）
    // 兼容多种日期格式：Date / Excel 序号 / YYYY-MM-DD / YYYY/MM/DD / YYYYMMDD(紧凑)
    // 解析 E1 单元格日期为销售时间段 {start, end}
    // 支持：Date对象、Excel日期序列号、字符串（单日期或日期范围）
    function parseSalesPeriodFromCell(cell) {
      if (!cell) return null;
      const v = cell.v;
      if (v == null) return null;

      // Date 对象（cellDates:true 时）
      if (v instanceof Date && !Number.isNaN(v.getTime())) {
        const dateStr = v.toISOString().slice(0, 10);
        return { start: dateStr, end: dateStr };
      }

      // Excel 日期序列号
      if (typeof v === "number" && v > 20000 && v < 70000) {
        const base = new Date(Date.UTC(1899, 11, 30));
        base.setUTCDate(base.getUTCDate() + v);
        const dateStr = base.toISOString().slice(0, 10);
        return { start: dateStr, end: dateStr };
      }

      // 字符串
      const text = String(v).trim();
      if (!text) return null;

      // 日期范围：如 "2024-01-01~2024-07-31"、"2024/1/1 - 2024/7/31"、"2024.01.01至2024.07.31"
      const rangeMatch = text.match(/(\d{4}[-./]\d{1,2}[-./]\d{1,2})\s*[~\-至到~]+\s*(\d{4}[-./]\d{1,2}[-./]\d{1,2})/);
      if (rangeMatch) {
        return { start: normalizeDateStr(rangeMatch[1]), end: normalizeDateStr(rangeMatch[2]) };
      }

      // 单个日期
      const dateMatch = text.match(/(\d{4}[-./]\d{1,2}[-./]\d{1,2})/);
      if (dateMatch) {
        const dateStr = normalizeDateStr(dateMatch[1]);
        return { start: dateStr, end: dateStr };
      }

      return null;
    }

    // 统一日期字符串为 "YYYY-MM-DD" 格式
    function normalizeDateStr(s) {
      const m = String(s).match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
      if (!m) return String(s);
      return `${m[1]}-${String(m[2]).padStart(2, "0")}-${String(m[3]).padStart(2, "0")}`;
    }

    function parseTrendDate(value) {
      if (!value) return "";
      if (value instanceof Date && !Number.isNaN(value.getTime())) return value.toISOString().slice(0, 10);
      if (typeof value === "number" && value > 20000 && value < 70000) {
        const base = new Date(Date.UTC(1899, 11, 30));
        base.setUTCDate(base.getUTCDate() + value);
        return base.toISOString().slice(0, 10);
      }
      const text = String(value).trim();
      let m = text.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
      if (m) return `${m[1]}-${String(m[2]).padStart(2, "0")}-${String(m[3]).padStart(2, "0")}`;
      m = text.match(/^(\d{4})(\d{2})(\d{2})$/);
      if (m) return `${m[1]}-${m[2]}-${m[3]}`;
      return "";
    }

    // 优先 69 码(EAN-13) 作为商品主键，和九宫格保持一致，避免线下 P 码与线上 69 码对不上
    function pickTrendBarcode(...cands) {
      const list = cands.map((v) => (v == null ? "" : String(v).trim())).filter(Boolean);
      return list.find((v) => /^69\d{11}$/.test(v)) || list.find((v) => /^\d{13}$/.test(v)) || list[0] || "";
    }

    // 销售趋势专用：统一用 69 码做 key，保证出库单(线上)和门店单(线下)能按同一商品对齐
    function makeTrendKey(row) {
      const barcode = pickTrendBarcode(row.barcode, row.sku, row.specCode, row.productCode);
      if (barcode) return barcode;
      return keyFrom(row.productName, row.spec);
    }

    // 用 Web Worker + JSZip + 正则解析 xlsx，比 SheetJS 快 30 倍
    // 关键优化：用 JSZip 按需解压（跳过图片），用正则只提取需要的列
    function parseSalesTrendWorker(buffer) {
      return new Promise((resolve, reject) => {
        const workerCode = [
          "importScripts('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');",
          "function norm(v){return String(v==null?'':v).trim().replace(/\\s+/g,'').replace(/[()（）【】\\[\\]\\/\\\\,，。:：;；._-]/g,'').toLowerCase();}",
          "function pDate(v){if(!v)return'';var t=String(v).trim();var m=t.match(/^(\\d{4})[-/](\\d{1,2})[-/](\\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');m=t.match(/^(\\d{4})(\\d{2})(\\d{2})$/);if(m)return m[1]+'-'+m[2]+'-'+m[3];if(typeof v==='number'&&v>20000&&v<70000){var b=new Date(Date.UTC(1899,11,30));b.setUTCDate(b.getUTCDate()+v);return b.toISOString().slice(0,10);}return'';}",
          "function pNum(v,f){f=f||0;if(v==null||v==='')return f;var m=String(v).replace(/,/g,'').trim().match(/-?\\d+(?:\\.\\d+)?/);return m?Number(m[0]):f;}",
          "function colToIdx(col){var idx=0;for(var i=0;i<col.length;i++)idx=idx*26+(col.charCodeAt(i)-64);return idx-1;}",
          "function unesc(s){return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'\"').replace(/&#39;/g,\"'\");}",
          "function parseSS(xml){var ss=[];var re=/<si>([\\s\\S]*?)<\\/si>/g;var m;while((m=re.exec(xml))!==null){var ts=[];var tr=/<t[^>]*>([\\s\\S]*?)<\\/t>/g;var tm;while((tm=tr.exec(m[1]))!==null)ts.push(unesc(tm[1]));ss.push(ts.join(''));}return ss;}",
          "function parseWB(wbXml,relsXml){var sheets=[];var rels={};var rm;var rr=/<Relationship\\s+Id=\"([^\"]+)\"[^>]*Target=\"([^\"]+)\"/g;while((rm=rr.exec(relsXml))!==null)rels[rm[1]]=rm[2];var sm;var sr=/<sheet\\s+name=\"([^\"]+)\"[^>]*r:id=\"([^\"]+)\"/g;while((sm=sr.exec(wbXml))!==null){sheets.push({name:sm[1],file:rels[sm[2]]||('worksheets/sheet'+(sheets.length+1)+'.xml')});}return sheets;}",
          "function extractRow(rowXml,targetCols,ss){var cells={};var re=/<c r=\"([A-Z]+)\\d+\"([^>]*)>([\\s\\S]*?)<\\/c>/g;var m;while((m=re.exec(rowXml))!==null){var ci=colToIdx(m[1]);if(!targetCols.has(ci))continue;var tM=m[2].match(/\\bt=\"(\\w+)\"/);var type=tM?tM[1]:'';var vM=m[3].match(/<v>([^<]*)<\\/v>/);var val=vM?vM[1]:'';cells[ci]=type==='s'?(ss[parseInt(val)]||''):val;}return cells;}",
          "function forEachRow(xml,cb){var parts=xml.split('</row>');for(var i=0;i<parts.length-1;i++){if(parts[i].indexOf('<row')>=0)cb(parts[i]);}}",
          "self.onmessage=async function(e){try{",
          "  var zip=await JSZip.loadAsync(e.data);",
          "  var ssFile=zip.file('xl/sharedStrings.xml');var ss=ssFile?parseSS(await ssFile.async('string')):[];",
          "  var wbXml=await zip.file('xl/workbook.xml').async('string');",
          "  var relsXml=await zip.file('xl/_rels/workbook.xml.rels').async('string');",
          "  var sheets=parseWB(wbXml,relsXml);",
          "  var pm=new Map(),cm=new Map(),agg=new Map(),used=[];",
          "  function addR(k,pn,d,on,off,cat){if(!k||!d)return;var kk=k+'__'+d;var en=agg.get(kk);if(!en){en={key:k,productName:pn||'',barcode:k,sku:'',spec:'',date:d,onlineQty:0,offlineQty:0,category:cat||''};agg.set(kk,en);}en.onlineQty+=on;en.offlineQty+=off;if(!en.productName&&pn)en.productName=pn;if(!en.category&&cat)en.category=cat;}",
          "  for(var si=0;si<sheets.length;si++){",
          "    var sh=sheets[si];var file=zip.file('xl/'+sh.file);if(!file)continue;",
          "    var xml=await file.async('string');var nn=norm(sh.name);",
          "    if(nn.indexOf('商品资料')>=0||nn.indexOf('商品信息')>=0){",
          "      var tc=new Set([0,3,6]);var hi=0;var rows=xml.split('</row>');",
          "      for(var h=0;h<Math.min(3,rows.length);h++){if(rows[h].indexOf('条码')>=0){hi=h;break;}}",
          "      for(var i=hi+1;i<rows.length-1;i++){var c=extractRow(rows[i],tc,ss);var bc=String(c[0]||'').trim();var pn=String(c[3]||'').trim();var cat=String(c[6]||'').trim();if(bc&&/^\\d{12,14}$/.test(bc)){pm.set(bc,pn);if(cat)cm.set(bc,cat);}}",
          "      used.push(sh.name);continue;",
          "    }",
          "    if((nn.indexOf('线上销售')>=0||nn.indexOf('线上销量')>=0)&&nn.indexOf('退货')<0){",
          "      var tc=new Set([8,9,49,6]);forEachRow(xml,function(rx){var c=extractRow(rx,tc,ss);var bc=String(c[8]||'').trim();var d=pDate(c[49]);var q=pNum(c[9],0);if(!bc||!d||q<=0)return;var pn=pm.get(bc)||String(c[6]||'').trim();addR(bc,pn,d,q,0,cm.get(bc)||'');});",
          "      used.push(sh.name);continue;",
          "    }",
          "    if(nn.indexOf('退货')>=0){",
          "      var tc=new Set([11,12,50,9]);forEachRow(xml,function(rx){var c=extractRow(rx,tc,ss);var bc=String(c[11]||'').trim();var d=pDate(c[50]);var q=pNum(c[12],0);if(!bc||!d||q<=0)return;var pn=pm.get(bc)||String(c[9]||'').trim();addR(bc,pn,d,-q,0,cm.get(bc)||'');});",
          "      used.push(sh.name);continue;",
          "    }",
          "    if(nn.indexOf('线下销售')>=0||nn.indexOf('线下销量')>=0||nn.indexOf('门店')>=0){",
          "      var tc=new Set([14,19,50,3,2]);forEachRow(xml,function(rx){var c=extractRow(rx,tc,ss);var bc=String(c[14]||'').trim();var d=pDate(c[50]);var q=pNum(c[19],0);var st=String(c[2]||'').trim();if(st==='关闭'||st==='取消'||st==='退款成功')return;if(!bc||!d||q<=0)return;var pn=pm.get(bc)||String(c[3]||'').trim();addR(bc,pn,d,0,q,cm.get(bc)||'');});",
          "      used.push(sh.name);continue;",
          "    }",
          "  }",
          "  var all=Array.from(agg.values());",
          "  all.forEach(function(r){if(r.onlineQty<0)r.onlineQty=0;if(r.offlineQty<0)r.offlineQty=0;});",
          "  all=all.filter(function(r){return r.onlineQty>0||r.offlineQty>0;});",
          "  self.postMessage({ok:1,sheetName:used.join(' + '),rows:all});",
          "}catch(err){self.postMessage({ok:0,err:String(err.message||err)});}",
          "};"
        ].join("\n");

        let done = false;
        function fallback() {
          if (done) return; done = true;
          try {
            const wb = XLSX.read(buffer, { type: "array", cellDates: false, raw: true, cellFormula: false });
            const sheets = {};
            wb.SheetNames.forEach((sn) => { sheets[sn] = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: "" }); });
            resolve({ sheetNames: wb.SheetNames, sheets });
          } catch (err) { reject(err); }
        }
        try {
          const blob = new Blob([workerCode], { type: "application/javascript" });
          const worker = new Worker(URL.createObjectURL(blob));
          const timer = setTimeout(() => { try { worker.terminate(); } catch (_) {} fallback(); }, 300000);
          worker.onmessage = (e) => {
            clearTimeout(timer); try { worker.terminate(); } catch (_) {}
            if (done) return; done = true;
            if (e.data.ok === 1) resolve({ directResult: { sheetName: e.data.sheetName, rows: e.data.rows } });
            else reject(new Error(e.data.err || "worker error"));
          };
          worker.onerror = (err) => { clearTimeout(timer); try { worker.terminate(); } catch (_) {} fallback(); };
          worker.postMessage(buffer);
        } catch (_) { fallback(); }
      });
    }

    // 保留旧函数名兼容（主线程 fallback 用）
    function parseWorkbookAsync(buffer) {
      return new Promise((resolve, reject) => {
        try {
          const wb = XLSX.read(buffer, { type: "array", cellDates: false, raw: true, cellFormula: false });
          const sheets = {};
          wb.SheetNames.forEach((sn) => { sheets[sn] = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: "" }); });
          resolve({ sheetNames: wb.SheetNames, sheets });
        } catch (err) { reject(err); }
      });
    }

    async function parseSalesTrendRowsFromFile(file) {
      const lower = file.name.toLowerCase();
      // CSV：单表，主线程通用解析
      if (lower.endsWith(".csv")) {
        const text = await file.text();
        const rows = parseCsvText(text);
        return { sheetName: file.name, rows: parseSalesTrendRows(rows) };
      }
      if (!window.XLSX) {
        throw new Error("Excel 解析库没有加载成功，请刷新页面后重试。");
      }
      const buffer = await file.arrayBuffer();
      // 让「解析中」状态先渲染出来，再开始解析
      await new Promise((resolve) => setTimeout(resolve, 30));

      // 优先用 Web Worker 在后台完成全部解析（读取+聚合），避免大文件阻塞 UI
      // Worker 只传回聚合后的 rows，避免大对象 postMessage 超时
      const workerResult = await parseSalesTrendWorker(buffer);
      if (workerResult.directResult) {
        // Worker 成功完成全部解析，直接返回结果
        return workerResult.directResult;
      }

      // Worker 失败，回退到主线程解析
      const { sheetNames: wbSheetNames, sheets: wbSheets } = workerResult;

      // ===== 新数据源结构（趋势图数据源 0630.xlsx）=====
      // 子表1 商品资料：商品主档，用条码关联品名
      // 子表2 线上销售：I列(8)条码、AX列(49)日期、J列(9)数量
      // 子表3 线上退货：L列(11)条码、AY列(50)日期、M列(12)数量
      // 子表4 线下销售：O列(14)规格条码、AY列(50)日期、T列(19)数量
      // 线上净销售 = 线上销售 - 线上退货；线下净销售 = 线下销售

      // 商品资料：条码 -> 品名
      const productMap = new Map();

      // 按 商品key+日期 聚合
      const agg = new Map();
      const addRow = (key, info, date, onlineQty, offlineQty) => {
        if (!key || !date) return;
        const k = key + "__" + date;
        let entry = agg.get(k);
        if (!entry) {
          entry = { key, productName: info.productName || "", barcode: info.barcode || "", sku: info.sku || "", spec: info.spec || "", category: info.category || "", date, onlineQty: 0, offlineQty: 0 };
          agg.set(k, entry);
        }
        entry.onlineQty += onlineQty;
        entry.offlineQty += offlineQty;
        if (!entry.productName && info.productName) entry.productName = info.productName;
        if (!entry.barcode && info.barcode) entry.barcode = info.barcode;
        if (!entry.sku && info.sku) entry.sku = info.sku;
        if (!entry.category && info.category) entry.category = info.category;
      };

      const usedSheets = [];

      for (const sheetName of wbSheetNames) {
        const rows = cleanSheetRows(wbSheets[sheetName] || []);
        if (!rows.length) continue;
        const nameNorm = normalizeText(sheetName);

        // 子表1：商品资料 —— 建立条码→品名映射
        if (nameNorm.includes("商品资料") || nameNorm.includes("商品信息") || nameNorm.includes("产品资料")) {
          // 商品资料表可能有标题行/时间戳行，真正表头不一定在第0行
          // 找到包含"条码"的那一行作为表头
          let headerRowIdx = 0;
          let map = headerIndex(rows[0] || []);
          if (!map.has(normalizeText("条码"))) {
            for (let h = 1; h < Math.min(5, rows.length); h++) {
              const testMap = headerIndex(rows[h] || []);
              if (testMap.has(normalizeText("条码"))) {
                headerRowIdx = h;
                map = testMap;
                break;
              }
            }
          }
          for (let i = headerRowIdx + 1; i < rows.length; i++) {
            const row = rows[i];
            const barcode = pickTrendBarcode(getCell(row, map, ["条码", "商品条码", "规格条码", "69码"]));
            const productName = getCell(row, map, ["产品名称", "商品名称", "货品名称", "品名"]);
            const sku = getCell(row, map, ["货号", "商品编码", "规格编码", "SKU"]);
            const category = getCell(row, map, ["分类", "商品类目", "一级分类", "类别", "商品分类", "类目"]);
            if (barcode) {
              productMap.set(barcode, { productName: productName || "", sku: sku || "", category: category || "" });
            }
          }
          usedSheets.push(sheetName);
          continue;
        }

        // 子表2：线上销售 —— I列(8)条码、AX列(49)日期、J列(9)数量
        if (nameNorm.includes("线上销售") || nameNorm.includes("线上销量")) {
          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            const barcode = String(row[8] != null ? row[8] : "").trim();
            const date = parseTrendDate(row[49]);
            const qty = parseNumber(row[9], 0);
            if (!barcode || !date || qty <= 0) continue;
            const key = barcode;
            const pInfo = productMap.get(barcode) || {};
            // 商品资料表查到的品名优先，否则用本表 col[6] 货品名称
            const fallbackName = String(row[6] != null ? row[6] : "").trim();
            addRow(key, { productName: pInfo.productName || fallbackName || "", barcode, sku: pInfo.sku || "", category: pInfo.category || "" }, date, qty, 0);
          }
          usedSheets.push(sheetName);
          continue;
        }

        // 子表3：线上退货 —— L列(11)条码、AY列(50)日期、M列(12)数量
        if (nameNorm.includes("线上退货") || nameNorm.includes("退货")) {
          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            const barcode = String(row[11] != null ? row[11] : "").trim();
            const date = parseTrendDate(row[50]);
            const qty = parseNumber(row[12], 0);
            if (!barcode || !date || qty <= 0) continue;
            const key = barcode;
            const pInfo = productMap.get(barcode) || {};
            const fallbackName = String(row[9] != null ? row[9] : "").trim();
            // 退货扣减线上销量
            addRow(key, { productName: pInfo.productName || fallbackName || "", barcode, sku: pInfo.sku || "", category: pInfo.category || "" }, date, -qty, 0);
          }
          usedSheets.push(sheetName);
          continue;
        }

        // 子表4：线下销售 —— O列(14)规格条码、AY列(50)日期、T列(19)数量
        if (nameNorm.includes("线下销售") || nameNorm.includes("线下销量") || nameNorm.includes("门店")) {
          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            const barcode = pickTrendBarcode(String(row[14] != null ? row[14] : "").trim());
            const date = parseTrendDate(row[50]);
            const qty = parseNumber(row[19], 0);
            if (!barcode || !date || qty <= 0) continue;
            // 跳过已关闭/取消/退款的订单
            const status = String(row[2] != null ? row[2] : "").trim();
            if (status === "关闭" || status === "取消" || status === "退款成功") continue;
            const key = barcode;
            const pInfo = productMap.get(barcode) || {};
            const fallbackName = String(row[3] != null ? row[3] : "").trim();
            addRow(key, { productName: pInfo.productName || fallbackName || "", barcode, sku: pInfo.sku || "", category: pInfo.category || "" }, date, 0, qty);
          }
          usedSheets.push(sheetName);
          continue;
        }
      }

      let rows = Array.from(agg.values());
      // 线上净销售 = 销售 - 退货，如果退货>销售则净值为负，限制为0
      rows.forEach((r) => {
        if (r.onlineQty < 0) r.onlineQty = 0;
        if (r.offlineQty < 0) r.offlineQty = 0;
      });
      // 过滤掉全部为0的记录
      rows = rows.filter((r) => r.onlineQty > 0 || r.offlineQty > 0);

      if (!rows.length) {
        // 未识别到新结构子表时，回退到旧解析逻辑
        const fd = await readRowsFromFile(file);
        rows = parseSalesTrendRows(fd.rows);
        return { sheetName: fd.sheetName, rows };
      }
      return { sheetName: usedSheets.length ? usedSheets.join(" + ") : file.name, rows };
    }

    function parseInventorySalesRows(rows) {
      const [headers, ...body] = rows;
      const map = headerIndex(headers || []);
      return body.map((row) => {
        const productName = getCell(row, map, ["品名", "货品名称", "商品名称", "SKU名称"]);
        const barcode = getCell(row, map, ["条码", "商品条码", "规格条码"]);
        const sku = getCell(row, map, ["货品编号", "商品编码", "规格编号", "商品/规格编码"]);
        const spec = getCell(row, map, ["规格"]);
        const category = getCell(row, map, ["分类", "商品类目", "一级分类"]);
        const brand = getCell(row, map, ["品牌"]);
        const imageUrl = getCell(row, map, ["图片", "图片链接", "主图", "SKU图片", "image", "imageUrl"]);
        const salesQty = parseNumber(getCell(row, map, ["销售数量", "今年销量", "销量", "近90天销量", "销售量"]), 0);
        const stockQty = parseNumber(getCell(row, map, ["即时库存", "当前库存", "库存数量", "库存"]), 0);
        const stockAmount = maybeNumber(getCell(row, map, ["库存金额", "库存金额(元)", "库存总金额", "库存货值"]));
        const remainingDays = maybeNumber(getCell(row, map, ["库存保质期", "保质期", "剩余保质期", "剩余天数"]));
        const expiryDate = formatDateValue(getCell(row, map, ["到期日期", "有效期至", "截止日期"]));
        const isRegularPrice = parseYesNo(getCell(row, map, ["是否正价", "是否正价品", "正价", "是否正价商品"]));
        const retailPrice = maybeNumber(getCell(row, map, ["零售价", "建议零售价(元)", "最新零售价"]));
        return {
          key: makeBarcodeKey({ barcode, sku, specCode: sku, productCode: sku, productName, spec }),
          productName,
          barcode,
          sku,
          spec,
          category,
          brand,
          imageUrl,
          salesQty,
          stockQty,
          stockAmount,
          remainingDays,
          shelfLifeDays: remainingDays,
          expiryDate,
          isRegularPrice,
          retailPrice,
          raw: row,
        };
      }).filter((row) => (row.productName || row.barcode || row.sku) && !isAggregateLabel(row.productName) && !isAggregateLabel(row.barcode));
    }

    function aggregateRows(rows, keyFn, buildRow) {
      const map = new Map();
      rows.forEach((row) => {
        const key = keyFn(row);
        if (!key) return;
        const current = map.get(key);
        if (!current) {
          map.set(key, buildRow(row));
          return;
        }
        buildRow(row, current);
      });
      return Array.from(map.values());
    }

    function summarizeChannelSales(rows) {
      return aggregateRows(rows, (row) => keyFrom(row.channel, row.barcode, row.sku, row.productName, row.spec), (row, current) => {
        if (!current) {
          return {
            key: keyFrom(row.channel, row.barcode, row.sku, row.productName, row.spec),
            orderCount: 1,
            qty: row.qty,
            channel: row.channel,
            warehouse: row.warehouse,
            productName: row.productName,
            barcode: row.barcode,
            sku: row.sku,
            spec: row.spec,
            latestTime: row.time,
          };
        }
        current.orderCount += 1;
        current.qty += row.qty;
        current.channel = current.channel || row.channel;
        current.warehouse = current.warehouse || row.warehouse;
        current.latestTime = current.latestTime || row.time;
        return current;
      });
    }

    function summarizeStoreSales(rows) {
      return aggregateRows(rows, (row) => keyFrom(row.store, row.barcode, row.specCode, row.productCode, row.productName, row.spec), (row, current) => {
        if (!current) {
          return {
            key: keyFrom(row.store, row.barcode, row.specCode, row.productCode, row.productName, row.spec),
            orderCount: 1,
            qty: row.qty,
            store: row.store,
            productName: row.productName,
            barcode: row.barcode,
            spec: row.spec,
            specCode: row.specCode,
            productCode: row.productCode,
            unitPrice: row.unitPrice,
            finalPrice: row.finalPrice,
            status: row.status,
          };
        }
        current.orderCount += 1;
        current.qty += row.qty;
        current.unitPrice = current.unitPrice || row.unitPrice;
        current.finalPrice = current.finalPrice || row.finalPrice;
        current.status = current.status || row.status;
        return current;
      });
    }

    function buildLinkedRows(sources) {
      const map = new Map();
      const periodDays = getSalesPeriodDays();
      // 用于计算加权平均到期日期的批次数据收集
      const batchExpiryData = new Map(); // key -> [{expiryDate, availableQty}]

      const ensure = (key) => {
        if (!map.has(key)) {
          map.set(key, {
            key,
            productName: "",
            barcode: "",
            sku: "",
            spec: "",
            brand: "",
            category: "",
            retailPrice: null,
            warehouseStock: 0,
            warehouseAvailable: 0,
            storeStock: 0,
            storeAvailable: 0,
            channelSalesQty: 0,
            storeSalesQty: 0,
            totalSalesQty: 0,
            stockDepthDays: null,
            remainingDays: null,
            productionDate: "",
            expiryDate: "",
            avgExpiryDate: "", // 加权平均到期日期
            productionNote: "", // 生产备注
            reorderNote: "", // 补单备注
            sourceCount: 0,
            sourceFlags: {
              product: false,
              warehouse: false,
              storeInventory: false,
              channelSales: false,
              storeSales: false,
            },
          });
        }
        return map.get(key);
      };

      // 收集批次到期日期数据用于加权平均计算
      const collectBatchExpiry = (key, expiryDate, availableQty) => {
        if (!key || !expiryDate || !availableQty || availableQty <= 0) return;
        // 标准化日期格式
        const dateStr = String(expiryDate).trim();
        if (!dateStr) return;
        if (!batchExpiryData.has(key)) {
          batchExpiryData.set(key, []);
        }
        batchExpiryData.get(key).push({ expiryDate: dateStr, availableQty });
      };

      // 计算加权平均剩余有效期（年）
      const calculateWeightedAvgRemainingYears = (key) => {
        const batches = batchExpiryData.get(key);
        if (!batches || batches.length === 0) return null;

        const now = new Date();
        let totalWeight = 0;
        let weightedDays = 0;

        for (const batch of batches) {
          const expiryDate = new Date(batch.expiryDate);
          if (Number.isNaN(expiryDate.getTime())) continue;
          const remainingDays = Math.max(0, Math.round((expiryDate.getTime() - now.getTime()) / 86400000));
          totalWeight += batch.availableQty;
          weightedDays += remainingDays * batch.availableQty;
        }

        if (totalWeight === 0) return null;

        const avgDays = weightedDays / totalWeight;
        const years = (avgDays / 365).toFixed(1); // 保留1位小数
        return years;
      };

      const mergeIdentity = (target, row) => {
        target.productName = target.productName || row.productName || "";
        target.barcode = target.barcode || row.barcode || "";
        target.sku = target.sku || row.sku || "";
        target.spec = target.spec || row.spec || "";
        target.brand = target.brand || row.brand || "";
        target.category = target.category || row.category || row.firstCategory || "";
        target.productionNote = target.productionNote || row.productionNote || "";
        target.reorderNote = target.reorderNote || row.reorderNote || "";
        if (target.retailPrice === null && row.retailPrice !== undefined && row.retailPrice !== null) {
          target.retailPrice = row.retailPrice;
        }
      };

      sources.product.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        item.sourceFlags.product = true;
      });

      sources.warehouse.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        item.sourceFlags.warehouse = true;
        item.warehouseStock += row.stockQty || 0;
        item.warehouseAvailable += row.availableQty || 0;
        const candidateDays = row.remainingDays !== null && row.remainingDays !== undefined ? row.remainingDays : daysUntil(row.expiryDate);
        if (candidateDays !== null && candidateDays !== undefined) {
          item.remainingDays = item.remainingDays === null ? candidateDays : Math.min(item.remainingDays, candidateDays);
        }
        item.productionDate = item.productionDate || row.productionDate || "";
        item.expiryDate = item.expiryDate || row.expiryDate || "";
        // 收集批次到期日期数据用于加权平均计算（可用库存 > 0）
        collectBatchExpiry(row.key, row.expiryDate, row.availableQty);
      });

      sources.storeInventory.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        item.sourceFlags.storeInventory = true;
        item.storeStock += row.stockQty || 0;
        item.storeAvailable += row.availableQty || 0;
        const candidateDays = row.remainingDays !== null && row.remainingDays !== undefined ? row.remainingDays : daysUntil(row.expiryDate);
        if (candidateDays !== null && candidateDays !== undefined) {
          item.remainingDays = item.remainingDays === null ? candidateDays : Math.min(item.remainingDays, candidateDays);
        }
        item.productionDate = item.productionDate || row.productionDate || "";
        item.expiryDate = item.expiryDate || row.expiryDate || "";
        // 收集批次到期日期数据用于加权平均计算（可用库存 > 0）
        collectBatchExpiry(row.key, row.expiryDate, row.availableQty);
      });

      sources.channelSales.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        item.sourceFlags.channelSales = true;
        item.channelSalesQty += row.qty || 0;
      });

      sources.storeSales.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        item.sourceFlags.storeSales = true;
        item.storeSalesQty += row.qty || 0;
      });

      // 处理九宫格文件数据（matrixWorkbook），获取规格、生产备注、图片等
      sources.matrixWorkbook.rows.forEach((row) => {
        const item = ensure(row.key);
        mergeIdentity(item, row);
        // 从matrixWorkbook获取特有的字段
        if (row.spec) item.spec = row.spec;
        if (row.productionNote) item.productionNote = row.productionNote;
        if (row.reorderNote) item.reorderNote = row.reorderNote;
        if (row.imageUrl) item.imageUrl = row.imageUrl;
        if (row.imageTarget) item.imageTarget = row.imageTarget;
        if (row.salesBand) item.salesBand = row.salesBand;
        if (row.stockHealth) item.stockHealth = row.stockHealth;
        if (row.salesTrend) item.salesTrend = row.salesTrend;
        if (row.dailySalesCoef !== null && row.dailySalesCoef !== undefined) item.dailySalesCoef = row.dailySalesCoef;
        // 如果matrixWorkbook中有库存数据，也合并
        if (row.stockQty && row.stockQty > 0) {
          item.warehouseAvailable = item.warehouseAvailable || row.stockQty;
        }
      });

      return Array.from(map.values()).map((item) => {
        item.totalSalesQty = item.channelSalesQty + item.storeSalesQty;
        item.totalInventoryQty = item.warehouseAvailable + item.storeAvailable;
        item.salesDaily = safeDivide(item.totalSalesQty, periodDays) || 0;
        item.sales30Qty = item.totalSalesQty;
        item.inventoryQty = item.totalInventoryQty;
        item.stockDepthDays = item.salesDaily > 0 ? item.totalInventoryQty / item.salesDaily : null;
        item.coverMonths = item.salesDaily > 0 ? item.totalInventoryQty / (item.salesDaily * 30) : null;
        item.targetInventory6m = item.salesDaily > 0 ? item.salesDaily * 180 : null;
        item.replenishmentQty = item.targetInventory6m !== null ? Math.max(0, Math.round(item.targetInventory6m - item.totalInventoryQty)) : 0;
        item.expiryMinDays = item.remainingDays;
        item.slowRisk = evaluateSlowRisk(item);
        item.expiryRisk = evaluateExpiryRisk(item);
        item.sourceCount = Object.values(item.sourceFlags).filter(Boolean).length;
        // 计算加权平均到期日期
        item.avgExpiryDate = calculateWeightedAvgRemainingYears(item.key) || "";
        return item;
      }).sort((a, b) => {
        const aScore = a.totalSalesQty || a.totalInventoryQty || 0;
        const bScore = b.totalSalesQty || b.totalInventoryQty || 0;
        return bScore - aScore;
      });
    }

    function getSalesPeriodDays(period = state.salesPeriod) {
      const start = period && period.start ? new Date(period.start) : null;
      const end = period && period.end ? new Date(period.end) : null;
      if (!start || !end || Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) {
        return 180;
      }
      const diff = Math.round((end.getTime() - start.getTime()) / 86400000) + 1;
      return Math.max(diff, 1);
    }

    function makeDomId(prefix, key) {
      return `${prefix}-${String(key || "").replace(/[^a-zA-Z0-9_-]+/g, "_")}`;
    }

    function getStockHealthLabel(stockMonths) {
      if (stockMonths === null || stockMonths === undefined || Number.isNaN(stockMonths)) return "未知";
      if (stockMonths <= 12) return "健康";
      if (stockMonths <= 24) return "风险";
      return "积压";
    }

    function getSalesBandLabel(percent) {
      if (percent === null || percent === undefined || Number.isNaN(percent)) return "平销";
      if (percent <= 0.3) return "畅销";
      if (percent <= 0.7) return "平销";
      return "滞销";
    }

    function getMatrixCellMeta(row) {
      const stockBand = getStockHealthLabel(row.stockMonths);
      const salesBand = row.salesBand || "平销";
      const cellKey = `${stockBand}|${salesBand}`;
      const metaMap = {
        "健康|畅销": { title: "核心爆款区", badge: "重点保供", theme: "good" },
        "健康|平销": { title: "稳定发展区", badge: "持续关注", theme: "warm" },
        "健康|滞销": { title: "潜力优化区", badge: "优化动销", theme: "warn" },
        "风险|畅销": { title: "补货关注区", badge: "控制库存", theme: "warm" },
        "风险|平销": { title: "调整观察区", badge: "动态跟踪", theme: "warn" },
        "风险|滞销": { title: "预警处理区", badge: "促销去化", theme: "danger" },
        "积压|畅销": { title: "资金占用区", badge: "谨慎补货", theme: "danger" },
        "积压|平销": { title: "清理改善区", badge: "制定计划", theme: "danger" },
        "积压|滞销": { title: "重点清理区", badge: "清仓处理", theme: "danger" },
      };
      return metaMap[cellKey] || { title: cellKey, badge: "待判定", theme: "neutral" };
    }

    // ===== 新九宫格分类逻辑：日销系数 × 消化周期 =====
    // 消化周期(天) → X+Y系数之和
    function getDigestionSum(sellOutDays) {
      if (sellOutDays === null || sellOutDays === undefined || Number.isNaN(sellOutDays)) return 6;
      // 负数消化周期为异常情况（如库存或销量为负），当作无法消化丢到9号位（sum=6）
      if (sellOutDays < 0) return 6;
      if (sellOutDays <= 90) return 2;
      if (sellOutDays <= 180) return 3;
      if (sellOutDays <= 360) return 4;
      if (sellOutDays <= 720) return 5;
      return 6;
    }

    // 消化周期标签
    function getDigestionLabel(sum) {
      const labels = { 2: "≤90天", 3: "≤180天", 4: "≤360天", 5: "≤720天", 6: ">720天" };
      return labels[sum] || "未知";
    }

    // 判断消化周期是否"无法消化"：负数（异常）或 Infinity（有库存无销量）
    // 用于表格统一显示"无法消化"，避免负数被显示为"-100 天"
    function isIndigestible(sellOutDays) {
      return sellOutDays === Infinity
        || (typeof sellOutDays === "number" && sellOutDays < 0)
        || (sellOutDays !== null && sellOutDays !== undefined && Number(sellOutDays) < 0);
    }

    // 九宫格位置编号：先横再竖，1~9号位
    // gridOrder: (1,1)=1号位 (2,1)=2号位 (3,1)=3号位 (1,2)=4号位 ... (3,3)=9号位
    const GRID_ORDER = [
      { x: 1, y: 1 }, { x: 2, y: 1 }, { x: 3, y: 1 },
      { x: 1, y: 2 }, { x: 2, y: 2 }, { x: 3, y: 2 },
      { x: 1, y: 3 }, { x: 2, y: 3 }, { x: 3, y: 3 },
    ];

    function getMatrixPosition(x, y) {
      const idx = GRID_ORDER.findIndex(p => p.x === x && p.y === y);
      if (idx < 0) return "-";
      const nums = ["一", "二", "三", "四", "五", "六", "七", "八", "九"];
      return `${nums[idx]}号位`;
    }

    function getMatrixPositionShort(x, y) {
      const idx = GRID_ORDER.findIndex(p => p.x === x && p.y === y);
      if (idx < 0) return "-";
      return `${idx + 1}号位`;
    }

    // 九宫格位置优劣等级映射（1=最优，5=最差）
    // 规则：1号位最优；2号位=4号位；3号位=5号位=7号位；6号位=8号位；9号位最差
    // 等级数值越小表示位置越好
    const POSITION_RANK_MAP = { 1: 1, 2: 2, 3: 3, 4: 2, 5: 3, 6: 4, 7: 3, 8: 4, 9: 5 };

    // 从位置字符串（如"3号位"）提取等级；无效位置返回 null
    function getPositionRank(posStr) {
      if (!posStr) return null;
      const m = String(posStr).match(/(\d+)号位/);
      if (!m) return null;
      const num = parseInt(m[1], 10);
      return POSITION_RANK_MAP[num] != null ? POSITION_RANK_MAP[num] : null;
    }

    // 计算两个位置之间的趋势箭头（HTML）
    // 变好=绿色↑，变差=红色↓，持平=灰色→，无法比较=空
    function getPositionTrendArrow(fromPos, toPos) {
      const fromRank = getPositionRank(fromPos);
      const toRank = getPositionRank(toPos);
      if (fromRank == null || toRank == null) return "";
      if (toRank < fromRank) {
        // 等级数值变小=位置变好
        return `<span style="color:#16a34a;font-weight:600;" title="位置变好：${fromPos} → ${toPos}">↑</span>`;
      } else if (toRank > fromRank) {
        // 等级数值变大=位置变差
        return `<span style="color:#dc2626;font-weight:600;" title="位置变差：${fromPos} → ${toPos}">↓</span>`;
      } else {
        // 等级相同=持平
        return `<span style="color:#9ca3af;font-weight:600;" title="位置持平：${fromPos} → ${toPos}">→</span>`;
      }
    }

    // 获取当前数据源的时间节点标签
    function getCurrentNodeLabel() {
      const source = state.sources.matrixWorkbook;
      if (source && source.fileName) {
        // 从文件名中提取日期信息
        const match = source.fileName.match(/(\d{2,4}[-.]?\d{1,2}[-.]?\d{0,2})/);
        if (match) return match[1].replace(/[.-]/g, ".");
      }
      if (state.salesPeriod && state.salesPeriod.end) {
        return state.salesPeriod.end;
      }
      return new Date().toISOString().slice(0, 10);
    }

    // 保存当前九宫格位置到历史记录
    function saveMatrixHistory(rows) {
      const nodeLabel = getCurrentNodeLabel();
      if (!nodeLabel) return;
      rows.forEach((row) => {
        if (!row.key) return;
        if (!state.matrixHistory[row.key]) {
          state.matrixHistory[row.key] = {};
        }
        state.matrixHistory[row.key][nodeLabel] = getMatrixPositionShort(row.salesCoef, row.inventoryCoef);
      });
      if (!state.matrixHistoryNodes.includes(nodeLabel)) {
        state.matrixHistoryNodes.push(nodeLabel);
      }
      // 自动填充未设置的对比节点
      for (let i = 0; i < 3; i++) {
        if (!state.historyCompareNodes[i] && state.matrixHistoryNodes[i]) {
          state.historyCompareNodes[i] = state.matrixHistoryNodes[i];
        }
      }
    }

    // 新九宫格单元格元数据
    // 横轴X=日销系数(1高~3低)，纵轴Y=消化周期反推(1低~3高)
    function getMatrixCellMetaNew(x, y) {
      const cellKey = `${x}|${y}`;
      const metaMap = {
        "1|1": { title: "原价/补货",   badge: "≤90天",   theme: "good" },
        "2|1": { title: "原价/关注",   badge: "≤180天",  theme: "good" },
        "3|1": { title: "原价/不补",   badge: "≤360天",  theme: "warm" },
        "1|2": { title: "原价/关注",   badge: "≤180天",  theme: "good" },
        "2|2": { title: "原价/不补",   badge: "≤360天",  theme: "warm" },
        "3|2": { title: "压力/消化",   badge: "≤720天",  theme: "danger" },
        "1|3": { title: "原价/不补",   badge: "≤360天",  theme: "warm" },
        "2|3": { title: "浮动/消化",   badge: "≤720天",  theme: "danger" },
        "3|3": { title: "折价/去库存", badge: ">720天",  theme: "danger" },
      };
      return metaMap[cellKey] || { title: cellKey, badge: "待判定", theme: "neutral" };
    }

    // 为商品分配日销系数(X)和纵轴值(Y=sum-X)
    // 1. 用O列库存月确定 X+Y 之和（库存月×30≈消化周期天数）
    // 2. 直接读取N列日销系数数值分配X：N≥10→X=1(高日销)，3≤N<10→X=2(中日销)，N<3→X=3(低日销)
    // 3. Y = sum - X（由消化周期反推，不再单独计算库存系数）
    function assignMatrixCoefficients(rows, periodDays) {
      // 计算消化周期和系数之和
      rows.forEach((row) => {
        // 优先使用库存月(O列)计算消化周期
        if (row.stockMonths !== null && row.stockMonths !== undefined && !Number.isNaN(row.stockMonths)) {
          row.sellOutDays = row.stockMonths * 30;
        } else if (row.sellOutDays !== null && row.sellOutDays !== undefined) {
          // 保留已计算的 sellOutDays（可能为 Infinity）
        } else if (row.salesQty > 0) {
          row.sellOutDays = (row.stockQty / row.salesQty) * periodDays;
        } else {
          // 有库存但无销量，消化周期无穷大
          row.sellOutDays = Infinity;
        }
        row.digestionSum = getDigestionSum(row.sellOutDays);
      });

      // 直接根据N列日销系数数值分配X（不再组内排名）
      rows.forEach((row) => {
        const n = (row.dailySalesCoef != null && !Number.isNaN(row.dailySalesCoef)) ? row.dailySalesCoef : 0;
        let x;
        if (n >= 10) {
          x = 1;  // 高日销
        } else if (n >= 3) {
          x = 2;  // 中日销
        } else {
          x = 3;  // 低日销
        }
        // 根据消化周期约束 X 的范围：X ∈ [max(1, sum-3), min(3, sum-1)]
        const sum = row.digestionSum;
        const minX = Math.max(1, sum - 3);
        const maxX = Math.min(3, sum - 1);
        x = Math.max(minX, Math.min(maxX, x));
        row.salesCoef = x;
        row.inventoryCoef = sum - x;
      });
    }

    // 生产属性归一化：将生产备注文本归为 正常生产 / 停产 / 待定 / 其他 / 未设置
    function getProductionStatus(productionNote) {
      const note = String(productionNote || "").trim();
      if (!note) return "未设置";
      if (note.includes("正常")) return "正常生产";
      if (note.includes("停产")) return "停产";
      if (note.includes("待定")) return "待定";
      return "其他";
    }

    // 判断补单备注是否为在途（用于⭐补单在途标记）
    function isReorderInTransit(reorderNote) {
      return String(reorderNote || "").includes("在途");
    }

    function buildMatrixRowsFromWorkbook(source) {
      const periodMonths = source?.periodMonths || 7;
      const periodDays = periodMonths * 30;
      const baseRows = Array.isArray(source?.rows) ? source.rows.slice() : [];
      const rows = baseRows
        .map((row) => {
          const salesQty = parseNumber(row.salesQty, 0);
          const stockQty = parseNumber(row.stockQty, 0);
          const retailPrice = maybeNumber(row.retailPrice);
          const inventoryAmount = maybeNumber(row.inventoryAmount);
          const stockMonths = maybeNumber(row.stockMonths);
          const remainingDays = maybeNumber(row.remainingDays);
          const sellOutDays = (stockMonths !== null && stockMonths !== undefined && !Number.isNaN(stockMonths))
            ? stockMonths * 30
            : (row.sellOutDays !== null && row.sellOutDays !== undefined
              ? row.sellOutDays
              : (salesQty > 0 ? (stockQty / salesQty) * periodDays : Infinity));
          const derivedStockMonths = stockMonths !== null && stockMonths !== undefined
            ? stockMonths
            : (salesQty > 0 ? (stockQty / salesQty) * periodMonths : null);
          // 负数消化周期为异常情况：能否卖完直接判定为 false（卖不完）
          const canSellBeforeExpiry = (sellOutDays !== null && sellOutDays < 0)
            ? false
            : (row.canSellBeforeExpiry !== null && row.canSellBeforeExpiry !== undefined
              ? row.canSellBeforeExpiry
              : (remainingDays !== null && sellOutDays !== null ? sellOutDays <= remainingDays : null));

          // 保质期：剩余天数 / 365，保留1位小数
          const remainingDaysForExpiry = maybeNumber(row.remainingDays);
          const avgExpiryDate = remainingDaysForExpiry !== null && remainingDaysForExpiry !== undefined
            ? (remainingDaysForExpiry / 365).toFixed(1)
            : "";

          return {
            ...row,
            salesQty,
            stockQty,
            retailPrice,
            inventoryAmount: inventoryAmount !== null && inventoryAmount !== undefined
              ? inventoryAmount
              : (retailPrice !== null && retailPrice !== undefined ? stockQty * retailPrice : null),
            stockMonths: derivedStockMonths,
            sellOutDays,
            canSellBeforeExpiry,
            avgExpiryDate,
            stockHealth: row.stockHealth || getStockHealthLabel(derivedStockMonths),
            salesBand: row.salesBand || "",
          };
        })
        .filter((row) => row.productName || row.barcode || row.sku);

      // 分配日销系数和纵轴值（基于消化周期反推九宫格）
      assignMatrixCoefficients(rows, periodDays);
      rows.forEach((row) => {
        row.matrixMeta = getMatrixCellMetaNew(row.salesCoef, row.inventoryCoef);
      });

      const categoryOptions = Array.from(new Set(rows.map((row) => row.category || "未分类"))).sort((a, b) => a.localeCompare(b, "zh-CN"));
      const filtered = rows.filter((row) => {
        // 即时库存为0的商品暂不计入统计
        if ((row.stockQty || 0) === 0) return false;
        const categoryFilter = state.matrixFilters.category || "全部";
        const priceFilter = state.matrixFilters.isRegularPrice || "全部";
        const productionFilter = state.matrixFilters.productionNote || "全部";
        const kpiFilter = state.matrixFilters.kpiFilter || "all";
        if (categoryFilter !== "全部" && (row.category || "未分类") !== categoryFilter) return false;
        if (priceFilter !== "全部" && (row.isRegularPrice || "未设置") !== priceFilter) return false;
        if (productionFilter !== "全部" && getProductionStatus(row.productionNote) !== productionFilter) return false;
        // KPI筛选（按消化周期分类）
        if (kpiFilter !== "all") {
          if (kpiFilter === "digest2" && row.digestionSum !== 2) return false;
          if (kpiFilter === "digest3" && row.digestionSum !== 3) return false;
          if (kpiFilter === "digest4" && row.digestionSum !== 4) return false;
          if (kpiFilter === "digest5" && row.digestionSum !== 5) return false;
          if (kpiFilter === "digest6" && row.digestionSum !== 6) return false;
        }
        return true;
      });

      const gridOrder = [
        { x: 1, y: 1 }, { x: 2, y: 1 }, { x: 3, y: 1 },
        { x: 1, y: 2 }, { x: 2, y: 2 }, { x: 3, y: 2 },
        { x: 1, y: 3 }, { x: 2, y: 3 }, { x: 3, y: 3 },
      ];
      const cells = gridOrder.map(({ x, y }) => {
const cellRows = filtered.filter((row) => row.salesCoef === x && row.inventoryCoef === y)
.sort((a, b) => {
const ai = parseInt(a.id, 10); const bi = parseInt(b.id, 10);
if (!isNaN(ai) && !isNaN(bi)) return ai - bi;
return String(a.id || "").localeCompare(String(b.id || ""), "zh");
});
const skuCount = cellRows.length;
const inventoryQty = cellRows.reduce((sum, row) => sum + (row.stockQty || 0), 0);
const inventoryAmount = cellRows.reduce((sum, row) => sum + (row.inventoryAmount || 0), 0);
return {
key: `${x}|${y}`,
x,
y,
rows: cellRows,
skuCount,
inventoryQty,
          inventoryAmount,
          meta: getMatrixCellMetaNew(x, y),
        };
      });

      const summary = {
        totalSku: filtered.length,
        totalInventoryQty: filtered.reduce((sum, row) => sum + (row.stockQty || 0), 0),
        totalInventoryAmount: filtered.reduce((sum, row) => sum + (row.inventoryAmount || 0), 0),
        digest2Count: filtered.filter((row) => row.digestionSum === 2).length,
        digest3Count: filtered.filter((row) => row.digestionSum === 3).length,
        digest4Count: filtered.filter((row) => row.digestionSum === 4).length,
        digest5Count: filtered.filter((row) => row.digestionSum === 5).length,
        digest6Count: filtered.filter((row) => row.digestionSum === 6).length,
        selloutSafeCount: filtered.filter((row) => row.canSellBeforeExpiry === true).length,
        selloutRiskCount: filtered.filter((row) => row.canSellBeforeExpiry === false).length,
        categoryOptions,
      };

      return {
        rows,
        filteredRows: filtered,
        cells,
        summary,
        periodDays,
        periodLabel: source?.salesPeriod ? `${source.salesPeriod.start} ~ ${source.salesPeriod.end}` : `最近 ${periodMonths} 个月净出库`,
        categoryOptions,
      };
    }

    function buildMatrixRows(sources) {
      const productMap = new Map(sources.product.rows.map((row) => [row.key, row]));
      const stockMap = new Map(sources.inventorySales.rows.map((row) => [row.key, row]));
      const keys = new Set([...productMap.keys(), ...stockMap.keys()]);
      const periodDays = getSalesPeriodDays();
      const periodMonths = periodDays / 30;

      const rows = Array.from(keys).map((key) => {
        const product = productMap.get(key) || {};
        const stock = stockMap.get(key) || {};
        const productName = product.productName || stock.productName || "";
        const barcode = product.barcode || stock.barcode || "";
        const sku = product.sku || stock.sku || "";
        const spec = product.spec || stock.spec || "";
        const category = product.category || stock.category || "未分类";
        const brand = product.brand || stock.brand || "";
        const imageUrl = product.imageUrl || stock.imageUrl || "";
        const isRegularPrice = product.isRegularPrice || stock.isRegularPrice || "";
        const retailPrice = maybeNumber(product.retailPrice ?? stock.retailPrice);
        const salesQty = parseNumber(stock.salesQty, 0);
        const stockQty = parseNumber(stock.stockQty, 0);
        const inventoryAmount = maybeNumber(stock.stockAmount);
        const derivedInventoryAmount = inventoryAmount !== null && inventoryAmount !== undefined
          ? inventoryAmount
          : (retailPrice !== null && retailPrice !== undefined ? stockQty * retailPrice : null);
        const shelfLifeDays = maybeNumber(stock.shelfLifeDays);
        const expiryDate = stock.expiryDate || "";
        const currentSellDays = salesQty > 0 ? (stockQty / salesQty) * periodDays : null;
        const stockMonths = salesQty > 0 ? (stockQty / salesQty) * periodMonths : null;
        const canSellBeforeExpiry = shelfLifeDays !== null && currentSellDays !== null
          ? currentSellDays <= shelfLifeDays
          : null;
        const salesBand = "";
        const stockHealth = getStockHealthLabel(stockMonths);
        const productionNote = product.productionNote || stock.productionNote || "";
        const reorderNote = product.reorderNote || stock.reorderNote || "";
        return {
          key,
          productName,
          barcode,
          sku,
          spec,
          category,
          brand,
          imageUrl,
          isRegularPrice,
          retailPrice,
          salesQty,
          stockQty,
          inventoryAmount: derivedInventoryAmount,
          shelfLifeDays,
          expiryDate,
          sellOutDays: currentSellDays,
          stockMonths,
          stockHealth,
          canSellBeforeExpiry,
          salesBand,
          productionNote,
          reorderNote,
          rawProduct: product.raw,
          rawStock: stock.raw,
        };
      }).filter((row) => row.productName || row.barcode || row.sku);

      // 分配日销系数和纵轴值（基于消化周期反推九宫格）
      assignMatrixCoefficients(rows, periodDays);
      rows.forEach((row) => {
        row.matrixMeta = getMatrixCellMetaNew(row.salesCoef, row.inventoryCoef);
      });

      const categoryOptions = Array.from(new Set(rows.map((row) => row.category || "未分类"))).sort((a, b) => a.localeCompare(b, "zh-CN"));
      const filtered = rows.filter((row) => {
        // 即时库存为0的商品暂不计入统计
        if ((row.stockQty || 0) === 0) return false;
        const categoryFilter = state.matrixFilters.category || "全部";
        const priceFilter = state.matrixFilters.isRegularPrice || "全部";
        const productionFilter = state.matrixFilters.productionNote || "全部";
        if (categoryFilter !== "全部" && (row.category || "未分类") !== categoryFilter) return false;
        if (priceFilter !== "全部" && (row.isRegularPrice || "未设置") !== priceFilter) return false;
        if (productionFilter !== "全部" && getProductionStatus(row.productionNote) !== productionFilter) return false;
        return true;
      });

      const gridOrder = [
        { x: 1, y: 1 }, { x: 2, y: 1 }, { x: 3, y: 1 },
        { x: 1, y: 2 }, { x: 2, y: 2 }, { x: 3, y: 2 },
        { x: 1, y: 3 }, { x: 2, y: 3 }, { x: 3, y: 3 },
      ];
      const cells = gridOrder.map(({ x, y }) => {
const cellRows = filtered.filter((row) => row.salesCoef === x && row.inventoryCoef === y)
.sort((a, b) => {
const ai = parseInt(a.id, 10); const bi = parseInt(b.id, 10);
if (!isNaN(ai) && !isNaN(bi)) return ai - bi;
return String(a.id || "").localeCompare(String(b.id || ""), "zh");
});
const skuCount = cellRows.length;
const inventoryQty = cellRows.reduce((sum, row) => sum + (row.stockQty || 0), 0);
const inventoryAmount = cellRows.reduce((sum, row) => sum + (row.inventoryAmount || 0), 0);
return {
key: `${x}|${y}`,
x,
y,
rows: cellRows,
skuCount,
inventoryQty,
          inventoryAmount,
          meta: getMatrixCellMetaNew(x, y),
        };
      });

      const summary = {
        totalSku: filtered.length,
        totalInventoryQty: filtered.reduce((sum, row) => sum + (row.stockQty || 0), 0),
        totalInventoryAmount: filtered.reduce((sum, row) => sum + (row.inventoryAmount || 0), 0),
        digest2Count: filtered.filter((row) => row.digestionSum === 2).length,
        digest3Count: filtered.filter((row) => row.digestionSum === 3).length,
        digest4Count: filtered.filter((row) => row.digestionSum === 4).length,
        digest5Count: filtered.filter((row) => row.digestionSum === 5).length,
        digest6Count: filtered.filter((row) => row.digestionSum === 6).length,
        selloutSafeCount: filtered.filter((row) => row.canSellBeforeExpiry === true).length,
        selloutRiskCount: filtered.filter((row) => row.canSellBeforeExpiry === false).length,
        categoryOptions,
      };

      return {
        rows,
        filteredRows: filtered,
        cells,
        summary,
        periodDays,
        periodLabel: `${state.salesPeriod.start || "未设定"} ~ ${state.salesPeriod.end || "未设定"}`,
        categoryOptions,
      };
    }

    function evaluateExpiryRisk(row) {
      if (row.remainingDays === null || row.remainingDays === undefined) return { level: "neutral", label: "未知", days: null };
      if (row.remainingDays <= 365) return { level: "danger", label: "1年内", days: row.remainingDays };
      if (row.remainingDays <= 730) return { level: "warn", label: "2年内", days: row.remainingDays };
      return { level: "good", label: "2年以上", days: row.remainingDays };
    }

    function evaluateSlowRisk(row) {
      if (!row.remainingDays || row.remainingDays <= 0) {
        return { level: "danger", label: "临期/过期", gapDays: row.remainingDays || 0 };
      }
      if (!row.stockDepthDays) return { level: "warn", label: "无销量", gapDays: null };
      if (row.stockDepthDays >= row.remainingDays) {
        return { level: "danger", label: "卖不完", gapDays: row.stockDepthDays - row.remainingDays };
      }
      if (row.stockDepthDays >= row.remainingDays - 365) {
        return { level: "warn", label: "有滞销风险", gapDays: row.stockDepthDays - (row.remainingDays - 365) };
      }
      return { level: "good", label: "正常", gapDays: row.remainingDays - row.stockDepthDays };
    }

    function getModelSignature() {
      const base = SOURCE_CONFIGS
        .map((cfg) => {
          const source = state.sources[cfg.key];
          return [
            cfg.key,
            source.fileName || "",
            source.sheetName || "",
            source.importedAt || "",
            source.rows.length,
            source.error || "",
          ].join(":");
        })
        .join("|");
      return [
        base,
        `period:${state.salesPeriod.start || ""}-${state.salesPeriod.end || ""}`,
        `filters:${state.matrixFilters.category || ""}-${state.matrixFilters.isRegularPrice || ""}-${state.matrixFilters.productionNote || ""}-${state.matrixFilters.kpiFilter || ""}`,
        `focus:${state.matrixFocusKey || ""}`,
      ].join("|");
    }

    // 聚合每日销量趋势数据：按商品 key 聚合，每商品保留按日期的线上/线下销量
    // productRows 用于通过 key 关联商品资料的 category（G列）字段
    function buildSalesTrendModel(rows, productRows) {
      // 双重索引：product 源 key 走 normalizeText，salesTrend xlsx 路径 key 是 raw trim，
      // 用 normalizeText(barcode) 兜底匹配，保证两边 key 格式不一致也能关联上 category
      const catMap = new Map();
      (productRows || []).forEach((r) => {
        if (!r.category) return;
        if (r.key) catMap.set(r.key, r.category);
        if (r.barcode) catMap.set(normalizeText(r.barcode), r.category);
      });
      const lookupCat = (row) => row.category || catMap.get(row.key) || (row.barcode ? catMap.get(normalizeText(row.barcode)) : "") || "";
      const productMap = new Map();
      const dateSet = new Set();
      (rows || []).forEach((row) => {
        if (!row.key || !row.date) return;
        dateSet.add(row.date);
        let entry = productMap.get(row.key);
        if (!entry) {
          entry = {
            key: row.key,
            productName: row.productName || "",
            barcode: row.barcode || "",
            sku: row.sku || "",
            spec: row.spec || "",
            category: lookupCat(row),
            dates: {},
            totalOnline: 0,
            totalOffline: 0,
          };
          productMap.set(row.key, entry);
        }
        const slot = entry.dates[row.date] || { online: 0, offline: 0 };
        slot.online += row.onlineQty || 0;
        slot.offline += row.offlineQty || 0;
        entry.dates[row.date] = slot;
        entry.totalOnline += row.onlineQty || 0;
        entry.totalOffline += row.offlineQty || 0;
        if (!entry.productName && row.productName) entry.productName = row.productName;
        if (!entry.barcode && row.barcode) entry.barcode = row.barcode;
        if (!entry.sku && row.sku) entry.sku = row.sku;
        if (!entry.category) { const c = lookupCat(row); if (c) entry.category = c; }
      });
      const allDates = Array.from(dateSet).sort();
      const products = Array.from(productMap.values()).sort(
        (a, b) => (b.totalOnline + b.totalOffline) - (a.totalOnline + a.totalOffline)
      );
      return {
        products,
        allDates,
        dateMin: allDates[0] || "",
        dateMax: allDates[allDates.length - 1] || "",
        productCount: products.length,
      };
    }

    function buildModel() {
      const signature = getModelSignature();
      if (modelCache.signature === signature && modelCache.model) {
        return modelCache.model;
      }

      const matrixWorkbook = state.sources.matrixWorkbook;
      const product = state.sources.product;
      const inventorySales = state.sources.inventorySales;
      const warehouse = state.sources.warehouse;
      const storeInventory = state.sources.storeInventory;
      const channelSales = state.sources.channelSales;
      const storeSales = state.sources.storeSales;

const matrix = matrixWorkbook.rows.length
? buildMatrixRowsFromWorkbook(matrixWorkbook)
: buildMatrixRows(state.sources);
// 保存当前九宫格位置到历史记录
if (matrix.rows && matrix.rows.length) {
saveMatrixHistory(matrix.rows);
}
const channelSalesAgg = summarizeChannelSales(channelSales.rows);
      const storeSalesAgg = summarizeStoreSales(storeSales.rows);
      const linkedRows = buildLinkedRows(state.sources);
      const productUnique = new Set(product.rows.map((row) => row.key)).size;
      const inventorySalesQty = inventorySales.rows.reduce((sum, row) => sum + (row.salesQty || 0), 0);
      const inventoryStockQty = inventorySales.rows.reduce((sum, row) => sum + (row.stockQty || 0), 0);
      const inventoryStockAmount = inventorySales.rows.reduce((sum, row) => sum + (row.stockAmount || 0), 0);
      const warehouseQty = warehouse.rows.reduce((sum, row) => sum + (row.availableQty || 0), 0);
      const storeQty = storeInventory.rows.reduce((sum, row) => sum + (row.availableQty || 0), 0);
      const channelQty = channelSales.rows.reduce((sum, row) => sum + (row.qty || 0), 0);
      const storeSalesQty = storeSales.rows.reduce((sum, row) => sum + (row.qty || 0), 0);
      const linkedCount = linkedRows.length;
      const uploadedCount = SOURCE_CONFIGS.filter((cfg) => state.sources[cfg.key].rows.length).length;
      const replenishmentRows = linkedRows
        .filter((row) => row.totalSalesQty > 0 || row.totalInventoryQty > 0)
        .map((row) => ({
          ...row,
          sales30Qty: row.totalSalesQty,
          inventoryQty: row.totalInventoryQty,
          stockMonths: row.coverMonths,
        }))
        .filter((row) => row.replenishmentQty > 0)
        .sort((a, b) => b.replenishmentQty - a.replenishmentQty);
      const slowRows = linkedRows
        .filter((row) => row.slowRisk && row.slowRisk.level !== "good")
        .sort((a, b) => (b.stockDepthDays || 0) - (a.stockDepthDays || 0));
      const expiryRows = linkedRows
        .filter((row) => row.expiryRisk && row.expiryRisk.level !== "good")
        .sort((a, b) => (a.remainingDays ?? 999999) - (b.remainingDays ?? 999999));

      const model = {
        sources: state.sources,
        productUnique,
        inventorySalesQty,
        inventoryStockQty,
        inventoryStockAmount,
        warehouseQty,
        storeQty,
        channelQty,
        storeSalesQty,
        matrixRows: matrix.rows,
        matrixFilteredRows: matrix.filteredRows,
        matrixCells: matrix.cells,
        matrixSummary: matrix.summary,
        matrixPeriodDays: matrix.periodDays,
        matrixPeriodLabel: matrix.periodLabel,
        matrixCategoryOptions: matrix.categoryOptions,
        linkedRows,
        linkedCount,
        uploadedCount,
        allUploaded: uploadedCount === SOURCE_CONFIGS.length,
        channelSalesAgg: channelSalesAgg.sort((a, b) => b.qty - a.qty),
        storeSalesAgg: storeSalesAgg.sort((a, b) => b.qty - a.qty),
        replenishmentRows,
        slowRows,
        expiryRows,
        salesTrendModel: buildSalesTrendModel(state.sources.salesTrend.rows, state.sources.product.rows),
      };
      modelCache.signature = signature;
      modelCache.model = model;
      return model;
    }

    function badge(type, text) {
      return `<span class="badge ${type}">${escapeHtml(text)}</span>`;
    }

    function renderProgressPills(model) {
      const host = document.getElementById("progress-pills");
      let pills = [];
      if (state.activeTab === "salesTrend") {
        const t = model.salesTrendModel;
        if (t.productCount) {
          let totalOn = 0, totalOff = 0;
          t.products.forEach((p) => { totalOn += p.totalOnline; totalOff += p.totalOffline; });
          pills = [
            `<span class="pill">商品数 ${formatInteger(t.productCount)}</span>`,
            `<span class="pill">日期范围 ${t.dateMin || "-"} ~ ${t.dateMax || "-"}</span>`,
            `<span class="pill">线上净销售 ${formatInteger(Math.max(0, totalOn))}</span>`,
            `<span class="pill">线下净销售 ${formatInteger(Math.max(0, totalOff))}</span>`,
          ];
        }
      } else if (state.activeTab === "kttImport") {
        const rows = state.kttImportData;
        if (rows.length) {
          const orderCount = new Set(rows.map((r) => r.importNo)).size;
          pills = [
            `<span class="pill">已解析 ${formatInteger(orderCount)} 单</span>`,
            `<span class="pill">${formatInteger(rows.length)} 条商品</span>`,
          ];
        }
      } else if (state.activeTab === "matrix") {
        if (model.matrixRows && model.matrixRows.length) {
          const cats = new Set(model.matrixRows.map((r) => r.category).filter(Boolean));
          pills = [
            `<span class="pill">商品 ${formatInteger(model.matrixRows.length)}</span>`,
            `<span class="pill">分类 ${formatInteger(cats.size)}</span>`,
          ];
        }
      } else {
        pills = [
          `<span class="pill">已上传 ${formatInteger(model.uploadedCount)} 个文件</span>`,
          `<span class="pill">商品条码 ${formatInteger(model.productUnique)}</span>`,
          `<span class="pill">库存数量 ${formatInteger(model.warehouseQty + model.storeQty)}</span>`,
          `<span class="pill">销售数量 ${formatInteger(model.channelQty + model.storeSalesQty)}</span>`,
          `<span class="pill">联动商品 ${formatInteger(model.linkedCount)}</span>`,
          `<span class="pill">建议补货 ${formatInteger(model.replenishmentRows.reduce((sum, row) => sum + (row.replenishmentQty || 0), 0))}</span>`,
        ];
      }
      host.innerHTML = pills.join("");
    }

    // 根据当前Tab获取需要显示的文件配置
    function getVisibleSourceConfigs() {
      if (state.activeTab === "matrix") {
        // 九宫格Tab只显示九宫格文件
        return SOURCE_CONFIGS.filter(cfg => cfg.key === "matrixWorkbook");
      }
      if (state.activeTab === "salesTrend") {
        // 销售趋势Tab只显示每日销量趋势文件
        return SOURCE_CONFIGS.filter(cfg => cfg.key === "salesTrend");
      }
      if (state.activeTab === "kttImport") {
        // 快团团导入Tab不需要文件上传
        return [];
      }
      // 驾驶舱Tab显示除九宫格与销售趋势外的所有文件
      return SOURCE_CONFIGS.filter(cfg => cfg.key !== "matrixWorkbook" && cfg.key !== "salesTrend");
    }

    function renderSourceList(model) {
      const host = document.getElementById("source-list");
      const visibleConfigs = getVisibleSourceConfigs();
      host.innerHTML = visibleConfigs.map((cfg) => {
        const source = model.sources[cfg.key];
        const ready = source.rows.length > 0;
        const statusType = source.error ? "danger" : source.loading ? "busy" : ready ? "good" : "neutral";
        const statusText = source.error ? "解析失败" : source.loading ? "解析中" : ready ? "已上传" : "未上传";
        const countText = ready ? `${formatInteger(source.rows.length)} 条记录` : "尚未上传";
        const extraText = cfg.key === "product"
          ? (ready ? `${formatInteger(new Set(source.rows.map((row) => row.barcode || row.sku || row.key)).size)} 个条码` : "建议用条码做主键")
          : cfg.key === "channelSales" || cfg.key === "storeSales"
            ? (ready ? `${formatInteger(source.rows.reduce((sum, row) => sum + (row.qty || 0), 0))} 件销量` : "会自动汇总销量")
            : (ready ? `${formatInteger(source.rows.reduce((sum, row) => sum + (row.availableQty || 0), 0))} 件库存` : cfg.hint);

        return `
          <div class="source-card">
            <div class="source-head">
              <div>
                <strong>${escapeHtml(cfg.label)}</strong>
                <div class="note">${escapeHtml(cfg.hint)}</div>
              </div>
              ${badge(statusType, statusText)}
            </div>
            <div class="source-meta">
              <div>文件：${ready ? escapeHtml(source.fileName) : "未选择"}</div>
              <div>工作表：${ready ? escapeHtml(source.sheetName || "自动匹配") : "未选择"}</div>
              <div>状态：${escapeHtml(countText)}</div>
              <div>提示：${escapeHtml(extraText)}</div>
            </div>
            ${source.error ? `<div class="error-text">${escapeHtml(source.error)}</div>` : ""}
            <div class="source-actions">
              <button class="ghost" data-upload="${cfg.key}">${ready ? "重新上传" : "上传文件"}</button>
              ${ready ? `<button class="ghost" data-clear="${cfg.key}">清除</button>` : ""}
              <input id="input-${cfg.key}" data-source="${cfg.key}" type="file" accept=".xlsx,.xls,.csv" hidden>
            </div>
          </div>
        `;
      }).join("");

      host.querySelectorAll("[data-upload]").forEach((button) => {
        button.addEventListener("click", () => {
          const key = button.dataset.upload;
          const input = document.getElementById(`input-${key}`);
          if (input) input.click();
        });
      });

      host.querySelectorAll("[data-clear]").forEach((button) => {
        button.addEventListener("click", () => {
          clearSource(button.dataset.clear);
        });
      });

      host.querySelectorAll('input[type="file"]').forEach((input) => {
        input.addEventListener("change", async () => {
          const file = input.files && input.files[0];
          if (!file) return;
          await handleUpload(input.dataset.source, file);
          input.value = "";
        });
      });
    }

    function renderMatrixTab(model) {
      const rows = model.matrixFilteredRows;
      const totalRows = model.matrixRows || [];
      const categoryOptions = ["全部", ...model.matrixCategoryOptions];
      const priceOptions = ["全部", "是", "否", "未设置"];
      // 生产属性选项：按固定优先级展示数据中实际存在的状态
      const productionOrder = ["正常生产", "停产", "待定", "其他", "未设置"];
      const presentStatuses = new Set(totalRows.map((row) => getProductionStatus(row.productionNote)));
      const productionOptions = ["全部", ...productionOrder.filter((s) => presentStatuses.has(s))];
      // 区分两种空状态：1)完全没有数据 2)有数据但被筛选条件过滤为空
      if (!totalRows.length) {
        return `
          <div class="panel matrix-panel">
            <div class="block-head">
              <div>
                <h2>九宫格看板</h2>
                <div class="note">请先上传单文件《总库存情况》九宫格模板，系统会直接读取商品资料、库存、净出库和图片。</div>
              </div>
              <button class="primary" data-open-source="matrixWorkbook">上传九宫格文件</button>
            </div>
            <div class="soft-card">
              <div class="note">上传后，系统会根据消化周期自动将商品分配到日销系数×消化周期九宫格，并保留点击商品图片跳转明细的能力。</div>
            </div>
          </div>
        `;
      }
      // 有数据但筛选后为空：显示筛选栏和提示，不让用户卡死
      if (!rows.length) {
        const activeFilters = [];
        if (state.matrixFilters.category && state.matrixFilters.category !== "全部") activeFilters.push(`分类=${state.matrixFilters.category}`);
        if (state.matrixFilters.isRegularPrice && state.matrixFilters.isRegularPrice !== "全部") activeFilters.push(`是否正价=${state.matrixFilters.isRegularPrice}`);
        if (state.matrixFilters.productionNote && state.matrixFilters.productionNote !== "全部") activeFilters.push(`生产属性=${state.matrixFilters.productionNote}`);
        if (state.matrixFilters.kpiFilter && state.matrixFilters.kpiFilter !== "all") {
          const kpiLabels = { digest2: "≤90天", digest3: "≤180天", digest4: "≤360天", digest5: "≤720天", digest6: ">720天" };
          activeFilters.push(`消化周期=${kpiLabels[state.matrixFilters.kpiFilter] || state.matrixFilters.kpiFilter}`);
        }
        return `
          <div class="panel matrix-panel" id="matrix-panel">
            <div class="block-head">
              <div>
                <h2>SKU 九宫格分析（日销系数 × 消化周期）</h2>
                <div class="note">横轴=日销系数（N列数值：1高日销~3低日销），纵轴=消化周期反推（1低~3高）。点击商品图片会跳到联动总表对应行。</div>
              </div>
              <div style="display:flex;gap:10px;align-items:center;">
                <span class="badge neutral">共 ${formatInteger(totalRows.length)} 个商品（筛选后 0 个）</span>
                <button class="ghost" data-matrix-reset>重置筛选</button>
                <button class="primary" data-matrix-export-image>导出图片</button>
              </div>
            </div>
            <div class="matrix-toolbar">
              <label>
                销售时间段
                <div style="display:flex;align-items:center;gap:4px;font-weight:600;color:var(--ink);">
                  ${escapeHtml(state.salesPeriod.start || "自动读取")} ~ ${escapeHtml(state.salesPeriod.end || "")}
                </div>
              </label>
              <label>
                分类
                <select data-matrix-category>
                  ${categoryOptions.map((item) => `<option value="${escapeHtml(item)}" ${state.matrixFilters.category === item ? "selected" : ""}>${escapeHtml(item)}</option>`).join("")}
                </select>
              </label>
              <label>
                是否正价
                <select data-matrix-price>
                  ${priceOptions.map((item) => `<option value="${escapeHtml(item)}" ${state.matrixFilters.isRegularPrice === item ? "selected" : ""}>${escapeHtml(item)}</option>`).join("")}
                </select>
              </label>
              <label>
                生产属性
                <select data-matrix-production>
                  ${productionOptions.map((item) => `<option value="${escapeHtml(item)}" ${state.matrixFilters.productionNote === item ? "selected" : ""}>${escapeHtml(item)}</option>`).join("")}
                </select>
              </label>
              <label>
                每格显示
                <div style="display:flex;gap:4px;">
                  ${[4, 8, 12].map(n => `<button type="button" class="${state.matrixItemsPerCell === n ? 'primary' : 'ghost'}" data-matrix-items="${n}" style="padding:6px 12px;font-size:12px;">${n}</button>`).join('')}

              <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'digest2' ? 'active' : ''}" data-kpi-filter="digest2" style="cursor:pointer;" title="消化周期≤90天"><small>≤90天</small><strong>${formatInteger(model.matrixSummary.digest2Count)}</strong></div>
              <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'digest3' ? 'active' : ''}" data-kpi-filter="digest3" style="cursor:pointer;" title="消化周期≤180天"><small>≤180天</small><strong>${formatInteger(model.matrixSummary.digest3Count)}</strong></div>
              <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'digest4' ? 'active' : ''}" data-kpi-filter="digest4" style="cursor:pointer;" title="消化周期≤360天"><small>≤360天</small><strong>${formatInteger(model.matrixSummary.digest4Count)}</strong></div>
              <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'digest5' ? 'active' : ''}" data-kpi-filter="digest5" style="cursor:pointer;" title="消化周期≤720天"><small>≤720天</small><strong>${formatInteger(model.matrixSummary.digest5Count)}</strong></div>
              <div class="matrix-mini ${state.matrixFilters.kpiFilter === 'digest6' ? 'active' : ''}" data-kpi-filter="digest6" style="cursor:pointer;" title="消化周期>720天"><small>>720天</small><strong>${formatInteger(model.matrixSummary.digest6Count)}</strong></div>
            </div>

        if (!productionNote) return "";

        if (note.includes("正常")) return "production-normal";
        if (note.includes("停产")) return "production-stopped";
        return "production-other";
      };

      const chipRows = (cellRows, cellKey) => {
        const isExpanded = state.matrixExpandedCells[cellKey];
        const itemsPerCell = state.matrixItemsPerCell || 4;
        const displayRows = isExpanded ? cellRows : cellRows.slice(0, itemsPerCell);
        const extra = Math.max(0, cellRows.length - displayRows.length);
        return `
          <div class="sku-strip">
            ${displayRows.map((row) => `
              <button type="button" class="sku-chip ${row.canSellBeforeExpiry === false ? 'sellout-risk' : ''}" data-matrix-jump="${escapeHtml(row.key)}" title="点击跳转到联动总表：${escapeHtml(row.productName || "")}${row.reorderNote ? '\n补单备注：' + row.reorderNote : ''}">

          </div>
        `;
      };

      const cellHtml = model.matrixCells.map((cell) => {
        const theme = cell.meta.theme || "neutral";
        const itemsPerCell = state.matrixItemsPerCell || 4;
        const isExpanded = state.matrixExpandedCells[cell.key];
        const previewRows = isExpanded ? cell.rows : cell.rows.slice(0, itemsPerCell);
        return `
          <div class="matrix-cell ${theme}" data-cell-key="${escapeHtml(cell.key)}" data-matrix-big-cell="${escapeHtml(cell.key)}" style="cursor:pointer;" title="点击查看大宫格">

              <div>
                <h3>${escapeHtml(cell.meta.title)}</h3>
                <div class="matrix-cell-stats">
                  <span>商品 ${formatInteger(cell.skuCount)}</span>
                  <span>库存 ${formatInteger(cell.inventoryQty)} 件</span>
                  <span>金额 ${cell.inventoryAmount === null || cell.inventoryAmount === undefined ? "-" : formatCurrency(cell.inventoryAmount)}</span>

              ${badge(theme === "good" ? "good" : theme === "danger" ? "danger" : "warn", cell.meta.badge)}
            </div>
            ${chipRows(previewRows, cell.key)}
          </div>
        `;
      });

      // 渲染大宫格弹窗
      const renderBigCellModal = () => {
        if (!state.matrixBigCell) return "";
        const cell = model.matrixCells.find(c => c.key === state.matrixBigCell.cellKey);
        if (!cell) return "";
        const theme = cell.meta.theme || "neutral";
        const totalAmount = cell.rows.reduce((sum, row) => sum + (row.inventoryAmount || 0), 0);
        return `
          <div class="big-cell-overlay" data-big-cell-overlay>
            <div class="big-cell-modal">
              <div class="big-cell-header">
                <h3>${escapeHtml(cell.meta.title)} <span style="font-size:14px;font-weight:normal;color:var(--muted);">(${escapeHtml(cell.meta.badge)})</span></h3>

<span class="legend-item"><span class="legend-box legend-red"></span>停产</span>
<span class="legend-item"><span class="legend-box legend-yellow"></span>待定</span>
<span class="legend-item"><span class="legend-box legend-green"></span>继续生产</span>
<span class="legend-item"><span class="legend-text-danger">红色加粗字体</span>保质期到期前消化不完</span>
<span class="legend-item"><span style="color:#ffc107;font-size:16px;">⭐</span>补单在途</span>
              </div>
              <div class="big-cell-content">
                <div class="big-cell-stats">
                  <div class="big-cell-stat">
                    <small>商品数量</small>
                    <strong>${formatInteger(cell.skuCount)}</strong>
                  </div>
                  <div class="big-cell-stat">
                    <small>总库存</small>
                    <strong>${formatInteger(cell.inventoryQty)} 件</strong>
                  </div>
                  <div class="big-cell-stat">
                    <small>总金额</small>
                    <strong>${formatCurrency(totalAmount)}</strong>
                  </div>
                </div>
                <div class="sku-strip">
                  ${cell.rows.map((row) => `
                    <button type="button" class="sku-chip ${row.canSellBeforeExpiry === false ? 'sellout-risk' : ''}" data-matrix-jump="${escapeHtml(row.key)}" title="点击跳转到联动总表：${escapeHtml(row.productName || "")}${row.reorderNote ? '\n补单备注：' + row.reorderNote : ''}">
