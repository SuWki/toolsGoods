name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 站点根 = 驾驶舱（index.html + 各看板）；商品文档保留在 /商品文档/ 子路径
      # 排除数据源 xlsx、开发调试脚本与临时文件，避免业务数据被公开
      - name: Build site
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='work/' \
            --exclude='__pycache__/' \
            --exclude='_site/' \
            --exclude='*.xlsx' \
            --exclude='*.xls' \
            --exclude='*.xlsm' \
            --exclude='_scan*' \
            --exclude='_test.txt' \
            --exclude='README.md' \
            --exclude='.gitignore' \
            ./ _site/
          # 子路径入口：/商品文档/ 直接打开（其 ../theme.css、../icon.png 会解析到站点根）
          cp "商品文档/商品文档.html" "_site/商品文档/index.html"
          echo "files: $(find _site -type f | wc -l)"
          du -sh _site
          ls _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
